            - github.com/birdtable/gragas/internal/port/testing$
            - github.com/birdtable/gragas/internal/repo/gatetest$
        layer-cmd-gragas-subset:
          list-mode: lax
          files: ["**/cmd/gragas-subset/**"]
          deny:
            - pkg: github.com/birdtable/gragas
              desc: "arch.layers.13: the explorer stays separable, so the subset entry never imports host/assets"
          allow:
