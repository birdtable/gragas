        #   ^ui\.(Ending|Refusal)$, ^lipgloss\.Style\.(Padding|Margin|Width)$,
        #   flag definitions of the module's flag names.
        # per-project (arch.ports.6, arch.shared.8, cli.config.2): sibling names,
        #   shared exports and config decodes named in rule data.

    gocognit:
      min-complexity: 20 # code.size.3 (tests excluded below)

    gocritic:
      # code.comments.3: commentedOutCode only.
      disable-all: true
      enabled-checks:
        - commentedOutCode

    gocyclo:
      min-complexity: 30 # code.idioms.4

    gomoddirectives:
      # go.layout.3: no replace lines at all.
      replace-local: false
      replace-allow-list: []
      # go.cycle.3: the go line and the toolchain line name a release to the patch, so a
      # build says which Go it ran on; a bare 1.27 or a toolchain with no patch fails.
      go-version-pattern: '^1\.\d+\.\d+$'
      toolchain-pattern: '^go1\.\d+\.\d+$'

    gomodguard_v2:
      # supply.intake.6: a module a chosen row of the register of libraries replaces and
      # bans is refused in go.mod, with the row's why as the reason and the row's own
      # module as the one to use. The rows are held to the register by
      # internal/preset_register_test.go. A repo's own blocked modules go in its own
      # .golangci.yml, never here.
      blocked:
        # json-schema
        - module: github.com/kaptinlin/jsonschema
          reason: less mature
          recommendations: [github.com/santhosh-tekuri/jsonschema/v6]
        # json-schema
        - module: github.com/google/jsonschema-go
          reason: aimed at one protocol; second choice
          recommendations: [github.com/santhosh-tekuri/jsonschema/v6]
        # json-schema
        - module: cuelang.org/go
          reason: a large dependency and a new language for one small job
          recommendations: [github.com/santhosh-tekuri/jsonschema/v6]
        # version-and-semver
        - module: github.com/carlmjohnson/versioninfo
          reason: 'package-level variables set in init, no injected build info, no stamp merge'
          recommendations: [golang.org/x/mod]
        # version-and-semver
        - module: github.com/caarlos0/go-version
          reason: 'one maintainer, the same 40 lines, no stamp'
          recommendations: [golang.org/x/mod]
        # command-tree
        - module: github.com/alecthomas/kong
          reason: the same
          recommendations: [github.com/spf13/cobra]
        # command-tree
        - module: github.com/hashicorp/cli
          reason: 'no safe arguments, no dry run, no json mode'
          recommendations: [github.com/spf13/cobra]
        # ansi-text
        - module: github.com/acarl005/stripansi
          reason: no push since 2022
          recommendations: [github.com/charmbracelet/x/ansi]
        # ansi-text
        - module: github.com/muesli/reflow
          reason: last release 2021
          recommendations: [github.com/charmbracelet/x/ansi]
        # ansi-text
        - module: github.com/muesli/cancelreader
          reason: no release since 2022; the standard library does it in about 60 lines
          recommendations: [github.com/charmbracelet/x/ansi]
        # forms-and-live-ui
        - module: github.com/AlecAivazis/survey
          reason: archived in April 2024
          recommendations: [charm.land/huh/v2]
        # forms-and-live-ui
        - module: github.com/manifoldco/promptui
          reason: 'no accessible mode, no multi-step form'
          recommendations: [charm.land/huh/v2]
        # forms-and-live-ui
        - module: github.com/walles/moor
          reason: a second terminal framework for about 200 lines of pager
          recommendations: [charm.land/huh/v2]
        # forms-and-live-ui
        - module: github.com/jackdoe/go-pager
          reason: 'abandoned, for about 200 lines of pager'
          recommendations: [charm.land/huh/v2]
        # log
        - module: github.com/lmittmann/tint
          reason: 'a fine handler, but the Charm one is already linked'
          recommendations: [log/slog]
        # shell-quote
        - module: github.com/kballard/go-shellquote
          reason: last tag 2018
          recommendations: [al.essio.dev/pkg/shellescape]
        # confine-to-folder
        - module: github.com/cyphar/filepath-securejoin
          reason: superseded by os.Root; the fd form is Linux only and it follows links inside the root
          recommendations: [os]
        # confine-to-folder
        - module: github.com/google/safeopen
          reason: its own README defers to os.Root
          recommendations: [os]
        # confine-to-folder
        - module: github.com/containerd/continuity
          reason: 'RootPath resolves a string, so it checks then uses'
          recommendations: [os]
        # path-lock
        - module: github.com/alexflint/go-filemutex
          reason: blocking only, one maintainer, last release January 2024
          recommendations: [github.com/gofrs/flock]
        # path-lock
        - module: github.com/juju/fslock
          reason: archived 2016, LGPL
          recommendations: [github.com/gofrs/flock]
        # path-lock
        - module: github.com/nightlyone/lockfile
          reason: 'a pid file with staleness, which goes stale'
          recommendations: [github.com/gofrs/flock]
        # app-folders
        - module: github.com/adrg/xdg
          reason: 'its macOS default is the Library folder, its variables are read at init, one maintainer'
          recommendations: [github.com/birdtable/go-files]
        # app-folders
        - module: github.com/kirsle/configdir
          reason: stale
          recommendations: [github.com/birdtable/go-files]
        # machine-facts
        - module: github.com/mackerelio/go-osstat
          reason: lighter but no Windows load either; second choice
          recommendations: [github.com/birdtable/go-proc]
        # machine-facts
        - module: github.com/prometheus/procfs
          reason: Linux only
          recommendations: [github.com/birdtable/go-proc]
        # machine-facts
        - module: github.com/elastic/go-sysinfo
          reason: macOS needs cgo
          recommendations: [github.com/birdtable/go-proc]
        # machine-facts
        - module: go.uber.org/automaxprocs
          reason: superseded by the runtime since Go 1.25
          recommendations: [github.com/birdtable/go-proc]
        # login-service
        - module: github.com/kardianos/service
          reason: 'no timers, Windows needs an administrator, Zlib licence, fixed templates'
          recommendations: [github.com/birdtable/go-proc]
        # login-service
        - module: howett.net/plist
          reason: an encoder for about 60 lines of fixed text
          recommendations: [github.com/birdtable/go-proc]
        # login-service
        - module: github.com/takama/daemon
          reason: stale
          recommendations: [github.com/birdtable/go-proc]
        # sandbox
        - module: github.com/elastic/go-seccomp-bpf
          reason: 64-bit argument compare and arch-mismatch issues are open
          recommendations: [github.com/birdtable/go-proc]
        # sandbox
        - module: github.com/seccomp/libseccomp-golang
          reason: cgo
          recommendations: [github.com/birdtable/go-proc]
        # sandbox
        - module: github.com/criyle/go-sandbox
          reason: a judge sandbox needing root
          recommendations: [github.com/birdtable/go-proc]
        # sandbox
        - module: github.com/tailscale/wf
          reason: a firewall tool needing administrator
          recommendations: [github.com/birdtable/go-proc]
        # unix-socket-listen
        - module: github.com/cloudflare/tableflip
          reason: 'fd handover for upgrades, a different job'
          recommendations: [github.com/birdtable/go-socket]
        # unix-socket-listen
        - module: github.com/ory/graceful
          reason: one server only; signal glue
          recommendations: [github.com/birdtable/go-socket]
        # unix-socket-listen
        - module: github.com/pseidemann/finish
          reason: one server only; signal glue
          recommendations: [github.com/birdtable/go-socket]
        # unix-socket-listen
        - module: github.com/libp2p/go-socket-activation
          reason: no gain over go-systemd
          recommendations: [github.com/birdtable/go-socket]
        # peer-identity
        - module: github.com/tailscale/peercred
          reason: no tag, last push January 2025, Unix only, 16 stars
          recommendations: [github.com/birdtable/go-socket]
        # peer-identity
        - module: github.com/natefinch/npipe
          reason: no ACL, unmaintained
          recommendations: [github.com/birdtable/go-socket]
        # epub-and-crawl
        - module: github.com/raitucarp/epub
          reason: runner-up; the switch target if go-epub is archived
          recommendations: [github.com/go-shiori/go-epub]
        # std-synctest
        - module: github.com/benbjohnson/clock
          reason: the standard library has a fake clock for tests
          recommendations: [testing/synctest]
        # std-synctest
        - module: github.com/jonboulle/clockwork
          reason: the standard library has a fake clock for tests
          recommendations: [testing/synctest]
        # std-synctest
        - module: github.com/coder/quartz
          reason: the standard library has a fake clock for tests
          recommendations: [testing/synctest]

    gosec:
      # supply.scans.3: every rule runs, G201, G202, G204 and G404 among them, and no
      # includes or excludes list narrows it; an exclusion below names its rule
      # ids, its paths and its reason (internal/contexts_test.go holds the four).
      config:
        global:
          # cli.process.1, gates.exemptions.1: a #nosec comment silences
          # nothing; a suppression is a nolint with its reason, counted.
          nosec: true

    govet:
      enable:
        - waitgroup # go.concurrency.2 (on top of the default analyzers, code.format.2)

    iface:
      enable: # arch.ports.10
        - identical
        - unused
        - opaque

    interfacebloat:
      max: 10 # go.style.1

    nolintlint:
      # gates.exemptions.1, gates.exemptions.2
      allow-unused: false
      require-explanation: true
      require-specific: true

    paralleltest:
      # go.cycle.2, tests.runners.4: a test that runs alone is written
      # //nolint:paralleltest // serial: <the process state it needs>; the
      # project's suppression list holds the text, since nolintlint cannot.
      ignore-missing: false
      ignore-missing-subtests: false

    revive:
      rules:
        - name: early-return # code.idioms.1
        - name: indent-error-flow # code.idioms.1
        - name: exported # code.naming.1 (stutter check on), code.comments.4
        - name: var-naming # code.naming.1
        - name: package-naming # arch.structure.7
          arguments:
            - check-extra-bad-name: true
              user-defined-bad-names: [helpers, types, models, interfaces, base, other, misc]
        - name: argument-limit # code.size.4
          arguments: [6]
        - name: deep-exit # go.errors.4
        - name: datarace # go.concurrency.2
        - name: waitgroup-by-value # go.concurrency.2
        - name: forbidden-call-in-wg-go # go.concurrency.2

    sloglint:
      # go.logging.1, go.logging.2
      no-global: all
      static-msg: true
      kv-only: true

    thelper:
      # go.style.5: a helper calls t.Helper first. Where the testing value sits
      # in the parameters and what it is named are not the rule.
      test: {begin: true, first: false, name: false}
      benchmark: {begin: true, first: false, name: false}
      tb: {begin: true, first: false, name: false}
      fuzz: {begin: true, first: false, name: false}

    staticcheck:
      # code.format.2: all groups, the non-default ST checks off except
      # ST1003, which code.naming.1 asks for. ST1005 stays on (go.errors.5 is
      # not ruled yet; a project that keeps sentence-style errors excludes it).
      checks:
        - all
        - -ST1000
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

  exclusions:
    # code.comments.4: no exclusion presets, so the comments preset stays off.
    presets: []
    # cli.process.1, gates.exemptions.1: a generated-file header silences no
    # linter; golangci-lint v2 reads one loosely by default and drops the whole
    # file. A suppression is a nolint with its reason, counted.
    generated: disable
    # Keep this list last in the file: a project's own exclusion rules are
    # list items appended below its overrides line.
    rules:
      # >>> generated by gragas gen from layers.yaml: the Clock adapter's exclusion
      # Only the Clock adapter's package reads the clock; its tests are held too.
      - path: '(^|/)internal/host/clock/[^/]+\.go$'
        linters: [forbidigo]
        text: "arch\\.ports\\.1: only the Clock adapter reads the clock"
      # <<< generated by gragas gen: the Clock adapter's exclusion
      # >>> generated by gragas gen from layers.yaml: the program adapters' exclusion
      # Only an outside program's adapter starts it, by the checked path its
      # setting names; its non-test files alone are spared G204 and the ban of exec.Command.
      # the adapter of git
      - path: '^internal/host/git/([^/]{0,4}|[^/]*([^/_][^/]{4}|_[^/t][^/]{3}|_t[^/e][^/]{2}|_te[^/s][^/]|_tes[^/t]))\.go$'
        linters: [gosec]
        text: "G204:"
      - path: '^internal/host/git/([^/]{0,4}|[^/]*([^/_][^/]{4}|_[^/t][^/]{3}|_t[^/e][^/]{2}|_te[^/s][^/]|_tes[^/t]))\.go$'
        linters: [forbidigo]
        text: "cli\\.process\\.1: a program starts through the runner"
      # the adapter of enforcer
      - path: '^internal/host/tool/([^/]{0,4}|[^/]*([^/_][^/]{4}|_[^/t][^/]{3}|_t[^/e][^/]{2}|_te[^/s][^/]|_tes[^/t]))\.go$'
        linters: [gosec]
        text: "G204:"
      - path: '^internal/host/tool/([^/]{0,4}|[^/]*([^/_][^/]{4}|_[^/t][^/]{3}|_t[^/e][^/]{2}|_te[^/s][^/]|_tes[^/t]))\.go$'
        linters: [forbidigo]
        text: "cli\\.process\\.1: a program starts through the runner"
      # <<< generated by gragas gen: the program adapters' exclusion
      # >>> generated by gragas gen from gate/shared.yaml: the owners' own calls
      # internal/host/fs owns lock, so it makes the calls.
      - path: '(^|/)internal/host/fs/[^/]+\.go$'
        linters: [forbidigo]
        text: "arch\\.shared\\.8: lock belongs to "
      # internal/digest owns digest, so it makes the calls.
      - path: '(^|/)internal/digest/[^/]+\.go$'
        linters: [forbidigo]
        text: "arch\\.shared\\.8: digest belongs to "
      # internal/journeys may make digest's calls too: tests.journeys.2: its tests sum on their own
      - path: '(^|/)internal/journeys/[^/]+\.go$'
        linters: [forbidigo]
        text: "arch\\.shared\\.8: digest belongs to "
      # internal/host/fs owns atomic-write, so it makes the calls.
      - path: '(^|/)internal/host/fs/[^/]+\.go$'
        linters: [forbidigo]
        text: "arch\\.shared\\.8: atomic-write belongs to "
      # test files may make atomic-write's calls until the test files' raw calls move onto go-files' write helper: test files still make the raw calls the module's helper will take over
      - path: '_test\.go$'
        linters: [forbidigo]
        text: "arch\\.shared\\.8: atomic-write belongs to "
      # internal/host/fs owns capped-read, so it makes the calls.
      - path: '(^|/)internal/host/fs/[^/]+\.go$'
        linters: [forbidigo]
        text: "arch\\.shared\\.8: capped-read belongs to "
      # cmd/gragas-dev may make capped-read's calls too: fetch caps the body of a download, which is a stream and no file in a root
      - path: '(^|/)cmd/gragas-dev/[^/]+\.go$'
        linters: [forbidigo]
        text: "arch\\.shared\\.8: capped-read belongs to "
      # internal/core/api may make capped-read's calls too: the audit reads each file through an fs.FS its caller hands it, which confine cannot open
      - path: '(^|/)internal/core/api/[^/]+\.go$'
        linters: [forbidigo]
        text: "arch\\.shared\\.8: capped-read belongs to "
      # internal/host/git may make capped-read's calls too: a named file is compared with the one checked, by SameFile, before it is read
      - path: '(^|/)internal/host/git/[^/]+\.go$'
        linters: [forbidigo]
        text: "arch\\.shared\\.8: capped-read belongs to "
      # <<< generated by gragas gen: the owners' own calls
      # go.errors.1, code.idioms.3, code.size.3, code.duplication.1: non-test
      # code only; a test's table of cases repeats by design.
      - path: _test\.go$
        linters: [dupl, errcheck, exhaustive, gocognit]
      # supply.scans.3: a test reads and writes its own temp folders and testdata,
      # builds its inputs from planted values, and plants credential-shaped strings
      # that the secret scan reads with every file; G104 is errcheck's, as above.
      - path: _test\.go$
        linters: [gosec]
        text: "G(101|104|115|122|301|302|304|306|703):"
      # go.errors.3, go.errors.4: main and tests may panic and exit.
      - path: (^|/)cmd/|_test\.go$
        linters: [forbidigo]
        text: "go\\.errors\\.[34]:"
      # go.concurrency.1: a root context is made in main and in tests.
      - path: (^|/)cmd/[^/]+/main\.go$|_test\.go$
        linters: [forbidigo]
        text: "go\\.concurrency\\.1:"
      # cli.config.3: the config package and main read the environment; only
      # the config package's own files, not a package below it. A test reads
      # it with std.
      # per-project: add the terminal module path.
      - path: (^|/)cmd/[^/]+/main\.go$|(^|/)internal/config/[^/]+\.go$|_test\.go$
        linters: [forbidigo]
        text: "cli\\.config\\.3:"
      # cli.process.1: a test starts the programs it tests with std; the
      # runner's own files and a project's other callers are named here.
      - path: _test\.go$
        linters: [forbidigo]
        text: "cli\\.process\\.1: a program starts through the runner"
      # gragas starts its programs, each from its one adapter (arch.ports.6, the
      # generated block below): git from internal/host/git and an enforcer from the
      # one run file of internal/host/tool. A test calls exec with std, as the base
      # says. The files that are not tests and run others: go, and the built
      # binary in the journeys (internal/journeys, internal/config/testing). The
      # dev tools start go and git (cmd/gragas-dev); the release command starts go,
      # git ls-tree of the clone it checks and the binary it
      # unpacked, from its one file, cmd/gragas-release/toolchain.go. The docs
      # checks (internal/repo/docs) run git ls-files to list the
      # tracked files; the generator's copy of the tree lists them the same way,
      # from cmd/gragas-new/check.go.
      - path: ^internal/(journeys|config/testing)/
        linters: [forbidigo]
        text: "cli\\.process\\.1: a program starts through the runner"
      - path: ^cmd/gragas-dev/
        linters: [forbidigo]
        text: "cli\\.process\\.1: a program starts through the runner"
      - path: ^cmd/gragas-new/check\.go$
        linters: [forbidigo]
        text: "cli\\.process\\.1: a program starts through the runner"
      - path: ^cmd/gragas-release/toolchain\.go$
        linters: [forbidigo]
        text: "cli\\.process\\.1: a program starts through the runner"
      # cli.errors.3: main wires the process streams into run.
      # per-project: add the terminal module path.
      - path: (^|/)cmd/[^/]+/main\.go$
        linters: [forbidigo]
        text: "cli\\.errors\\.3:"
      # cli.output.2: only the command path is checked: cmd/ and the command
      # tree under internal/cli/.
      # per-project: add the root command file.
      - path-except: (^|/)cmd/|(^|/)internal/cli/
        linters: [forbidigo]
        text: "cli\\.output\\.2:"
      # tests.admission.5, tests.isolation.6: test files only.
      - path-except: _test\.go$
        linters: [forbidigo]
        text: "tests\\.(admission\\.5|isolation\\.6):"
# gragas: project overrides
      # ParseYAML is banned in the gate registry, the repo checks and the dev tool only.
      - path-except: ^(internal/dev/gate|internal/repo|cmd/gragas-dev)/
        linters: [forbidigo]
        text: "gates\\.readers\\.1:"
      # filepath.EvalSymlinks is banned in the tests of host/fs only.
      - path-except: ^internal/host/fs/[^/]*_test\.go$
        linters: [forbidigo]
        text: "arch\\.ports\\.24: a test of host/fs resolves a root"
      # path.IsAbs and path.Clean are banned for the code of a local path; each
      # exclusion is slash-path code, which the model's tree and a URL spell with slashes.
      # The command layer and the proof judge slash paths of the model's tree.
      - path: ^internal/(core/api|core/proof|apply)/
        linters: [forbidigo]
        text: "arch\\.ports\\.24: a local path is judged with filepath"
      # The in-memory world's names and the sandbox's one file of names are slash paths too.
      - path: ^internal/port/testing/|^internal/host/sandbox/sandbox\.go$
        linters: [forbidigo]
        text: "arch\\.ports\\.24: a local path is judged with filepath"
      # The contract test's sandbox check and the fixture and deprecation readers name slash paths of the contract.
      - path: ^internal/(port/contracttest/sandbox|core/contract/(fixture|deprecated))\.go$
        linters: [forbidigo]
        text: "arch\\.ports\\.24: a local path is judged with filepath"
      # The audit's extension and the link check read slash paths of the tracked tree.
      - path: ^internal/core/(audit/extend|link/checkers)\.go$
        linters: [forbidigo]
        text: "arch\\.ports\\.24: a local path is judged with filepath"
      # The tool adapter judges the slash paths of a package's files and of a script's interpreter chain.
      - path: ^internal/host/tool/(packagebin|locate|trust)\.go$
        linters: [forbidigo]
        text: "arch\\.ports\\.24: a local path is judged with filepath"
      # The persisted name is the model's slash name, and the release's archive member names are slash names.
      - path: ^(internal/config/(persisted|tools_test)|cmd/gragas-release/archive)\.go$
        linters: [forbidigo]
        text: "arch\\.ports\\.24: a local path is judged with filepath"
      # The root package's os-code test reads the slash names of the allow-lists.
      - path: ^internal/oscode_test\.go$
        linters: [forbidigo]
        text: "arch\\.ports\\.24: a local path is judged with filepath"
      # The three files that still name syscall or x/sys, each until
      # the OS audit row that replaces it lands;
      # a fourth file is not spared, and the row's own file is deleted with
      # its exclusion.
      # remote_deadline_unix_test: rows 67 and 97, go-proc proc.Start, Stop and Usage.
      - path: ^internal/host/git/remote_deadline_unix_test\.go$
        linters: [depguard]
        text: "arch\\.ports\\.24: no (syscall|golang\\.org/x/sys):"
      # owned_unix_test: rows 165-168 and 601, go-files trust and go-proc's G8, G12, G16.
      - path: ^internal/host/trust/owned_unix_test\.go$
        linters: [depguard]
        text: "arch\\.ports\\.24: no (syscall|golang\\.org/x/sys):"
      # blocked_test: rows 25, 27 and 28, std ErrPermission and go-proc's G6, G13.
      - path: ^internal/journeys/blocked_test\.go$
        linters: [depguard]
        text: "arch\\.ports\\.24: no (syscall|golang\\.org/x/sys):"
      # The admin-group test gives a folder to a group with os.Chown, which
      # go-files' trusttest has no helper for; the exclusion goes with the
      # helper, and a second file is not spared.
      - path: ^internal/host/trust/trust_test\.go$
        linters: [forbidigo]
        text: "arch\\.ports\\.24: the meaning of an account"
      # go.layout.3: no replace lines, but seven: go.mod replaces go-files, go-run, go-testkit,
      # go-socket, go-console and go-proc each at its pin. The text names the paths; internal/closure_test.go
      # holds each target. Each leaves with its library's public tag.
      - path: ^go\.mod$
        linters: [gomoddirectives]
        text: "replacement are not allowed: github\\.com/birdtable/(go-files|go-run|go-testkit|go-testkit/contain|go-socket|go-console|go-proc)$"
      # cli.output.2: answer.go is the root command's renderer, the one place
      # that writes a JSON document.
      - path: ^internal/cli/root/answer\.go$
        linters: [forbidigo]
