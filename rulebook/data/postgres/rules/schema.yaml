format: 3
part: postgres
concern: schema
rules:
  - id: postgres.schema.1
    statement: "Naming, check constraints, mandatory columns, primary keys, references and audit columns hold in the live schema; a reference to one of several kinds is a foreign key per kind in an exclusive arc, never a kind and an id in text; and a rule enforced in SQL is tested in SQL against the replayed migrations, never re-implemented in code to be tested."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A schema lint runs in the shared container: name casing, name inflection, mandatory columns, a primary key on every table, references and types, with ignores by identifier pattern. A status column has a check. An exclusive arc is one nullable foreign-key column per kind and a check that exactly one is set. A law the database enforces (a check, a trigger, a constraint) has a SQL test (pgTAP or plain SQL run by the test runner) on a database built from the migrations; a copy of the law in application code to test it is a second implementation and is refused in review."
      pros:
        - "A convention held only in migration text drifts from what the database actually holds. A kind-and-id text reference is one the database cannot check, and a law tested only through a copy in code proves the copy."
    sources:
      - ref: decision-65-postgres
        backs: rule
  - id: postgres.schema.2
    statement: "After replay, the application role reads and writes every table, tables with an update time have the update trigger, actor columns are not null, and no update sets a created field."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "The application role is named per service (<svc>_app); update-time tables have an updated_at trigger, and no update sets a created_* field."
      pros:
        - "A table the app role cannot reach, a missing trigger or a rewritten created field is invisible until production."
  - id: postgres.schema.3
    statement: "Every if-it-does-not-exist-insert is backed by a unique index or exclusion constraint on the same key, read back from the live catalogue by a test, and a status column has a check."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "A registry kept beside the repository lists the natural keys the repository layer claims; the catalogue test asserts a unique index for each. An ast-grep pattern flags a select followed by an insert on the same key in one function, to be listed or constrained."
      pros:
        - "Application-level uniqueness and association validations in Rails applications were shown to be violable under concurrent requests; the finding is about where an invariant must live."
    relations:
      relates:
        - store.schemas.3
    sources:
      - ref: bailis-feral-concurrency-control
        backs: rule
      - ref: p-03-data
        where: section 13
        backs: rule
  - id: postgres.schema.4
    statement: A generated rules catalogue is regenerated in the gate and fails on drift.
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "The catalogue file is named RULES-CATALOG.md in the reference, kept at a service root and regenerated by the gate."
      pros:
        - A catalogue that is not regenerated drifts from the rules it lists.
    relations:
      relates:
        - supply.provenance.4
  - id: postgres.schema.5
    statement: "A table that records facts is append-only: a trigger refuses UPDATE and DELETE for every role, the superuser included, and a test drives it."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The trigger raises on UPDATE and DELETE (and TRUNCATE where the engine allows a trigger on it); a grant alone is not enough because the superuser bypasses grants. A correction is a new row that refers to the one it corrects. The table is marked append-only in the model, so a new fact table gets the trigger from the same declaration."
      pros:
        - "A recorded fact that can be changed is not a record, and a trigger outlasts every application that writes to the table."
    sources:
      - ref: decision-65-postgres
        backs: rule
  - id: postgres.schema.6
    statement: "A library that owns tables keeps them in its own schema, migrated by the library at a pinned version, and only the program's own schema is held to the DDL its model generates."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "An auth library, a job queue or the migrator's ledger each get a Postgres schema of their own. The program never writes their tables by hand, and its migrations never touch them. Upgrading a library moves its pin and runs its own migrations."
      pros:
        - "A library schema lets a library be upgraded without touching the product's tables, and keeps the model-equals-DDL check (postgres.migrations.1) from failing on tables the model does not own."
    relations:
      relates:
        - postgres.migrations.1
    sources:
      - ref: decision-65-postgres
        backs: rule
