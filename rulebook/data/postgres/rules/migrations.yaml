format: 3
part: postgres
concern: migrations
rules:
  - id: postgres.migrations.1
    statement: "Migrations are numbered in order and append-only: a landed migration is never edited, each carries a checksum the runner checks, and the schema after replaying every migration equals the schema file and the DDL the data model generates."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The model is the one source (postgres.queries.1): the replayed schema is compared with the DDL generated from it, and a difference fails; the model is never regenerated from the replayed schema. A change to the schema is a new migration. The runner refuses to start when a landed migration's checksum differs from the one recorded when it ran."
      pros:
        - "A gap or a reorder changes what replay produces, a schema file that drifts from replay misleads the types and the review, and an edited landed migration means two databases that ran different text under one number."
    relations:
      relates:
        - postgres.queries.1
        - store.schemas.2
    sources:
      - ref: decision-65-postgres
        backs: rule
  - id: postgres.migrations.2
    statement: "No destructive migration (drop, truncate, destructive type change) without a written plan."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - "A destructive step cannot be undone by a down script, so the plan is the recovery."
  - id: postgres.migrations.3
    statement: "Migrations stay compatible with the running version, in the order expand, migrate, then contract."
    strength: must
    status: active
    origin: migrated
    reasoning:
      pros:
        - "A Lambda deploy runs old and new code together for a while, and a queue can deliver an old message to new code, so a migration that breaks the old code breaks the deploy."
    sources:
      - ref: ambler-sadalage-refactoring-databases
        backs: rule
      - ref: fowler-parallel-change
        backs: rule
      - ref: p-03-data
        where: section 14
        backs: rule
  - id: postgres.migrations.4
    statement: "A migration that starts an expand-and-contract change records the date by which the old column or table is removed and names the readers alive during the deploy; the gate fails a leftover past its date."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The date sits in the migration header as contract-by in the same register as other exemptions. The question for the readers is which ones will be alive during this deploy. The header line reads contract-by with a date, for example contract-by: <date>."
      pros:
        - "If the contract phase never runs you end up worse off, with two versions supported for good; agents add the new column and forget the old (inference). The transition is needed only when several clients are coupled to the schema."
    sources:
      - ref: fowler-parallel-change
        backs: rule
      - ref: ambler-sadalage-refactoring-databases
        backs: rule
      - ref: p-03-data
        where: section 14
        backs: rule
  - id: postgres.migrations.5
    statement: "Migration text has a class header and notes for renames, splits, merges and removals, no down scripts, no risky extensions, and states the delete behaviour of every reference; and a program that applies migrations at start backs up first, and restores the backup and refuses to start when a migration fails."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "No CREATE EXTENSION, dblink or foreign data wrapper; every REFERENCES states ON DELETE. With no down script the way back from a failed migration is the backup taken just before it; the program names the backup in its log and exits non-zero after restoring."
      pros:
        - "A down script gives false comfort for a step that cannot be reversed, and an unstated delete behaviour is a decision nobody made. A migration that fails halfway at start leaves a store no version can read unless the copy from just before is put back."
    sources:
      - ref: decision-65-postgres
        backs: rule
  - id: postgres.migrations.6
    statement: "A migration passes a lock lint: an index is built concurrently, a constraint is added in two phases, and a lock timeout is set and read back before the step runs."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "Squawk rules: require-concurrent-index-creation, require-timeout-settings, require-lock-timeout, constraint-missing-not-valid and adding-foreign-key-constraint, named from the project's documentation (exit code and config not confirmed). Atlas and eugene were considered. The pack binds a repository when it adopts Postgres. The lock timeout is the session setting lock_timeout, set and read back before the step runs."
      pros:
        - "A migration on nearly empty tables cost one payment company about 15 seconds of API downtime: the ALTER waited for a strong lock behind a long read and every later query queued behind it."
    sources:
      - ref: postgres-docs
        where: ALTER TABLE and CREATE INDEX
        backs: rule
      - ref: p-03-data
        where: section 8
        backs: rule
      - ref: decision-37
        backs: rule
  - id: postgres.migrations.7
    statement: "The migration runner sets a lock timeout and a statement timeout for the session that applies a migration, and a migration that waits behind a lock aborts, shown by a test."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "A deploy that hits the timeout fails and is retried. The test holds a lock from another connection and asserts the migration aborts within the timeout, and a second test reads SHOW lock_timeout in the migration session. The lint reads text; it cannot know the session setting or what runs on the table at that moment."
      pros:
        - "Removing long transactions, setting a lock timeout so aborting a deploy is better than stopping the app, and splitting changes are the remedy from the payment company's incident. Its post names lock types that the current manual names differently; the queue mechanism stands."
    relations:
      relates:
        - postgres.migrations.6
    sources:
      - ref: p-03-data
        where: section 8
        backs: rule
