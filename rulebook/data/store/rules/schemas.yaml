format: 3
part: store
concern: schemas
rules:
  - id: store.schemas.1
    statement: "Data files are data, so they are schema-valid, carry no logic or markup and hold only declared placeholders."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "Every data file validates against a JSON Schema in strict mode with no additional properties; a string pattern forbids markup and logic delimiters except declared placeholders. The check uses the validator as a library from the shared check, because the command-line wrapper had not been published since 2023. A string in a fixture such as <b> is the plant, and the schema sets additionalProperties: false. The wrapper that was rejected is ajv-cli."
      pros:
        - A data file that carries logic or markup becomes a program nobody reviews as one.
  - id: store.schemas.2
    statement: "A versioned file carries its version inside it and the reader says what it does with an older and a newer one; schema changes are forward-only numbered steps, each in one transaction with the version bump."
    strength: must
    status: active
    origin: migrated
    exemptions:
      - kinds:
          - no-persistent-files
        reason: It has nothing to upgrade.
    reasoning:
      definition: "A newer file is left untouched and reported. A step marked rebuild runs only in one runner on a dedicated connection, in this order: foreign keys off before BEGIN, BEGIN IMMEDIATE, create new, copy, drop old, rename new, a foreign-key check that must be empty or roll back, version bump, COMMIT, foreign keys on and read back. Shipped steps may not be edited (a diff against the last tag). Tests use one fixture per released version plus a next fixture. The foreign-key check is the engine call foreign_key_check. The shipped-steps-unchanged half is the recipe git diff <last tag> -- <steps dir>, run against the directory of steps."
      pros:
        - "One program renames a newer hours file aside, so a downgrade moves real data away. No repository tests a file written by build N against N-1 and N+1. Latent today: one program's migrations are column additions only, one has no foreign-key setting and one has no ALTER TABLE."
    sources:
      - ref: p-03-data
        where: section 6
        backs: rule
  - id: store.schemas.3
    statement: "A status column's vocabulary is declared once, in the casing the program declares, and compared across the schema check list, the code constants and the doc table; the status check is generated from the same declaration; tables are strict; and every check-then-insert has a unique constraint."
    strength: must
    status: active
    origin: migrated
    exemptions:
      - kinds:
          - no-embedded-store
        reason: It has no schema.
    reasoning:
      definition: "Each is read back from the schema by a test. The values follow the program's one declared casing (service.contract.10); the rulebook names no default. A scan flags a select followed by an insert on the same key with no unique index."
      pros:
        - "In one repository 64 checks and 30 strict tables exist; another has none because its index can be rebuilt. A status written in three places drifts."
    relations:
      relates:
        - service.contract.10
        - postgres.schema.3
    sources:
      - ref: p-03-data
        where: sections 5 and 13
        backs: rule
      - ref: decision-65-store
        backs: rule
  - id: store.schemas.4
    statement: A store that returns a time or an integer has a round-trip test asserting the stored form and the width.
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - no-embedded-store
        reason: It has no stored form.
    reasoning:
      pros:
        - A time or integer that truncates in the store reads back different from what was written.
  - id: store.schemas.5
    statement: "Each named real engine has a contract suite pinning concurrent writers, retry on conflict, order, time and integer width, and an engine version floor."
    strength: must
    status: active
    origin: migrated
    exemptions:
      - kinds:
          - no-store-engine
        reason: There is no engine to pin.
    reasoning:
      definition: "With one engine in use, the suite is the store's own test set and the floor is the part that bites now. A build-time read of the linked engine version is compared with a known-bad list, which is a protected path. The suite runs once per engine named on the port."
      pros:
        - The embedded driver bundles an engine version past a write-ahead-log reset bug fixed in 3.51.3. A bug in a version below the floor corrupts data silently.
    relations:
      relates:
        - postgres.engine.1
    sources:
      - ref: p-03-data
        where: "sections 2, 4 and 24"
        backs: rule
