kinds:
  - slug: cli
    name: Command-line program
    description: "A program a person or an agent runs from a terminal, one command at a time."
  - slug: daemon
    name: Long-running program
    description: A program that runs in the background under a service manager and is reached through a socket or a port.
  - slug: service
    name: Network service
    description: A program that answers requests over HTTP for other programs or for a page.
  - slug: web-app
    name: Web application
    description: "Pages a person uses in a browser, built from components and served by a program of the product."
  - slug: library
    name: Library
    description: "Code other code imports: a package or a module with no program of its own."
  - slug: site
    name: Static site
    description: "Pages built ahead of time and served as files, with little or no code in the browser."
  - slug: cloud-service
    name: Cloud service
    description: "A service run on a cloud provider's managed functions, tables and queues."
  - slug: docs
    name: Docs-only repository
    description: "A repository that holds Markdown, pages or nothing, with no program to build: its checks are the commit members and a members file that says so."
  - slug: no-identity
    name: No identity
    description: "A program with no visitor, no grant and no sign-in: every view is public data, so the rules that assume a signed-in person do not bind it."
  - slug: static-data
    name: Static data
    description: "A page that reads one published document and writes nothing to a server: it has no live connection, no reconnect and no write, so the rules about a live server do not bind it."
  - slug: capability-role
    name: capability-role
    description: "a facet of the part arch before the format; a rule scoped to it names this kind"
  - slug: no-readers
    name: no-readers
