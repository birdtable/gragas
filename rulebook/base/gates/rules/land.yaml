format: 3
part: gates
concern: land
rules:
  - id: gates.land.1
    statement: "Main moves only by a reviewed change whose merged tree the checks passed: the lander runs them on the merged tree, then squash-merges; where a repo has no lander, the owner fast-forwards main to the exact tree the pre-push hook passed, or has the gate run again on the merged tree first."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The change is reviewed (the author's own included), and the owner merges it or says to. Where a repo runs the lander, the lander checks out origin/main plus the squash in a scratch clone, runs the repo's own checks there (its Taskfile's pre-push tier, or make check in gragas), and only then squash-merges. Where it does not, the pre-push hook has run the full gate on the pushed tree (gates.hooks.1), and the owner either fast-forwards main to that exact commit, so the tree that moves main is the tree that ran, or, when main has moved since or the merge is a squash, has the gate run again on the merged tree before main moves: a squash onto a main that moved is a tree that never ran. There is no stamp, no stored verdict and no hash record: a pass is the run just made on the tree about to move main, never a claim carried from another tree, another machine or the author's word. In both forms nothing else moves main: no direct push to main and no merge of a tree the checks did not pass."
      pros:
        - "A merge path that skips the check is the path that gets used. With no hosted land job the binding between the tree that was merged and the run that passed it is that the run is made on that tree, just before the merge; a pass on one tree must never be claimed for another."
    relations:
      relates:
        - gates.hooks.1
        - gates.land.12
    sources:
      - ref: decision-50
        backs: rule
      - ref: decision-65-gates
        backs: rule
      - ref: operator-points
        backs: rule
      - ref: gragas-907-ticket
        where: the table rows gates.land.1 to gates.land.3
        backs: rule
  - id: gates.land.2
    statement: "A verdict is bound to the tree it judged, the land gate runs on the tree that was pushed, and changing the tree after a gate run means a new run."
    strength: must
    status: retired
    origin: migrated
    reasoning:
      definition: "Every land carries the gate summary of its tree (the verdict carries the commit's tree id; it lists the tree id, a test count and zero skipped). The lander accepts a verdict only for the tree it merges and re-runs the top tier when a merge changes the tree. An amend that keeps the tree keeps the verdict; any change reruns, so there is no ban on amending. The lander reads the verdict from the gate's own output or from a stored record keyed by tree, never from the author's report, and never from a stamp left by a session that may be cut off; the hand-in is read from the ref, not from the message."
      pros:
        - "A lead reported 14 chosen tests green where the whole package would have failed 4. The tree-keyed verdict is proven in one repo; two other repos have variants."
    relations:
      relates:
        - gates.land.3
    sources:
      - ref: decision-20
        backs: rule
      - ref: p-09-agentic-development
        where: section 4 O4
        backs: rule
  - id: gates.land.3
    statement: "Where a repo runs the lander, it recomputes a hash over the tree, the base and the rule set, and refuses a verdict record that it cannot recompute or whose base is stale."
    strength: must
    status: retired
    origin: migrated
    reasoning:
      definition: "Applies only to a repo that runs the lander (gates.land.1); a repo whose land step is the local gate and a reviewed merge has no verdict record. The record lists what was run and why the selector, not the author, chose it. A file with plausible fields typed by hand has the same shape as one written by the gate, so the lander does the arithmetic itself. The verdict lists what was selected and why."
      pros:
        - "A self-reported proof was the fault: a lead reported 14 chosen tests green where the whole package would have failed 4 (P-09 section 4 O4). Agents declare done early and prove subsets; the known way round is re-running a chosen subset through the gate, so the record lists the selection and its reason."
    relations:
      relates:
        - gates.land.1
    sources:
      - ref: p-09-agentic-development
        where: sections 4 and 6.4
        backs: rule
      - ref: decision-65-gates
        backs: rule
  - id: gates.land.4
    statement: "Where a repo runs the lander, the run record carries the plan with a hash over changes, rules and result, and the lander recomputes it."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Applies only to a repo that runs the lander (gates.land.1). The summary carries the plan: the base, head and merge-base ids, the rules hash, manifests hash and graph hash, the scope and its reasons, the selected domains, tests, stories and checks, and the plan hash. The lander recomputes the plan at the commit and compares the plan hash; a hand-edited plan with a stale hash is refused. For Go, the run record lists each skipped package with its reason keyed to the tree and the land step compares it (no plan hash yet)."
      pros:
        - "A plan that is only a file is the author's claim; a recomputed hash makes it the gate's."
    relations:
      relates:
        - gates.land.1
    sources:
      - ref: decision-65-gates
        backs: rule
  - id: gates.land.5
    statement: "A plan computed against a base that is not the current main tip is refused, with a message that names the rerun."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "The lander refuses a plan whose base is not the main tip and merge-base of the ref, or whose head is not the gated commit, with a message like \"plan computed against X, main is Y: re-run the land tier\"."
      pros:
        - A stale base lets a green result from an older tree stand for a newer one.
  - id: gates.land.6
    statement: "The land check is a runner over separate condition files, each with its own spec, and a new condition never edits the runner."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "One program with conditions as separate modules; a pack adds conditions and never edits the base runner. The proven land gate with its conditions is lifted as a shared piece, and a project adds only its own rules."
      pros:
        - A runner that every new condition edits is a gate whose own changes weaken it.
  - id: gates.land.7
    statement: "The land tier runs tests only for what the change can reach and every whole-program check, with a full run as backstop, fail closed, each skip proved."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Selected tests and stories at land, for affected domains only; every always-full check (gates.command.6) in full. The full suite runs at least every third release, and the post-land full run is the backstop. Each skipped package has a proved reason."
      pros:
        - "A full suite at every land misses the budget; selection without a backstop misses what selection missed."
    relations:
      relates:
        - gates.command.6
    sources:
      - ref: decision-18
        backs: rule
      - ref: decision-27
        backs: rule
  - id: gates.land.8
    statement: "A red release tier in the fresh checkout refuses the tag; the bad range is bisected and the miss becomes a permanent test."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The release recipe runs the release tier of the repo's own Taskfile in a fresh checkout of the commit it is about to tag, and a red run refuses the tag until the cause is fixed or reverted. There is no lock file and no record kept between runs: the next release runs the tier again on its own commit. The bad range is bisected with the full tier, the ticket that landed it is reopened, and the miss becomes a permanent test. On our side the check attaches to the release backstop, not to every land; there is no run after each land."
      pros:
        - "A red nobody stops compounds; the miss that got through selection teaches the planner only if it is kept."
    sources:
      - ref: decision-18
        backs: rule
      - ref: decision-27
        backs: rule
  - id: gates.land.9
    statement: A bound on how many changes may land without a full proof.
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "The land check refuses a land when main is more than 3 lands (not commits) past the last full-green full run. On our side it is counted in releases: at most two tags pass between full runs (the full run at least every third release)."
      pros:
        - Selection without a bound lets unproven changes pile up on main.
  - id: gates.land.10
    statement: A gate check on a built artefact is accepted only when the artefact records the tree it was built from.
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "For the web, a story check passes only on a built storybook whose stamp records the source commit and a dirty flag, where that commit equals HEAD or the planner proves no change in the story closure (stories and their imports, tool config, global style, `package-lock.json`, environment files, the design system version) between them; the full tier always rebuilds. For Go, the binary under journey tests runs as built, and the version output prints the commit, but nothing ties the binary under test to the tree."
      pros:
        - An old build passes checks that the new tree would fail.
  - id: gates.land.11
    statement: "A cached result counts only when a trusted runner wrote it under a key from the tree, lockfile and platform, and a fail is never cached."
    strength: must
    status: retired
    origin: migrated
    reasoning:
      definition: "The key is recomputed from the tree ids of the gated commit, the lockfile, the runtime version, the OS and the architecture (and the browser version for stories). The summary records whether the source was a run or the cache (`result-cache`) and the key. The full tier ignores the cache. A cache is trusted only for packages that read nothing the cache cannot see; a verdict names the OS and host."
      pros:
        - A cache keyed on less lets a result from a different platform or lockfile stand in.
    sources:
      - ref: gates-reasons-stated
        backs: rule
  - id: gates.land.12
    statement: "Where a repo lands trains, a train of changes is gated once, on its merged tree, before any of its changes lands; a change landed alone passes the same gate on the tree as pushed."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Applies only to a repo that lands trains of changes; a repo that merges one reviewed change at a time meets the second half through gates.land.1. The train builder compiles and vets the union of the train's trees before landing any of them. The land path comes first: many changes are not re-gated one by one."
      pros:
        - "Two semantic conflicts passed every file-overlap tool and only train builds caught them (two cases in the delivery record, P-09 O5)."
    relations:
      relates:
        - gates.land.1
    sources:
      - ref: p-09-agentic-development
        where: section 4 O5
        backs: rule
      - ref: decision-65-gates
        backs: rule
  - id: gates.land.13
    statement: "A green verdict survives a clean rebase, and landing many changes does not re-gate each."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "The verdict is keyed to the change's patch id (`git patch-id`) as well as the tree, so a clean rebase keeps it."
      pros:
        - "At a reference team one change ran to revision 9 when the lead wrote and revision 11 by 17:20Z; part of that is real fixes, not rebases."
  - id: gates.land.14
    statement: A heavy run is refused if a verdict for the tree already exists.
    strength: must
    status: retired
    origin: migrated
    reasoning:
      definition: The heavy-run wrapper refuses a run when the verdict store holds a verdict for the tree.
      pros:
        - At a reference team 98 of 201 heavy runs were a bare full gate repeated until the command refused.
    sources:
      - ref: gates-reasons-stated
        backs: rule
  - id: gates.land.15
    statement: "A stamp is a claim keyed to the exact tree, its settings and its tools, and it only lets a rerun on the same key be skipped; it is never keyed to a commit or an age, landing and release never take it as proof, and a member that reads a moving source pins that source by digest in the key."
    strength: may
    status: retired
    origin: migrated
    reasoning:
      definition: "A stamp is plain data that any process able to write the common git folder can write, so it is trusted only to skip a local rerun. gates.land.11 holds the key of a cached result; this rule holds what the stamp may and may not do. A stamp keyed to a commit id survives an amend that changes nothing, which is fine, and one keyed to an age vouches for code nobody ran, which is not. A vulnerability database or a remote list the member reads is part of the key as a digest, or the stamp is stale the moment the source moves. The landing proof is keyed to the candidate tree (gates.land.16), which is what makes a moved main stale nothing."
      pros:
        - "Two projects kept a stamp keyed to a 24-hour age; another organisation's landing read a stamp bound to the main branch's tip, so every landing staled every waiting green and 37 of 44 land commands in 8 hours landed nothing."
    relations:
      relates:
        - gates.land.11
        - gates.land.2
        - tests.selection.7
        - gates.land.16
    sources:
      - ref: gates-reasons-stated
        backs: rule
  - id: gates.land.16
    statement: "Approved, disjoint changes land as a train proved once on its merged tree; the proof is keyed to the candidate tree, so a landing that produces a tree already proved needs no rerun, landing makes one push, the next train is built on this train's squash and never on its verdict commit, and a train of one is a train."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "gates.land.12 holds that a train is gated once on its merged tree. This rule holds the four things around it that cost proofs. The key is the candidate tree, not the main branch's tip, so a green that is still the same tree after main moved is still green. Landing pushes once, so there is one new tree per train. The next train starts from the squash that landed, because a verdict commit that never lands is not a base anyone can build on. A project with one builder lands trains of one with the same rule. A post-land run of the whole tree is retired where the landing proof is the whole merged tree (gates.land.12), because it proves nothing new and holds a slot."
      pros:
        - "One project ran 44 checks for 13 landings, 18 of them on a verdict commit that never lands, and two landing agents threw away 9 of each other's proofs; in another organisation 44 land commands in 8 hours landed 8 changes, 5.1 runs per change."
    relations:
      relates:
        - gates.land.12
        - gates.land.13
        - gates.land.15
    sources:
      - ref: gates-reasons-stated
        backs: rule
  - id: gates.land.17
    statement: "Where a project has protected paths, the landing judge is built from the main branch and run on the change, so a change cannot loosen the rules it is judged by; the judge is not the tier runner, a file the judge reads changes format in two steps, expand then contract, and everything else at landing runs the head's own tier."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "gates.protection.1 to .3 hold the verdicts and the list of protected paths. This rule holds which code runs the check. The judge is small and trusted, built from the base revision into its own folder; the tier runner is the head's own and runs the head's members. A format change to a file the judge reads (the members file, the protected list) lands first as a reader that accepts both forms, then as the writer of the new form, because the base's judge must still read the head's file. A project with no protected paths has no judge, and the hub lands it on the head's tier alone."
      pros:
        - "A head that changed the format of a file the judge reads was judged by code that could not read it and went red at landing; five projects with no judge needed the rule only where one exists."
    relations:
      relates:
        - gates.protection.1
        - gates.protection.3
        - gates.land.3
    sources:
      - ref: gates-reasons-stated
        backs: rule
  - id: gates.land.18
    statement: "A hand-off between agents carries a notice to the agent that waits, the wait is logged, and a red proof at or after landing says in the same message which main branch commit to build on."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A hand-off is a change passed from builder to reviewer, reviewer to lander, or lander back to builder. The notice goes to the one who waits, not to a channel they may read later, and the wait is a row where the hub counts rounds (gates.measures.5). When a landing proof is red, the message that says so names the last green main, so nobody waits for someone to name one."
      pros:
        - "Six engineers of one organisation waited 333 agent-minutes after a red post-land proof for someone to name a main branch commit, and four hand-offs with no notice idled 106 minutes in one day."
    relations:
      relates:
        - gates.measures.5
        - agents.delivery.1
    sources:
      - ref: gates-reasons-stated
        backs: rule
