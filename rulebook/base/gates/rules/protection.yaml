format: 3
part: gates
concern: protection
rules:
  - id: gates.protection.1
    statement: "Weakening a gate needs a non-author: a different session with a stored verdict tied to the content that names the weakening in words, checked at land."
    strength: must
    status: retired
    origin: migrated
    reasoning:
      definition: "Every agent pushes as one identity, so a trailer proves nothing: \"non-author\" means a different session with a stored verdict, content-hashed, which names the weakening in words. A named person signs only a short list: gate config, protected paths and new dependencies. The change records its reason. Weakening means raising a ceiling, removing a check, turning error to warn or off, narrowing where a rule applies, or deleting a plant. A change to a sensitive path (infrastructure and permissions, migrations, gate config, shared packages, the applies-to data) or a new dependency needs sign-off by someone other than the author. The trailer form (a `Gate-Change:` line naming a reviewer and a reason, checked by a `commit-msg` hook job) remains the record of the reason and the first, cheap check; the stored verdict is the one the land check relies on. The known way round is starting a second session to rubber-stamp, so the verdict must name the weakening in words and the list stays short enough for a person to sample."
      pros:
        - "No Gate-Change trailer exists in any of seven Go repos (0, verified), and nothing stores such a verdict. A sign-off passed as a land argument stops a missing and a self sign-off but not a land-runner who names someone falsely. This row rests on the ruling of 4 November."
    relations:
      relates:
        - gates.protection.2
        - gates.protection.3
        - gates.protection.4
    sources:
      - ref: decision-31
        backs: rule
      - ref: p-09-agentic-development
        where: section 9.2
        backs: rule
  - id: gates.protection.2
    statement: "Gate paths are named in one list, and the land check requires a stored second-party verdict for any staged path on that list."
    strength: must
    status: retired
    origin: migrated
    reasoning:
      definition: "The list (a committed file) holds lint config, suppression files, hooks, dependency-boundary config, the compiler config, the package registry config, the agent instruction file and the other gate files; the list itself and test oracles, goldens and protected fixtures are on it (gates.protection.3). A commit-message job checks staged paths against the one list, and the same job runs in the land hook. Domain-edge additions are named in the trailer, and the deny list covers the bypass class only. Message catalogues carry no trailer. Other sensitive paths (shared modules, state schema, infrastructure) are not yet on the list on the Go and UI sides."
      pros:
        - "0 mentions in any repo today, no grammar and no list (V-90)."
    relations:
      relates:
        - gates.protection.3
    sources:
      - ref: decision-31
        backs: rule
  - id: gates.protection.3
    statement: "An agent cannot widen a rule, plant, baseline, threshold, selector map or ban list in the change it judges; test oracles, goldens, protected fixtures and the protected-path list itself are on the protected list, which takes a path, a folder or a pattern with one * segment."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A pattern such as a command folder's testdata with one * for the command name protects every feature's golden without a line per feature, and a verdict covers the one feature's files it was given for: a rebase that leaves those files byte-identical keeps the verdict valid, so another feature landing first does not cost it. The * stands for one path segment and never crosses a slash, and the pattern grammar is held by the list's schema test. The shared package and its lock are not writable by the agent that consumes them, in the same change. The agent-side deny is a committed settings rule and an OS-level write deny, which makes the stored-verdict flow the only way in. A trailer alone proves nothing, and one GitHub identity means no branch protection or CODEOWNERS: the land check is the only holder."
      pros:
        - "One web repo's own check runs but its reviewer condition skips any path with no reviewer, and its scripts folder has none (V-65). Three reports asked for this with no row in the first merge."
    sources:
      - ref: decision-31
        backs: rule
  - id: gates.protection.4
    statement: "A review condition never skips a protected path, including one with no named reviewer."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: A path on the protected list with no named reviewer fails the condition instead of being skipped.
      pros:
        - "At one reference team the reviewer condition skipped any path with no reviewer, and its scripts folder had none (V-65)."
  - id: gates.protection.5
    statement: "When a candidate conflicts only in files a generator owns, landing regenerates them and continues; a conflict in any hand-written file goes back to the builder."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "A file is generator-owned when a generator in the repository's own tools writes it and gen --check holds it, and the landing step reads that list from the base revision, never from the candidate. When every conflicting path is on it, landing takes the base side, runs the generators, commits the result as the landing step's own commit, and runs the checks again; nothing is merged as text. One hand-written path among the conflicts returns the whole candidate to its builder, with the paths named. The regenerated files are never reviewed by hand, because the generator and its check are what a reviewer approved. The list of generated paths is read from the base revision's generators, built from the base, so a candidate cannot add a path to the list that judges it. A regenerate never changes a hand-written file: if running the generators would alter any path they do not own, the landing fails and the candidate returns to its builder. The regenerated tree is a new tree and gets the full proof: nothing is served from either side's stamp, and the generated-file check and the tier run on the result. A generated path that is also protected keeps needing a verdict on the regenerated bytes; landing never writes a verdict, and if the base holds none for those bytes the landing fails with the need and the digest."
      pros:
        - "The organisation's run log of 8 Nov 2026 (trains 2 and 2b) shows each landing sending the waiting candidates back through a rebase, a full check run and sometimes a new verdict. A conflict in a generated file is the part of that cost with no judgement in it: the fix is the command that wrote the file, and a builder adds nothing by running it."
    relations:
      relates:
        - gates.protection.3
        - arch.structure.9
    sources:
      - ref: kubectl-verify-docs
        says: Committed generated documents are held by a script that regenerates and compares.
        backs: rule
      - ref: kubernetes-verify-codegen
        says: Committed generated files are held by a script that fails when they are out of date.
        backs: rule
      - ref: git-gitattributes
        says: "A merge driver is defined in the clone's own configuration, never in the repository, and the union merge leaves added lines in an order the user must verify."
        backs: rule
