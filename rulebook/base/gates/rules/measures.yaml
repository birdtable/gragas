format: 3
part: gates
concern: measures
rules:
  - id: gates.measures.1
    statement: "A number on a page, in a status page or in the rulebook is produced by a script from the baseline or gate data and never typed by hand; a frozen number only falls."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Pages are rendered from data and the committed pages are diffed; any hand-typed number fails because the rendered page differs. A scan for numerals is not used: dates, ids and versions are numerals, a page with no numbers would pass, and a hand-typed number equal to a generated one would pass. Census scripts count the debt with a fixed command and print the input count. Every number in a doc has the command that produced it."
      pros:
        - "Numbers copied by hand into the criteria Today cells had wrong totals (V-28); a reference team typed 3 checks as enforced where the computed count was 0."
    sources:
      - ref: r-03-criteria-enforcement
        where: R03-23
        backs: rule
  - id: gates.measures.2
    statement: "A metric that cannot be measured prints null with its reason, never 0."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The baseline format prints null with a reason; a schema test rejects a numeric 0 where the metric is unmeasurable."
      pros:
        - A failed measurement that prints 0 reads as perfect.
    sources:
      - ref: gates-reasons-stated
        backs: rule
  - id: gates.measures.3
    statement: "A process measure with no honest limit trips a decision-point alarm: crossing it opens a recorded decision and does not fail the build."
    strength: should
    status: active
    origin: migrated
    reasoning:
      definition: "Each threshold is data and is labelled a guess. A crossing writes an item to the decision queue; land blocks until the decision is recorded. Examples: pipeline time, new-case fan-out, journey count. No agent is blocked at the moment of crossing, so there is nothing to game."
      pros:
        - It fills the space between a measure that nobody reads and a gate that blocks on a guess.
    sources:
      - ref: ford-bea
        where: chapters 4 and 8
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 7.1
        backs: rule
  - id: gates.measures.4
    statement: "Every boolean switch has a test for its non-default value, or a ticketed exemption."
    strength: may
    status: proposed
    origin: migrated
    reasoning:
      definition: Boolean switches are listed against test references in a report first (the boolean-switch-without-test list).
      pros:
        - A switch whose non-default value is never run is dead configuration.
  - id: gates.measures.5
    statement: "A rule that measures review rounds or refused pushes names where the count is kept, because neither leaves a record on its own."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "Review by message leaves no review on GitHub, and a refused push is recorded nowhere. The count of review rounds of a pull request is kept where the reviewer's verdict is recorded: one record per round, written by the reviewer and never by the change's author. The count of refused pushes is kept by the hook that refuses them, as a field in that run's time record (one JSON file a run, in the git folder, which nothing appends to). Each count is a local claim and decides nothing: no stamp key, gate, land or release step reads it. A measure that cannot name its place prints null with the reason (gates.measures.1)."
      pros:
        - "A study could not say how many rounds a pull request took or how many pushes a gate refused, as no place held either number."
    relations:
      relates:
        - gates.measures.1
        - agents.review.6
    sources:
      - ref: birdtable-study-issue-641
        where: item 4
        says: "Review by message leaves no review on GitHub, and a refused push is recorded nowhere."
        backs: rule
  - id: gates.measures.6
    statement: "A green report says how many tests, files or stories each member ran and the delta against the merge base; a member that ran nothing is red, a count that fell against the merge base fails landing, and an instrument counts as a guard only once it has been seen to fail."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "gates.plants.8 holds that a check prints its input count and that zero inputs is not a pass unless declared. This rule holds the counts per member and the comparison. The count is read from the tool's own output, never from a list of files. The delta is against a count made on the merge base in the same run, not against a stored report, so a test script removed from a manifest, a target changed to do nothing, or a story set that stopped playing shows as a fall. A member that ran nothing is red whatever the tool's exit code: a Go package with no tests makes gotestsum print `EMPTY <package>` and `DONE 0 tests` and exit 0, so the tier reads that output and a member that found no test exits 1. A setting of the environment that selects or skips tests (`GOFLAGS` with `-run` or `-skip`) can hide a red test: when it leaves no test the zero count makes the member red, but when it leaves one (the Windows run's `-run=TestPass` gave `DONE 1 tests`, exit 0) only the fall of the count against the merge base shows it, and that holds only if the base ran without the flag: clearing the flag is the guard (gates.command.23), the count its backstop. A new instrument (a mutation run, a lint rule, a contrast check) is planted red once (gates.plants.1) before its green counts. Evidence: a spike on Linux and on Windows."
      pros:
        - "One organisation published two versions of a design system with no test script, 4 days 20 hours with 20 spec files unrun and a green gate; a green with 18 story plays unrun passed review; 13 of 14 mutation runs tested nothing; eleven instruments were green that had never been able to go red."
    relations:
      relates:
        - gates.plants.8
        - gates.plants.1
        - tests.selection.8
    sources:
      - ref: gragas-907-ticket
        where: "the table row gates.measures.6, the counts against the merge base"
        backs: rule
      - ref: gragas-926-linux-spike
        where: a package with no tests
        backs: rule
      - ref: gragas-926-windows-spike
        where: "a package with no tests, and GOFLAGS"
        backs: rule
  - id: gates.measures.7
    statement: "A gate's wall time excludes the time it waited for a slot; queue wait and slot hold print on their own lines, and a timed step records the load and whether it held a slot."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "tests.measures.1 holds that each tier's wall time is recorded with the load beside it. This rule holds what the wall time is: from the first member's start to the last member's end. The wait for a slot before that is a second number, and the time the slot was held is a third. A budget (tests.measures.2) is judged on the first number only. A step timed outside a slot at a high load says so, because its number is inflated by an amount nobody can state."
      pros:
        - "One organisation counted 11 minutes of queue as gate time against a 1.5 times limit and landed 0 of 5; its agents waited at least 2,846 minutes for slots in two days, a floor because the wait was logged only at its start."
    relations:
      relates:
        - tests.measures.1
        - tests.measures.2
        - gates.command.29
    sources:
      - ref: gates-reasons-stated
        backs: rule
