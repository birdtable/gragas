format: 3
part: supply
concern: release
rules:
  - id: supply.release.1
    statement: "A release is built from a clean annotated tag on main by one recipe that runs the full gate first and never pushes, an install is made only from such a build and reads the installed version back, and where something is published only the release workflow on the tag publishes it, with publish refused unless CI is set."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The release recipe (make release or its equivalent) refuses anything but a clean checkout of main, runs the full gate unless a local stamp shows that this exact tree passed it (gates.land.1), writes or checks the changelog entry (supply.release.5), tags with an annotated tag and builds. It never pushes; the person pushes the tag. An install or deploy refuses a checkout or build that is not exactly a clean release tag, and after installing reads the running program's version and commit back and compares them with the tag. Where something is published (a package, an image, a release page), only the release workflow triggered by the tag publishes it, with the publish job needing every test and build job (supply.release.6); a command refuses to publish when the CI environment variable is not set, and the first publish of a package is from the workflow too. There is no CI on every push and no run is scheduled: each release prints the age of the last whole run, and no weekly or other scheduled run is added. The recipe also runs non-blocking steps that need the network, such as the external link check (docs.links.1): each prints its findings and never stops the release."
      pros:
        - "A shared package can otherwise publish from a laptop with whatever the laptop holds, and an install from an untagged tree is a version nobody can name. The invariant three target repos share is one recipe from a clean tagged main after the full gate; CI is the only place that holds the publish token."
    relations:
      relates:
        - gates.land.1
        - supply.release.5
        - supply.release.6
        - docs.links.1
        - supply.workflows.1
    sources:
      - ref: decision-34
        backs: rule
      - ref: decision-14
        backs: rule
      - ref: decision-65-supply
        backs: rule
  - id: supply.release.2
    statement: "A release is refused on an API break that is not declared, checked before the tag is pushed."
    strength: must
    status: active
    origin: migrated
    reasoning:
      pros:
        - "A break the author did not declare turns every consumer's next bump into a surprise. The tag step is the last moment the check can run, because the tool refuses once the tag exists. A real break was found in the shared module."
    sources:
      - ref: supply-reasons-stated
        backs: rule
  - id: supply.release.3
    statement: "A release is the same bytes from any directory: the build strips paths, and a script builds twice from two paths and compares."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "It runs on the candidate at land when release files change, and again on the shipped artifact after publish as a report. The check is go build with -trimpath; a snapshot build (goreleaser build --snapshot) is made twice from two directories and compared with cmp."
      pros:
        - "A build that embeds its path cannot be reproduced; two hashes from two paths prove it, and the flag that strips paths removes the difference."
  - id: supply.release.4
    statement: "Release artifacts carry a checksum; an SBOM or a signature is added when a third party verifies it, and not before."
    strength: must
    status: retired
    origin: migrated
    reasoning:
      pros:
        - "A checksum lets a consumer detect corruption or substitution; heavier attestations cost work with no reader until a verifier exists."
    relations:
      relates:
        - supply.release.9
    sources:
      - ref: decision-65-supply
        backs: rule
    replaced_by: supply.release.9
  - id: supply.release.5
    statement: "Every release has a plain-words changelog entry that a person writes or rewrites, a tool proposes the version with a named override allowed, a program with an API names its API number in the entry, and the release recipe never pushes."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The entry is written per change (each change adds its item under Unreleased) or as a draft the release recipe makes from the commits for a person to rewrite before tagging; either way a person writes the words, in plain language with a bold lead and no file names, function names or internal ids. A tool proposes the next version from the history since the last tag (git-cliff in the Go repos, a change-notes tool in a web workspace; the tool is chosen per repo), and the recipe accepts a named override (VERSION=vX.Y.Z) for a person's choice. A program with a versioned API names the API number in each release's entry. The release check fails a tag whose entry is missing or still the untouched draft. The recipe scan is run by a gate scanner (gatescan) and bans git push in the recipe."
      pros:
        - "A tag with no entry gives consumers nothing to read, and a generated entry made of commit subjects is written for the author, not the reader. A version a tool proposes is not mistyped, and an override keeps the person's choice. A recipe that pushes releases without the person's last look."
    sources:
      - ref: decision-65-supply
        backs: rule
    bindings:
      - tool: goreleaser
        target: source
        key: changelog.disable
        severity: error
        rung: 0
        run_point: release
      - tool: changie
        target: source
        key: unreleasedDir
        severity: error
        rung: 0
        run_point: release
  - id: supply.release.6
    statement: "After the tag build and before publish, a release step unpacks the archive, runs version and one start test and compares its digest with the one the tests saw; the publish job needs every test and build job, the workflow has no conditional or continue-on-error, and the publishing job runs no project code."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "In the release workflow the publish job lists every test and build job as a need and runs only when all passed: no if: and no continue-on-error anywhere in the workflow, held by a test that reads the file. The publish job has no checkout of the project and runs none of its code; it only promotes the artifacts the build made (for example by undrafting a complete draft release). The publish job needs every job, has no if: and no continue-on-error, and runs none of the module's code. For a web project the archive's page is served and one start test is run. A page embedded in a daemon is tested through the daemon's archive. For a deployed function the bundle is unpacked, its handler invoked from the bundle, and its hash compared with the one the tests saw and with the code hash of the deployed function. A library ships no binary, so the Go rule has an exemption."
      pros:
        - "A bundle can differ from the source the tests ran against through bundler options or an optional dependency resolved at build time. A last-modified time shows the function was updated, not that its bytes are the ones that passed. In one web estate 4 of 72 faults showed only on a real server after release."
    sources:
      - ref: p-04-systems-and-delivery
        where: sections 11 and 23
        backs: rule
      - ref: decision-65-supply
        backs: rule
  - id: supply.release.7
    statement: "The program is compiled and vetted at push, on the one machine the gate runs on."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "One gate step runs go vet ./... at push for each system of the project's list (arch.ports.4), by GOOS on the one machine the gate runs on, as one step. It catches a compile fault only. What differs by system is the platform libraries' own proof, which is run on each system by loan and is not a leg of a product's gate."
      pros:
        - "A compile fault is invisible until a later tier if the push does not vet at all. (An earlier version of this rule asked for a vet per shipped GOOS, because one program built only on Linux failed in six packages on Linux-only calls; a product now holds no such calls.)"
    sources:
      - ref: supply-reasons-stated
        backs: rule
  - id: supply.release.8
    statement: "Binary size is recorded as a metric, not a gate."
    strength: should
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - "Five standard-library imports grew a binary 4.5 percent, which a 5 percent budget passes, so a budget gate would not have caught the growth that matters; the number is the value."
  - id: supply.release.9
    statement: "A release carries a checksum file listing every artifact; an SBOM, provenance and a signature are added the day a repo is public, and a container image is built from a base pinned by digest and runs as a non-root user."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Every release has a checksum file listing every artifact. A repo that is not public ships no SBOM, no provenance statement and no signature, and no check asks for them; the day a repo is made public its release config adds them wherever the place a release is published supports them (a package registry's provenance statement, a build attestation, an SBOM, a signed and notarized desktop build). An image is built by the release recipe from a base image pinned by digest, runs as a non-root user with a read-only filesystem except its volumes, whether the repo is public or not. What the publisher offers is read from its documentation when the release is set up and recorded in the release config; a publisher that adds provenance later is picked up by the next review of that config. Ruling: no SBOM or signing while private; a checksum file now, and an SBOM, provenance and a signature the day a repo is public."
      pros:
        - "A checksum lets a consumer detect corruption or substitution. Provenance, an SBOM and a pinned non-root base cost minutes once and age well; waiting for a third party to ask is waiting to be asked why not."
    relations:
      relates:
        - supply.release.4
    sources:
      - ref: decision-65-supply
        backs: rule
      - ref: gragas-907-ticket
        where: "the table row supply.release.9, a checksum file now"
        backs: rule
  - id: supply.release.10
    statement: "The release tier runs from a fresh clone of the tag, never from a working checkout; the release dry run is a release member with its cost listed; and a member that needs the tag says so and runs last."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "supply.release.1 holds that a release is built from a clean annotated tag by one recipe that runs the full gate first. This rule holds the members: the push tier plus the release members, all at once (gates.command.17), on a clone made from the tag so no file of a working checkout reaches the build. The dry run of the release tool is a member with its cost, so a broken release config is found before the release and not at it. A member that needs the tag to exist (the changelog check, the publish) declares it and runs after the others."
      pros:
        - "One project found its broken release config only at release, because the dry run was not a member; a release from a working checkout carries whatever that checkout holds."
    relations:
      relates:
        - supply.release.1
        - supply.release.3
        - gates.command.17
    sources:
      - ref: supply-reasons-stated
        backs: rule
  - id: supply.release.11
    statement: "A hosted release workflow maps its jobs to the members file and ends with the runner's report, installs once and never per job, and a reproducible build builds each artifact twice from two clean copies and compares byte for byte, one reproducibility proof for each artifact."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "supply.workflows.5 holds that a workflow which runs gate members runs the one gate command. This rule holds the release workflow's shape: each job is a member or a group of members of the release tier, the last job prints the runner's report with its counts (gates.measures.6), and the install runs once into a cache the jobs share. supply.release.3 holds the same bytes from any directory; this rule runs that proof for each artifact, two clean copies each, the artifacts in parallel (gates.command.18)."
      pros:
        - "Hosted release workflows of one organisation installed per job and had no success on record in seven repositories; a release that builds once cannot say its bytes are reproducible."
    relations:
      relates:
        - supply.workflows.5
        - supply.release.3
        - gates.measures.6
        - gates.command.18
    sources:
      - ref: supply-reasons-stated
        backs: rule
