format: 3
part: supply
concern: secrets
rules:
  - id: supply.secrets.1
    statement: "No secret is committed: one pinned secret scanner runs at commit and in the pre-push gate over the whole history, a land tier where one exists runs it again, and a finding is reported by rule, file and line without the value."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The scanner config is chosen explicitly and not picked up by accident. A staged-file scan runs at commit, and the gate command the pre-push hook runs scans every commit in the history and the working tree as it is. A land tier, where a repo has one, repeats the full scan; it is never the only full scan. The documentation example key is allowlisted by default and is not reported. The staged-file scan is gitleaks protect --staged (git --staged in current versions). The commit scan is one of the three standing gates shared across repos (the others are the armed hook and the pipefail check), run by the shared hook file over the staged changes."
      pros:
        - "A committed secret stays in history forever and must be rotated. The scan also reaches the web bundle, which must carry no secret. There is no hosted land job, so a full scan placed only at land never ran."
    relations:
      relates:
        - gates.hooks.7
    sources:
      - ref: decision-65-supply
        backs: rule
      - ref: operator-points
        backs: rule
  - id: supply.secrets.2
    statement: "Configuration holds a reference to a secret, never the value, and secrets are read through one required schema."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A secret never comes from a flag and is never printed. For a web page, variables it reads are in a typed schema and no secret reaches the bundle."
      pros:
        - "A value in configuration is copied into logs, images and every place the configuration goes; a reference is resolved only where it is used."
    sources:
      - ref: supply-reasons-stated
        backs: rule
  - id: supply.secrets.3
    statement: "Secret-shaped keys in public environment files fail, and no secret reaches the bundle."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "Public environment files hold only public values; a variable whose name looks like a secret fails the check."
      pros:
        - A secret in a public file ships to every browser.
    relations:
      relates:
        - gates.own-rules.5
        - supply.secrets.2
  - id: supply.secrets.4
    statement: "Forbidden names come from a list kept outside the repository with its words stored as hashes; every tracked file, branch name and pushed commit message is scanned against it, the check fails when the list cannot be read, and in a public repo every commit's author and committer email is a no-reply address."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The forbidden names are the private facts of the people and places a repo serves: employers, people, machines, networks, addresses, households and the software a deployment runs. The list lives outside the repository (a path set in the environment) and holds each word as a hash, so the guard does not spell what it guards. The scan reads every tracked file, the branch name and every commit message in the pushed range, matching whole words case-insensitively against the hashes. When the list path is unset or unreadable the check exits 2 (could not run), never 0. Examples, fixtures and docs use stand-in names from an explicit stand-in list and documentation address ranges. In a public repository the pre-push hook refuses a commit whose author or committer email is not the host's no-reply address."
      pros:
        - "A private name in history cannot be removed without rewriting it, and a public repository publishes every word of it. In one target repository a work email reached 217 commits before the check existed. A list kept in the repo would itself publish the names."
    sources:
      - ref: decision-65-supply
        backs: rule
    bindings:
      - tool: gragas
        target: source
        key: names
        severity: error
        rung: 0
        run_point: land
