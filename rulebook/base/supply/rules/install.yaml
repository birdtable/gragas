format: 3
part: supply
concern: install
rules:
  - id: supply.install.1
    statement: "One package manager, pinned, installs from the lockfile only; the lockfile is the pin, it is verified, and a version conflict is never hidden."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "For Go: go.sum is committed, go mod verify passes, builds use -mod=readonly, and no gate or release script uses -mod=mod or go get. For JavaScript: install with the frozen-lockfile form only, one package manager for the whole estate, and a peer mismatch fails the install instead of being silenced (a legacy-peer switch is removed). Go has no peer ranges, so that half does not transfer. The strict install form is --frozen-lockfile; peer mismatches are not hidden (legacy-peer-deps is removed). The gate scanner (gatescan) bans -mod=mod and go get in gate and release scripts."
      pros:
        - "An install that resolves again can differ by day. In the web estate a package manager that honours the cooldown refused a young locked entry while another passed it, so the choice of manager is part of the defence."
    sources:
      - ref: p-04-systems-and-delivery
        where: sections 12 and 13
        backs: rule
  - id: supply.install.2
    statement: "After the dependencies are installed, the build, the type-check and the tests run with the network blocked, and generated output comes from committed inputs."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "No CDN or latest-tag URL in a build config; no download at build time; a code generator's output fails the build when it did not compile. A build step that declares a fetch as its own input, such as a content build that reads a remote source, is exempt, because that fetch is the build's input. A Go build runs behind go-proc's network block (sandbox.Run) with GOFLAGS=-mod=readonly and GOPROXY=off; a JS build runs under a sandbox runtime with an empty domain allowlist. Where the system gives no block (Windows today: sandbox.ErrNoBlock) the run is refused by name and never made unblocked. Install itself needs the network and runs before. The install step is npm ci or its frozen equivalent; the build and type-check run after it with no network. A message-format plugin loads from disk through node_modules, not from a URL. The sandbox is @anthropic-ai/sandbox-runtime; a scan of gate and release scripts by gatescan bans -mod=mod and go get."
      pros:
        - "A build that reaches the network can differ by day and is an exfiltration route. How a block is made differs by system, so the rule names the behaviour and the refusal, never one means."
    sources:
      - ref: p-04-systems-and-delivery
        where: sections 12 and 13
        backs: rule
  - id: supply.install.3
    statement: "The manifest pins the package manager by name with an error on mismatch and a minimum version, so an old tool that would ignore a setting silently refuses to install."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: The settings check reads the package manager pin as part of the check-npmrc command of the reference.
      pros:
        - "A package manager older than the settings file ignores the settings, so the cooldown and install-script guards vanish without a message."
  - id: supply.install.4
    statement: "Direct code dependencies use exact versions, ranges are allowed only for peers, and the exact-pin rule covers code dependencies, not the images a program writes into a stack it deploys."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Every direct dependency in a manifest or module file names one exact version; a peer dependency may name a range. The rule is about code the build resolves. A stack file that a program writes for its owner (a compose file, a service unit) may follow an image's release tag and update by comparing the running digest with the registry; how such stacks are written is held by the daemon and deploy rules, not here. An image the release itself builds is pinned by digest (supply.release.9). The second opinion rule is prefer-absolute-version-dependencies (and the dev form)."
      pros:
        - A range on a direct dependency means two installs of one commit can differ. In the web baseline none of 32 direct dependencies was a range. Extending exact pins to the images a program deploys for its owner would forbid the update path that design chose on purpose.
    relations:
      relates:
        - supply.release.9
    sources:
      - ref: decision-65-supply
        backs: rule
  - id: supply.install.5
    statement: A shared package whose peer range lags a major tool is replaced or overridden on record.
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - "A peer range that excludes the installed major forces a silenced install, which hides every other peer conflict."
  - id: supply.install.6
    statement: No package runs an install script unless it is named on a reasoned allowlist.
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Either of two settings blocks scripts, and the last value wins as the package manager reads it. The few packages that need a script are rebuilt by an explicit step after an install with scripts off. Go modules run nothing at fetch, and the one native build step is removed by building without cgo, so the rule has no Go check. The npm form is ignore-scripts, with the allowlisted few rebuilt explicitly."
      pros:
        - "An install script runs arbitrary code on every machine that installs, which is the usual route of a package takeover."
    sources:
      - ref: supply-reasons-stated
        backs: rule
  - id: supply.install.7
    statement: "Every install-script allowlist entry names the package, an owner and a reason of at least ten characters; the file must parse, and an absent file is fine."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - An allowlist without owner and reason becomes a list nobody can review or expire.
  - id: supply.install.8
    statement: "No phantom imports: the lock has exactly the declared direct dependencies, a binary run by name is a declared dependency, in a workspace the root manifest holds no dependency a package imports, and each package declares exactly the siblings its import rules allow, checked both ways."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A bare package-runner call resolves an unlisted tool to whatever has that name, so every binary used must be a declared dependency. A non-flat install layout keeps an undeclared import from resolving. The install is the frozen-lockfile form so a mismatch fails. In a workspace, a dependency in the root manifest resolves from every file, so the root holds only workspace tooling that no package imports. Each package's manifest declares exactly the packages its units may import under the layer table (arch.layers.12): a declared sibling it may not import fails, and an allowed import it does not declare fails."
      pros:
        - "A package that resolves only because something else installed it breaks the day that other package changes, and a bare runner call can fetch a stranger. A root dependency hides the same phantom import inside a workspace."
    relations:
      relates:
        - arch.layers.12
    sources:
      - ref: decision-65-supply
        backs: rule
  - id: supply.install.9
    statement: "The toolchain is at one version in every project, with the same presets, the toolchain a gate ran on is the one the lockfile names, each dependency has one version across a workspace's packages, and siblings are linked as workspace dependencies."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A preflight on every gate host compares the runtime version with its pinned file, the package manager with the manifest field, and the frozen install offline, and lists missing tools; a non-zero result stops the gate. A runtime-major file is rendered from the template answer so one major holds across declarations. One preflight serves Go and web. The preflight frozen install is install --frozen-lockfile --offline. In a workspace each third-party dependency resolves to one version across all packages, and a package depends on a sibling only through a workspace link, never a published version of it."
      pros:
        - A gate that ran on a different toolchain than the lockfile names proves nothing about the shipped build. One tool version per estate removes a class of drift.
    sources:
      - ref: decision-17
        backs: rule
      - ref: decision-65-supply
        backs: rule
  - id: supply.install.10
    statement: "Each check tool has one pinned version and runs from the pinned install, passing its exit code through; no tool is run through a package runner that could fetch a same-named stranger."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A test fails if the runner's name appears in a shipped file. No go run of a package at a version at gate time, and no go get or -mod=mod in gate or release scripts. The licence checker is one of the tools run from the pinned install (license-checker with the others such as depcruise, spectral, cspell and markdownlint)."
      pros:
        - "A check that fetches its own tool at run time can be replaced by whatever has that name, and a changed version gives a changed verdict."
    sources:
      - ref: supply-reasons-stated
        backs: rule
  - id: supply.install.11
    statement: "The module tidy command leaves no diff, and the language version is one the estate supports."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - "A stale unused require is a dependency nobody chose, and an unsupported language version silently skips fixes."
    relations:
      relates:
        - supply.install.1
