format: 3
part: agents
concern: instructions
rules:
  - id: agents.instructions.1
    statement: "The instruction file is a short map that holds what a reader cannot find from the code, and a repo-wide invariant may live there as a numbered rule that code cites, each naming the check that holds it where one exists, while how a rule is checked leaves the file."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The file holds commands, traps, a where-to-look table and the repo's numbered invariants, not a repository overview, and each fact has one home. An invariant keeps its number for life and code cites it by number; its line is the rule and the name of its check, never the steps of the check. A number that code cites must exist in the file (docs.links.2). The repo-wide rules live in AGENTS.md, numbered, and code cites them by number. Its size is measured as a byte count per file that is a ratchet and only falls, and a report lists the lines whose rule id already has a check. A required list of headings is checked, and the file is size-checked. The reference organisation capped the pair of files at 12,000 characters, a figure no measurement of ours supports, so no limit is set here. The rule applies to AGENTS.md. The size check is ported from the UI repository's check-agents-md. The workflow of each repository validates its instruction file against the shared convention."
      pros:
        - "One controlled study found no gain in success and over 20 percent more cost from longer files, and every line is paid for on every run. Our own files are 33,282 B, 18,492 B and 8,811 B (and 4,400 B in another repository)."
    relations:
      relates:
        - docs.links.2
    sources:
      - ref: p-09-agentic-development
        where: sections 7.1 and 9.3
        backs: rule
      - ref: decision-65-agents
        backs: rule
  - id: agents.instructions.2
    statement: "Every backticked command and path in an instruction file resolves, and CLAUDE.md holds only the line that imports AGENTS.md."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Paths are checked against the tree with an allow list for runtime paths, make targets against the Makefile, scripts against the package manifest, and CLAUDE.md with an exact-match test for the import line. An audit also reports stale or contradictory lines and references to missing files or commands. READMEs point to AGENTS.md. AGENTS.md holds commands, traps and a where-to-look table."
      pros:
        - "A scan found dangling or unverifiable references in 7 of 7 AGENTS.md files, 3 truly dangling, and the same name-exists class holds for ticket faults."
    sources:
      - ref: agents-reasons-stated
        backs: rule
  - id: agents.instructions.3
    statement: "Rules load only when the paths they govern are touched, and an agent reads the instruction file, the ticket and every anchor it cites, in that order, before proposing or changing anything."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A nested AGENTS.md or a path-scoped rule file holds a kind's rules under that kind's directory (the closest file to the edited path wins), and the root file holds no rule id of a kind or framework pack. A pack loads its own rules. An anchor is any file, rule or decision the ticket names; the agent reads each before its first proposal, and a session-start hook can record the reads so a proposal made before them is flagged."
      pros:
        - "Rules in the root file are paid for on every task and then crowd out the instruction map; unmeasured beyond the same size study."
    sources:
      - ref: decision-65-agents
        backs: rule
  - id: agents.instructions.4
    statement: "A procedure an agent runs often ships as a skill that loads on use, and the instruction file points at it and does not repeat it."
    strength: may
    status: proposed
    origin: migrated
    reasoning:
      definition: "An agent uses the packaged procedures and generators (add a route, add a migration, does-it-exist lookups, build a page, plan a ticket) instead of improvising the steps. New pages and parts come from a generator or a golden page."
      pros:
        - A procedure written in the instruction file is paid for every run and drifts from the generator.
  - id: agents.instructions.5
    statement: "An agent can reach the current rules with no network and no sibling clone, because they are vendored at a tag and each vendored file equals its locked hash."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Agents find standards and decisions by text search on a checkout, not by a portal. Each vendored file is hashed against a lock file, and a rule lookup in a test with no network and no clone must succeed. A rule file reachable only by URL fails. Vendored tokens for UI projects follow the same rule."
      pros:
        - Agents run in directories that are not sibling clones.
    sources:
      - ref: decision-3
        backs: rule
      - ref: decision-4
        backs: rule
  - id: agents.instructions.6
    statement: "The first file an agent opens in an area is a good one, small and typical of how the area is written."
    strength: may
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - "An agent copies the first file it reads; one UI component file of 2,868 lines is the example agents copy."
    relations:
      relates:
        - docs.samples.4
  - id: agents.instructions.7
    statement: "Where a library ships its own agent instructions, take the version that does and link them from the project's instruction file."
    strength: may
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - The library authors know how the library is meant to be used.
