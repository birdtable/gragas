format: 3
part: agents
concern: review
rules:
  - id: agents.review.1
    statement: "A missing, stale or failing reviewer verdict for a touched area blocks landing, a pass is needed but never enough alone, the reviewer is a fresh session that did not write the code and re-runs the gate from a clean checkout of the tip with a count that differs from the close a finding, and load-bearing paths need a reviewer of a different model family from the author."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The land check reads one stored verdict file per lens, holding the lens, the model family, the content hash of the diff plus the card, and the verdict, and refuses a verdict that is missing, stale (the hash names another tree) or failing for any area the change touches (the area to reviewer map). A pass never clears a change by itself: an AI review is a sensor that opens a finding, and the person or gate closes it. Load-bearing paths are the protected-path list and the area-to-reviewer map; for them the reviewer must be of a different model family from the author, and the land check refuses the same family. A block is overridden only by a second reviewer of yet another model family, with a recorded reason and ticket (a reviewer-override trailer naming the reviewer, the reason and the ticket), and every override appears in the weekly digest. Same-family review shares blind spots. The reviewer is a session that wrote none of the change; it checks out the tip into a clean tree, runs the gate there and compares its counts (tests run, checks run, findings) with the counts the author's close reported; any difference is a finding in the verdict."
      pros:
        - "Argued: no study supports AI review as a verdict (principles report P-09 section 5.6). Our own evidence is that review finds faults: one project's designer agent found 31 of 72 and another's reviewers 16, and a spec-against- diff lens found a missing case that tests had not."
    relations:
      relates:
        - agents.review.2
        - agents.review.3
        - agents.review.4
    sources:
      - ref: decision-43
        backs: rule
      - ref: decision-31
        backs: rule
      - ref: decision-33
        backs: rule
      - ref: p-09-agentic-development
        where: sections 5.6 and 9.3
        backs: rule
      - ref: decision-65-agents
        backs: rule
  - id: agents.review.2
    statement: "Each judgement area has a read-only reviewer lens that returns a verdict for one concern, stored tied to the content and not the sha, run on the final content and given only the diff and the card."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A lens is read-only (read, search and list tools only) and the review runner, not the lens, writes its verdict file. For Go the areas are command-line output, state and daemon safety; for the web the areas are design system, accessibility, permissions, structure and spec-vs-diff. A model gives the pass or fail on a judgement rule such as is the name accurate or is the abstraction right."
      pros:
        - "A lens given more than the diff and the card can be steered by the author's account of the change, and a verdict tied to a sha goes stale on a rebase while the content is unchanged."
    relations:
      relates:
        - agents.review.3
    sources:
      - ref: decision-31
        backs: rule
      - ref: decision-33
        backs: rule
      - ref: p-09-agentic-development
        where: section 5.6
        backs: rule
  - id: agents.review.3
    statement: "A reviewer lens has its own plant, a stored bad diff it must fail and a clean control it must pass, before its verdicts count."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "At each change to the lens and at release the gate gives the lens the stored bad diff and requires a failing verdict that names the planted fault, plus a passing verdict on the clean control. Model output varies, so the run is repeated: the lens is promoted when it catches the planted fault in at least 9 of 10 runs and wrongly flags the clean control at most once, and a lens that passes the bad diff or fails the control is suspended. The stored bad diff holds a wrapper that only forwards and a swallowed error; the bad page for a web lens is a known bad page. A lens prompt reduced to always-pass is suspended. The lens itself is read-only."
      pros:
        - "An instrument that cannot fail carries no information, and a lens is a prompt that can drift with a model change."
    sources:
      - ref: decision-44
        backs: rule
      - ref: p-02-enforcement-and-measure
        backs: rule
      - ref: p-09-agentic-development
        where: section 5.6
        backs: rule
  - id: agents.review.4
    statement: "A change that crosses a trust boundary answers a short list of threat questions in the change: what is newly reachable, by whom, and what would an attacker try first."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "This is continuous threat modelling: a full model per story is too heavy. The baseline is kept with its notable changes. Paths marked as trust boundaries force the questions; a model judges the answers, and a reader checks them on sensitive paths."
      pros:
        - "An agent can invent an answer that passes any presence check, so the answer needs a reader."
    sources:
      - ref: tarandach-coles-threat-modeling
        where: "chapter 5, continuous threat modeling"
        backs: rule
      - ref: p-04-systems-and-delivery
        where: section 3
        backs: rule
  - id: agents.review.5
    statement: "Review reads for understanding and for the rows no check can hold: is the name accurate, is the abstraction right, and who owns the rule."
    strength: may
    status: proposed
    origin: migrated
    reasoning:
      definition: Each rule has one owner. The reviewer agent becomes a check only if its verdict blocks the land (agents.review.1).
      pros:
        - "Checks hold the mechanical rules; what remains is judgement that only a reader can make."
    relations:
      relates:
        - agents.review.1
  - id: agents.review.6
    statement: "When a review round finds another instance of a gap that an earlier round found, the reviewer asks for the fix to the kind of gap, with a check that fails on any new instance, and names where it belongs, not a fix of the one instance."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "The fix to a kind is the one place every instance goes through: the reader, the parser, the shared helper, the check. The reviewer names it in the round, and the builder changes that place and its test; a patch of the instance in hand is sent back. The check is a test, a lint rule or a tree scan that fails on the next instance of the kind, so the class cannot return unseen. A third round on the same kind means the second round did not name it."
      pros:
        - "One review went five rounds, one spelling of the same reference per round, and the fix to the kind (read the decoded data, not the raw text) came in round five; another project needed four pull requests for the same class."
    relations:
      relates:
        - agents.review.1
        - gates.measures.5
    sources:
      - ref: birdtable-study-issue-641
        where: item 2
        says: one spelling of the same token reference per round ... came only in round 5 ... needed 4 PRs for the same class.
        backs: rule
  - id: agents.review.7
    statement: "A fix round reviews only the delta, and the reviewer breaks each new guard by hand; a guard that no test catches when broken is a finding."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A guard is a check, a deny, a plant or a refusal the change adds. The reviewer makes the change the guard should refuse and sees it refused, then reverts. A project may hold this in test form as a planted violation and a fixed twin (gates.plants.1); the reviewer still breaks the one guard the plant does not cover. On a fix round the reviewer reads what changed since the last round and the record of that round, not the whole change again (agents.review.2)."
      pros:
        - "Every security change of one project needed two or more rounds, and breaking the guards found the ones the tests did not hold."
    relations:
      relates:
        - agents.review.2
        - agents.review.6
        - gates.plants.1
    sources:
      - ref: agents-reasons-stated
        backs: rule
