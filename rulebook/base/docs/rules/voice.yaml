format: 3
part: docs
concern: voice
rules:
  - id: docs.voice.1
    statement: "No em dash in any tracked file, no semicolon in text a program prints, and headings are in sentence case; docs may use the semicolon."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The em dash scan reads every tracked text file, code and data included; a repo's own rule format uses another separator. The semicolon scan reads the strings a program prints (messages, help, errors, status rows), not docs and not code syntax. The heading scan reads markdown, HTML and .astro files. Words kept in data files are exported as text for the scan to read. In source strings a lint rule rejects string literals that contain an em dash, and a printed-string literal that contains a semicolon. ESLint form: `no-restricted-syntax` on such literals. Biome form: a GritQL plugin on the same literals."
      pros:
        - "Punctuation style is checkable and drifts without a check; evidence D. An em dash is the mark that most often survives from generated text, and a semicolon in a terminal line splits one fact into two half-sentences."
    sources:
      - ref: p-03-data
        where: on shared vocabulary
        backs: rule
      - ref: decision-65-docs
        backs: rule
  - id: docs.voice.2
    statement: "Written output puts the point first and is honest about what it knows, text the program prints carries no joke, aside or personality and a status row is a fact, not a sentence, and a check refuses a filler-word list and the not-X-but-Y form in docs and printed text."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "There are two registers. Docs may be warm and may joke. Text the program prints (help, errors, status rows, prompts) is plain fact: no joke, aside, exclamation or first person, and a status row is a value with its label. A repo keeps one list of refused filler words and phrases in its style config, and the check also refuses the not-X-but-Y construction. Point-first order and honesty stay with the reader."
      pros:
        - "Printed text is read in a hurry and parsed by scripts, so personality there is noise; the filler patterns are the ones a model reaches for and a reader stops trusting. Tone, honesty and order cannot be checked by a pattern, so a reader or a model lens judges them."
    relations:
      relates:
        - docs.voice.1
        - docs.spelling.2
    sources:
      - ref: decision-65-docs
        backs: rule
  - id: docs.voice.3
    statement: "A measured figure in a doc carries its date, the machine and whose measurement it is, a claim about outside behaviour cites a source and what it says, and a doc that generalises from one machine says so."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "No figure claims more precision than its source: a source in whole units gives no decimal, an estimate is marked as one (≈), and a remainder the doc cannot explain is its own row, never spread over the rest. A doc says what it can and cannot promise. Generated figures carry the same three facts from the generator."
      pros:
        - "A number without its date and machine reads as a property of the product when it is one reading on one day, and a figure with more decimals than its source is a claim nobody measured."
    sources:
      - ref: decision-65-docs
        backs: rule
