format: 3
part: arch
concern: structure
rules:
  - id: arch.structure.1
    statement: "A new concern lands in exactly one door of a classification table and the change names it; a program cannot grow its own folder for a shared concern."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The doors are an existing module, a new module, a shared package, a design-system part, a generated client, an app-wide concern, a new library and a new check. The change names the door in a trailer. If none fits, the decision record of arch.decisions.2 comes first. The concern table gives one owner per concern. An agent cannot create a plumbing folder in a service, and there is no util or common package."
      pros:
        - "Without a table every agent invents a new place, and shared plumbing grows a private copy in each program."
    relations:
      relates:
        - arch.decisions.2
    sources:
      - ref: p-08-splitting
        where: section 18
        backs: rule
  - id: arch.structure.2
    statement: "An extension lands complete in one change: structure, rule, check with its plant, catalogue row, examples and docs."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "One change holds the structure (from the generator), the rule rows, each new check with its negative test, the catalogue row, stories and specs, the scope-rules entry, and the rulebook and page update. In Go, growing the foundation is one change record adding the rule, its check, its plant and its grid cell together. A living example per state and a catalogue entry for a part belong to the same change."
      pros:
        - "A rule without its plant or a part without its example is half added, and the half that is missing is the one a reviewer cannot see."
  - id: arch.structure.3
    statement: "Splitting, merging or renaming a module needs a decision, and a move or rename commit changes no behaviour and no baseline count; editing comes in a second commit."
    strength: should
    status: active
    origin: migrated
    reasoning:
      definition: "A move commit contains only renames at 100% similarity and import-path and package-clause edits; baseline keys are rewritten and counts left unchanged. A commit that marks itself as a move is checked, other commits are not. A move that lands before any behaviour change is the wanted result."
      pros:
        - "A move mixed with an edit cannot be reviewed as a move, and baselines reset when a rename is not recorded. Not measured in Go; the web rule holds it for the UI."
    sources:
      - ref: p-02-enforcement-and-measure
        where: section 5.14
        backs: rule
  - id: arch.structure.4
    statement: "A project declares its kind and its one framework and uses the stack the foundation lists for that kind; a package outside the list needs a written exception."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - web-app
    reasoning:
      definition: "The framework value is read from the project's parameter file. A second framework is refused by the import-side rule in the web part. Which framework per kind follows the foundation's by-kind answer, which is a recommendation: only some project rulings bind their own artefacts."
      pros:
        - "A stack the foundation did not list is a stack nobody maintains; the declared kind is what lets the right pack be applied."
    sources:
      - ref: decision-7
        backs: rule
  - id: arch.structure.5
    statement: "A new module, package or repository names the driver that a folder or namespace cannot meet, because a logical split comes before a physical one."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "Before a new package, shared library or repository is created, the change states the driver a folder or namespace inside the existing package cannot meet. A seeded change that creates a package with one importer must be flagged. A required field in the change template can be checked for presence only."
      pros:
        - "Companies reported going back to a coarser split after paying for a physical split they did not need, risking a distributed monolith. New packages are free for an agent to make, so the question has to come from outside."
    relations:
      relates:
        - arch.structure.1
    sources:
      - ref: ford-sathp
        where: chapter 3 on modularity drivers
        backs: rule
      - ref: p-08-splitting
        where: section 11
        backs: rule
  - id: arch.structure.6
    statement: "Things that change together live together, in the same folder shape across a kind of program, and the layout matches the template for that kind."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The folder-shape template for a kind says what folders must exist and which file kinds sit beside which; a missing or extra folder fails. Whether things belong together is judgement; the shape is mechanical. The Go program template is: cmd/<name> for each binary; under internal, core and core/api for the decisions and the operations every client calls; one port package holding the platform interfaces with its fake; slot packages that hold a registry each; adapters under host/<platform> and host/<tool>; door for the network front; config; cli/<group> for commands and cli/ui for terminal output. The import table between these folders is rule data read by the layer test (arch.layers.1), not prose. A new kind of program or a new language adds its own template under the same rule."
      pros:
        - "A census of 20 UI steps found 3 identical and 12 independent; the same shape across a kind is what lets a check and an agent find things. Two Go target designs name the same folders for core, port, adapters and commands, and a template that does not exist (the rule pointed at one) holds nothing."
    relations:
      relates:
        - arch.layers.1
    sources:
      - ref: decision-65-arch
        backs: rule
  - id: arch.structure.7
    statement: "A package or module is a unit of meaning: no catch-all names such as util, common, helpers, types or misc, and the phrase describing it needs no \"and\"."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The name deny-list holds util and common, the layer-type names helpers, types, models, interfaces and base, and the words other and misc, matched on the whole name. The names adapters, domain and port are the ports model's own and stay off the list. The word \"and\" in the description stays a review question: Go package names have no word breaks, and a substring match only gives false hits (standin-gate, standdown and ondemand all hit falsely)."
      pros:
        - "A run over 190 Go folder names in six repos found one hit, a package named base; the substring test for \"and\" hit three false names. A catch-all name invites everything."
    sources:
      - ref: tornhill-code-crime-scene
        where: chapters 5 and 10
        backs: rule
      - ref: p-01-core-programming
        where: section 20
        backs: rule
      - ref: p-08-splitting
        where: section 9
        backs: rule
    bindings:
      - tool: golangci-lint
        target: source
        key: revive
        severity: error
        rung: 0
        run_point: commit
  - id: arch.structure.8
    statement: "A refactor of a path in live use starts only after a merged contract test of what its consumers read, and a refactor that moves code that touches the system (files, processes, the network) behind ports records a transcript of every command's output first, with each step's transcript diff empty."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Before the first refactor commit on a path a consumer reads, a contract test of the fields and answers that consumer reads is merged (arch.ports.7 holds the contract; this rule holds its order). A refactor that moves such code behind ports records, before it starts, the output of every read-only command, the status and health commands and every dry run, and each step of the refactor reruns them and shows an empty diff; a step with a diff is a behaviour change and is split out. The transcripts are committed beside the tests and replaced only by the change that means to change the output."
      pros:
        - "A refactor without a pinned consumer contract finds its breakage in the consumer, after release. A port extraction touches every command at once, and only a recorded transcript shows that nothing a person reads moved."
    relations:
      relates:
        - arch.ports.7
    sources:
      - ref: decision-65-arch
        backs: rule
  - id: arch.structure.9
    statement: "A list that grows by one entry per feature is a folder of one file per entry, joined by a generator and held by gen --check; no feature edits a line another feature owns."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "Commands, gate members, planned items, surface marks and the notes an index points at are the usual lists. Adding an entry is a new file, and removing one is a deleted file; the one table the program or a reader needs is rendered from the folder by a generator, sorted by a key in the entries so no order list exists. A cross-cutting rule over the entries (\"every entry has two examples\") is a test that walks the joined result, not a column each feature edits. A generated join still conflicts as text when two changes add neighbours, and the fix is to run the generator (gates.protection.5). An index is generated too (docs.freshness.1): a person reads it and nobody edits it."
      pros:
        - "Own measure: in one repository a single new command edited a dozen shared files, and the run log of one working day shows each landing sending the queue back through a rebase and a full gate run. Surveyed projects avoid the same by putting each command in its own folder and walking the tree in a test."
    relations:
      relates:
        - gates.protection.5
        - docs.freshness.1
    sources:
      - ref: kubectl-cmd-sanity
        backs: rule
      - ref: helm-golden-output
        backs: rule
      - ref: cargo-commands-mod
        backs: rule
  - id: arch.structure.10
    statement: "A fact about a package, an export or a command (what it holds, why it imports what it imports, its stability mark) is written in that thing's own folder, and any central table of such facts is rendered from them."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "The fact sits where the thing's own author already edits: what a package holds in its package doc comment, an answer about an import in a file of the package's folder, a mark beside the export or in a per-package file, a command's usage text in the command's own file. The central table, the layer document or the usage page is a generator's output, so a change to one package edits one folder and one generated row. A column of prose in a table that every package change edits is the sign of a fact kept away from its thing. A table row keeps what is true of the layer itself, in one line."
      pros:
        - "Own measure: over three days one layer table was changed in 42 commits, and by changed line the paragraph each package says it holds took 92 lines, more than the lists of what may import what. Each package change edited a prose column that another package change also edited."
    relations:
      relates:
        - arch.structure.9
        - arch.layers.14
    sources:
      - ref: bazel-build-files
        says: "Build facts about a package live in a build file in that package's own folder, not in one table at the root."
        backs: rule
      - ref: kubernetes-owners
        says: "Who owns a directory is a file in that directory, inherited upward."
        backs: rule
