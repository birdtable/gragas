format: 3
part: arch
concern: measures
rules:
  - id: arch.measures.1
    statement: "Afferent and efferent coupling per package is reported, and a rise in a package's fan-out blocks until the change says why."
    strength: should
    status: active
    origin: migrated
    reasoning:
      definition: "Report Ca, Ce and instability per package. A package created after adoption may not exceed a fan-out ceiling (a guessed number), and a package not in the baseline whose Ce exceeds it fails. The cheap cure is a facade package that re-exports, so a fan-out line alone is easy to pass; the answered form needs no guessed ceiling."
      pros:
        - "In one repo the command package has Ce=43, the hook package 28 and the main package 25, and 3 of 325 edges run from stable to unstable."
    sources:
      - ref: go-review-r-02-donor-section-gap
        where: section 3.9
        backs: rule
  - id: arch.measures.2
    statement: "A commit that adds a provider reports how many core files and folders it changed, and a change that touches core files blocks until answered."
    strength: should
    status: active
    origin: migrated
    scope:
      kinds:
        - service
        - cli
        - daemon
    reasoning:
      definition: "On the change that adds a new case to an existing seam (a new adapter) report the files and folders touched outside the new adapter (git diff --name-only against the adapter globs), as a change-locality report. It reports the result of the seam, not its form, so renaming does not satisfy it. A decision-point alarm at a guessed level is optional."
      pros:
        - "A new launcher took 6 files in 1 package in one repo and a second OS took 69 code files in 21 folders in another; this is the measured result of arch.ports.1."
    relations:
      relates:
        - arch.ports.1
    sources:
      - ref: p-08-splitting
        where: section 5
        backs: rule
      - ref: p-08-splitting
        where: section 20.2 item 1
        backs: rule
  - id: arch.measures.3
    statement: "Change coupling across a boundary is computed per ticket or pull request, and a pair that crosses a boundary without a visible link blocks a review until answered."
    strength: should
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "Group file pairs by ticket or pull request, never by commit (per commit it means nothing at an agent's commit rate); ticket ids on commits make it possible. A pair crossing a package or repository boundary with no import link is printed at land (ticket-grouped file-pair coupling, cross-language pairs read first). The numbers (confidence 0.5, 3 tickets) are guesses."
      pros:
        - It is the one history idea with outcome support that was not computed. The trial rediscovered a known seam.
    sources:
      - ref: tornhill-code-crime-scene
        where: chapters 7 and 8 on temporal coupling
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 7.2 item 1
        backs: rule
  - id: arch.measures.4
    statement: "A package is judged by its exported surface, not its size; a rise in a package's exported count blocks until the change says why, and no size line is set."
    strength: should
    status: active
    origin: migrated
    reasoning:
      definition: "Report exported names per package at each tag from the generated listing of arch.shared.9, diffed between tags and printed. The count is read with the merge-candidate report of code.size."
      pros:
        - "One repo's command package has 117 non-test files and 37,566 non-blank lines, which no size line would have caught early; the surface shows the cost."
    relations:
      relates:
        - arch.shared.9
    sources:
      - ref: ousterhout-aposd
        where: chapter 4
        backs: rule
  - id: arch.measures.5
    statement: "A shared abstraction is watched after entry: releases that forced a consumer change, signature churn, option growth and callers using disjoint subsets."
    strength: should
    status: active
    origin: migrated
    scope:
      kinds:
        - service
        - web-app
    reasoning:
      definition: "Per-package release and consumer counts by release from the registry plus an exported-signature diff across tags. The question each report asks is whether this should be two packages, and whether all its callers change for one reason. There is no limit. A shared package past its churn baseline blocks until the owner answers. A shared part with fewer than 3 importing surfaces is listed as a candidate to move back."
      pros:
        - "A shared abstraction is cheap to enter and dear to leave; option growth is the early signal that two uses have drifted apart, and agents add an option to a shared call rather than question it. Entry is gated by arch.shared.10 and nothing watched a package after it."
    relations:
      relates:
        - arch.shared.10
    sources:
      - ref: ford-sathp
        where: chapter 8
        backs: rule
      - ref: p-01-core-programming
        where: five-list item 2
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 5.15
        backs: rule
  - id: arch.measures.6
    statement: "The repositories that release together and how far each consumer lags the newest shared version are reported; a forced-newest rule is itself a cause."
    strength: may
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "Release tags per repository joined with the shared-package pins. The unit is the release, never the day, because agent commit rates make day counts meaningless."
      pros:
        - "A many-repo layout rests on pairs of repos not moving together; lockstep deployment signals a misplaced boundary. Independent deployability is what the layout protects."
    sources:
      - ref: p-08-splitting
        where: section 20.2 item 2
        backs: rule
      - ref: b-05-architecture-hard-parts
        where: section 5.2 item 1
        backs: rule
      - ref: stopford-designing-event-driven-systems
        where: chapter 16
        backs: rule
  - id: arch.measures.7
    statement: "A file per service lists the stores and event families it writes and the services each flow includes, compared with a scan of the writers."
    strength: must
    status: proposed
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "The tool compares the file with the writers found by scanning write statements. Measure first, gate once the list exists. An agent cannot infer ownership from the code, so the list is what makes a check possible."
      pros:
        - "Two seam cases of our own were this: no one could say which program wrote a shared store."
