format: 3
part: tests
concern: doubles
rules:
  - id: tests.doubles.1
    statement: "A managed store (one our own services own) is tested against the real engine, not a fake."
    strength: must
    status: active
    origin: migrated
    reasoning:
      pros:
        - A fake of a store proves the fake. One of our repos has no mock library at all. The reference practice starts a real database in one shared container (see the tool record).
    sources:
      - ref: khorikov-unit-testing
        where: chapters 5 and 8
        backs: rule
  - id: tests.doubles.2
    statement: "Tests do not mock our own modules, and no mock library is a dependency."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Mock libraries (gomock, testify mock, mockery and the like) are banned in go.mod and imports. In TypeScript a module mock or global stub of a module in the repo is banned in test files by a restricted-import or restricted-syntax rule. A fake stands only as in tests.doubles.4, small and written by hand."
      pros:
        - "Mocking our own code makes the test a copy of the implementation. Own measure: no mock library in any repo today."
    relations:
      relates:
        - tests.doubles.4
        - tests.doubles.3
    sources:
      - ref: khorikov-unit-testing
        where: chapter 5
        backs: rule
    bindings:
      - tool: golangci-lint
        target: source
        key: depguard
        severity: error
        rung: 0
        run_point: commit
  - id: tests.doubles.3
    statement: "A repo keeps a file in a protected path marking each dependency managed or unmanaged; a double of a managed one fails a scan, and a double of an unmanaged one uses literal recorded bytes and asserts no calls on queries."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Managed means a database or queue our own services own; unmanaged means a third-party API. A double stands only at an unmanaged edge, is small and hand-written, and carries literal recorded bytes. A call assertion on a query (as opposed to a command) is wrong; whether it is wrong is a review question. The file is a protected path, since marking a dependency unmanaged is the known way round. Recorded bytes are the second choice: where the unmanaged program offers a fake account or a local server, the test runs the real program against it (tests.doubles.5)."
      pros:
        - "Khorikov's line: mock only the edge you do not control, and do not assert on calls that are queries. The file turns a ban of named paths into a check per dependency."
    relations:
      relates:
        - tests.doubles.5
    sources:
      - ref: khorikov-unit-testing
        where: chapters 5 and 8
        backs: rule
      - ref: decision-65-tests
        backs: rule
  - id: tests.doubles.4
    statement: "A fake of a store exists only to inject a failure the real engine cannot cheaply produce, a contract test against the real adapter pins that failure, a fake serves its seeded rows and throws on any call it was not seeded for, and no fake returns a constant."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A fake answers from the rows a test seeded into it; a call whose arguments match no seeded row throws with the call it got, so a test that forgot to seed fails loudly instead of passing on a default. A fake whose method returns the same value whatever it is asked is refused. One contract suite per fake runs the same cases against the fake and the real adapter, and the failure the fake injects is one of those cases."
      pros:
        - "A fake that drifts from the engine hides the bug; a contract test per fake proves it against the real one. A fake that answers an unseeded call with a default makes a test pass for a reason the author never chose."
    sources:
      - ref: decision-65-tests
        backs: rule
  - id: tests.doubles.5
    statement: "Where a test needs an external program's behaviour it runs the real program against a fake account or server, and only where no fake account exists does it use recorded bytes; tests and stories use fakes generated from the contract, and hand-written network stubs are banned outside the generated folder."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The order of preference is fixed. First, the real external program, run against a fake account, a fake model or a local server it can be pointed at. Second, only where the program offers no such account or server, a double with literal recorded bytes at the unmanaged edge (tests.doubles.3), pinned by a contract test where the engine allows one (tests.doubles.4). A hand-written stand-in for the program's behaviour is never used. Generated mock handlers come from the spec, and a lint ban stops hand-written network stubs and per-feature fake harnesses outside the generated folder. In Go the equivalent of a generated fake is a small hand-written fake proved against the real one by a contract test (tests.doubles.4)."
      pros:
        - "A hand-written stub encodes what the author thought the server said, and recorded bytes freeze what it said once; the real program on a fake account says what it says today. Reference practice, one fake source for the whole repo."
    relations:
      relates:
        - tests.doubles.3
        - tests.doubles.4
    sources:
      - ref: decision-65-tests
        backs: rule
  - id: tests.doubles.6
    statement: "Fixtures are the server's own output or held to its type in both directions, every enum member and nullable field has a sample, each supported platform has its own generated example set held exactly, and a test fails when an answer changes."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Fixtures come from the server side: its tests write golden JSON from the real encoder (an update flag run only in the owning repo, `-update`), and a check (`companion fixtures --check`) regenerates in memory and diffs (forward direction). In reverse, every golden path must be exercised by the demo world; the check lists golden paths absent from it and fails on a rise (shrink-only). A schema walk over the generated schema confirms a sample for every enum member and nullable field. A program that supports more than one platform keeps one example set per platform, written by one command from that platform's adapter or fake and held exactly; the answer for a feature a platform lacks is one shared body, not a copy per platform."
      pros:
        - "Fixtures generated from samples run the wrong direction: goldens are the handler's bytes and the schema is a second check. Generators' defaults broke \"null, never 0\". Own bugs: 11, 6 and 6 faults across three repos. A single example set hides what one platform answers differently."
    sources:
      - ref: decision-65-tests
        backs: rule
  - id: tests.doubles.7
    statement: "Fixtures, stories, docs, tests and shipped examples use made-up names only, for people, machines, managed software, networks and addresses, checked against an explicit stand-in list."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Every name of a person, machine, container, image, network, domain or account in those paths is on a committed stand-in list, and any other name in a name-shaped position fails. Addresses use the documentation ranges (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24, 2001:db8::/32, the example domains), never a real MAC or host. A second check compares every tracked file, commit message and branch name with a roster of real names kept outside the repository or as hashes, never in clear text; the check fails when the roster cannot be read, rather than passing on an empty list. In a public repository every author and committer email is a no-reply address, refused at pre-push."
      pros:
        - "Real names recurred in fixtures twice (own bugs), and a real host, address or person in a public file cannot be taken back. A stand-in list catches the name nobody thought to put on a roster; the roster catches the known ones in places the stand-in list does not cover."
    sources:
      - ref: rfc-5737
        backs: rule
      - ref: rfc-3849
        backs: rule
      - ref: rfc-2606
        backs: rule
      - ref: decision-65-tests
        backs: rule
