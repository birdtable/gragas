format: 3
part: tests
concern: runners
rules:
  - id: tests.runners.1
    statement: "Unit tests run in the gate from one runner, uncached, over the whole tree, or where selection is on for the packages that changed."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The default is every unit test of every package with the result cache off (tests.selection.1); a repo runs only the changed packages only when it has turned selection on."
      pros:
        - "A test that is not in the gate does not exist for the agent; unit tests are the fastest tier."
    relations:
      relates:
        - tests.selection.1
    sources:
      - ref: decision-65-tests
        backs: rule
  - id: tests.runners.2
    statement: "Test and browser workers per run equal cores divided by concurrent slots, with the slot count read from the job tool and never hard-coded, applied only inside a slot."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - "On the current host 15 cores and two heavy slots give 7 workers per run; a hard-coded number oversubscribes one run and starves another."
  - id: tests.runners.3
    statement: "The test runner configuration is one shared preset, and race, leak and shuffle flags are set once in the shared fragment."
    strength: must
    status: active
    origin: migrated
    reasoning:
      pros:
        - "One preset is the only place a flag is set once; the reference practice has one preset for every program."
    sources:
      - ref: decision-10
        backs: rule
  - id: tests.runners.4
    statement: "A test runs in parallel with the others of its package by default, and a test that runs alone says why in its own code."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A test that needs its own process state (an environment variable, the working folder, a global) is the exception, and it carries a comment naming the state it needs. A test that only needs a variable for a child process sets it on that child's environment and stays parallel. The cases of a long table test are parallel subtests when each has its own temp folder. A package whose tests all run one at a time is a finding in the tier report, with the share of its wall time. This rule holds the tests; gates.command.17 to .20 hold the members around them. The shuffle seed (tests.isolation.10) still prints, and a test that fails only in parallel is a bug ticket, never a retry (tests.flakes.1)."
      pros:
        - "One push kept 1.7 of 15 CPUs busy because two packages ran 152 and 101 tests one after another; making them parallel removes the longest member of the tier without dropping a test."
    relations:
      relates:
        - tests.runners.2
        - tests.isolation.1
        - tests.isolation.10
    sources:
      - ref: go-testing-package
        where: "func (*T) Parallel"
        says: Parallel signals that this test is to be run in parallel with (and only with) other parallel tests.
        backs: rule
    bindings:
      - tool: golangci-lint
        target: source
        key: paralleltest
        severity: error
        rung: 0
        run_point: commit
      - tool: golangci-lint
        target: source
        key: tparallel
        severity: error
        rung: 0
        run_point: commit
  - id: tests.runners.5
    statement: "Expensive setup (a build, a clone, a started program) runs once per package, in TestMain or a once, and never once per test or per case."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A case that needs a different input to the same built program reuses the build and changes the input. A case that must have its own build says so in its code. The setup writes nothing into the tree under test. This is about how many times the work is done; tests.isolation.3 holds how the shared fixture is reached (through a helper with its own temp folder and no fixed port), and both hold together."
      pros:
        - "One test built the landing judge and ran the landing script four times, 38 to 47 seconds of every push, to prove four things that one build could show."
    relations:
      relates:
        - tests.isolation.3
    sources:
      - ref: go-testing-package
        where: func TestMain
        says: TestMain runs in the main goroutine and can do whatever setup and teardown is necessary around a call to m.Run.
        backs: rule
  - id: tests.runners.6
    statement: "The race detector runs at push over the light packages, and the heavy race run is on demand; the race detector is not turned off at push."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "The light packages run with the race detector on in the push tier, because a race there costs a few seconds of wall time and is found at the earliest moment. The heavy race run (the packages whose race build takes minutes) leaves every tier and runs when the owner asks for it, or when the hub asks the owner first. A change that adds shared state across goroutines to a heavy package asks for that run in its pull request. Turning the race detector off at push is not taken: it saves about 17 seconds of wall time today and about none once members run together."
      pros:
        - "The heavy race tests took 6 minutes 38 seconds of a release and found no race; the light race run costs 17 seconds of wall time and keeps every race visible at push."
    relations:
      relates:
        - tests.runners.3
        - gates.hooks.4
    sources:
      - ref: go-race-detector
        where: Runtime Overheads
        says: "The cost of race detection varies by program, but for a typical program, memory usage may increase by 5-10x and execution time by 2-20x."
        backs: rule
  - id: tests.runners.7
    statement: "A project that turns the race detector off at push names who runs it on the main branch each day, and an issue opens on a red."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "The name is a person, a scheduled job or an agent, written in the project's test guide, and the run is daily on the default branch. A red opens an issue with the failing package and no one waits for the next day to read it. This project keeps the detector on at push (tests.runners.6), so the rule binds a project that takes the other road; a daily run that the guide asks for and nobody runs is the failure it prevents."
      pros:
        - "In one project the daily race run its docs asked for was not happening, and its main branch failed the race detector on a data race in test code."
    relations:
      relates:
        - tests.runners.6
    sources:
      - ref: birdtable-study-issue-641
        where: item 3
        says: "the daily race run the docs asked for wasn't happening, and main now fails race on a data race in test code."
        backs: rule
  - id: tests.runners.8
    statement: "A test that waits out real time (a timeout, a retry delay, a poll) runs on a fake clock, and a real sleep in a test is a finding with its reason beside it."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "The code under test takes its clock as an input, or the test runs it inside a bubble whose time package is fake, so a wait of seconds takes no wall time. A test that must observe real time, such as one of the clock adapter itself, says so in its code. The wait is not shortened by setting a smaller timeout in the test, as that tests another number."
      pros:
        - "A test that waits out real time takes that time on every run however many cores it has; a fake clock takes none, and the same holds for the other time recommendations."
    sources:
      - ref: go-synctest
        where: Time
        says: "Within a bubble, the time package uses a fake clock."
        backs: rule
  - id: tests.runners.9
    statement: "A module's whole suite is one invocation of the test tool per tier, so the runner spreads its packages over the CPUs, and a per-package timeout lives in that invocation's flags, named in the members file."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "Two batches of one module run the second after the first and the CPUs idle between them. One invocation over the whole module lets the test tool schedule every package at once. A second invocation for a cover profile is the same suite run twice; one run gives the verdict and the profile. A second module in the same repository (a web folder, a tools module) is its own member with its own folder. The timeout that applies to each package is a flag of the invocation and the members file names it, so the number is in one place."
      pros:
        - "One project ran its tests as two batches, 135 seconds, where one batch takes 51 seconds; another ran its Go tests then its web tests in series; a third ran the test tool twice, the second time for a cover profile sent nowhere."
    relations:
      relates:
        - tests.runners.1
        - tests.runners.4
        - tests.measures.5
    sources:
      - ref: tests-reasons-stated
        backs: rule
  - id: tests.runners.10
    statement: "The package whose tests read the whole tree reads it once through one shared snapshot and scans in parallel, and it may run without the race detector at push when an on-demand race member covers it."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "Every project has one package of tests that read every file: names scans, repository rules, layout checks. It runs on every change whatever changed, so it sets a floor for every push and makes selection pointless for itself. Its tests share one read of the tree taken in the package's setup (tests.runners.5) and scan that snapshot in parallel (tests.runners.4). It checks text, not concurrency, so under the race detector it is 7 to 40 times slower for nothing; tests.runners.6 keeps the detector on at push for the light packages, and this package is the one exception, covered by the on-demand race run."
      pros:
        - "It was the slowest package in every project of one organisation, 7 to 40 times slower under the race detector: 47 seconds to 334 seconds in one, and one test from 4.5 seconds to 72.8 seconds in another."
    relations:
      relates:
        - tests.runners.4
        - tests.runners.5
        - tests.runners.6
    sources:
      - ref: tests-reasons-stated
        backs: rule
  - id: tests.runners.11
    statement: "The gate's own tests run in the test member, parallel and built once, and never as a serial step of their own on every push."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A gate has tests: of its runner, its scripts, its plants (gates.plants.12). They are tests like any other and belong in the test member, where they run beside the rest and share the package's setup. A self-test step that runs each gate once more, or a sweep that runs each gate twice, is the suite run again in series, and it sets the push time."
      pros:
        - "Self-tests set the push time in three repositories of one organisation, 126 of 189 seconds in one service and 221 of 254 seconds in another; the gate's tests were one project's slowest package, 126 seconds, for the same reason."
    relations:
      relates:
        - gates.plants.12
        - tests.runners.5
    sources:
      - ref: tests-reasons-stated
        backs: rule
  - id: tests.runners.12
    statement: "A change to the test runner's pool, isolation or worker settings is proved on the whole suite in the shared pool, on every host the project claims, before it lands."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "Isolation off, a shared pool, a worker count: each changes what every test sees, and a test that passes alone can fail only there. The change's proof is the whole suite under the new setting on each claimed platform (gates.command.16), run where the other gates run, not on a quiet machine. A selected run proves nothing for a setting that touches every test."
      pros:
        - "One organisation set isolation off on a shared pool; four specs went red only there, one at 31 seconds against 6 seconds alone, and two changes were held off the main branch for 4 hours 23 minutes."
    relations:
      relates:
        - tests.runners.3
        - tests.isolation.12
        - gates.command.16
    sources:
      - ref: tests-reasons-stated
        backs: rule
