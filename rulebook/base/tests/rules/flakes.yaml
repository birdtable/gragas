format: 3
part: tests
concern: flakes
rules:
  - id: tests.flakes.1
    statement: "A failing test is never rerun to green, and a red suite is never accepted as the new normal."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "No count above one and no retry step or loop in a gate script or workflow, and zero retries read back from the runner configs. The scan excepts the admission step by name (tests.admission.1). A count of one is required by tests.selection.6 and is allowed. A green test list with a non-zero exit is classified as an infrastructure fault before any rerun (tests.flakes.5). A red suite is never re-normalised: the suite is green or the cause is ticketed."
      pros:
        - "Own bugs: one repo's rule. The donor reruns three times to prove a flake; this catalogue bans reruns and quarantines on first sight."
    relations:
      relates:
        - tests.admission.1
        - tests.selection.6
        - tests.flakes.5
    sources:
      - ref: p-07-testing
        where: sections 6.6 and 7.1
        backs: rule
  - id: tests.flakes.2
    statement: "A result that is not reproduced is quarantined on first sight, ticketed and counted; the quarantined test has an expiry date, by which it is fixed or deleted, and the count and oldest age are reported per repo."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A quarantine with no clock is a way to delete a test without saying so. Quarantine is a shrink-only list that does not lock landing but blocks the next proof-debt credit until ticketed; the cap and the expiry follow the exemption rules of the gates part. A quarantine that is a separate suite is not covered by the skip rule. Applies to repos with a flaky-test list."
      pros:
        - "Fowler names the graveyard: tests left in quarantine are not helping regression coverage, and his remedy is a limit on how many or how long. Neither the cap nor the expiry has a number: both are guesses until a real quarantine set exists."
    sources:
      - ref: fowler-non-determinism
        backs: rule
      - ref: p-07-testing
        where: section 6.6
        backs: rule
  - id: tests.flakes.3
    statement: "Record, per test, how often it failed on a tree that later passed unchanged, and report the rate with the machine load at the time."
    strength: must
    status: active
    origin: migrated
    reasoning:
      pros:
        - "In one study 78 percent of flaky tests were flaky when first written, so the first sighting is early. Load from parallel agents is a flake source people rarely count: our own swings of 22 and 40 percent in one measurement were load noise. An agent facing a red will rerun it, so the gate must write the record."
    sources:
      - ref: p-07-testing
        where: section 7.1
        backs: rule
  - id: tests.flakes.4
    statement: "A test asserts counted work, never elapsed wall time; where timing is the point, it judges only on an undisturbed machine or as a ratio, and fixed waits carry a reason."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "A time budget is measured by a script at low load. A loaded box gives no verdict, which is a bounded third result (an all-inconclusive run still locks). A scan for the wall-clock reading used as an argument of an assertion, with the remaining uses in test files on a shrink-only count; a wait deadline is legitimate and carries a marker or allow-list entry. A fixed-waits list and a flake counter exist beside it. Wall-time budgets are measured by a script at low load, never asserted in a test."
      pros:
        - "Own bugs: 7 of 60 sampled bugs; one project fixed three cases, and 9 load flakes in 12 days read as waits, not pixels."
  - id: tests.flakes.5
    statement: A green test list with a non-zero exit is classified as an infrastructure fault before it is re-run.
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - Reruns of an infrastructure fault look like reruns to green.
  - id: tests.flakes.6
    statement: "No rerun closes a red: the hub may rerun a red proof once on a quiet slot as a diagnostic and logs both results, the first red opens the ticket whatever the rerun says, and a second red quarantines the test with an owner and an expiry."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "tests.flakes.1 holds that a failing test is never rerun to green, and tests.flakes.2 holds the quarantine with its expiry. This rule holds the one rerun that is allowed and what it is for. The rerun is a measurement: run alone on a quiet slot, it tells whether load exposed the fault. Its green does not close anything. The ticket names the test, the load at the red and the two results. A second red of the same test, in any run, moves it to the quarantine list (gates.exemptions.4), with an owner and the date by which it is fixed or deleted. A quarantined race skips its test at push and nothing else: the member still runs, so no member leaves push over one test, and the skip line names the test, the ticket and the expiry. At release a race-kind row's test is not skipped, so the release proves the fix. The first implementation is the shared module's tier quarantine list."
      pros:
        - "Reruns hide what load exposes: one project's journeys flaked at load 76 to 202 and only under load; 13 red journeys of another were 75 of 75 green alone, and each had a cause and a fix."
    relations:
      relates:
        - tests.flakes.1
        - tests.flakes.2
        - gates.exemptions.4
    sources:
      - ref: tests-reasons-stated
        backs: rule
