format: 3
part: web
concern: states
rules:
  - id: web.states.1
    statement: "Every data region declares one of six states (ready, loading, empty, error, stale, disconnected) and draws each; loading is marked busy in its final boxes, empty says what is missing and what to do, and shared state parts draw them."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "Loading is marked `aria-busy`, keeps its final box size (no shift) and says what it waits for after 10 seconds. Empty has text and an action. Error has Retry. Stale shows its age. Disconnected has a status region. Loading, empty and failure use the shared state parts (a section or inline loader, or a page-shaped skeleton; the empty-state part; the error-state part); no bare spinner and no bare \"Checking\" text. A page declares its regions in a data file (id, states); the land-tier run forces each state per region (route interception for loading, error, empty, stale and disconnected; a fixture for ready). The count of declared regions must equal the count of region elements in the page, which proves the check reads something. The state set is a closed type, and a switch-exhaustiveness lint makes a missing case a type error. The regions file is `regions.json`; the count is of `[data-region]` elements; the 10-second wait is fast-forwarded with `page.clock`."
      pros:
        - "The heaviest fault class in our record: 23 of 144. No benchmark scoring this was found, which the stack report says is not proof."
  - id: web.states.2
    statement: "The page ran against the real server before it is called done, on one made-up world, and the run names its build."
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "The page reads one published document and writes nothing to a server: there is no live server, reconnect, write or request budget beyond the file reads."
    reasoning:
      definition: "The land step runs the end-to-end suite against the real binary and writes a run record (tree hash, the daemon's reported version, date, journeys run); it refuses to land unless the record's tree equals the change's tree and its build string equals the built daemon's."
      pros:
        - "Faults that only a mock allowed: 8 in one site, 3 in another, 3 in a third."
  - id: web.states.3
    statement: "The live transport only rings: state travels in whole answers so a missed message costs one read, and a failed stream falls back to polling and notices when open never comes."
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "The page reads one published document and writes nothing to a server: there is no live server, reconnect, write or request budget beyond the file reads."
    reasoning:
      definition: "Stream drop uses `routeWebSocket` or a held-open event route."
      pros:
        - "The browser's 6-connection limit is the reason; neither site has the fallback."
  - id: web.states.4
    statement: "A failed read names the cause in plain words through one table of codes, keeps old content, offers Retry and carries an id the reader can quote; a raw server or exception message is never shown."
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "The page reads one published document and writes nothing to a server: there is no live server, reconnect, write or request budget beyond the file reads."
    reasoning:
      definition: "Error text comes from one table typed `Record<ErrorCode, string>`, so a missing code is a type error. A backend code maps to a local message through one describer; an unknown code shows generic text with a reference id; enum labels are exhaustive maps. The error part is fed by the describer, never by the raw message. A lint bans rendering `.message` in view files; the kit asserts Retry, old content kept and a run id present, and two forced runs must show different ids. A golden of the error-state text is kept. Words are review."
      pros:
        - "One site shows \"500 Internal Server Error: internal error\"; another stays on \"Checking...\" with no Retry on the shell only. The donor built this gate and it is still open."
  - id: web.states.5
    statement: "A value nobody read is shown as a dash with its reason, never as 0, idle or clean."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "For each nullable field in the contract schema the fixture generator sets null and the page must show a dash with a reason. The scan on `?? 0` and `|| 0` in view files is a hint that warns or needs a reason (known false positives). The hint lint is `no-restricted-syntax` on `??` with a 0 right side and on `||` with a 0 right side in view files."
      pros:
        - "Two sites showed an unread value as zero; the scan hit 59 and 48 lines."
    sources:
      - ref: web-reasons-stated
        backs: rule
  - id: web.states.6
    statement: "A response is checked against a schema where it enters, never cast; external payloads, cache hydration and URL parameters are validated at the boundary, in development and test every response is validated, and the check tolerates extra fields."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "A newer server must not break an older page, so the boundary schema is non-strict and an extra field is accepted and ignored; a person's own config refuses unknown keys. Schemas come from the generated output. Type-aware lint (`no-unsafe-assignment`, `no-unsafe-argument`, `no-unsafe-return`) flags the untyped value a JSON parse returns, and `consistent-type-assertions` with `assertionStyle: never` in the api folder bans `as T` on responses. A unit test per boundary sends an extra field. Boundary library options: `zod/mini` or ajv."
      pros:
        - "One site has 3 hits, the one network cast; another has 0. The test is who wrote it."
    sources:
      - ref: ford-bea
        where: "ch. 7 on Postel's law"
        backs: rule
      - ref: b-01-evolutionary-architectures
        where: section 2.7
        backs: rule
      - ref: b-01-evolutionary-architectures
        where: section 5.1
        backs: rule
      - ref: b-04-philosophy-of-software-design
        where: T9
        backs: rule
  - id: web.states.7
    statement: "The page's API types and client are generated from the server's published contract (or a test proves them equal), shapes never come from local code, and no hand-written client remains."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "Generate the types from the server's types or from its OpenAPI spec, commit them, and regenerate-and-diff in the check. Every service uses the generated output (client, gated query options, mock handlers). Where a project hand-keeps types, a name-comparison script is the fallback. Which generator per project is a parameter. Fallback script `drift.py`; the loop is `companion gen --check`."
      pros:
        - "Today right only because people kept it so; a comparison trialled on 60 of 60 shapes found the one planted difference."
  - id: web.states.8
    statement: "API specs live once in the repository, pinned by a lock file and synced by one command; per-service copies are deleted."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: A vendored shared file equals its source at the named version by hash.
      pros:
        - A spec copied by hand into each service drifts from its origin without notice.
  - id: web.states.9
    statement: "The page reads only fields the contract names, and a field the server stopped sending fails a test."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "For each field on the consumer list the kit serves the contract body with that field deleted and asserts the page does not throw and shows a dash or an error state; the list comes from the contract, not the author. The example field is `ramBytes`, read unguarded."
      pros:
        - One site reads a bytes field unguarded and crashes when it is missing.
  - id: web.states.10
    statement: "Reconnect has a bounded back-off with jitter, and a hidden tab asks nothing."
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "The page reads one published document and writes nothing to a server: there is no live server, reconnect, write or request budget beyond the file reads."
    reasoning:
      definition: "Hidden state is `document.hidden` with a `visibilitychange` event; fake timers via `page.clock`."
      pros:
        - "Both sites behave so today, unproven by test."
  - id: web.states.11
    statement: "A failed refresh keeps the last good data marked stale with its age; disconnected is visible with a time and a status region, never blank; and the page never fills a value the server answered as unknown or not read."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The known unfailable spec is `hostile.spec.ts:72`; the abort is `route.abort()`. An unknown is drawn as unknown with the server's reason; a dash with a reason (web.states.5) is the empty form, never a stand-in for a value."
      pros:
        - "One site tracks the link state and never draws it, and its end-to-end spec accepts either value, so it cannot fail. A page that draws 0, off or a carried-forward value for an unread one turns the server's honest answer into a false one."
    relations:
      relates:
        - web.states.5
    sources:
      - ref: decision-65-web
        backs: rule
  - id: web.states.12
    statement: "A live update never moves what the reader is looking at: scroll, focus, open details and typed text stay."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "Details element `<details>`; the kit check is `checkLiveKeepsPlace`."
      pros:
        - "One site does it correctly in an unshared module; others replace whole lists."
  - id: web.states.13
    statement: "The URL carries the place (page, tab, filter and open detail), and Back closes a sheet without leaving the app."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "A journey per page changes the tab, filter or open detail, reloads, and asserts the same place; it then presses Back and asserts the sheet closes. On a router stack the router's typed search parameters add a type check (react.routing.3 for React). Template-stack helper: `URLSearchParams`."
      pros:
        - A tab kept only in memory loses its place on reload.
    relations:
      relates:
        - react.routing.3
  - id: web.states.14
    statement: "Search and filter act without a button, say how many match, can be cleared and survive a reload."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - "Marked inferred in the source report; no fault in our record, so it rides on a journey that other rules already earn."
  - id: web.states.15
    statement: "A derived value is computed, not stored and synced."
    strength: may
    status: proposed
    origin: migrated
    reasoning:
      definition: "On the component stack the lint of react.client-state.3 holds it; the template stack has no equivalent lint and stays on the review question."
      pros:
        - Stored derived state drifts from the value it was derived from.
    relations:
      relates:
        - react.client-state.3
  - id: web.states.16
    statement: "A page has a request budget, counted per page load and per journey, and fetches only what the user can see and what is not fresh."
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "The page reads one published document and writes nothing to a server: there is no live server, reconnect, write or request budget beyond the file reads."
    reasoning:
      definition: "A counter on the browser's request event, grouped by URL path to ignore static assets, with the budget per page in the parameters file; the check fails when over. No per-row fan-out for data the user cannot see. Counter: `page.on(\"request\")`."
      pros:
        - "Marginal build on the journey runner; no fault in our record."
  - id: web.states.17
    statement: An optimistic write is undone when the request fails.
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "The page reads one published document and writes nothing to a server: there is no live server, reconnect, write or request budget beyond the file reads."
    reasoning:
      pros:
        - "Zero optimistic handlers exist today; the rule is set ahead of the first one."
  - id: web.states.18
    statement: "A write carries the version it read, and a conflict is a typed outcome distinct from not-found that the page names."
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "The page reads one published document and writes nothing to a server: there is no live server, reconnect, write or request budget beyond the file reads."
    reasoning:
      pros:
        - A stale write and a missing row both read as zero rows affected unless told apart.
  - id: web.states.19
    statement: "No virtualisation library is added outside the list table's virtual mode, and that mode is added only when a list mounts over about 500 rows or a profile misses a frame budget."
    strength: may
    status: proposed
    origin: migrated
    reasoning:
      definition: "It is not banned; it carries a re-entry trigger. Never in a canvas list lens."
      pros:
        - "A heavy library not needed yet costs bytes and behaviour; the ruling kept it watched, not banned."
  - id: web.states.20
    statement: "No local-first collection library is added until a stated trigger holds: a stable (final) release, a stated offline need, a persister policy for collections, or a second screen live-joining two whole collections."
    strength: may
    status: proposed
    origin: migrated
    reasoning:
      definition: It is not banned. A prerelease major is added only as a labelled pilot.
      pros:
        - A prerelease data library locks in an unstable API.
