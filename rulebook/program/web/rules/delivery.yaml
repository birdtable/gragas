format: 3
part: web
concern: delivery
rules:
  - id: web.delivery.1
    statement: "A change that alters what a person sees carries pictures of it at phone, tablet and desktop sizes (for example 390, 1024 and 1440 px) in light and dark, with links to the stories, and a done claim names its question."
    strength: should
    status: proposed
    origin: migrated
    reasoning:
      definition: "The screenshot matrix of viewports and schemes is generated by the land gate, not typed into the change description; land refuses a UI change with no pictures."
      pros:
        - "v1 gave no reason beyond its evidence grade, Evidence D."
  - id: web.delivery.2
    statement: "The browser checks that find UI faults run at land for what the change can reach, not only by hand."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "The land step reads the plan: a change touching a web path whose plan has no browser step fails. The picker is the reach map of the affected-gates rules; one site's habit of running its changed-journeys target is lifted into the land command."
      pros:
        - "No fault in one site's record was found by its normal check; another site runs its verify target before a merge, unproven as a refusal."
  - id: web.delivery.3
    statement: The building agent renders and looks at its own page before asking for review.
    strength: should
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - "21 of 72 faults in one site were found by the builder; the site's own check ends by saying to open the page."
  - id: web.delivery.4
    statement: "Taste, hierarchy, tone and brand fit are judged against a written design rubric, hierarchy test first; an agent lens reads every surface, and a canvas screen that is exempt is judged by its own rubric."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "Hierarchy test: one primary action, emphasis by taking away from what is secondary, labels only when needed, and no page that wraps itself in what the shell already gives. The rubric lens verdict is stored like the other lens verdicts."
      pros:
        - "Faults found by the rubric in two sites (a recorded issue and a case). The rubric's content is provisional, because the book it draws on was read only in outline."
    sources:
      - ref: refactoring-ui
        where: outline only
        backs: rule
  - id: web.delivery.5
    statement: "The operator signs a sample of surfaces plus every new surface, with a stored record."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "New routes need a sign-off record entry; the check compares the route list with the sign-off file. Taste and hierarchy are judgement; only the presence of the sign-off is mechanical."
      pros:
        - "The person looks at what the lens only flags."
    sources:
      - ref: decision-33
        backs: rule
  - id: web.delivery.6
    statement: Per-person state is private on a shared device.
    strength: may
    status: proposed
    origin: migrated
    reasoning:
      pros:
        - "Three recorded cases in one site where one person's state showed to the next."
  - id: web.delivery.7
    statement: The web build output is static files where a daemon embeds it.
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "No daemon embeds the page: the engine embeds the built app and writes it out as files."
    reasoning:
      definition: "After the build a test asserts the output folder has no server entry, and the Go side's embed directive fails to compile when the directory is empty or absent."
      pros:
        - "Held in two sites; an adapter emitting a server entry would make the embed a lie."
  - id: web.delivery.8
    statement: "A variable a page reads is declared in a typed environment schema, secrets are reachable only on the server, only public-prefixed names reach the bundle, and a service base URL comes from one descriptor that throws when unset, never a hard-coded URL or fallback."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "ESLint `no-restricted-syntax` on environment access (`import.meta.env`) outside the one schema module, with the framework's own schema as the framework side; a bundler exposes only the public prefix. An endpoint address is read from the typed schema, never hard-coded. The schema module and the public prefix are per framework: the template-stack form uses the framework's own environment schema, and the component-stack form (its bundler's public prefix) is react.config.1."
      pros:
        - "And D; the outcome scan on the built output is the no-secret rule."
    relations:
      relates:
        - react.config.1
  - id: web.delivery.9
    statement: "No secret reaches the bundle, and no secret sits in an environment file that the bundler inlines into the build."
    strength: must
    status: proposed
    origin: migrated
    reasoning:
      definition: "gitleaks runs on the built output with redaction at land and release; findings are reported by rule and line only, never by value. An empty variable-prefix setting inlines every key into the bundle, so the rule also bans secrets in the stage environment files. A source-tree secret scan covers source. The plant fires `aws-access-token`; allow-lists must not use documented example strings."
      pros:
        - "The documented AWS example key did not fire (the tool allows words like EXAMPLE), so plants must not use documented example strings. A minified single-line bundle was found. Entropy-only secrets without a known prefix may escape."
  - id: web.delivery.10
    statement: "The built page is embedded, hashed files are immutable and the HTML entry revalidates."
    strength: must
    status: proposed
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "No daemon embeds the page: the engine embeds the built app and writes it out as files."
    reasoning:
      definition: "A test in the shared helper asserts `Cache-Control: immutable` on hashed files and revalidation on the HTML entry; one site's web test is the lift."
      pros:
        - Held in one site.
  - id: web.delivery.11
    statement: "A deployed page has someone listening: a health poll on its real address notifies a person when it fails, and failures per release are reported; staged rollout is not required."
    strength: should
    status: active
    origin: migrated
    exemptions:
      - kinds:
          - static-data
        reason: "The page has no address of its own, so nothing is listening for it: whoever hosts a copy owns its poll."
    reasoning:
      pros:
        - "The page shows a stale state when the server is down; this row is who hears. A page embedded in a daemon rests on the daemon's health."
    sources:
      - ref: p-04-systems-and-delivery
        where: section 20
        backs: rule
