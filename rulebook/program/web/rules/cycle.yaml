format: 3
part: web
concern: cycle
rules:
  - id: web.cycle.1
    statement: "Every story renders in a real browser with the accessibility engine at error; for a design system that is a push member, and for an application it runs at land."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "web.accessibility.1 holds that every story passes the engine as an error in both themes. This line places it in the cycle. A design system's stories are its product, so they render at push, where 474 stories with the engine took 44 seconds. An application's stories are many and the render runs at land, with the plays (web.cycle.3). A story the engine skips carries an owner and an expiry (gates.exemptions.4)."
      pros:
        - "One organisation's design system shipped two versions with its stories unrun, and its consumer opened seven contrast tickets in eight days."
    relations:
      relates:
        - web.accessibility.1
        - web.testing.11
        - gates.exemptions.4
    sources:
      - ref: storybook-accessibility-testing
        where: "Configure accessibility tests, the error level"
        says: violations return a failing test in the Storybook UI and CLI/CI
        backs: check
      - ref: storybook-vitest-addon
        where: Vitest addon
        says: test the rendering and behavior of your components in a real browser environment.
        backs: check
  - id: web.cycle.2
    statement: The story build is a member of the push tier.
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A story build that fails is found at publish otherwise. It is a member with its cost listed, and the story render member declares it runs after it where it reads the built output (gates.command.28)."
      pros:
        - "One organisation's design system had its story build, 17.6 seconds, in no gate before the publish."
    relations:
      relates:
        - gates.command.23
        - gates.command.28
    sources:
      - ref: storybook-publish
        where: Build Storybook as a static web application
        says: Storybook will create a static web application capable of being served by any web server.
        backs: check
  - id: web.cycle.3
    statement: "For an application, story renders and plays run at land, the plays are counted in the report, and renders and plays share one browser page so a story is opened once per width."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "gates.measures.6 holds that a green carries its counts; a play count that falls against the base fails landing. Opening a story for the render and again for the play doubles the time; the render reuses the play's page, so the verdicts of one pass serve the other."
      pros:
        - "Eighteen story plays once went unrun in a green of one organisation's main web application, and renders reused 475 verdicts from the plays once they shared the page."
    relations:
      relates:
        - gates.measures.6
        - web.testing.11
    sources:
      - ref: web-reasons-stated
        backs: rule
  - id: web.cycle.4
    statement: "Token contrast is checked over every pair of tokens drawn together, in both themes, as one check at push."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "web.tokens.8 holds the contrast ratios and that the check is a pure test over the tokens. This line holds its shape in the cycle: one member, every pair the roles allow (web.tokens.9), both themes, so a new token or a new ground is covered the day it lands and not when a consumer finds it."
      pros:
        - "Seven contrast tickets in eight days came from a test that held one token pair, and one miss reached 61 stories in the consumer."
    relations:
      relates:
        - web.tokens.8
        - web.tokens.9
    sources:
      - ref: web-reasons-stated
        backs: rule
  - id: web.cycle.5
    statement: "At push a small browser smoke set runs: the journeys that prove the page loads and the main path works, beside the other members at no wall cost; the member declares the network and its platform, and a skip is red at land."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "The smoke set is a handful of journeys, chosen for what a cheaper test cannot see (tests.journeys.4), and it runs in the pool beside the build and the tests, so it adds nothing to the wall time when it is shorter than the longest member. The member carries net and os fields (gates.command.30); on a builder's machine with no browser it prints SKIPPED, and at land that skip is red. The full suite is a release member (web.cycle.6)."
      pros:
        - "Ten journeys of one project, 17.4 seconds, run beside its site check at no wall cost; browser gates in a no-network sandbox of another organisation failed 49 of 49 blocks with a network error nobody read as a skip."
    relations:
      relates:
        - gates.command.30
        - tests.journeys.4
        - web.delivery.2
    sources:
      - ref: web-reasons-stated
        backs: rule
  - id: web.cycle.6
    statement: "At release the full browser suite runs sharded across the pool's workers, with the shards balanced by each journey's recorded duration and never by file count, and both browser engines run until the grid is green and balanced."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A shard by file puts the slow journeys in one shard and the suite waits for it. The runner records each journey's duration and the next run balances by it. The worker count is the pool's (gates.command.27); more shards on a loaded host only add contention. Both engines run at release until the grid has been green and the shards balanced; then the owner decides on the green numbers which engines stay. A release does not carry a known red journey; a tolerated red is a listed entry with an owner and an expiry (gates.exemptions.4, tests.flakes.6)."
      pros:
        - "One project's slowest shard fell from 1,573 seconds to about 1,261 when balanced by duration, and its grid was red three of three releases."
    relations:
      relates:
        - gates.command.27
        - gates.exemptions.4
        - tests.flakes.6
    sources:
      - ref: playwright-test-sharding
        where: Sharding tests between multiple machines
        says: "To shard the test suite, pass --shard=x/y to the command line."
        backs: check
  - id: web.cycle.7
    statement: "A browser journey waits on a condition through the runner's auto-wait and never on a sleep; a fixed budget scales by a printed load factor; and the page's own timers run on the runner's fake clock."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "tests.runners.8 and tests.isolation.6 hold that no test waits out real time. In a browser the runner waits for the element to be ready before it acts, so a journey that sleeps is waiting twice. A budget that must be fixed (a page load) is multiplied by a factor from the host's load and the factor prints, so a red under load is read as one. The page's own timers (a poll, a toast, a debounce) run on the runner's clock, so a wait of seconds takes none."
      pros:
        - "Fixed 10 and 15 second browser budgets of one organisation ran out at load 65, and a 5 second idle wait of one project was paid twice per journey."
    relations:
      relates:
        - tests.runners.8
        - tests.isolation.6
        - tests.measures.11
    sources:
      - ref: playwright-actionability
        where: Introduction
        says: It auto-waits for all the relevant checks to pass and only then performs the requested action.
        backs: rule
      - ref: playwright-clock
        where: Introduction
        says: Utilizing Clock functionality allows developers to manipulate and control time within tests
        backs: rule
  - id: web.cycle.8
    statement: "A journey's teardown removes every route handler it added, so a poll in flight cannot fail the next journey, and an action re-resolves its locator after the component's ready mark."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A route handler left on the page answers a poll that fires after the journey ended, and the failure lands on whichever journey runs next. The teardown fixture unroutes all handlers and waits for the ones in flight. A locator held across a re-render points at an element that is gone; the runner re-resolves a locator each time it acts, so the action waits for the component's ready mark and then locates."
      pros:
        - "A poll left routed after one journey failed the next in one organisation, and a held element handle failed on the re-render."
    relations:
      relates:
        - tests.journeys.6
        - tests.isolation.1
    sources:
      - ref: playwright-class-page
        where: unrouteAll
        says: Removes all routes created with page.route() and page.routeFromHAR().
        backs: check
      - ref: playwright-locators
        where: Locating elements
        says: "Every time a locator is used for an action, an up-to-date DOM element is located in the page."
        backs: rule
