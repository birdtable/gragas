format: 3
part: service
concern: evolution
rules:
  - id: service.evolution.1
    statement: "A breaking payload change gets a new version of the event name (the detail-type), and schemas are diffed against the last release."
    strength: must
    status: proposed
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "In Go, a versioned file says what it does with older and newer versions, and a breaking change fails the release."
      pros:
        - Consumers deployed against the old shape break silently when a field they read is removed or changes meaning.
  - id: service.evolution.2
    statement: "Event compatibility follows the program's declared reader mode (service.contract.2). With independent readers each event family states its compatibility mode, full by default, a loosening is a recorded exit, and consumer tests are fed fixtures from every released version of the family schema. With owned readers a breaking event change raises the family's version and moves every known consumer in the same change."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - service
        - daemon
    reasoning:
      definition: "Independent readers: the schema-diff step reads a compatibility field from the catalogue and tests the matching directions (old consumers read new events and new consumers read old events); a consumer test iterates the committed schema history. The backward direction matters for replay, for a redriven message in a dead-letter queue, and for a consumer deployed before its producer. Plain JSON has no built-in rules for full compatibility, so the check has to live in the diff tool. Owned readers: the gate fails a breaking change whose version did not rise or whose known consumers were not changed in the same change, and no fixture of a retired version is kept."
      pros:
        - "Loosening later is easy and tightening is hard, so a publisher to readers it cannot change starts at full. An owner of every reader moves them together, and keeping old shapes for readers that no longer exist is where bugs live."
    relations:
      relates:
        - service.contract.2
    sources:
      - ref: bellemare-bedm
        where: ch. 3 (full-featured schema evolution)
        backs: rule
      - ref: bellemare-bedm
        where: "ch. 15 (testing schema evolution and compatibility; creating mock events using schemas)"
        backs: rule
      - ref: decision-65-service
        backs: rule
  - id: service.evolution.3
    statement: "With independent readers a breaking change creates a new family, the old one is marked deprecated in the catalogue with a sunset date, the producer writes both during the migration, and the gate fails an old family past its date. With owned readers dual writing and sunset windows are an exception that needs a recorded reason, and a retired path or name is removed in the change that replaces it, with a test asserting it is gone."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - service
        - daemon
    reasoning:
      definition: "Independent readers: a catalogue field status and sunset exist; a subscription to a deprecated family needs a recorded exit; the gate fails a deprecated family past its sunset. The sunset length is a guess and not a measurement. Owned readers: there is no old-and-new fallback, no field marked going and no grow-only promise; the replacing change deletes the old name, and a test asserts the old path, field or family no longer exists."
      pros:
        - "Without a date the migration never finishes and near-duplicate families run on, and new services subscribe to the old one. Where the owner deploys every reader, a second stream is a compatibility layer with no reader to serve."
    sources:
      - ref: bellemare-bedm
        where: ch. 3 (breaking schema changes)
        backs: rule
      - ref: bellemare-bedm
        where: "ch. 16 (breaking schema changes; eventual migration via two event streams)"
        backs: rule
      - ref: decision-65-service
        backs: rule
