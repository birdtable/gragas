format: 3
part: service
concern: consumers
rules:
  - id: service.consumers.1
    statement: Consumers deduplicate atomically and tolerate redelivery.
    strength: must
    status: proposed
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "The processing key is written in the same transaction as the mutation. In Go, a command is safe to run twice and a torn last line is ended before append."
      pros:
        - "Delivery is at least once: a consumer that cannot take the same message twice does its work twice."
  - id: service.consumers.2
    statement: "The lifetime of a processing key (the record that stops a consumer doing the work twice) is at least the longest time a message can return: dead-letter retention, a redrive, a replay from an archive."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "The key lifetime is a named constant and a test asserts it is at least the longest configured redelivery path. The key table is the consumer processing-key table. Where the store expires keys, expiry must not be the authority on whether a key still counts, because the store deletes an item only some time after its stamp (the book says up to about two days; verify against current documentation)."
      pros:
        - "If the key expires first, the second delivery is a first delivery again. Perfect deduplication needs an unbounded lookup, so in practice it is a bounded window kept with expiry, sized to the application sensitivity to duplicates."
    sources:
      - ref: bellemare-bedm
        where: ch. 7 (guarding against duplicates)
        backs: rule
      - ref: debrie-dynamodb-book
        where: advanced concepts (TTL)
        backs: rule
  - id: service.consumers.3
    statement: Every subscription has a dead-letter path with redrive.
    strength: must
    status: proposed
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "In Go, queues are bounded, but there is no park-and-redrive of failed work yet."
      pros:
        - A message that fails for good with nowhere to go either blocks the queue or is lost.
  - id: service.consumers.4
    statement: "Work that fails for good goes to a dead-letter queue with a reason, and a redrive filters by what can still resolve (the target still exists, the state has not moved on) and does not blindly replay."
    strength: may
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      pros:
        - "A dead-letter queue is a snapshot with no expiry: a message that failed for good days ago acts on state that has since changed, and a blind redrive replays that stale intent. Silent retry forever is the default an agent writes."
    sources:
      - ref: p-04-systems-and-delivery
        where: section 7 (dead-letter channel
        backs: rule
  - id: service.consumers.5
    statement: "Non-request entry points release their resources (connection pools, handles) in finally."
    strength: must
    status: proposed
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "In Go, every goroutine has an owner that stops it and signals stop cleanly, and typed errors exist only where a caller branches."
      pros:
        - An entry that leaks a pool on the failure path exhausts connections when the runtime reuses the process.
  - id: service.consumers.6
    statement: A non-request entry point acknowledges a permanent refusal and throws a transient failure to the dead-letter path.
    strength: must
    status: proposed
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      pros:
        - "Retrying a message that can never succeed wastes the queue; acknowledging one that would have succeeded loses it."
  - id: service.consumers.7
    statement: "A queue-triggered consumer reports failure per item, so one bad message does not return the whole batch, and its batch size times its worst item time stays inside the function timeout."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "The worst-case item time is a stated figure and a guess until measured. Where the platform offers to halve the batch on failure, that does not replace the per-item report."
      pros:
        - "A throw from a handler holding a batch can fail every item, and the others are redelivered: harmless with deduplication but wasteful, and it hides which message is bad. A batch the function cannot finish in time fails as a whole and will fail again unless the time or the batch size changes."
    sources:
      - ref: bellemare-bedm
        where: "ch. 9 (batch event-processing parameters; commit offsets only after processing has completed)"
        backs: rule
  - id: service.consumers.8
    statement: "A consumer parses an event with a reader that ignores unknown fields; a file written by a person (a config, a catalogue) refuses unknown keys."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      definition: "The test is who wrote it: a typo at a keyboard must be seen, and a newer peer must not break an older one. A strict object type in a schema library rejects an extra field, which is a quiet way for an additive producer change to break an old consumer."
      pros:
        - "Strictness at a person keyboard catches typos; strictness at a peer breaks independent release."
    sources:
      - ref: bellemare-bedm
        where: ch. 3 (schema evolution)
        backs: rule
  - id: service.consumers.9
    statement: "The catalogue entry of each event family states a policy for late and out-of-order events as a business decision, and each consumer states what a replay does to its side effects (an email resent, a marketplace call repeated)."
    strength: may
    status: active
    origin: migrated
    scope:
      kinds:
        - service
    reasoning:
      pros:
        - "A strategy for late events is a business choice (drop, wait, or accept for a grace period): some events must be handled wherever they land and others may be discarded. A replay is something every consumer must expect, because events can be reread from a past point."
    sources:
      - ref: bellemare-bedm
        where: "ch. 6 (out-of-order and late-arriving events; handling late events)"
        backs: rule
      - ref: bellemare-bedm
        where: ch. 7
        backs: rule
      - ref: bellemare-bedm
        where: ch. 16 (reprocessing)
        backs: rule
