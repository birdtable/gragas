format: 3
part: daemon
concern: notify
rules:
  - id: daemon.notify.1
    statement: "A daemon's outward events are one closed list with a versioned payload, pushed through channels behind an interface, and documented per event in an example file that the gate holds equal to what the daemon sends."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - daemon
    exemptions:
      - kinds:
          - no-notify
        reason: A daemon that sends no notification has no event list.
    reasoning:
      definition: "Each event names its subject, its data and the version of its payload. The channel interface has one adapter per kind (a push service, a webhook, a kind added later); the event list does not change when a channel is added. The example file lists every event with a sample payload, and a test renders every event through the real encoder and compares it with the file in both directions, so an event sent but not documented, or documented but never sent, fails."
      pros:
        - "A notification channel is a contract nobody tests unless the list is closed and held to its document; a silent drift is found by a person who missed an alert."
    sources:
      - ref: decision-65-daemon
        backs: rule
  - id: daemon.notify.2
    statement: "A notification is sent only on a change; when no earlier state is readable the first run sets a silent baseline; sends are limited per subject and event; quiet hours hold back all but a bad event; and notifying rides an existing run, never a new timer."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - daemon
    exemptions:
      - kinds:
          - no-notify
        reason: A daemon that sends no notification has nothing to rate.
    reasoning:
      definition: "A fresh install or a lost state file sends nothing on its first pass and records what it saw. The rate limit is a stated count per subject, event and day (for example one). Quiet hours are the owner's setting; an event marked bad passes through them. The check that may notify runs inside a run the daemon already makes (a request, a scheduled job that exists for its own reason), so notifying adds no wake-up (daemon.lifecycle.5)."
      pros:
        - "Noise is what gets a channel muted in its second month, and a timer added only to notify costs idle power every hour for an alert that seldom comes."
    relations:
      relates:
        - daemon.lifecycle.5
    sources:
      - ref: decision-65-daemon
        backs: rule
