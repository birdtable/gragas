format: 3
part: ts
concern: runtime
rules:
  - id: ts.runtime.1
    statement: "The Node version is declared in the project template, and one Node major appears in every declaration: the version file, `engines`, the types package and the deploy runtime."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "`package.json` carries `engines`; the version file the gate reads (not an nvm-only file) is byte-equal to the template's; `engine-strict` is on; the types package for Node (`@types/node`) and the cloud runtime setting name the same major. The check reads `engines` with npm-package-json-lint's `require-engines`."
      pros:
        - Two Node majors in one project mean the code that passes tests runs on a different runtime in production. Neither of two donor sites declared Node at all (evidence A).
    sources:
      - ref: nodejs-docs
        where: release schedule
        backs: rule
      - ref: decision-43
        where: reviewer verdict A1
        backs: rule
  - id: ts.runtime.2
    statement: A short list of deprecated platform core modules may not be used.
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The list is data with the reason for each entry and the replacement; an import of a listed module fails. It is a boundary rule enforced by the import lint. Biome form: `noRestrictedImports` with the same list, each entry carrying its replacement in the message."
      pros:
        - A deprecated core module is removed in a later Node major and breaks the upgrade.
    sources:
      - ref: nodejs-docs
        where: deprecations
        backs: rule
      - ref: decision-65-ts
        backs: rule
  - id: ts.runtime.3
    statement: One unit test runner is used in every project.
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The runner is Vitest. Jest, mocha and ava are banned entries in the manifest config; the built-in `node:test` is banned in new files by no-restricted-imports with a baseline that only falls until the existing files migrate. The rule is read per project, not per estate. Migration is ordered: the recorded-reads selector is proved on the runner first, then the files move in the same change. Biome form for the import half: `noRestrictedImports` on `node:test` with the same shrink-only baseline; the manifest ban is engine-free."
      pros:
        - Two runners double the setup and split the test selection. A donor site had 87 of the 103 built-in runner files and is the one that must migrate.
    sources:
      - ref: decision-10
        backs: rule
      - ref: decision-65-ts
        backs: rule
