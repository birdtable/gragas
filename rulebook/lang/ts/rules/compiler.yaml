format: 3
part: ts
concern: compiler
rules:
  - id: ts.compiler.1
    statement: "The type check has zero errors in application and infrastructure code, under the strictest flags."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "Each project runs its framework's checker: `tsc --noEmit` for plain and React code, and `astro check` (with a tsconfig extending `astro/tsconfigs/strictest`, the framework's strictest preset) for `.astro` templates, never `tsc` on `.astro` files. The check covers application code and the deployment code beside it. Strict mode is on; the full flag set is in the shared base, see ts.compiler.3."
      pros:
        - "A type error that the gate lets through is a fault found at run time. At the donor project the type check refused its own lead's wrong ruling on one change, which is the evidence for a hard type gate (evidence C)."
    relations:
      relates:
        - ts.compiler.3
        - ts.compiler.6
    sources:
      - ref: typescript-handbook
        where: tsconfig strict
        backs: rule
      - ref: decision-43
        where: reviewer verdict A1
        backs: rule
  - id: ts.compiler.2
    statement: "The compiler flags reach the strictest base one flag per change, the list of flags on can only grow, and strictness never goes down."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The sequence includes `verbatimModuleSyntax` and `erasableSyntaxOnly`, with `noUncheckedIndexedAccess` last (it is the one that produces the most errors). A diff check on `tsconfig.json` fails when a flag is removed from the committed list. Project references are built with `tsc -b`. Extra flags beyond the strict base, such as unchecked indexed access and exact optional property types, are on."
      pros:
        - "Turning on all flags in one change produces a wall of errors that gets suppressed; one flag per change keeps each cost small and visible."
    sources:
      - ref: tsconfig-strictest
        where: flag list
        backs: rule
      - ref: decision-43
        where: reviewer verdict A1
        backs: rule
  - id: ts.compiler.3
    statement: "One published strictest compiler core is shared by every project, in two module modes: a published library compiles with nodenext resolution, composite, and emits declarations to dist, and a bundled app uses bundler resolution with no emit."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The strict core is the same in both modes: strict on, exact optional property types, unchecked indexed access, verbatim module syntax, erasable syntax only, isolated modules, no switch fall-through and consistent file-name casing. The mode is chosen by the package's kind (published library or bundled app), never per file, and a package declares which kind it is. The base is a published package with one entry per mode; a project's own compiler file extends the base for its kind and sets only lib, types and jsx (ts.compiler.5). Copies in projects are byte-equal to the template. A third mode is added to the base, never to a project."
      pros:
        - "One base changes once and reaches every project by a version bump, where per-project files drift. A library and an app are different compile targets and no single module mode serves both, while the strict flags are what the rule exists to share."
    relations:
      relates:
        - ts.compiler.5
    sources:
      - ref: tsconfig-strictest
        backs: rule
      - ref: decision-43
        where: reviewer verdict A1
        backs: rule
      - ref: decision-65-ts
        backs: rule
  - id: ts.compiler.4
    statement: A strictness flag deliberately left off is recorded with its reason and pinned off by a test.
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The base names each flag that is off (three in the source) with the reason beside it; a test fails when a flag recorded as off turns on without the record changing, or the reverse."
      pros:
        - "A flag that is off with no recorded reason is indistinguishable from one forgotten, and nobody turns it on."
    sources:
      - ref: decision-43
        where: reviewer verdict A1
        backs: rule
  - id: ts.compiler.5
    statement: "A project's compiler file extends the shared base and sets only lib, types and jsx, and a base option set in a project file fails."
    strength: must
    status: active
    origin: migrated
    reasoning:
      definition: "The check reads each project compiler file and fails on any compiler option other than lib, types and jsx, so no overlay can loosen strictness or change the module mode in a corner. Where a file still lists more than one extended file, the shared base is listed last so it wins, and a test sets a flag in the overlay that the base sets the other way and asserts the base's value is the resolved one."
      pros:
        - "A shared rule that a local file can silently override is not shared. Capping the overlay to three keys is the maintenance win: nobody loosens strict in a corner."
    sources:
      - ref: typescript-handbook
        where: extends in tsconfig
        backs: rule
      - ref: decision-65-ts
        backs: rule
  - id: ts.compiler.6
    statement: "The native TypeScript compiler becomes the type gate once its release is stable, with the previous compiler pinned beside it, and any disagreement between the two diagnostic lists is a finding."
    strength: must
    status: proposed
    origin: migrated
    scope:
      kinds:
        - ts
    reasoning:
      definition: "Stable means the native compiler's npm release is out of beta and is not a nightly. From then on the type-check step runs the native compiler as the gate and the previous major, pinned exactly, in the same step; both diagnostic lists are compared by file, code and line (project builds included), and any entry in one list and not the other fails the step as a finding until it is fixed or recorded with a reason. There is no waiting window and no scheduled tier: both run on every type check. Decorator flags are confirmed or removed first. The pinned previous compiler leaves only by a decision once the lint stack and every framework checker accept the native one."
      pros:
        - "Running both compilers and failing on a disagreement is the safety; a window that depends on a scheduled tier cannot be met once gates run only at the push and the release. Until the native release is stable nothing can fail, so the rule waits."
    sources:
      - ref: typescript-native-port
        backs: rule
      - ref: decision-44
        backs: rule
      - ref: decision-65-ts
        backs: rule
