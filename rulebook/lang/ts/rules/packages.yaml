format: 3
part: ts
concern: packages
rules:
  - id: ts.packages.1
    statement: "A published package's exports map has one subpath per unit and no root barrel, and every entry resolves in the packed tarball."
    strength: must
    status: active
    origin: migrated
    scope:
      kinds:
        - library
    reasoning:
      definition: "A unit's surface is its index file; the package's surface is its exports map, with one subpath per unit pointing at that unit's built index and its types. There is no `\".\"` entry that re-exports every unit, and no wildcard subpath. The check packs the package, installs the tarball into a scratch folder and resolves every subpath for import and for types; a subpath that resolves only in the source tree fails. The stability mark of each export (stable, experimental or internal) lives in the surface file of the architecture part (arch.shared.9), not here. The check is engine-free."
      pros:
        - "A root barrel is how a package grows a surface nobody chose, and only the packed tarball shows what a consumer sees: a file left out of the package or a types path that points into the source passes every check run on the tree."
    relations:
      relates:
        - arch.shared.9
    sources:
      - ref: nodejs-docs
        where: package exports
        backs: rule
      - ref: publint
        backs: rule
      - ref: are-the-types-wrong
        backs: rule
      - ref: decision-65-ts
        backs: rule
