    by_hand:
      - "a home-made unsupported error, an /etc/passwd reader, a hex digest helper, a static file server, a tar or zip walker"
    ban:
      note: review only, since no import or call stands for the hand-written code
    gap: None.
    source: https://pkg.go.dev/std
    state: chosen
# Tools. tools.yaml says which tool a rule's check uses; this list only points to it and names the code a program
# does not write instead. A tool with no row in tools.yaml yet needs that row first; a pointer stays a pointer until
# a rule needs a check from the tool.
tools:
  - {key: golangci-lint, version: v2.15.0, tools_yaml: "rulebook/lang/go/tools.yaml, key golangci-lint", replaces: "a hand-written layers test, a per-linter debt list, a clone detector, a lint config copied between programs", source: "https://github.com/golangci/golangci-lint"}
  - {key: gitleaks, version: v8.30.1, tools_yaml: "rulebook/base/supply/tools.yaml, key gitleaks", replaces: "a hand-written scan for private words, addresses and home paths in tests", source: "https://github.com/gitleaks/gitleaks"}
  - {key: typos, tools_yaml: "rulebook/base/docs/tools.yaml, key typos", replaces: "a hand-written spelling or one-word ban test; the one spelling tool kept", source: "https://github.com/crate-ci/typos"}
  # vale: v3.26.0 was published 2026-10-31, 16 days before this row (2026-11-16), so it clears the 7-day window; the
  # newer v3.27.0 (2026-11-12) passes it on 2026-11-19. Chosen for docs.voice.2, beside typos, which stays the spelling tool.
  - {key: vale, version: v3.26.0, tools_yaml: pointer, replaces: "a hand-written scan for filler words and the not-X-but-Y form in docs", source: "https://github.com/errata-ai/vale"}
  - {key: go-task, version: v3.54.0, tools_yaml: "rulebook/lang/go/tools.yaml, key go-task", replaces: "a home-made task runner, a stamp, a tier pool, a Makefile with its own fan-out", source: "https://github.com/go-task/task"}
  - {key: gotestsum, version: v1.13.0, tools_yaml: "rulebook/lang/go/tools.yaml, key gotestsum", replaces: "a hand-written test-result counter or event reader", source: "https://github.com/gotestyourself/gotestsum"}
  - {key: goreleaser, version: v2.20.2, tools_yaml: "rulebook/lang/go/tools.yaml, key goreleaser", replaces: "a hand-written archive, checksum and notices script", source: "https://github.com/goreleaser/goreleaser"}
  - {key: changie, version: v1.26.0, tools_yaml: "rulebook/lang/go/tools.yaml, key changie", replaces: "a changelog writer that parses commits, a release script", source: "https://github.com/miniscruff/changie"}
  - {key: govulncheck, version: v1.9.0, tools_yaml: "rulebook/lang/go/tools.yaml, key govulncheck", replaces: "a hand-written vulnerability scan of the module graph", source: "https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck"}
  - {key: go-tool-directive, tools_yaml: "rulebook/lang/go/tools.yaml, key go-tool-directive", replaces: "a tool-fetch package, a Makefile curl block with a checksum, a second tool manager", source: "https://go.dev/doc/modules/managing-dependencies#tools"}
  - {key: go-licenses, version: v2.0.1, tools_yaml: pointer, replaces: "a hand-written licence and notice collector", source: "https://github.com/google/go-licenses"}
  - {key: actionlint, tools_yaml: pointer, replaces: "a hand-read of workflow files", source: "https://github.com/rhysd/actionlint"}
  - {key: gorelease, tools_yaml: pointer, replaces: "a hand-written API diff of a library between tags", source: "https://pkg.go.dev/golang.org/x/exp/cmd/gorelease"}
  - {key: gh, version: v2.103.3, tools_yaml: pointer, replaces: "hand-written calls to the GitHub API", source: "https://github.com/cli/cli"}
  - {key: psmux, tools_yaml: pointer, replaces: "a hand-written tmux stand-in on Windows", source: "https://github.com/marlocarlo/psmux"}
  - {key: djvutxt, tools_yaml: pointer, replaces: "a hand-written DjVu text reader", source: "https://djvu.sourceforge.net/"}
  - {key: epubcheck, tools_yaml: pointer, replaces: "a hand-written EPUB validator", source: "https://github.com/w3c/epubcheck"}
  - {key: sandbox-exec, tools_yaml: pointer, replaces: "a hand-written sandbox on macOS", source: "https://developer.apple.com/library/archive/documentation/Security/Conceptual/AppSandboxDesignGuide/"}
# Dropped, and by what. No row and no ban for any of these.
dropped:
  - {name: gotest.tools/v3, by: "the standard testing package and the library's own golden helper; the preset's no-assert row stays as it is"}
  - {name: github.com/opencontainers/go-digest, by: "the standard crypto/sha256 (no shared digest package exists); a program that wants a typed sha256 value may import it directly, with no ban and no shared package"}
  - {name: multi-gitter, by: "not needed to sync files between repos"}
  - {name: osv-scanner, by: "govulncheck, which is the pick for the Go dependency scan"}
  - {name: lychee, by: "each repo's own offline link test"}
  - {name: github.com/moby/sys/reexec, by: "nothing; no source lists it"}
  - {name: dependabot, by: "nothing; Dependabot is not used on the Free plan, so no file of it is written or read. Out-of-date modules are found by the module-age check and govulncheck"}
  - {name: github.com/go-sqlite3, by: "modernc.org/sqlite (the sqlite row); no source bans it, so there is no ban"}
