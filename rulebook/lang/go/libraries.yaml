part: go
# The register of libraries and tools a Go program calls instead of writing the code itself (supply.intake.6).
# Beside tools.yaml, which says which tool a rule's check uses. This file says which library does a job, so a
# program does not write its own. Standing rule: do not build what already exists; the library is the core and is
# called directly, and a program's own code holds only the gap, which each row names.
#
# A row: key, job, use (module, version, package; released, the day the pinned release was published, and age, a day
# the row records, both only dates: no release-age window is held), scope, replaces (the modules it refuses, each with a why), by_hand (the hand-written code it refuses), ban (deny: import paths the depguard row refuses; forbid:
# forbidigo patterns; planned: patterns not yet proven by a planted fixture; note: why a row bans nothing; linter: the
# linter of the Go preset that holds the ban, one of depguard, forbidigo, gomodguard_v2 or gomoddirectives, or a list of
# them for a row that bans imports and calls; a row that bans an import or a call names it), gap,
# source (the module's own page or an upstream issue), state and, for a conditional row, the proof it waits for.
#
# version is a release (v1.2.3, which a chosen row dates in released), floor (the version every program resolves to,
# which the first change that adopts the module fixes with gh and the 7-day age), toolchain (the Go release's own)
# or none. state is chosen (built on), needs-spike (a spike decides it first) or conditional (applies only if its
# proof passes; the checker treats it as not used here until the proof is recorded). Only a chosen row that bans
# something feeds the preset.
libraries:
  # ---------------------------------------------------------------- data formats
  - key: yaml
    job: read and write YAML
    use: {module: go.yaml.in/yaml/v3, version: v3.0.6, released: "2026-10-13", package: "anywhere a program reads or writes YAML"}
    scope: anywhere
    replaces:
      - {name: "gopkg.in/yaml.v3", why: "archived upstream; go.yaml.in/yaml/v3 is the same code under the new path, so no call changes"}
      - {name: "github.com/go-yaml/yaml", why: "archived in April 2025"}
      - {name: "gopkg.in/yaml.v2", why: "the older line of the archived module; a second YAML implementation (one pin stays in one program for a crawl dependency, see crawl-pins)"}
      - {name: "github.com/goccy/go-yaml", why: "a second YAML implementation with 277 open issues and no gain over the first"}
    by_hand:
      - a strict YAML reader (duplicate keys, single document, depth limit) once a library option does it
    ban:
      linter: depguard
      deny: [gopkg.in/yaml.v3, gopkg.in/yaml.v2, github.com/go-yaml/yaml, github.com/goccy/go-yaml]
      note: the one yaml.v2 pin of crawl-pins is in go.mod and is never imported, and depguard reads imports
    gap: >-
      The v3 line has no unique-keys, known-fields or single-document options, so about 130 lines of a strict reader
      stay until the v4 line of the same organisation is released as stable (it has WithUniqueKeys, WithKnownFields and
      WithSingleDocument).
    source: https://github.com/yaml/go-yaml
    state: chosen
  - key: toml-read
    job: read and write TOML
    use: {module: github.com/BurntSushi/toml, version: v1.6.0, released: "2025-12-18", package: "anywhere a program reads TOML, called directly with no wrapper package"}
    scope: anywhere
    replaces:
      - {name: "github.com/pelletier/go-toml", why: "a second TOML library for a job that has one; v2 is allowed only for the toml-edit row"}
    by_hand:
      - a home-made TOML reader or line splitter
    ban:
      linter: depguard
      deny: [github.com/pelletier/go-toml]
      note: github.com/pelletier/go-toml/v2 stays allowed in the one editing package of the toml-edit row, and for the config checker's read of .gitleaks.toml
    gap: "It keeps no comments and no key order. A change to a file a person edits is the toml-edit row."
    source: https://github.com/BurntSushi/toml
    state: chosen
  - key: toml-edit
    job: change one key in a TOML file a person edits and keep its comments and key order
    use: {module: github.com/pelletier/go-toml/v2, version: v2.4.3, released: "2026-07-05", package: "the one package that edits the file"}
    scope: "one package per program, and the config checker's own read of .gitleaks.toml (ruled 14 Nov 2026; the reading library above is the reader everywhere else)"
    replaces:
      - {name: "github.com/BurntSushi/toml", why: "it writes the file back without comments or order, so it cannot edit a hand-kept file"}
    by_hand:
      - a regexp or line-by-line text edit of a TOML file
    ban:
      linter: depguard
      deny: [github.com/pelletier/go-toml]
      note: the v2 path of this library is denied everywhere except the one editing package and the config checker's reader
    gap: >-
      None known. A program that already has text edits that keep comments moves them onto the library in the same
      change that adds it.
    source: https://github.com/pelletier/go-toml
    state: chosen
  - key: json-strict
    job: decode JSON strictly (case-exact names, duplicate keys refused, unknown members refused by option)
    use: {module: encoding/json/v2, version: toolchain, package: "the wire and record readers"}
    scope: anywhere
    by_hand:
      - a walker that rejects duplicate JSON keys, such as an exact-keys or one-key-each reader
      - a line decoder that works around case-insensitive field matching
    ban:
      note: review only, since no import or call stands for the hand-written decoder
    gap: >-
      The package's API stability under the Go 1 promise is not confirmed. Recheck it when the toolchain moves.
    source: https://pkg.go.dev/encoding/json/v2
    state: chosen
    open:
      - "The check is the Go 1 compatibility statement for encoding/json/v2 in the release notes of each toolchain; until it says stable the row is kept chosen under this open."
  - key: json-schema
    job: check a YAML or JSON document against a schema
    use: {module: github.com/santhosh-tekuri/jsonschema/v6, version: v6.0.3, released: "2026-06-28", package: "the one package that validates a registry"}
    scope: one package per program
    replaces:
      - {name: "github.com/kaptinlin/jsonschema", why: "less mature"}
      - {name: "github.com/google/jsonschema-go", why: "aimed at one protocol; second choice"}
      - {name: "cuelang.org/go", why: "a large dependency and a new language for one small job"}
    by_hand:
      - hand shape checks of a document's fields, kinds, counts and budgets (about 900 lines in one registry)
    ban:
      linter: gomodguard_v2
      deny: [github.com/kaptinlin/jsonschema, github.com/google/jsonschema-go, cuelang.org/go]
    gap: "None known. Kept at the version the config checker already pins."
    source: https://github.com/santhosh-tekuri/jsonschema
    state: chosen
  - key: expression-rules
    job: compile and check typed rule expressions
    use: {module: github.com/google/cel-go, version: floor, package: "the one package that compiles rule expressions"}
    scope: one package per program
    by_hand:
      - an expression parser and evaluator for rule conditions
    ban:
      note: github.com/google/cel-go is denied everywhere except the one rule package; no alternative is banned
    gap: "None known. The first change that adopts the module fixes a tag with gh, since no release date is read yet."
    source: https://github.com/google/cel-go
    state: chosen
  - key: openapi-server
    job: generate a strict server interface from an OpenAPI document
    use: {module: github.com/oapi-codegen/oapi-codegen/v2, version: v2.8.1, released: "2026-10-24", package: "a tool of the program, run as a pinned tool and never imported"}
    scope: tool only
    by_hand:
      - a hand-written request or response type that the OpenAPI document already states
    ban:
      linter: depguard
      deny: [github.com/oapi-codegen]
      note: the tool is never imported by non-generated code
    gap: >-
      The generated file is generated, never edited. It is pinned as a tool (the go tool directive or a tool modfile),
      not in a Makefile.
    source: https://github.com/oapi-codegen/oapi-codegen
    state: chosen
  - key: version-and-semver
    job: read the build version, parse and compare semantic versions, read go.mod
    use: {module: golang.org/x/mod, version: v0.42.0, released: "2026-10-09", package: "version, semver and modfile uses"}
    scope: anywhere
    replaces:
      - {name: "github.com/carlmjohnson/versioninfo", why: "package-level variables set in init, no injected build info, no stamp merge"}
      - {name: "github.com/caarlos0/go-version", why: "one maintainer, the same 40 lines, no stamp"}
    by_hand:
      - a semantic-version regexp
      - a hand parse of go.mod or go.sum, or of the private-module path patterns
    ban:
      linter: gomodguard_v2
      deny: [github.com/carlmjohnson/versioninfo, github.com/caarlos0/go-version]
    gap: The stamped-else-build-info-else-dev rule is about 90 lines of our own.
    source: https://pkg.go.dev/golang.org/x/mod
    state: chosen
  # ---------------------------------------------------------------- command line and terminal
  - key: command-tree
    job: the command tree, flags, help and completion
    use: {module: github.com/spf13/cobra, version: v1.10.2, released: "2025-12-03", package: "the command packages and main"}
    scope: only the program's command packages
    replaces:
      - {name: "github.com/urfave/cli/v3", why: "it would replace the command tree every program already uses"}
      - {name: "github.com/alecthomas/kong", why: "the same"}
      - {name: "github.com/hashicorp/cli", why: "no safe arguments, no dry run, no json mode"}
    by_hand:
      - a flag parser, a help printer or a completion generator
    ban:
      linter: gomodguard_v2
      deny: [github.com/alecthomas/kong, github.com/hashicorp/cli]
      note: the preset row cli-flags already holds flag, pflag, cobra and urfave/cli outside the command packages
    gap: >-
      None. pflag resolves to v1.1.0 in the one program whose book converter requires it, and to v1.0.9 elsewhere; for
      "did you mean", cobra's SuggestionsFor does the job.
    source: https://github.com/spf13/cobra
    state: chosen
  - key: cli-frame
    job: run a command with version, help, completion and the closing line
    use: {module: charm.land/fang/v2, version: v2.0.1, released: "2026-03-11", licence: MIT, package: "anywhere a program draws"}
    scope: anywhere a program draws
    by_hand:
      - a home-made version, help or banner printer
      - a second command runner beside the shared one
    ban:
      note: no import is banned; the shared module owns the frame and a product may import Charm directly
    gap: >-
      The command frame (flags, recover, the ending and its exit code) is about 230 lines of our own in the shared UI
      library.
    source: https://github.com/charmbracelet/fang
    state: chosen
  - key: terminal-style
    job: colour, width, tables, layout and terminal detection
    use: {module: charm.land/lipgloss/v2, version: v2.1.0, released: "2026-11-09", age: "2026-11-16", licence: MIT, package: "anywhere a program draws"}
    scope: anywhere a program draws
    replaces:
      - {name: "github.com/fatih/color", why: "a second style system beside the one the programs share"}
      - {name: "github.com/mattn/go-isatty", why: "terminal detection belongs to the UI package"}
      - {name: "github.com/muesli/termenv", why: "superseded by colorprofile"}
      - {name: "github.com/pterm/pterm", why: "global writers and state, its own layout"}
      - {name: "github.com/rivo/tview", why: "a second UI framework beside Charm"}
      - {name: "github.com/jedib0t/go-pretty", why: "a second style system; the lipgloss table is already linked"}
      - {name: "github.com/olekukonko/tablewriter", why: "a second style system; the lipgloss table is already linked"}
      - {name: "github.com/cli/go-gh/v2/pkg/term", why: "it reads os.Stdout and os.Environ only, so streams cannot be injected"}
    by_hand:
      - a colour or no-colour switch that reads NO_COLOR, CLICOLOR or TERM by hand
      - a Windows ANSI switch (lipgloss has EnableLegacyWindowsANSI)
      - a table, grid or width fitter
    ban:
      linter: depguard
      deny: [github.com/pterm/pterm, github.com/rivo/tview, github.com/jedib0t/go-pretty, github.com/olekukonko/tablewriter, github.com/cli/go-gh/v2/pkg/term]
      note: the preset rows owner-ui and the os.Stdout and os.Stderr rows (cli.errors.3) hold the rest
    gap: >-
      The look itself (symbols, the lesson and report layouts, the plain twins) is about 5,500 lines in the shared UI
      library and nowhere else. colorprofile and charmbracelet/x/term stay at the shared UI library's floor.
    source: https://github.com/charmbracelet/lipgloss
    state: chosen
  - key: ansi-text
    job: strip ANSI sequences from text, wrap it, measure its width
    use: {module: github.com/charmbracelet/x/ansi, version: floor, licence: MIT, package: "anywhere a program draws"}
    scope: anywhere a program draws
    replaces:
      - {name: "github.com/acarl005/stripansi", why: "no push since 2022"}
      - {name: "github.com/muesli/reflow", why: "last release 2021"}
      - {name: "github.com/muesli/cancelreader", why: "no release since 2022; the standard library does it in about 60 lines"}
      - {name: "github.com/cli/go-gh/v2/pkg/asciisanitizer", why: "C0 and C1 only, errors on invalid UTF-8, no bidi or format characters"}
    by_hand:
      - an ANSI-stripping regexp
      - a word-wrap or display-width function
    ban:
      linter: gomodguard_v2
      deny: [github.com/acarl005/stripansi, github.com/muesli/reflow, github.com/muesli/cancelreader]
    gap: Making a name safe to print (control and bidi characters) stays in the shared UI library.
    source: https://github.com/charmbracelet/x
    state: chosen
  - key: forms-and-live-ui
    job: questions, live views, pager and meters
    use: {module: charm.land/huh/v2, version: v2.0.3, released: "2026-03-10", licence: MIT, package: "anywhere a program draws; charm.land/bubbletea/v2 v2.1.1 and charm.land/bubbles/v2 v2.2.1 (both MIT) come with it"}
    scope: anywhere a program draws
    replaces:
      - {name: "github.com/AlecAivazis/survey", why: "archived in April 2024"}
      - {name: "github.com/manifoldco/promptui", why: "no accessible mode, no multi-step form"}
      - {name: "github.com/walles/moor", why: "a second terminal framework for about 200 lines of pager"}
      - {name: "github.com/jackdoe/go-pager", why: "abandoned, for about 200 lines of pager"}
      - {name: "github.com/charmbracelet/x/exp/teatest/v2", why: "runs a real asynchronous program, pins a release candidate, cannot step a form"}
    by_hand:
      - a hand-drawn progress meter (bubbles progress.ViewAs does it)
    ban:
      linter: gomodguard_v2
      deny: [github.com/AlecAivazis/survey, github.com/manifoldco/promptui, github.com/walles/moor, github.com/jackdoe/go-pager]
    gap: >-
      The progress bar with its rate window and its pipe face (about 306 lines) stays our own: an outside progress
      library (github.com/schollz/progressbar/v3) was weighed and turned down.
    source: https://github.com/charmbracelet/huh
    state: chosen
  - key: log
    job: logging
    use: {module: log/slog, version: toolchain, package: "anywhere; the only logging API"}
    scope: anywhere
    replaces:
      - {name: "github.com/charmbracelet/log", why: "not as the logging API; as a slog handler it is allowed anywhere"}
      - {name: "github.com/lmittmann/tint", why: "a fine handler, but the Charm one is already linked"}
      - {name: "log", why: "a daemon logs through slog (rule go.logging.1)"}
    by_hand:
      - a home-made logger or logfmt writer
    ban:
      linter: gomodguard_v2
      deny: [github.com/lmittmann/tint]
      note: the Charm log package is allowed as a slog handler anywhere a program draws, and the sloglint settings of the preset hold the slog side
    gap: None.
    source: https://pkg.go.dev/log/slog
    state: chosen
  - key: shell-quote
    job: quote one word for a POSIX shell, and print a command a person can paste
    use: {module: al.essio.dev/pkg/shellescape, version: v1.6.1, released: "2026-09-01", licence: MIT, package: "called at the one site that prints the line, for a POSIX shell only; go-console's one quoter (POSIX, PowerShell and cmd, go-console#196) replaces it for a line a person pastes once it lands"}
    scope: anywhere
    replaces:
      - {name: "github.com/kballard/go-shellquote", why: "last tag 2018"}
    by_hand:
      - a home-made quote helper or a "line" package (about 30 copies existed)
      - a regexp that escapes single quotes by hand
    ban:
      linter: gomodguard_v2
      deny: [github.com/kballard/go-shellquote]
    gap: >-
      It passes a NUL byte through without error. The runner-up, the quote function of the shell parser in the next row,
      refuses NUL; this library was picked. A caller that prints for a person checks its input for NUL first.
    source: https://github.com/alessio/shellescape
    state: chosen
  - key: shell-parse
    job: read a shell line (tokens, quoting, commands) instead of splitting it by hand
    use: {module: mvdan.cc/sh/v3, version: v3.14.1, released: "2026-09-06", package: "the one package that reads shell lines"}
    scope: one package per program
    by_hand:
      - a hand tokenizer for shell lines or workflow run steps
    ban:
      note: mvdan.cc/sh is denied everywhere except the one package; its quote function is not used elsewhere (see shell-quote)
    gap: "Allowed for one package. Using its quote function elsewhere is not allowed."
    source: https://github.com/mvdan/sh
    state: chosen
  - key: size-and-duration-text
    job: print sizes, durations, counts and "ago"; read them back
    use: {module: github.com/dustin/go-humanize, version: v1.1.0, released: "2026-09-17", package: "anywhere a program prints a size or a count"}
    scope: anywhere
    by_hand:
      - a home-made size, duration, comma or plural formatter (about 240 lines in one program)
    ban:
      note: review only, since no import or call stands for the hand-written formatter
    gap: Parsing "10 MB" or "2h" typed by a person stays in the program (ParseSize, ParseDuration).
    source: https://github.com/dustin/go-humanize
    state: chosen
  - key: did-you-mean
    job: say "did you mean" for a mistyped command or word
    use: {module: github.com/agnivade/levenshtein, version: v1.2.2, released: "2026-10-17", package: "the command package, through cobra's SuggestionsFor where it fits"}
    scope: only the program's command packages
    by_hand:
      - an edit-distance function
    ban:
      note: review only, since no import or call stands for the hand-written function
    gap: None.
    source: https://github.com/agnivade/levenshtein
    state: chosen
  # ---------------------------------------------------------------- terminals in tests and on Windows
  - key: pseudoconsole
    job: a pseudoterminal on every system, including the Windows pseudoconsole
    use: {module: github.com/aymanbagabas/go-pty, version: v0.2.3, released: "2026-05-17", package: "the one package that starts a terminal child"}
    scope: one package per program
    replaces:
      - {name: "github.com/charmbracelet/x/conpty", why: "ruled 14 Nov 2026 in favour of go-pty (x/conpty was the earlier pick)"}
      - {name: "github.com/creack/pty", why: "no pseudoconsole on Windows"}
      - {name: "github.com/charmbracelet/x/xpty", why: "larger than the use"}
      - {name: "github.com/UserExistsError/conpty", why: "stale"}
    by_hand:
      - raw CreatePseudoConsole calls
      - a pty opened with cgo or a hand ioctl
    ban:
      linter: depguard
      deny: [github.com/charmbracelet/x/conpty, github.com/creack/pty, github.com/charmbracelet/x/xpty, github.com/UserExistsError/conpty]
    gap: Windows is not run yet; the Windows build of the session host is proven on a Windows machine first.
    source: https://github.com/aymanbagabas/go-pty
    state: chosen
  - key: terminal-screen
    job: a terminal screen that a test reads (the rendered cells of a program's output)
    use: {module: github.com/charmbracelet/x/vt, version: v0.1.0, released: "2026-10-12", package: "the journey test package only"}
    scope: only the program's journey tests
    by_hand:
      - a home-made ANSI screen model in a test
    ban:
      note: github.com/charmbracelet/x/vt is denied outside _test.go files of the journey package
    gap: Allowed 14 Nov 2026, and used only if it draws the goldens the same as today.
    source: https://github.com/charmbracelet/x
    state: conditional
    proof: the library draws the program's goldens byte for byte the same as the hand-written screen model does
  - key: test-scripts
    job: command-line test scripts
    use: {module: github.com/rogpeppe/go-internal/testscript, version: v1.16.0, released: "2026-07-01", licence: BSD-3-Clause, package: "test files, imported directly with no wrapper package"}
    scope: only the program's test files
    by_hand:
      - a home-made script runner or a wrapper package around testscript
    ban:
      note: >-
        review only for now: a lint on script text is to refuse [windows], [unix], [linux] and [darwin] conditions,
        chmod and symlink, and go-proc does not wrap testscript
    gap: "A script that must differ by system is written once with the program's own commands, never a condition on the system."
    source: https://github.com/rogpeppe/go-internal
    state: chosen
  # ---------------------------------------------------------------- files
  - key: confine-to-folder
    job: open, make and rename inside a folder and never leave it
    use: {module: os, version: toolchain, package: "anywhere, called directly (os.Root)"}
    scope: anywhere
    replaces:
      - {name: "github.com/cyphar/filepath-securejoin", why: "superseded by os.Root; the fd form is Linux only and it follows links inside the root"}
      - {name: "github.com/google/safeopen", why: "its own README defers to os.Root"}
      - {name: "github.com/containerd/continuity", why: "RootPath resolves a string, so it checks then uses"}
    by_hand:
      - a string-prefix test on a cleaned path
      - a path walk that Lstat-checks each part and then opens
      - raw openat2 syscalls with RESOLVE flags
    ban:
      linter: gomodguard_v2
      deny: [github.com/cyphar/filepath-securejoin, github.com/google/safeopen, github.com/containerd/continuity]
      planned: ['^unix\.(Openat2|Renameat2)$']
    gap: >-
      os.Root follows links that stay inside the root and has no rename-exchange. The no-link rule and the exchange stay
      as our side code until golang/go#83038 and golang/go#73080 land, and the macOS no-follow open until std gains
      os.O_NOFOLLOW_ANY.
    source: https://go.dev/blog/osroot
    state: chosen
    open:
      - The pattern for raw openat2 and renameat2 outside the host layer needs type information, so a planted fixture through golangci-lint makes it active.
  - key: atomic-write
    job: replace a file whole so a reader sees the old file or the new one
    use: {module: github.com/birdtable/go-files, version: v0.4.0, released: "2026-11-19", age: "2026-11-26", licence: Apache-2.0, package: "write (File, FileFrom and FileIn); a program imports no golang.org/x/sys, since go-files holds it inside write"}
    scope: anywhere a program writes a file
    replaces:
      - {name: "github.com/google/renameio/v2", why: "no Windows support; its root form puts the temp file in the root's top folder"}
      - {name: "github.com/moby/sys/atomicwriter", why: "by path only, no os.Root, no folder flush"}
      - {name: "github.com/natefinch/atomic", why: "unmaintained since 2021"}
      - {name: "github.com/dchest/safefile", why: "unmaintained since 2015"}
      - {name: "tailscale.com/atomicfile", why: "its API is declared unstable and it keeps the old ACL on Windows"}
    by_hand:
      - a temp file, sync, rename written again in a program
      - a plain os.WriteFile of a file another process reads
    ban:
      linter: depguard
      deny: [github.com/google/renameio, github.com/moby/sys/atomicwriter, github.com/natefinch/atomic, github.com/dchest/safefile, tailscale.com/atomicfile]
      note: os.WriteFile is not banned, because a scratch write is fine
    gap: >-
      The standard library has no atomic write (golang/go#22397 is open), so about 320 lines stay ours in one package.
      Revisit when std gains an atomic replace or when google/renameio covers Windows (its issue 47). The Windows form is
      not proven: clear the read-only bit first; no-replace needs hard links.
    source: https://github.com/golang/go/issues/22397
    state: needs-spike
  - key: path-lock
    job: one holder per path, on Linux, macOS, freebsd and Windows
    use: {module: github.com/gofrs/flock, version: v0.13.2, released: "2026-11-08", age: "2026-11-15", licence: BSD-3-Clause, package: "go-files lock (Take and Wait), which holds gofrs/flock, syscall.Flock and LockFileEx inside it; a program imports none of them"}
    scope: anywhere a program holds a path
