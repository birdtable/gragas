format: 3
part: py
concern: cycle
rules:
  - id: py.cycle.1
    statement: "At commit the formatter runs in check mode and the linter runs without fixing; neither rewrites a file."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "The formatter's check mode lists the files that differ and exits non-zero; the linter reports and does not fix. Both read and never write (gates.command.28), so they run beside the other commit members inside the commit hook's seconds. The fix is the same tool in write mode, run by the person. Their cost was not measured on the host that studied the stack."
      pros:
        - "A hook that rewrites files is the opposite of a check, and a formatter in write mode races the members beside it."
    relations:
      relates:
        - gates.command.28
        - gates.hooks.3
    sources:
      - ref: ruff-formatter
        where: "The Ruff Formatter, ruff format --check"
        says: "ruff format --check /path/to/file.py will avoid writing any formatted files back, and instead exit with a non-zero status code"
        backs: check
      - ref: ruff-linter
        where: "The Ruff Linter, ruff check"
        says: "It accepts a list of files or directories, and lints all discovered Python files, optionally fixing any fixable errors."
        backs: check
  - id: py.cycle.2
    statement: "The requirements are pinned with exact versions, or a lock file carries hashes; a minimum-version pin gives a fresh venv whatever is newest."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "supply.install.1 holds that one package manager installs from the lockfile only and that the lockfile is the pin. For a project with a plain requirements file the pin is an exact version per line; where hashes are carried the installer refuses anything it cannot match. A line that says at least a version is not a pin."
      pros:
        - "A requirements file with minimum-version pins gives every fresh venv a different tree, and a check that passed on one cannot be said to pass on the next."
    relations:
      relates:
        - supply.install.1
        - supply.install.4
    sources:
      - ref: pip-secure-installs
        where: "Hash-checking Mode, Requirements Pinned with =="
        says: "Requirements must be pinned (either to a URL, filesystem path or using ==)."
        backs: rule
  - id: py.cycle.3
    statement: "The venv is built from the pins and rebuilt only when the pins change; a run checks it once and installs nothing when the check passes."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "gates.command.19 holds that a tool is installed when its pin changes and checked once per run. The venv is this stack's install; the check compares the installed set with the pins, and the install runs when they differ or the pins file changed. The measured cost was 1.08 seconds plus 0.86 seconds warm."
      pros:
        - "An install on every push is paid on every push, and an install that never checks the pin lets a stale venv pass for the pinned one."
    relations:
      relates:
        - gates.command.19
        - gates.command.21
    sources:
      - ref: py-reasons-stated
        backs: rule
  - id: py.cycle.4
    statement: "At push every source file is byte-compiled, so a syntax error in a file nothing imports is found."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "An import smoke (py.cycle.5) proves only the files the imports reach. The byte-compile walks the tree and compiles each file, in about 0.05 seconds, and a file with a syntax error fails it whether or not anything imports it. It is a member of its own, quiet on success."
      pros:
        - A file nothing imports can carry a syntax error for months and fail the day something imports it.
    relations:
      relates:
        - py.cycle.5
    sources:
      - ref: python-compileall
        where: compileall
        says: These functions compile Python source files in a directory tree.
        backs: check
  - id: py.cycle.5
    statement: At push an import smoke imports every package in a fresh interpreter.
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "The smoke proves the packages import with the venv as pinned, in about 0.03 seconds. The interpreter is the one the venv pins, so its version is already in the stamp key through the pin (gates.land.15); the host's own build string is no part of the key."
      pros:
        - "One organisation's desktop tool was red on import on the host that studied it, and a stamp that ignores the interpreter would have served the green of another host."
    relations:
      relates:
        - gates.land.15
        - go.cycle.3
    sources:
      - ref: py-reasons-stated
        backs: rule
  - id: py.cycle.6
    statement: At push the tests run with workers from the pool and a type checker runs as its own member.
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "tests.runners.2 holds that the worker count comes from the pool's capacity and is never hard-coded; the test tool's automatic worker count is the tool's own reading of the host and is capped by the pool's number (gates.command.27). The type checker is a member of its own, so a type failure names it. Neither was measured on the host that studied the stack."
      pros:
        - "A serial test run holds one CPU while the pool has more, and a type check inside the test command hides which one failed."
    relations:
      relates:
        - tests.runners.2
        - gates.command.27
        - tests.runners.4
    sources:
      - ref: pytest-xdist-docs
        where: Running tests across multiple CPUs
        says: "With -n auto, pytest-xdist will use as many processes as your computer has physical CPU cores."
        backs: check
  - id: py.cycle.7
    statement: "At push the program runs headless on a checked-in input and its output is compared with a checked-in expected file, read by a person."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A replay golden is the one test that runs the whole program. tests.generated.5 holds how a golden a person reads is approved; this line places one in the push tier for a program that has a headless mode. A replay that proves only that the program did not crash is a start, and the expected file grows as the output does."
      pros:
        - "One organisation's desktop tool had no test that ran it; a replay was the cheapest proof that it starts and produces its output."
    relations:
      relates:
        - tests.generated.5
        - tests.journeys.2
    sources:
      - ref: py-reasons-stated
        backs: rule
  - id: py.cycle.8
    statement: "At push the requirements are scanned for known vulnerabilities, and at commit the staged diff is scanned for secrets against a reviewed allowlist."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "supply.scans.7 holds the vulnerability scan in the full gate the land job runs before main, and supply.secrets.1 the secrets scan at commit; this line names the inputs for the stack: the requirements file for the first, the staged diff for the second, with the allowlist a shrink-only baseline that has an owner (gates.ratchets.1). The standard's stack line lists the secrets scan at push; this rule keeps it at commit, the earliest moment that holds it (C3). The vulnerability scan took 0.69 seconds on the measuring host."
      pros:
        - "A secrets scan with no allowlist found 15 hits in three repositories of one organisation and none was a credential, so without the list the line stays red and is ignored."
    relations:
      relates:
        - supply.scans.7
        - supply.secrets.1
        - gates.ratchets.1
    sources:
      - ref: gitleaks-readme
        where: ".gitleaksignore"
        says: You can ignore specific findings by creating a .gitleaksignore file at the root of your repo.
        backs: check
