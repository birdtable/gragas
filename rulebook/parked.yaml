      tool: eslint
      tier: "1"
      note: "nodenext resolution in library mode, and Biome `useImportExtensions` or ESLint `import-x/extensions` in app mode. Plant: `import { x } from './util'` fails; `./util.ts` or `./util.js` passes. Control: a relative import with its extension passes"
  relates:
    ts.compiler.3:
      how: see
ts.modules.4:
