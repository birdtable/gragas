base/arch/rules/ports.yaml:
  summary: "The core of a program knows nothing it does not own. Every connection in or out (a provider, a runtime, the operating system, a store, the network, another program) goes through an interface the core declares and an adapter implements, so adding a provider or a platform means adding an adapter and changing no core file."
arch.ports.1:
  slug: core-knows-only-what-it-owns
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: forbidigo
      fix: never
      note: "rule data names core paths, pure packages, adapter paths and the domain list; depguard rules generated per core glob with strict list-mode allowing the standard library minus the process-spawning and network packages (with an allow entry for the URL and address packages), the pure shared packages and the core; forbidigo on runtime.GOOS and runtime.GOARCH outside adapter paths, tests included (an OS skip in a core test is a finding); a companion layout test that OS-suffixed files and build-constraint lines sit only under adapter paths; depguard or go-arch-lint independence between domain packages from the domain list. Plant: in a core path an import of the network package and of the process-spawning package are reported, and runtime.GOOS is reported by forbidigo; the same imports under the adapter folder are not reported. Control: the same imports and runtime.GOOS under the adapter path pass"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "eslint-plugin-boundaries rule boundaries/external restricts provider packages to adapter elements, provider list as rule data, count ratcheted. Plant: importing a provider's package in a feature file fails. Control: the same import in the adapter passes"
  review_question: "Would a second engine or provider have to invent a meaning for any method of the owned module, and which one?"
  open:
    - "In Go the depguard run passed three plants (network and process packages and GOOS) in golangci-lint 2.14.0; domain independence and OS-suffixed-file layout were not run. Denying the network package also hits the URL package unless an allow entry is added in lax mode."
    - "In the earlier trial a depguard config passed all three of its plants, an extended one caught 2 of 3 and a path check caught the third. Reflection on file-system information stays review."
    - "The web rule is vacuous today because neither site imports a provider package; it is held by the network-access rule and the provider-adapter rules in the web part."
    - "The web stack is agnostic at the level of intent, not engine neutrality."
    - "v1 evidence, not yet a source: operator (twin rules in Go and in the web stack); not measured on our web sites"
