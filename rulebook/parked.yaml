    "2":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "an import restriction allowing process.stdout writes and terminal modules only in the render module. Plant: process.stdout.write in a verb module fails. Control: the same call in the render module passes"
  open:
    - The architecture part holds the import-boundary side of the same check.
cli.look.2:
