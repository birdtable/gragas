program/cli/rules/commands.yaml:
  summary: "A command that writes either needs an explicit --apply after a dry run or writes only into a reviewable draft, is safe to run twice, serialises its writes through the store's own concurrency, keeps a versioned record that can be undone, reads the machine back before it says done, writes files without harming what a person or another program owns, and asks for the thing's own name before anything destructive. Help has fixed parts and topics, commands follow one grammar, a bare command never hangs, progress redraws only on work, and a mistyped command names the nearest match."
cli.commands.1:
  slug: apply-flag
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
