    - "Proposed for lack of a source; the v1 evidence was: practice"
program/service/rules/consumers.yaml:
  summary: "A consumer deduplicates, tolerates redelivery and unknown fields, releases what it opened, reports failure per item, and sends failed work to a dead-letter path that is redriven with care."
service.consumers.1:
  slug: consumers-deduplicate-atomically
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "the shared consumer wrapper writes the processing key in the mutation transaction, proven by the shared twice-helper delivering each message twice. Plant: a consumer that sends a call on each delivery fails the twice test. Control: a consumer using the wrapper passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test running each command twice and a torn-line append test. Plant: a command that duplicates its effect on a second run fails. Control: an idempotent command passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: The same shared twice-helper is the check of replay-and-conflict in the contract concern.
service.consumers.2:
  slug: dedupe-key-outlives-return
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "a test that reads the key lifetime constant and the dead-letter retention and redrive window in the same infrastructure and fails when the lifetime is shorter. Plant: a key lifetime shorter than the dead-letter retention fails. Control: a lifetime at least as long passes"
  review_question: "How long can this message come back, and how long is its key kept?"
  open:
    - The expiry delay of the store is quoted from a book and not verified.
    - "With agents: they pick a lifetime that looks tidy (inference)."
service.consumers.3:
  slug: subscription-has-dead-letter-redrive
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "an infrastructure scan failing a subscription or queue consumer with no dead-letter queue and redrive policy. Plant: a subscription with no dead-letter target fails. Control: one with a queue and a redrive policy passes"
  open:
    - In a daemon the park-and-redrive of failed work is a gap with no row yet.
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.consumers.4:
  slug: park-with-reason-redrive-filtered
  since: 0.1.0
  level: process
  kind: rule
  strength: Review
  review_question: "Where does this work go when it fails for good, and what stops a redrive acting on a stale state?"
  open:
    - "No plant: a seeded redrive tool that replays a message for a deleted resource must be flagged."
  note: "Extends subscription-has-dead-letter-redrive and the permanent-versus-transient rule, which say nothing about a stale message at redrive."
service.consumers.5:
  slug: release-resources-in-finally
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule requiring the non-request wrapper to call closePools() in a finally block. Plant: a wrapper that closes pools only on the success path fails. Control: a close inside finally passes"
    "2":
      binding: go
      class: preset-rule
      tier: "2"
      note: "goleak in tests and a rule that each goroutine started has a stop owner. Plant: a goroutine without a stop path fails. Control: an owned goroutine passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.consumers.6:
  slug: permanent-ack-transient-throw
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a wrapper test that a validation refusal returns without throwing and a downstream timeout throws. Plant: a wrapper that throws on a permanent refusal fails. Control: a wrapper that acknowledges it passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "In Go, a failed read names its cause through a code table and a transient one is retried with back-off."
service.consumers.7:
  slug: batch-fails-by-item
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: G
      note: "wrapper test: a batch with one poison message returns only that item as failed; a test asserting batch size times a stated worst-case item time is under the function timeout. Plant: a wrapper that throws on the first bad item fails. Control: a wrapper reporting the one failed item passes"
  open:
    - Per-item failure reporting for queue-triggered functions is a platform feature known and not verified here.
    - "With agents: holds (inference)."
  note: Extends permanent-ack-transient-throw. Related to the function timeout rules in the Lambda part.
service.consumers.8:
  slug: tolerant-reader
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a consumer test feeding each registered schema plus one extra field that must pass, and a config test feeding an unknown key that must fail. Plant: a consumer whose parser is strict fails on the extra field; a config that ignores an unknown key fails its test. Control: a tolerant event reader and a strict config reader pass"
  open:
    - "With agents: an agent may mark a peer message as config; the way round is visible in the choice of parser (inference)."
  note: "Beside the rule that an unknown query key from a client is a 400, which is correct for a client request."
service.consumers.9:
  slug: late-and-replayed-events
  since: 0.1.0
  level: release
  kind: rule
  strength: Review
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "catalogue schema test requiring a lateness policy field and a replay note per family. Plant: a catalogue entry with no policy field fails the catalogue test. Control: an entry with both passes"
  review_question: "What happens to an event that arrives a week late? What does a replay resend?"
  open:
    - The archive and replay behaviour of the bus was not verified.
    - "An agent cannot infer a business policy, so the question goes to a person (inference)."
  note: "Extends consumers-deduplicate-atomically, which says nothing about an event that arrives a week late or after its successor."
program/service/rules/contract.yaml:
  summary: "The contract is generated from the route schemas, diffed against the merge base and changed by the declared reader mode, linted with one shared ruleset in one declared casing, and written so that clients can be generated and retries are safe. This concern holds naming, errors in the contract, idempotency, compatibility between services and what a response promises."
service.contract.1:
  slug: contract-regenerated-and-diffed
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "gate step that regenerates the contract from the route schemas and fails on a diff with the committed file. Plant: a route added without regenerating the contract fails. Control: a regenerated, committed contract passes"
    "2":
      binding: any
      class: test-kit
      tier: "2"
      note: "gate step that regenerates the contract at the merge base with main and compares it with this change's contract under the program's compatibility mode. Plant: a change that removes a field and edits the committed file to match fails; a deleted committed file fails. Control: an additive change with a regenerated file passes"
    "3":
      binding: go
      class: test-kit
      tier: "2"
      note: "generated command tree and public surface file compared with the committed copy and with the merge base. Plant: a command added without regenerating the file fails. Control: a regenerated file passes"
  relates:
    service.contract.2:
      how: see
service.contract.2:
  slug: compatibility-follows-readers
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "gate step that reads the declared reader mode (none fails), then with owned readers fails a shape that loses or changes anything unless the contract number rose in the same change, and with independent readers fails a removal not deprecated in an earlier minor release. Plant: owned readers, a removed field with the number unchanged, fails; independent readers, a removed field never deprecated, fails; a program with no declared mode fails. Control: owned readers, a removed field with the number raised, passes; an additive change passes in either mode"
    "2":
      binding: any
      class: preset-config
      tool: oasdiff
      tier: "2"
      note: "oasdiff run against the last release of the contract (independent readers) or the merge base (owned readers), its breaking-change list fed to the mode step above. Plant: removing a response field is reported as a break. Control: adding an optional field passes"
    "3":
      binding: go
      class: preset-config
      tier: "2"
      note: "apidiff or gorelease refusing an undeclared break at the tag, plus the command tree diff. Plant: removing an exported field without a declared break fails. Control: an additive change passes"
  relates:
    cli.output.4:
      how: see
  open:
    - Both diff tools are chosen but not yet run on a planted break.
    - "cli.output.4 is rewritten under the same card for the CLI's own surface."
service.contract.3:
