lang/ts/rules/compiler.yaml:
  summary: "TypeScript runs under one shared strict compiler core, in a library mode and an app mode, raised one flag per change and never lowered. The type check has zero errors everywhere, and a replacement compiler gates only once stable, with the previous one pinned beside it."
ts.compiler.1:
  slug: zero-type-errors
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tool: astro-check
      tier: "1"
      note: "v1 class compiler. `tsc --noEmit` with the shared strict base for TypeScript and React projects; `astro check` (@astrojs/check) with the framework's strictest tsconfig for Astro projects. Plant: a planted type error in an `.astro` frontmatter and one in a `.tsx` file must each fail. Control: a project with no type errors passes"
  relates:
    ts.compiler.3:
      how: see
    ts.compiler.6:
      how: see
  open:
    - "TypeScript stays on the 6.0 line while typescript-eslint and the Astro checker peer ranges hold (stack list); the move to the native compiler is ts.compiler.6."
ts.compiler.2:
  slug: strictness-ratchet
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "a flag-list check: a committed list of compiler flags that can only grow, diffed against `tsconfig.json`, and a shrink-only count of errors for the next flag. Plant: removing a strict flag from `tsconfig.json` fails the flag-list check. Control: adding a flag with its errors fixed in the same change passes"
  open:
    - "The ratchet is a diff check on the flag list; the script is not written."
    - "The window of one flag per change starts after the last flag flip in the source's plan."
ts.compiler.3:
  slug: shared-compiler-base
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "a test that reads the project's resolved compiler options and compares them with the shared base's required set; a template-equality check on the compiler file. Plant: a project compiler file that turns `strict` off fails; one missing `noFallthroughCasesInSwitch` fails; a library package resolving with bundler, or an app package that emits, fails. Control: a project whose resolved options include the whole core and the module mode of its declared kind passes"
  relates:
    ts.compiler.5:
      how: see
  open:
    - "The check is written from the shared lists; not run."
ts.compiler.4:
  slug: flags-left-off-are-recorded
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "0"
      note: "a test that reads the base's off-list and asserts each flag in it is off and carries a reason. Plant: an off-flag with no reason fails; an off-flag that is on fails. Control: an off-list that matches the options passes"
  note: "A related rule in the base gates part holds that any waiver carries a reason and an expiry; this is its compiler form."
ts.compiler.5:
  slug: shared-base-listed-last
