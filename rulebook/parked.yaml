base/gates/rules/plants.yaml:
  summary: "A check that cannot fail is not a check. Every check has a planted violation that turns it red and a clean control, the gate runs the plants, empty or missing input fails closed, and the gate proves it ran its whole list and prints what it skipped."
gates.plants.1:
  slug: every-check-has-a-plant
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. A selftest command: the runner executes every plant fixture per rule and per tier, plant plus clean control, and a registered rule with no plant directory fails. Plant: Register a check with no fixture; delete one plant fixture and the runner fails. Control: A check with the full triple (plant, control, refusal) passes."
  relates:
    gates.plants.4:
      how: see
    gates.plants.2:
      how: see
  open:
    - "The selftest is the command `companion selftest`, to build."
    - "Shared runner and the pair-plant harness are planned; the self-test flag exists in one repo and is lifted from there."
  note: "Merges \"gates test themselves\", the planted-violation rule from both sides and the self-test kind (see tools). The two-sided half is gates.plants.4; the lint-specific half is gates.plants.2."
gates.plants.2:
  slug: lint-config-error-or-off-with-plants
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: eslint
      tier: "1"
      note: "v1 class our-cli. ESLint `--print-config` per sample file dumped by the runner: every rule is error or off; every error rule has a fixture that fires; the clean fixture yields zero findings. Plant: A rule left at warn fails; a rule on with no plant fixture fails. Control: A config with every rule error or off and a fixture each passes."
  open:
    - "Go has no direct row; its grid reads resolved configs and a rule at warn is not counted (see the registry concern)."
    - "Proposed for lack of a source; the v1 evidence was: C"
  note: "Merges: no rule at warn, one planted fixture per rule, a clean fixture with zero findings, and the \"rule is error or off, every rule on has a plant\" row."
gates.plants.3:
  slug: tool-preset-tests
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "One test per preset in the shared package that runs the real tool on a good and a bad sample. Plant: A preset whose rule is removed makes the planted sample pass, and the test fails. Control: Intact preset fails the bad sample and passes the good one."
  open:
    - "Go spell check has no chosen tool yet; its sample pair is waiting for the choice."
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.plants.4:
  slug: two-sided-pair-run
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Pair-plant harness in the registry: promotion of a row to gate is refused unless too-much, too-little, just-right, cheap-cure and not-applicable plants exist. Plant: A pair with only the too-much plant is refused promotion. Control: A row with all five plants is promoted."
  open:
    - "No pair run exists today (inference about agents)."
  note: "Agents take the cheapest cure, so the cure itself is planted. The known way round is planting only easy cases; hence the independent reader."
gates.plants.5:
  slug: fail-closed
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. Shared fail-closed helper returning pass, findings, refused or not applicable (with the count); the selftest runs each check on an empty input and requires refused unless zero is declared valid, and fails a check that accepts a flag on the softening list (strict, warn, no-fail and the like). Plant: A check that exits 0 on a missing tool fails the self-test; a check that exits 0 on an empty glob fails; a check with a warn-only flag fails. Control: A check declaring `zero_ok` prints not applicable with its count."
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. The type check step requires its generated inputs to exist and fails when they are absent. Plant: Remove the generated types directory; the type check step fails. Control: With the directory present it passes."
  relates:
    gates.plants.8:
      how: see
  open:
    - "The generated-inputs example is an infrastructure tool's directory; the rule is any generated input."
  note: "Merges the Go fail-closed rule, the web fail-closed rule and the type-check-in-every-gate rule."
gates.plants.6:
  slug: fatal-parse-is-failure
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: eslint
      tier: "1"
      note: "v1 class our-cli. A shared lint wrapper over ESLint `--format json` that exits 1 on any fatal message or null rule id. Plant: A template file with TypeScript front matter and no parser option fails the run instead of being listed as a finding. Control: The same file with the parser set passes."
  relates:
    gates.plants.7:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: C (23 fatal parse errors counted as findings)"
  note: "Shares its wrapper (about 30 lines) with gates.plants.7."
gates.plants.7:
  slug: lint-proves-rules-loaded
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: eslint
      tier: "1"
      note: "v1 class our-cli. Lint wrapper runs `eslint --print-config` on sample files and fails when fewer than the pinned count of rules are active; the plugin is the preset's own dependency. Plant: Running the lint from a folder without the plugin yields 0 rules and exit 1. Control: Running from the repo with the plugin yields the pinned count."
  open:
    - "The print-config rule-count probe was not run in the enforcement trial; an existing script (trialled, exit 1 with 0 rules) is the form to lift."
    - "Proposed for lack of a source; the v1 evidence was: A for the trap"
gates.plants.8:
  slug: full-list-and-three-results
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The runner summary lists each step with pass, fail or not applicable plus input count; a summary versus rule-table comparison fails when a step is missing; one known-positive run per tier. Plant: A gate run with one check dropped from the list fails the summary comparison. Control: A full run with one declared zero-input check passes and prints its count."
  relates:
    gates.plants.5:
      how: see
  note: Merges the Go and web forms and the gate orchestration kind.
gates.plants.9:
  slug: skipped-gate-named-in-change
  since: 0.1.0
  level: process
  kind: instruction
  strength: Review
  review_question: "Which gate or package did this change skip, and where is the reason written?"
  relates:
    gates.plants.8:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "The mechanical half (printing the skipped list) is gates.plants.8."
gates.plants.10:
  slug: read-output-not-exit-status
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: issues.max-issues-per-linter
      note: "golangci-lint run with both caps at 0 and `uniq-by-line: false`; gofmt -l, goimports -l and deadcode output asserted empty by the gate wrapper (the caps are `--max-same-issues=0 --max-issues-per-linter=0`). Plant: Two forbidden uses on one line, the second must still be reported; 60 findings of one linter all shown. Control: The caps at 0 with a clean tree report nothing."
  open:
    - "New finding from the trial: the two caps are not enough; uniq-by-line is a third hiding default."
    - "Proposed for lack of a source; the v1 evidence was: own measure"
gates.plants.11:
  slug: lint-config-verified-by-run
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tool: golangci-lint
      tier: "2"
      note: "Gate self-test runs `golangci-lint config verify` and a real run on an empty package. Plant: A config with an unknown linter name fails the run. Control: A valid config passes both."
    "2":
      binding: any
      class: test-kit
      tier: "2"
      note: "a probe test per claimed runtime setting that starts the program or tool and asserts on what it emitted (response headers, log lines, worker count). Plant: a redaction setting removed from config makes the probe see the secret in a log line and fail. Control: the configured redaction observed in the emitted log passes"
gates.plants.12:
  slug: foundation-scripts-tested
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: hook
      tier: "2"
      note: "the foundation repo's gate command runs each script's own tests and linters, and its pre-push hook runs the gate command. Plant: A script with a failing test makes the pre-push hook refuse the push. Control: Green scripts pass."
  relates:
    gates.hooks.4:
      how: see
gates.plants.13:
  slug: template-proof-end-to-end
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "A proof script in the shared package run in its gate, generating a repo from the template. Plant: Editing a managed root file in the generated repo makes the push hook fail naming the file. Control: Restoring the file makes the gate green."
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.plants.14:
  slug: shape-rule-measured
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Fixture pair per shape rule and measured rates against the clones before the rule is required, run by the selftest. Plant: A bypass form that the rule misses is recorded as a fixture and must fire. Control: The clean control stays clean."
  relates:
    gates.plants.1:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: own measure"
  note: "A field of the selftest registry in gates.plants.1; pairs with the structural-matcher guidance in the own-rules concern."
base/gates/rules/protection.yaml:
  summary: "A gate that the change under judgement can weaken is not a gate. Weakening a gate needs a non-author: a different session with a stored verdict tied to the content. Gate paths are named in one list, an agent cannot widen a rule in the change it judges, and the reviewer condition never skips a path."
gates.protection.1:
  slug: weakening-needs-a-non-author
  since: 0.1.0
  level: process
  kind: rule
  note: "Merges the second-reader rule, the sensitive-path sign-off rule, the Gate-Change trailer rows (config, sensitive path, record the reason), the non-author rule of both sources and the gate-change kinds (see tools). The one-list part is gates.protection.2 and the agent-side deny is gates.protection.3."
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The land check hashes the diff of staged paths on the gate-path list and requires a stored verdict file for that hash from a session id different from the diff author; a short list also needs the person's signature. Plant: A gate-file diff with no verdict is refused; a verdict written by the authoring session is refused. Control: An edit under a verdict from a different session passes."
    "2":
      binding: any
      class: hook
      tier: "1"
      note: "A commit-message hook job requiring a `Gate-Change:` line with a reason and a named non-author when a staged path is gate config. Plant: A commit touching gate config with no trailer is refused. Control: With a trailer naming a reviewer it passes."
  relates:
    gates.protection.2:
      how: see
    gates.protection.3:
      how: see
    gates.protection.4:
      how: see
  open:
    - "Independence depends on the delivery tool exposing the session identity (every agent pushes as one identity). If the verdict is written by the authoring session itself, the check proves presence only. Not designed here."
    - "The stored-verdict check says state unsure for that reason; the trailer check is only a cheap first line, and the trailer is text an agent can type."
    - "At the reference team, the reviewer condition skips any path with no reviewer; see gates.protection.4."
gates.protection.2:
  slug: one-list-of-gate-paths
  since: 0.1.0
  level: process
  kind: rule
  note: "Retired. No list of gate paths is kept to protect: a repo that its owner runs holds no approval and no path list, and a change to a gate is reviewed like any other change (gates.land.1)."
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. A committed list of gate paths read by the commit-message job and the land check; a tier 0 hook refuses an agent write to those paths. Plant: Edit the lint config in a branch with no verdict; refused. Control: An edit under a verdict passes."
  relates:
    gates.protection.3:
      how: see
  open:
    - "Which other sensitive paths (shared modules, state schema, infrastructure and permissions) join the list is not decided; the sources list them but only gate paths are listed on our side."
gates.protection.3:
  slug: agent-cannot-widen-in-own-change
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: hook
      tier: "0"
      note: "Committed agent settings deny writes to the protected-path list, with an OS-level write deny for the shared package and its lock. Plant: An agent write to a protected path is refused. Control: A write to an unprotected path passes."
  open:
    - "The sandbox runtime deny is a candidate, not chosen."
    - "The pattern form of the protected list is built in a planned step (the pattern in the protect code and one more case in the list's schema test); until then the list names whole folders."
gates.protection.4:
  slug: reviewer-condition-never-skips
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The land condition fails when a protected path has no reviewer entry. Plant: A protected path with no reviewer entry fails. Control: A path with a reviewer passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: A"
gates.protection.5:
  slug: landing-regenerates-generated-conflicts
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      fix: never
      note: "a landing test with a fixture repository: two candidates that add a package each conflict in the generated join; landing regenerates it and passes. Plant: a candidate that conflicts in a generated file and also in a hand-written file is landed without being sent back, or its generated file is merged as text, and the test fails. Control: the same pair with only the generated file in conflict lands, and the one with a hand-written conflict returns to its builder"
  relates:
    gates.protection.3:
      how: see
    arch.structure.9:
      how: see
  open:
    - "Proposed until the landing step regenerates. The work is in the lander's merged-tree check (task landing; scripts/land is gone): it has to read the generator list from the base, regenerate, and a fixture has to hold it. It comes from the organisation's ruling and has no step in the migration plan; this rule is the engine side of that ruling."
base/gates/rules/quality.yaml:
  summary: "A gate is only worth its noise. A blocking check has a measured false-positive rate, its failure message names the home and the fix, main stays green so red means something, a new check is trialled on a real repo before it is required, and every gate can be explained in a sentence."
gates.quality.1:
  slug: false-positive-bar
  since: 0.1.0
  level: process
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class our-cli. The runner counts hits, suppressions and overridden hits per rule from the delivery record and prints the false-positive share; a check above the bar blocks its next change until the answer (the decision to rework, demote or keep) is recorded. Plant: A fixture log with known counts yields the known share, and a check over the bar blocks until answered. Control: A check under the bar passes."
  review_question: "Which blocking check is above the false-positive bar, and what was decided about it?"
  relates:
    gates.quality.2:
      how: see
  open:
    - "Strength is a judgement: the Go row's enforcement note proposes Hard (suppressions per check may only fall; a check above the bar blocks until reworked) and the web row proposes Answered. Answered is used until the ratchet on per-check suppressions exists."
    - "The review-only part (does the first screen name the failing check) is gates.quality.2."
    - "v1 evidence, not yet a source: practice (Tricorder); own measure"
  note: Merges the Go and web false-positive rows and the measure of suppressed and overturned findings.
gates.quality.2:
  slug: failure-message-names-fix
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tool: eslint
      tier: "1"
      note: "v1 class shared-code. Rule-table schema requires `home` and `fix` fields in every rule message; for custom lint rules the eslint-plugin-eslint-plugin rules report-message-format and require-meta-docs-url. Plant: A rule message without a fix line fails the schema. Control: A message naming home and fix passes."
  review_question: "Does the first screen of this gate's failure output name the failing check and the line to rerun it?"
  open:
    - "Half: message form is mechanical; the quality of the first screen is review."
  note: "Merges the web message rule, the new-rule-ships-with-a-message half and the first-screen sentence of the false-positive row."
gates.quality.3:
  slug: main-stays-green
  since: 0.1.0
  level: process
  kind: instruction
  strength: Review
  review_question: "Is any gate on main red or retried, and why is it not fixed or removed?"
  relates:
    gates.quality.1:
      how: see
gates.quality.4:
  slug: trial-before-required
  since: 0.1.0
  level: process
  kind: rule
  strength: Record
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. The registry refuses a required check with no `trialled_on` field and run record. Plant: A required check with no trial record is refused. Control: A required check with a trial record passes."
  review_question: "On which real repo was this check trialled, and who read the result?"
  open:
    - "Recorded as a possible weak rule by the enforcement review; it binds when promoted."
    - "Proposed for lack of a source; the v1 evidence was: own measure"
  note: Merges the single-sentence rule with the trial scripts rule.
gates.quality.5:
  slug: gate-explained-in-a-sentence
  since: 0.1.0
  level: word
  kind: instruction
  strength: Lens
  review_question: "Does the one-line reason on this rule match what its check actually does?"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
base/gates/rules/ratchets.yaml:
  summary: "Existing violations are recorded once and may only shrink. A baseline is a numeric ceiling per file that survives rebases and moves, is registered with an owner and a zero-by stage, and is deleted at zero. Moves are separate changes that rewrite keys and never counts."
gates.ratchets.1:
  slug: debt-may-not-grow
  since: 0.1.0
  level: program
  kind: rule
  examples:
    bad:
      lang: yaml
      code: "# the counted lines: 12 at the merge base, 13 in the work tree\ndebt: 13\n"
    good:
      lang: yaml
      code: "# the counted lines: 12 at the merge base, 12 in the work tree\ndebt: 12\n"
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. Ratchet helper (lifted from the repo that holds it): a metric file per entry; the check fails when the working-tree figure exceeds the figure at the merge base (`git show <base>:file`); raising needs the stored verdict. Plant: Raise a baseline number in a branch; it fails against the base. Raise it with the growth switch but no verdict; refused. Control: Lowering the number passes."
    "2":
      tool: gragas
      key: debt
      fix: never
      note: "The debt key of the gragas preset, which gragas check computes: the lines of the work tree that count as debt against the merge base's. Plant: one more counted line than at the base is a finding. Control: the same count or fewer passes (internal/core/audit/repo_test.go)"
    "3":
      binding: ts
      class: preset-config
      tool: eslint
      tier: "1"
      note: "ESLint bulk suppressions (built-in suppressions file); an unused suppression fails by default and the pass-on-unpruned flag is never used in a gate. Plant: A new violation not in the suppressions file fails; fixing an entry without pruning it fails. Control: The pruned file passes."
  relates:
    gates.protection.1:
      how: see
    gates.ratchets.4:
      how: see
  open:
    - "Plant was never recorded in the repo that holds the Go ratchet; run it once when the helper is lifted."
    - "The alternative, a repo-local script, is caught by the shared-gates rule that ratchet files go through the helper path."
    - "v1 evidence, not yet a source: own measure; A (baselines in two web repos)"
  note: "Merges the Go debt rule, the web shrink-only list rule, the baseline-only-shrinks rule and the bulk suppression tool entry."
gates.ratchets.2:
  slug: per-file-ceiling
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "Ratchet helper with a numeric ceiling per file for size; a baseline entry that no longer applies fails. Plant: Append lines to a baselined file past its number; it fails. Control: Shrinking the file passes."
  open:
    - "Plant never recorded in the repo that has the file baseline; run once when the helper is lifted."
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.ratchets.3:
  slug: baseline-survives-moves
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Ratchet helper checks renames with `git diff -M --name-status` against the base and compares the per-baseline sums before and after a move. Plant: Rename a baselined file without moving the entry; fails. Double a count during a move; fails. Control: Rename with the entry moved and the count unchanged passes."
    "2":
      binding: ts
      class: preset-config
      tier: "2"
      note: "A baseline key naming a path that no longer exists fails (bulk-suppression and known-list tools exit non-zero on a stale entry). Plant: Renaming a file without rewriting its suppression key fails; rewriting the key passes. Control: Unrenamed file passes."
  open:
    - "Half holds on the web side: the sum-equality script (about 15 lines) is unbuilt, so doubling a count during a move is not seen."
    - "Proposed for lack of a source; the v1 evidence was: practice; D"
gates.ratchets.4:
  slug: debt-registered
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. A count made on the merge base and on the head, plus a zero check reading the milestone; a baseline with no owner or stage is a finding. Plant: A count that grew against the merge base fails; a last stage with count 1 fails. Control: A count within its stage that did not grow passes."
  relates:
    gates.exemptions.4:
      how: see
  open:
    - "The expiry horizon is capped by data, and that cap is a guess (see gates.exemptions.4)."
    - "The counts against the merge base are the work of gragas-new-2; no tool key makes them yet."
    - "v1 evidence, not yet a source: practice; D (a reference zero-check runs)"
  note: "Merges the owner and zero-by rules from both sides, the registry rule and the ESLint suppressions plus expiring-comment tool entry."
gates.ratchets.5:
  slug: zero-baseline-deleted
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The zero check fails when a registered baseline file exists with a count of zero. Plant: A zero baseline file left in place fails. Control: The file deleted and the rule error passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
gates.ratchets.6:
  slug: legacy-path-count
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Ratchet helper counts files outside the declared layout and applies the shrink-only rule. Plant: A new file added outside the declared layout fails. Control: A new file inside a declared layer passes."
  open:
    - "The declared layout is project-specific; the rule is generic and the layout comes from each project's rule data."
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.ratchets.7:
  slug: shared-package-size-ratchet
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The ratchet helper applied per shared package; growth requires the stored verdict. Plant: Adding a file to a ratcheted shared package fails without a verdict. Control: Removing one passes."
  relates:
    gates.protection.1:
      how: see
    gates.ratchets.2:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "Related to the per-file ceiling (gates.ratchets.2), which counts lines; this counts files per package."
gates.ratchets.8:
  slug: port-fingerprint
  since: 0.1.0
  level: package
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: R
      note: "v1 class our-cli. Check command `companion check port-surface`: generated port-surface file per package diffed in the gate; the reason must resolve to a ticket or decision id. apidiff covers only the exported API (to try). Plant: A new method with no reason fails; a field added to a parameter struct (owed, passes today). Control: The same diff with a reason naming a ticket passes; an unchanged port passes."
  review_question: "Did this port change break a consumer that the diff did not show?"
  open:
    - "Note, 8 Nov 2026: the item is the fact answered. For an answer about an import the item is the import, so its fingerprint covers the importing package’s import set and an unrelated edit to the file renews nothing (gates.ratchets.11). This is this rule read on the item it names, not loosened."
    - "No fault in our record; it would become a hard rule if a landed port change breaks a consumer unseen. The plant for a parameter-struct field is owed."
gates.ratchets.9:
  slug: move-commit-no-logic
  since: 0.1.0
  level: file
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. `git diff -M100% --name-status` on a commit whose subject starts `move:`: every entry must be R100; a mixed commit fails. About 30 lines over git. Plant: A commit marked `move:` that renames a file and edits one line fails. Control: A pure rename passes."
  review_question: "Does this commit move files and also change behaviour?"
  open:
    - "Detection works only for declared moves; undeclared moves pass, and the cheap cure is not to declare. It would become a hard rule if moves were detected without a declaration (rename detection on every commit with edit-size limits), which needs a build the evidence does not justify."
  note: "Merges the Go move rule, the web move rule and the handbook rule that a move commit changes no behaviour."
gates.ratchets.10:
  slug: module-move-is-own-change
  since: 0.1.0
  level: process
  kind: rule
  strength: Answered
  review_question: "Is this move a separate change, by the one mover, with every baseline key rewritten and no logic edit?"
  relates:
    gates.ratchets.3:
      how: see
    gates.ratchets.9:
      how: see
  open:
    - "Single-owner part is a process judgement with no check yet; the check mechanics are in gates.ratchets.3 and gates.ratchets.9."
    - "Proposed for lack of a source; the v1 evidence was: D"
  note: "v1 review check (review is not a v2 check class): Review of move changes against the single-owner list; the key rewrite is held by gates.ratchets.3."
gates.ratchets.11:
  slug: fingerprint-the-fact
  since: 0.1.0
  level: package
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      fix: never
      note: "the measure step recomputes the import-set fingerprint and fails an answer whose fact changed with no new reason, and refuses a file fingerprint on an import answer. Plant: an unrelated edit to the importing file renews nothing, while adding an import fails the answer. Control: an answer with the reason recorded passes"
  relates:
    gates.ratchets.8:
      how: see
  open:
    - "Proposed until the measure step fingerprints the import set. That is a planned step (answers as a folder of entries); the measure code is a judge path, so the change needs a security review. It has no tool key to bind to until then."
base/gates/rules/readers.yaml:
  summary: "A reader of the gate's own YAML refuses what the format forbids, so a file that says a thing twice is an error and never a silent last-one-wins."
gates.readers.1:
  slug: gate-reader-refuses-a-duplicate-key
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: forbidigo
      fix: never
      note: "golangci-lint forbidigo bans ordered.ParseYAML in internal/dev/gate, internal/repo and cmd/gragas-dev and names ParseStrict. Plant: a file in internal/dev/gate that calls ordered.ParseYAML is reported (internal/parse_strict_test.go). Control: the same call in another folder, and ParseStrict in the gate, pass."
  examples:
    bad:
      lang: go
      code: "// a gate list read so that a key written twice keeps the last one\nrows, err := ordered.ParseYAML(data)\n"
    good:
      lang: go
      code: "// the strict reader refuses a key written twice\nrows, err := ordered.ParseStrict(data)\n"
base/gates/rules/registry.yaml:
  summary: "The rulebook is data. A standard is active only while it links the check that enforces it, rule ids are unique and every claim resolves, every rule has one owner, rules have a way out, packs add rows and never edit the base, and the status board is derived from the registry, not typed."
gates.registry.1:
  slug: active-only-with-a-check
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "Rule data validated by a JSON Schema (a standard validator) requiring `check` or `instruction` on every row. Plant: A rule row with neither fails. Control: A row with a check, or marked instruction, passes."
  open:
    - "The schema validator is not chosen (check-jsonschema or ajv)."
  note: "Merges the standard-links-its-check rule, the Go no-check-is-an-instruction rule and the ledger of unbound rules."
gates.registry.2:
  slug: ruling-held-by-named-check
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "1"
      note: "Tests in the shared package named after each review finding that pin the ruling. Plant: Reverting a ruled setting fails the test that names it. Control: The ruled configuration passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.registry.3:
  slug: rule-ids-and-claims-resolve
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. A rule-links check command: unique rule ids, resolvable backticked claims, cited ids exist (the guide-names-real-tests test is the model). Plant: A duplicate id fails; a claim naming a missing file fails; a cited rule id that does not exist fails. Control: A registry with unique ids and resolving claims passes."
  open:
    - On the web side no check yet verifies that a cited rule or ticket id exists.
    - "v1 evidence, not yet a source: own bugs (52 lines)"
  note: "Merges the Go unique-id rule, the web citation rule and the rulebook-committed rule."
gates.registry.4:
  slug: one-owner-per-rule
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. A roster generator over the rule data and cards. Plant: A rule with no card, and a rule on two cards, both fail. Control: One owner each passes."
  open:
    - Falls to best practice if the roster is kept by hand.
    - "Proposed for lack of a source; the v1 evidence was: own measure; reference lesson"
gates.registry.5:
  slug: stage-exit-review
  since: 0.1.0
  level: process
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class our-cli. A fire-count report from gate logs at each stage exit; a rule silent past its window blocks the stage exit until answered. Plant: A fixture log with one silent rule lists it. Control: A log where every rule fired lists nothing."
  review_question: "Which rules have not fired in the window or have no owner, and what was decided for each?"
  open:
    - The window is a guess and is data.
    - The Go and web sources have no scheduled review at a stage end today.
  note: Merges the stage-exit rows from both sides and the exemption-list review row.
gates.registry.6:
  slug: rung-moves-announced
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. The rule-table schema requires a `rung` field with the four values; a rung change must be recorded in the changelog. Plant: A rule with no rung fails the schema. Control: A rule with a rung passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
gates.registry.7:
  slug: base-and-packs
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The sync check re-renders base plus packs for a repo and compares bytes with the committed config. Plant: Delete a rule from the rendered file; the byte check fails. Control: A clean render passes."
gates.registry.8:
  slug: rule-data-least-powerful
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "3"
      note: "A JSON Schema for pack files (additionalProperties false, no conditional keys) run in the standards repo's gate. Plant: A pack row with an `if` key fails the schema. Control: A valid pack passes."
  open:
    - "Note, 8 Nov 2026: a folder pattern in registry or layer data is a glob with one ellipsis or one star segment, not an expression, so this rule holds for it; the schema should say so."
gates.registry.9:
  slug: framework-needs-a-pack
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The module allow file has a pack field per allowed module; a require with no pack fails. Plant: Add a framework require with no pack entry; fails. Control: Pack named; passes."
    "2":
      binding: ts
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. The generator refuses to list a framework with no pack directory holding a plants folder (a 10-line test in the shared repo). Plant: A listed framework with no plants folder fails the generator test. Control: A framework with a pack and plants passes."
  relates:
    gates.registry.10:
      how: see
  open:
    - "No framework in use has a pack; the Postgres pack is written and binds when a repo adopts Postgres."
gates.registry.10:
  slug: pack-pilot
  since: 0.1.0
  level: process
  kind: rule
  status: later
  review_question: "Has the first project on this pack run every pack row with a plant, and who signed the list?"
  open:
    - "Binds with the first React project; the list then becomes a file that land reads."
  note: Merges the pilot rule and the pack-admission route.
gates.registry.11:
  slug: rule-growth-one-change
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Land refuses a new rule row with no check, plant or grid cell (diff scan in the registry repo's gate). Plant: A rule row added with no plant is refused. Control: A row added with its check, plant and cell passes."
  open:
    - "Would become a hard rule when a rule enters without its plant; Hard from the enforcement record."
    - "Proposed for lack of a source; the v1 evidence was: own measure; reference lesson"
gates.registry.12:
  slug: status-board-generated
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. Status board generated from the rule registry and committed, with a generate-check drift gate. Plant: Edit the board by hand and the check fails; a registry rule with no fixture shows as unproven. Control: A regenerated board passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: A (reference)"
  note: "Merges the status-board rule, the page-generator tool and the generated-views kind."
gates.registry.13:
  slug: grid-from-resolved-configs
  since: 0.1.0
  level: process
  kind: rule
  strength: Record
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. A grid generator reading resolved configs; a gate test fails a hand-typed cell. Plant: A rule at warn counted as enforced fails; a hand edit of the grid fails. Control: A regenerated grid passes."
  review_question: "Is any grid cell hand-typed or counted from a rule at warn?"
  open:
    - "Donor fault only (no fault in our record); becomes a hard rule if our hand-kept status is found wrong."
    - "Proposed for lack of a source; the v1 evidence was: own measure"
gates.registry.14:
  slug: rule-row-required-fields
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. Rule-table schema requires status, enforced_by, zero_by, failure and fixture. Plant: A row missing any field fails the schema. Control: A complete row passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: A (reference)"
base/gates/rules/shared.yaml:
  summary: "Gates are generic and shared by version; a project adds only its own rules. Managed root files exist and are byte-equal to the template, a repo's overlay holds a closed list of keys, each tool has one pinned version, a new repo starts from the template, and a replaced check keeps a parity table."
gates.shared.1:
  slug: gates-shared-by-version
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. A sync check command: gate files in each project equal the version-locked template output. Plant: Edit a synced gate script or a rendered config by one byte; the sync check fails. Control: A clean sync passes."
  open:
    - "golangci-lint issue 6621 on extends was closed 5 June 2026 with no maintainer comment; not re-checked."
    - "Template for Go and for TypeScript are both planned; the tool is decided but not built."
  note: "Merges the Go one-lint-stack row, the TypeScript one-shared-config row, the web shared-gates row and the cross-repo parity row."
gates.shared.2:
  slug: managed-root-files-exist
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The structural check command fails when a managed root file is missing. Plant: Delete a managed root file; the check fails. Control: All present passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.shared.3:
  slug: managed-root-files-byte-equal
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The structural check compares each one-line root file with the template copy byte for byte. Plant: Edit a root file by one byte; the check fails. Control: Unedited passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.shared.4:
  slug: overlay-closed-keys
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "A parameters file validated by a JSON Schema with additionalProperties false; the check reads the compiler overlay and rejects keys outside the closed list and any strictness flag set off. Plant: An unknown key in the parameters file is refused; a strict flag turned off in the overlay fails. Control: A valid overlay passes."
    "2":
      binding: go
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. The shared check reads the repo's local lint fields by meaning and rejects anything outside the named fields. Plant: A local file that disables a base linter fails. Control: A local file with only the named fields passes."
  relates:
    gates.measures.4:
      how: see
  open:
    - "Switch-test pairing (a test for each boolean switch's non-default value) is gates.measures.4."
    - "Proposed for lack of a source; the v1 evidence was: D"
  note: "Merges the overlay key list, the one parameters file with unknown keys refused (the web row, split), and the strictness-flag part of the small-rules bundle."
gates.shared.5:
  slug: one-pinned-version
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "A preflight command reading the version file and running each tool's `--version`; Go tools through `go tool -modfile`. Plant: A tool absent or one patch version off fails the preflight. Control: Pinned versions all present passes."
  open:
    - Currency window length is not stated in the source.
    - "Proposed for lack of a source; the v1 evidence was: own measure"
gates.shared.6:
  slug: new-repo-starts-pinned
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "The template's proof test (gates.plants.13) asserts the generated repo has each listed start item. Plant: A template that omits the hook install fails the proof test. Control: The shipped template passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.shared.7:
  slug: migration-swept-by-deadline
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Sync check compares each consumer lock to the newest allowed shared version against the migration record's deadline. Plant: A consumer one release behind past the deadline fails. Control: A consumer on the newest version passes."
gates.shared.8:
  slug: check-in-gate-or-deleted
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "3"
      note: "A gate scan: every Makefile target named as a check is reachable from `check`; a recipe in the shared Makefile fragment, standard tools only. Where gates are files, a test that the member list the gate command runs equals the set of gate files. Plant: A check target not reachable from `check` fails; a new gate file missing from a typed member list fails. Control: All targets reachable passes; a list derived from the files passes."
gates.shared.9:
  slug: parity-before-replacing
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. The replacement change runs the old tool's plant corpus against the new config (`--parity old-plants-dir`). Plant: A replacement that misses one old plant fails the swap. Control: A replacement that fires every old plant passes."
  relates:
    gates.protection.1:
      how: see
  note: "Merges the parity-table rows of both sides and the \"check that exists is in the gate\" replacement half."
gates.shared.10:
  slug: one-format-command
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "0"
      note: "`prettier --check` with its template plugin for the template files; a single fmt command wraps the choice. Plant: A file with a double-quoted string in a single-quote project fails the check. Control: A conforming file passes."
  open:
    - "Biome or Prettier on React is still unruled; Biome cannot format the template files."
    - "Proposed for lack of a source; the v1 evidence was: C"
base/gates/rules/tracked.yaml:
  summary: "The tracked file list is checked for what breaks a checkout on another system: a link, and two paths that differ only by case."
gates.tracked.1:
  slug: no-tracked-symlink
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      tool: gragas
      key: link
      fix: never
      note: "The link key of the gragas preset, which gragas check computes. gragas check reads the tracked list from git. Plant: a tracked symlink fails, naming its path. Control: a tree of regular files passes."
  open:
    - "Proposed until the check runs from a command of its own."
gates.tracked.2:
  slug: no-paths-differing-by-case
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      tool: gragas
      key: fold
      fix: never
      note: "The fold key of the gragas preset, which gragas check computes. gragas check folds the case of each tracked path and fails a pair. Plant: two paths that differ by case fail, naming both. Control: distinct paths pass."
  open:
    - "Proposed until the check runs from a command of its own."
base/supply/rules/age.yaml:
  summary: "A new version is not trusted the day it is published. A release-age window holds at add time and at land, a skip for a security fix must name an advisory that resolves, a waiver names every package it lets through, a version with weaker publishing evidence than an earlier one is refused, and a vendor family moves as one group."
supply.age.1:
  slug: no-entry-younger-than-the-window
  since: 0.1.0
  level: deploy
  kind: rule
  note: "Retired by the operator's ruling of 22 Nov 2026: no release-age window is held, in gragas or in a project it ships to. The id is frozen and is not reused."
supply.age.2:
  slug: add-time-cooldown-setting
  since: 0.1.0
  level: file
  kind: rule
  note: "Retired by the operator's ruling of 22 Nov 2026: no release-age window is held, so no cooldown setting is read back. The id is frozen and is not reused."
supply.age.3:
  slug: skips-and-waivers-name-what-they-pass
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the age check resolves each skip's advisory id in a vulnerability database and parses each waiver as an exception record listing every package and the clearing date. Plant: a skip with no advisory id fails; a waiver with no clearing date fails. Control: a skip naming a real advisory passes"
  open:
    - "The gragas replace key (a replace or a workspace is a finding unless a waiver names it) is not built into gragas check; the rule carries no gragas row until a later change runs it."
    - "The advisory-id check and the waiver record format are planned; the waiver format has no implementation."
    - "v1 evidence, not yet a source: own measure; xz"
supply.age.4:
  slug: weaker-publishing-evidence-refused
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "the package manager's trust policy set to no-downgrade, read back; a signature audit at release as a report. Plant: the setting removed fails the read-back. Control: the setting present passes"
    "2":
      binding: go
      class: preset-config
      tier: "3"
      note: "go mod verify against go.sum and the checksum database. Plant: an edited hash in go.sum fails. Control: an intact tree passes"
  open:
    - "One package manager supports the trust policy and the others do not; the registry-signature audit itself is npm-only."
    - "v1 evidence, not yet a source: C: the setting is held in the web template"
supply.age.5:
