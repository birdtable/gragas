program/cli/rules/config.yaml:
  summary: "Settings come through one helper from the sources a program declares, in one order where more than one is on; the environment is read in one place; unknown, old and wrongly cased keys are refused at load; a migration proves the new config means the same; each setting has one home; a missing file means the defaults and an unreadable one is an error; secrets live in one owner-only folder and never come from a flag or reach the output; paths come from one helper per program kind and platform; and every key has a reader, a default, a doc row and a documented refusal."
