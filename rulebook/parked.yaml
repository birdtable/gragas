lang/ts/rules/modules.yaml:
  summary: "A TypeScript module stays importable by anything (a test, a worker, a bundler, a later runtime) for years: it exports by name, uses no enum or namespace that compiles to a runtime object, is an ES module whose relative imports carry their extension, and does nothing when it is imported. Each rule names its compiler, Biome and ESLint form."
ts.modules.1:
