  open:
    - A seeded wrapper whose method takes an AWS-specific continuation token as a plain argument must be flagged by the review.
    - "The syntax half is configuration; the nil half is the only code to write. The type-aware form is not written, so the nil-test half is review until it is."
    - "Real struct clones of the Platform field were found in three repos (2, 4 and 1); whether those are ports was not read."
  note: "The reviewing question is the held part for methods meaning something on one provider only (also the web form of this rule); it applies to wrappers over a marketplace, payment, mail or storage provider."
arch.ports.6:
  slug: sibling-program-in-one-adapter
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "a go/packages test per binary: each external module's importers and each process-start or path-lookup call's resolved name (literal, constant or a variable traced to a constant or the owning adapter) compared with the allow list in rule data; unresolved names fail; the allow list only shrinks. Plant: a second package importing an external module fails; a program name passed through a variable from config to the process-start call fails. Control: the same import and call inside the one adapter pass"
    "2":
      binding: go
      class: preset-config
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule, or forbidigo with analyze-types on call arguments, over non-test code outside the sibling's adapter path: string literals equal to a sibling-name list in rule data (binary name, socket path, header and variable names), ratcheted. Plant: a call that spawns the sibling program by name outside the adapter fails. Control: the same call inside the adapter folder passes"
arch.ports.7:
  slug: boundary-shape-has-one-source
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. companion contract: consumer field list derived from the consumer type against a golden generated from the provider types by reflection; runs in the provider's land check reading the consumer list; optional misses counted; a shrinking list fails without a reason line; routes through the general call path are listed. Plant: renaming a field read by the consumer fails and names it; an added provider field passes; a removed optional field must fail (owed). Control: an added provider field passes"
  open:
    - "A trial found no real rename in history, so only plants speak for this gate; the plant for a removed optional field is owed."
    - "How the provider's land reaches a list in another repository with no per-push CI is unsettled."
    - "No generator is chosen; no Makefile has one."
    - Where the consumer is in another language a JSON Schema generator was not searched for.
    - "v1 evidence, not yet a source: own measure (the shape typed twice in two repos); operator-named seam"
arch.ports.8:
  slug: domains-meet-through-a-caller-port
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: dependency-cruiser
      tier: "2"
      note: "a dependency-cruiser rule built from a domain list kept as data (not typed per rule) forbids any import between two listed domains except via a file under ports/; typed slots for cross-module UI. Plant: a direct import from one listed domain's barrel into another fails. Control: the same call through a declared port passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "2"
      note: "depguard or go-arch-lint independence between the domain packages in the domain list. Plant: a direct import between two listed domain packages fails. Control: the same call through the caller's port passes"
  open:
    - "It is stricter than the donor's rulebook and costs more adapters; weigh it against the size of the domains."
    - "v1 evidence, not yet a source: argued; operator concern about the boundary between domains"
  note: "Applies to services with several domains. With agents it holds with a known way round, a neutral package, an inference."
arch.ports.9:
  slug: decisions-are-pure
  since: 0.1.0
  level: function
  kind: measure
  strength: Review
  review_question: "Which function takes a port and also branches, and could its decision be a pure function of values?"
  open:
    - No plant until built.
  note: "Plain-value logic is the code an agent can test with no doubles, so it removes a source of fault (an inference). Applies to services with domain logic over a store."
arch.ports.10:
  slug: ports-declared-up-front
