framework/liquid/rules/cycle.yaml:
  summary: "What a theme written in Liquid adds to the moments of the development cycle: every JSON file and schema block parses and the locales match at commit; every reference resolves, the tags balance, the theme linter runs and the layout files are scanned for secrets at push; and a release pushes to an unpublished theme and renders three pages before anything reaches the live one. These lines add members to the core moments and never a moment of their own. The theme linter was not measured on the host that studied the stack."
liquid.cycle.1:
