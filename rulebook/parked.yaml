    "2":
      binding: go
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "a lint rule or ast-grep scan for not-implemented errors and placeholder returns in non-test source. Plant: a function whose body returns a not-implemented error fails. Control: a real body passes"
  open:
    - "The sources record this as a gap: neither the Go nor the web rulebook has a scan for stub bodies; the stub rule of the language-neutral docs row is held by a model lens with a linter ban."
    - "Some plants and controls of this rule were written at the merge from the sources' description of the check, and have not been run."
    - "Proposed for lack of a source; the v1 evidence was: practice"
code.deadcode.3:
  slug: no-go-linkname
  since: 0.1.0
  level: file
  kind: instruction
  strength: Lens
  review_question: "Does this directive have an exemption row with a reason and an expiry?"
  relates:
    code.deadcode.1:
      how: see
  open:
    - "Planned check: an ast-grep or text scan for the //go:linkname comment in non-generated Go files outside an exemption list whose rows carry a file, a reason and an expiry date; a row past its date is a finding. Plant: a file with a //go:linkname line and no exemption row fails. Control: the same file with an unexpired row passes. No tool key is bound yet, and a row without one would raise checks-unresolved, a baseline that may only fall. A directive is a comment, so no golangci-lint linter reads it as a call (forbidigo matches calls and selectors); ast-grep has no preset in this repository yet, and the exemption list and its expiry check are not built. It becomes a Hard rule with its row when a key resolves."
    - "Opened from a review; the finding was that code.deadcode.1 only said linkname may be reported."
base/code/rules/duplication.yaml:
  summary: "Duplicated blocks only fall inside a repository, measured across packages by a clone detector that also sees renamed copies. Functions that do the same job written differently are looked for as advice, and the count of copies across repositories is the shared-code concern of the arch part."
code.duplication.1:
  slug: clones-only-fall
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: dupl
      fix: never
      note: "the within-package tripwire: dupl with a threshold of 60 tokens (0 hits in the first Go program that adopts it, so it is safe to lower from 150). Plant: a 70-token block copied inside one package fails. Control: an unrelated block passes"
    "2":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      fix: never
      note: "the standalone dupl over every non-test file at 60 tokens, measured by the dev binary; the clone-group count is written to the measure output and held by a shrink-only baseline row. Plant: a receiver-unwrapping helper copied into a third package reports one more group and fails. Control: the groups already on the baseline pass"
    "3":
      binding: ts
      class: preset-config
      tool: jscpd
      tier: "2"
      note: "jscpd 5.4.2 --min-lines 10 --min-tokens 80 over source with generated files ignored; the clone count compared with a committed count and allowed only to fall; --ignore-identifiers-style mode for renamed copies where the option exists in 5.x (ignore-identifiers is read at adoption). Plant: a copy of a 12-line block into a second file raises the count and fails; removing it passes. Control: removing the copy passes"
  relates:
    code.duplication.2:
      how: see
  open:
    - "Conflict C-22 in the sources: the two reports' figures for the Go clone count are not reconciled."
    - "The web trial found nothing in a renamed copy by default; code.duplication.2 covers that."
    - "Proposed until the checks exist. The standalone detector, its pin in the tool list and the baseline row are step G2 of the shared-code proposal; the clone groups it finds on adoption are listed by file and line in the row, and the later small-clone steps lower it to 0. The shared preset holds the lint runner's dupl threshold at 150 tokens today; the move to 60, which the first Go check describes, is part of step G2 (the proposal found 0 hits at 60, so it is safe)."
code.duplication.2:
  slug: renamed-copies-seen
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tool: gragas
      tier: "3"
      fix: never
      note: "the standalone detector of code.duplication.1, which ignores identifier names by construction, with the same baseline row. Plant: a copy with every name changed reports a clone group and fails. Control: an unrelated function reports 0 groups"
  open:
    - "A code-clone tool from another family (PMD CPD) was judged not needed."
    - "Proposed until the Go check exists: step G2 of the shared-code proposal. The TypeScript pass stays the jscpd second pass above."
code.duplication.3:
  slug: same-job-written-differently
  since: 0.1.0
  level: function
