base/agents/rules/delivery.yaml:
  summary: "The gate writes a record for each ticket, a short list of measures rolls up once a week, the agent judged on those numbers does not see them, and a change to guidance is replayed on closed tickets before it spreads."
agents.delivery.1:
  slug: delivery-record-per-ticket
  since: 0.1.0
  level: process
  kind: measure
  strength: Record
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. a measure script appends the gate's output to a per-ticket record, and a test fails when the record is missing. Plant: a fixture ticket record with known rounds gives known totals. Control: a record with all fields present passes"
  review_question: "Does the record hold the real gate and review rounds and the real rework for this ticket?"
  open:
    - "A Record binds only once it is paired with a review question that checks the record's content."
    - "Numbers watched, stop nothing; proposed, report only."
    - "The reference organisation's version records metrics per ticket as a line file; a per-ticket record was a gap in the Go rows."
    - "v1 evidence, not yet a source: D (tickets give the unit that commits cannot)"
  note: "Merges the Go and UI rows, the handbook rule and the reference's per-ticket metrics rule."
agents.delivery.2:
  slug: weekly-measures-line
  since: 0.1.0
  level: process
  kind: measure
  strength: Record
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. the measure script rolls the per-ticket records into the weekly line. Plant: a fixture set of ticket records with known rounds gives the known weekly totals. Control: a complete week produces one line"
  review_question: "Do the weekly numbers match the records they roll up?"
  open:
    - "Planned only; the measure script and the weekly digest do not exist yet."
    - "Proposed for lack of a source; the v1 evidence was: D"
agents.delivery.3:
  slug: agent-does-not-see-its-number
  since: 0.1.0
  level: process
  kind: instruction
  strength: Review
  review_question: "Can the agent whose ticket this is read its own delivery record?"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
agents.delivery.4:
  slug: guidance-change-replayed
  since: 0.1.0
  level: process
  kind: instruction
  strength: Record
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. a guidance change carries its replay result, checked present by the land check. Plant: a guidance change with no replay result is flagged. Control: a guidance change carrying a replay result passes"
  review_question: "Does the replay result show the guidance change helped, or added cost with no gain?"
  open:
    - "Proposed replay harness; none has run. No plant is possible because a person reads the two arms."
    - The study behind it is a workshop poster and its figures are second-hand.
    - "No UI row replayed tasks to measure guidance; the first-file and weekly measures came closest."
    - "v1 evidence, not yet a source: practice (a workshop poster, figures second-hand)"
  note: "Merges the Go and UI rows and the reference's measured-before-it-spreads rule."
agents.delivery.5:
  slug: commit-message-shape
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: hook
      tier: "1"
      note: "a commit-msg hook that fails an empty body, a subject that starts with a past-tense or imperative action verb from a listed set, and a prefix that disagrees with the repo's declared setting. Plant: a commit with subject \"Fixed the gate\" fails; a commit with no body fails; a prefix in a repo that declared none fails. Control: a subject stating what is true with a body saying why passes"
  review_question: "Does the subject say what is true after the commit, and does the body say why?"
  open:
    - "A verb list catches the common forms only; whether a subject states a fact is review."
base/agents/rules/discovery.yaml:
  summary: "An agent learns what already exists before it writes: it reads the glossary and the listing of shared exports, searches sibling repositories, and asks the type checker for callers rather than text. The tools it uses for this run offline, pinned, and never write to the tree."
agents.discovery.1:
  slug: look-before-writing
  since: 0.1.0
  level: process
  kind: instruction
  strength: Session
  checks:
    "1":
      binding: any
      class: hook
      tier: R
      note: "the agent's own session record (the hook log) shows the kit listing was read and the sibling clones searched before a new helper landed. Plant: a session that lands a new helper with no listing read in its log is flagged. Control: a session whose log shows the listing read passes"
  review_question: "Did the agent read the kit listing and search the sibling repositories before writing this helper?"
  open:
    - "No program sees what an agent read; the session record is the only evidence."
    - No eval has been run on the question set.
    - "v1 evidence, not yet a source: own bugs (census of 42 hand copies of shared helpers)"
  note: "Merges the Go lookup rows, the UI second-copy rows and the reference's search-other-repos and read-the-glossary rules."
agents.discovery.2:
  slug: tool-use-is-measured
  since: 0.1.0
  level: process
  kind: measure
  strength: Session
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. the session record counts lookups by tool per session and reports it in the weekly digest. Plant: a session with no lookup recorded is counted as none. Control: a session with a lookup is counted"
  review_question: "Do agents answer the known-answer questions better with the guidance than without it?"
  open:
    - "Building the eval is a project, not a check; none has been run."
    - "What would change it: a measured fault class the lookup tools were meant to prevent."
    - "Proposed for lack of a source; the v1 evidence was: practice"
agents.discovery.3:
  slug: type-checked-lookup-ready
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a preflight row in the host check runs command -v gopls with a version check and reads the plugin as enabled in the agent settings. Plant: gopls removed from the path fails the preflight. Control: gopls present passes"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a companion preflight row per pack checks typescript-language-server or tsgo on the path and reads the version. Plant: the language server removed from the path fails the preflight. Control: the language server present passes"
  open:
    - "The Go plugin was not run in the first trial; the preflight is proposed."
    - "A report of lookups by tool per session is planned; presence is enforced, use is a report."
agents.discovery.4:
  slug: type-checked-answer-bounded
  since: 0.1.0
  level: function
  kind: instruction
  strength: Session
  checks:
    "1":
      binding: any
      class: hook
      tier: R
      note: "the hook log shows whether the language server answered, and the tool wrapper checks the byte size of each answer. Plant: a wrapped tool answer larger than the bound is cut or flagged. Control: an answer under the bound passes through"
  review_question: "Did the agent ask the type checker for callers or implementations, or search text?"
  open:
    - "No program sees which instrument an agent chose; only the hook log and the wrapper's size check exist."
    - "Proposed for lack of a source; the v1 evidence was: practice"
agents.discovery.5:
  slug: knowledge-tools-offline-pinned
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "3"
      note: "three checks in the tools-file gate, an exact version pin, a licence check (go-licenses check with an allow list), and git status --porcelain empty after the run; no-network by a sandboxed run. Plant: a tool whose licence is not on the list fails; a run that writes a file into the tree fails. Control: a pinned tool under an allowed licence with a clean tree passes"
  open:
    - "Half held: pin, licence and no-write are mechanical; no-network needs a sandbox whose macOS form was not tried."
    - A hosted library-docs service breaks the offline rule and is not used.
    - "Proposed for lack of a source; the v1 evidence was: practice (a licence checker was planted with an allow list)"
agents.discovery.6:
  slug: helper-names-its-search
  since: 0.1.0
  level: process
  kind: rule
  strength: Record
  checks:
    "1":
      binding: go
      class: test-kit
      tool: gragas
      tier: "2"
      fix: never
      note: "the dev gate over the diff against the base: a new exported function outside a registry owner whose body calls a registry primitive or whose name matches a capability word, with no Reuse trailer in the commits, fails at pre-push. Plant: a new Put(path, bytes) in a dev package with no trailer fails. Control: the same function with a trailer passes"
  relates:
    agents.discovery.1:
      how: see
    arch.shared.8:
      how: see
  review_question: "Which registry row did you read, and what in it did not fit?"
  open:
    - "Proposed until the registry and the diff check exist: the registry is step G1 of the shared-code proposal. The trailer check has no step and no ticket yet: it is a check of the dev gate over the diff against the base, run at pre-push, and it needs the registry first."
base/agents/rules/guards.yaml:
  summary: "What an agent may not do is refused where it acts: protected paths cannot be written, the gate cannot be bypassed by command, work that is not the agent's own is not swept in or discarded, and outside text is never taken as an instruction. The land check stays the backstop because a deny rule can be walked round."
agents.guards.1:
  slug: protected-paths-refused
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion check protected-paths at commit and at land, failing a protected path changed without a stored non-author verdict; write-time denies generated from the same list by companion sync; an OS write sandbox with denyWrite on the protected paths. Plant: a commit editing a gate config with no verdict is refused at commit and at land; a planted Edit on each protected path is refused by the committed settings. Control: an ordinary source edit passes"
  open:
    - "The write-time half is per runtime and unproven; Codex, Gemini and OpenCode syntax is source says, from search only."
    - "A Claude deny rule does not cover Bash subprocesses; an OS sandbox was run on macOS and refused echo and sed -i writes."
    - "The commit and land half is what makes this a rule; it needs a land check that does not yet exist outside one repo."
    - "v1 evidence, not yet a source: own measure (0 tracked .claude/ files in seven repos) and A"
  note: "Merges the Go row B-16, the reference's gate rule, the handbook rule that test oracles and plant files are protected, and the protected-path half of the UI settings rule."
agents.guards.2:
  slug: bypass-by-command-refused
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the land recompute refuses a push with no recomputable verdict; deny lists for the bypass commands generated into each runtime's committed settings. Plant: a push from a clone with hooks disabled is refused at land; each listed command attempted by a test session is refused. Control: a normal push with its verdict passes"
  open:
    - "The land recompute lives in one program; a repo without it has only the courtesy deny list."
    - Deny behaviour is source says and was not run.
    - "v1 evidence, not yet a source: own bugs (B-692 was a --no-verify push)"
  note: "Merges B-21's bypass half, the reference's gate rule and the handbook's gate rule."
agents.guards.3:
  slug: no-sweeping-or-discarding
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: hook
      tier: "0"
      note: "committed agent settings deny the listed git commands, with a staged-file scope check at commit and the land check as backstop. Plant: each listed command attempted by a test session is refused. Control: git add of a named path passes"
  note: "Merges the staging and discard halves of B-21 with three reference and handbook rows, one of which is an instruction."
agents.guards.4:
  slug: committed-agent-settings
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: hook
      tier: "0"
      note: "committed agent settings with a post-edit hook running the cheap tier, a stop hook, a fail-closed pre-tool hook and committed deny rules, checked to hold in bypass mode. Plant: a planted attempt to edit a baseline is refused with the next step named, in the default mode and under bypass. Control: an ordinary edit passes and the cheap tier runs"
  relates:
    agents.guards.5:
      how: see
    agents.guards.6:
      how: see
  open:
    - The planted attempt is a manual test in a live session until the managed test in agents.guards.6 runs.
agents.guards.5:
  slug: managed-settings-fleet
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "0"
      note: "v1 class framework. a doctor row that hashes the managed-settings file against the shipped template and fails when it differs, and prints the permission mode it allows beside the decision that chose it. Plant: a modified managed file shows red; a mode that differs from the recorded decision shows red. Control: the file equal to the template shows green"
  open:
    - "Not deployed; host-level, owned by the operator."
    - "Whether local settings can lift a deny was left open; the docs answer it for managed settings."
  note: "Merges the Go managed-settings row and the reference's estate configuration; the reference's bypass-off row is replaced by the recorded mode."
agents.guards.6:
  slug: hard-rules-are-denies-not-hooks
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "companion check agent-settings parses the committed settings and fails an if-filtered refusal hook with no deny rule. Plant: settings with an if-filtered refusal hook and no deny rule fail. Control: a deny rule present passes"
    "2":
      binding: any
      class: test-kit
      tier: R
      note: "a scripted live run on each agent release attempts a denied write from the main session and from a subagent, plus an allowed control, and records the result. Plant: a denied Edit is attempted and must be refused. Control: an allowed edit passes"
  open:
    - "The live test cannot gate: it needs a live session of each runtime."
    - Other runtimes are unstudied.
    - "v1 evidence, not yet a source: practice (hooks docs) and own measure (a headless trial showed deny under bypass and in a subagent)"
  note: "Merges P-9 (deny not hook) and P-11 (planted denial) and the live-test half of the handbook rule."
agents.guards.7:
  slug: outside-the-task-tree-needs-permission
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: R
      note: "run each ticket under a write sandbox profile per task (sandbox-exec or the OS write sandbox); a path outside needs a named permission. Plant: a task that writes a path outside its tree is refused. Control: a write inside the tree passes"
    "2":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the land check compares the modules a diff touches with the modules its ticket names and refuses an unnamed one. Plant: a change for one module that edits a file in another module the ticket does not name is refused. Control: a change inside the named module passes"
  review_question: "Which path outside this repository does this change write, and which ticket line allows it?"
  open:
    - "No write-scope tracer exists; the sandbox profile per task was not tried."
agents.guards.8:
  slug: outside-text-is-data
  since: 0.1.0
  level: process
  kind: instruction
  strength: Session
  checks:
    "1":
      binding: any
      class: hook
      tier: R
      note: "a hook marks a session that read outside text, and a push, publish or secret read in a marked session needs the ticket link. Plant: a planted issue body asking for a push must not produce one, and a page under test carrying an instruction must not change the run. Control: a session that read no outside text pushes normally"
    "2":
      binding: any
      class: hook
      tier: "0"
      note: "committed deny rules and the pre-tool hook refuse printenv, a bare env, set and export with no arguments, and reads of the listed secret files. Plant: an agent running printenv is refused; an agent reading .env is refused. Control: reading a named non-secret variable passes"
  review_question: "Does anything this change or session did trace to text it read rather than to its ticket?"
  open:
    - "Not built and not tried; no taint hook exists in any agent runtime checked."
    - The planted issue-body plant is model behaviour and nondeterministic.
  note: "Merges the Go, UI and handbook rules and the tool-output sentence of the lookup row."
agents.guards.9:
  slug: preflight-before-first-edit
  since: 0.1.0
  level: process
  kind: rule
  strength: Session
  checks:
    "1":
      binding: any
      class: hook
      tier: "0"
      note: "a session-start hook runs the preflight command and refuses the first edit until it has passed on the current base. Plant: a session on a base behind the tip is stopped before its first edit; a session with an untracked file is stopped. Control: a session on a clean tip with a green verdict proceeds"
agents.guards.10:
  slug: escalate-never-bend
  since: 0.1.0
  level: process
  kind: instruction
  strength: Session
  review_question: "Did this change suppress, lower, skip or reword a rule, and where is the escalation that allowed it?"
  relates:
    agents.guards.1:
      how: see
  open:
    - "The protected-path rule (agents.guards.1) holds the mechanical half; the escalation itself is judged by review."
agents.guards.11:
  slug: two-failures-then-diagnose
  since: 0.1.0
  level: process
  kind: rule
  strength: Session
  checks:
    "1":
      binding: any
      class: hook
      tier: "0"
      note: "a pre-tool hook counts identical failing commands in the session and, after two, refuses the same command, a reset, a revert and a baseline write until a read-only step has run. Plant: a third identical failing command is refused; a git reset after two identical failures is refused. Control: a read command after two failures passes"
  relates:
    agents.guards.10:
      how: see
agents.guards.12:
  slug: no-token-on-a-command-line
  since: 0.1.0
  level: process
  kind: instruction
  strength: Session
  review_question: "Does this command or brief carry a token, and does the wrapper it names set the variable instead?"
  relates:
    agents.guards.8:
      how: see
    supply.secrets.2:
      how: see
  open:
    - "Planned check: the secret scanner runs over the briefs and the agent settings as it runs over the tree, and the pre-tool hook refuses a command whose text matches a token shape. No tool key is bound yet. The workflow scan holds the same rule for the project's own workflows: it fails a run step that expands a secret into a program's arguments. Plant: a token handed to git config as an argument. Control: a secret tested by a builtin, and a token handed to git in its environment. What holds now: the workflow scan, for the project's own workflows only. What does not: no check runs over briefs, agent settings or command lines, so a token on a command line is not refused by any tool today. No tool key is bound: the gragas tool has no preset, so no key of it resolves, and an unresolved checks row raises checks-unresolved, a baseline that may only fall. The rule stays as it is until a key holds it."
base/agents/rules/instructions.yaml:
  summary: "The file an agent reads before it works is a short map, one fact in one home. It holds what cannot be found from the code and the repo's numbered invariants, never how they are checked, every command and path it names resolves, and the rules it points at reach the agent offline and load only for the paths they govern."
agents.instructions.1:
  slug: short-instruction-map
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion check agents-md, a shrink-only byte-count ratchet per instruction file with a report of lines whose rule id already has a check, ported from the UI repository's existing check; a required-headings rule from markdownlint. Plant: an instruction file grown by 1 KB fails the ratchet; a fixture line added must raise the count. Control: the file shrunk passes"
  relates:
    docs.links.2:
      how: see
  open:
    - "No limit has been measured; the ratchet is the control."
    - "A UI repository holds the size check today; Go repositories have it planned only."
    - "agnix 0.61.0 claims 758 rules; no byte-size ratchet was found in it."
  note: Merges the Go and UI instruction-size rows with the handbook rule that a line whose rule has a check leaves the file.
agents.instructions.2:
  slug: instruction-commands-resolve
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tool: agnix
      tier: "1"
      note: "agnix 0.61.0 with --strict for missing paths; a roughly 40-line companion check for make targets, npm scripts and grep -x @AGENTS.md CLAUDE.md for the import line. Plant: an AGENTS.md naming a missing path (docs/missing.md) and a missing make target (make nosuchtarget) fails; a CLAUDE.md with extra text fails. Control: a file whose paths, targets and import line all resolve passes"
  open:
    - "agnix did not flag a missing npm script or a CLAUDE.md that is not the import line, so those parts are our own check."
    - Not re-run since the first scan.
    - "v1 evidence, not yet a source: own measure (scan of 7 of 7 AGENTS.md files)"
  note: "Merges the Go and UI rows with the reference's two rules and the audit tools."
agents.instructions.3:
  slug: rules-load-by-path
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a structure check that the root instruction file holds no rule id of a kind or framework part, with nested AGENTS.md files (and Claude path-scoped rule files as the Claude-only form). Plant: a web rule id added to the root file fails. Control: the same rule in the web directory's file passes"
  review_question: "Did the session read the instruction file, the ticket and each anchor it cites before its first proposal?"
  open:
    - "Nested AGENTS.md is read by several agent tools per agents.md; path-scoped rule files only by Claude."
    - "Half checkable: the structure is a check, whether a rule belongs in a path-scoped file is review."
    - The read order is held by review until a session hook records reads.
agents.instructions.4:
  slug: procedures-ship-as-skills
  since: 0.1.0
  level: process
  kind: instruction
  strength: Review
  review_question: "Is this procedure in a skill, and does the instruction file point at it rather than repeat it?"
  open:
    - "The skills themselves are tooling of the reference organisation's estate; ours are still to be written."
    - "Proposed for lack of a source; the v1 evidence was: D (unmeasured)"
agents.instructions.5:
  slug: rules-reachable-offline
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion sync vendors the rules from the private standards repository at a tag; companion check hashes each vendored file against rules.lock and fails on a difference or a missing file. Plant: a vendored file edited by one byte fails; a rule file reachable only by URL fails the offline lookup. Control: a clean vendored copy passes"
  open:
    - "The rule data lives in a private repository."
    - The offline lookup test is planned only.
agents.instructions.6:
  slug: first-file-is-good
  since: 0.1.0
  level: file
  kind: instruction
  strength: Lens
  review_question: "Would a new contributor copying the first file an agent opens in this area write good code?"
  relates:
    docs.samples.4:
      how: see
  open:
    - "No plant yet; a lens that scores the first file for a new area is unproven."
    - "Proposed for lack of a source; the v1 evidence was: A (one component file is 2,868 lines)"
  note: The golden page or worked example is docs.samples.4.
agents.instructions.7:
  slug: library-shipped-instructions
  since: 0.1.0
  level: package
  kind: instruction
  strength: Lens
  review_question: "Does any dependency admitted in this change ship agent instructions or an llms.txt, and is it linked?"
  open:
    - "A report listing dependencies that ship AGENTS.md or llms.txt could prompt it; unproven."
    - "Proposed for lack of a source; the v1 evidence was: D"
base/agents/rules/review.yaml:
  summary: "Each area of judgement has a read-only reviewer lens that stores a verdict tied to the content. A stored verdict can block landing but never clears a change alone; a lens has its own plant before its verdicts count; and review reads for understanding and for the rows no check can hold."
agents.review.1:
  slug: reviewer-verdict-blocks-land
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the land check reads reviewer-verdicts/<lens>.json, one stored verdict file per lens (lens, model family, content hash of the diff plus card, verdict) and refuses a missing, stale or failing verdict for a touched area and, on load-bearing paths, a reviewer of the same model family as the author; an override is a trailer naming a reviewer of yet another family, a reason and a ticket. Plant: a change with no verdict for a lens is refused; a change whose verdict hash names another tree is refused; a load-bearing change reviewed by the author's own family is refused. Control: a change with a current passing verdict from a different family passes this check and still runs every gate"
    "2":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the verdict file carries the reviewer's session id and the counts from its clean-checkout gate run; the land check refuses a verdict whose session authored a commit of the change or whose counts differ from the close without a finding. Plant: a verdict written by the authoring session is refused; a verdict whose test count differs from the close with no finding is refused. Control: a verdict from a fresh session with equal counts passes"
  review_question: "Did a lens of a different model family read this change, and does its stored verdict name the tree?"
  relates:
    agents.review.2:
      how: see
    agents.review.3:
      how: see
    agents.review.4:
      how: see
  open:
    - "Held at the donor as five lenses with a verdict file each; in our estate it is planned."
    - "The lens judgement itself is review; only the presence and the tie of the verdict is enforced."
    - The weekly digest that lists overrides does not exist yet.
  note: "One merged rule. It carries the reference organisation's stored-verdict-blocks-landing rule, the UI reviewer-lens rule's sensor clause and the handbook rule that a review opens a finding and never clears a change. The lens definition is agents.review.2, its plant is agents.review.3 and the threat questions are agents.review.4."
agents.review.2:
  slug: read-only-lens-per-area
  since: 0.1.0
  level: process
  kind: instruction
  strength: Lens
  review_question: "Did the lens run on the final content, see only the diff and the card, and write a verdict that names the tree?"
  relates:
    agents.review.3:
      how: see
  open:
    - "No Go lens exists yet; the web lenses are held at the donor only."
    - "A lens binds only once promoted: the plant in agents.review.3 must catch the planted fault in at least 9 of 10 runs."
    - "v1 evidence, not yet a source: A (31 of 72 and 16 faults found by review)"
agents.review.3:
  slug: lens-has-its-own-plant
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. companion lens-test runs the lens on a stored bad-diff or page and a clean control over several runs with a pass threshold, suspending a lens that fails the control or passes the bad input; an eval harness with assertions could host it. Plant: the stored bad diff itself, and a lens prompt reduced to always-pass is suspended. Control: the clean control diff must pass"
  open:
    - "Model calls are nondeterministic, so it needs repeated runs and a threshold."
    - "The eval harness (promptfoo) was found by search only, not opened or run; its release dates conflict between sources."
    - "v1 evidence, not yet a source: D (a lens carries the most faults found, 31 of 72)"
  note: "Merges the UI rule and the handbook rule, and the plant half of the Go review row. The control is what stops a lens that fails everything."
agents.review.4:
  slug: trust-boundary-threat-questions
  since: 0.1.0
  level: process
  kind: instruction
  strength: Lens
  review_question: "What is newly reachable through this change, by whom, and what would an attacker try first?"
  open:
    - "A change-template field on trust-boundary paths could be checked for presence only; an invented answer passes it."
agents.review.5:
  slug: review-reads-for-understanding
  since: 0.1.0
  level: process
  kind: instruction
  strength: Review
  review_question: "Is the name accurate, is the abstraction right, and who owns this rule?"
  relates:
    agents.review.1:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "The reference rule's three questions; the rest of the owner-away rule belongs in the handbook."
agents.review.6:
  slug: second-round-asks-for-the-fix-to-the-kind
  since: 0.1.0
  level: process
  kind: instruction
  strength: Lens
  review_question: "Is this finding an instance of a gap found before in this change, and if so, which one place fixes the kind?"
  relates:
    agents.review.1:
      how: see
    gates.measures.5:
      how: see
agents.review.7:
  slug: the-reviewer-breaks-each-new-guard
  since: 0.1.0
  level: process
  kind: instruction
  strength: Lens
  review_question: "Which guards does this change add, did the reviewer break each one by hand, and which had no test that caught the break?"
  relates:
    agents.review.2:
      how: see
    agents.review.6:
      how: see
    gates.plants.1:
      how: see
  open:
    - "Planned check: the review record lists each new guard with the break the reviewer made. No tool key is bound yet."
base/agents/rules/tickets.yaml:
  summary: "The ticket is what an agent works from, so it is checked like code: it names only what exists at its base, lists the files it expects to touch, names a check that can fail, and arrives as one concern with its purpose and proof. These rules hold the largest fault class in our record, a ticket's false claim about the code."
agents.tickets.1:
  slug: ticket-names-exist
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. companion ticket-lint (ticketlint) at dispatch resolves backticked path, command, symbol and rule id against the base; marked-new names must be absent (a marked-new absent name passes), unmarked names must exist; a moved-path detector; Files names must be backticked. Plant: a ticket citing a path and a symbol the base lacks is refused; a marked new existing name is refused. Control: a ticket citing a real path and a marked new absent file passes"
    "2":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the dispatch step reads the ticket's done-when gates against the gate list and its dependencies against open decisions and escalations, and refuses on any. Plant: a ticket whose done-when names a gate not on the line is refused; a ticket blocked by an open escalation is refused. Control: a ticket with every anchor resolved and no open blocker is dispatched"
  open:
    - "The planner cannot see the whole repo; the known way round is marking everything as to be created, so the marked share is printed for the reader."
    - "No ticket carries a mark yet: as written 178 of 219 landed tickets refuse, 168 of them legitimately; with hindsight marks 31 remain (11 of 58 faulted, 20 of 161 clean), which is weak."
    - Only about 20 of 104 false-claim and scope faults can be caught by a name check at all.
    - "Trialled on Go tickets only; no ticket linter that resolves symbols, commands and ids against a base was found by search."
  note: "Merges the Go and UI rows and the handbook rule; the tier is dispatch, outside the 0 to 4 grid."
agents.tickets.2:
  slug: scope-list-against-diff
  since: 0.1.0
  level: process
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. at land a comparison of the diff's files against the scope list with the listed-touched share, blocking until a recorded answer exists. Plant: a scoped ticket with an unlisted file in its diff is listed and blocks until answered. Control: a diff within the listed scope passes"
  review_question: "What does this change's exported surface break, and who implements the port it changes?"
  open:
    - "Conflict between sources: the criterion and the handbook say report only and refuse nothing; the best-practice strength is Answered (a mismatch blocks until answered). Held as Answered; to be settled by the operator."
    - "The class has no working gate: an unlisted file is the normal case. The compiler already forces consumers of a changed name, and the overlap check stays."
    - "Listed-touched share: median 1.0, 7 percent under 0.5. Tickets do not state the names they change, so a reference search has little to start from. A one-line reason would be paper at this rate."
    - "v1 evidence, not yet a source: own bugs (the second 52 of the 137 run-log faults)"
  note: "Merges the Go row, the UI row and the handbook rule. People in a finding means people and review agents; in one project the main finder was the designer agent (31 of 72) and the operator found 5."
agents.tickets.3:
  slug: done-when-check-ran
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the land step runs the named check and parses go test -json for run events, failing on zero (go test -run on an unknown name exits 0 and prints no tests to run). Plant: a done-when naming a test that does not exist is refused. Control: a done-when naming a real test passes with one run event"
    "2":
      binding: ts
      class: fact
      tool: vitest
      tier: "3"
      note: "v1 class our-cli. vitest run -t name with the json reporter, failing unless numPassedTests is at least 1; a Playwright list count for browser checks. Plant: vitest run on a nonexistent name exits 0 with numPassedTests 0 and must be refused. Control: a real test name gives numPassedTests 1"
  open:
    - "The Go form was verified on 5 Nov (the unknown name exits 0, no run events); the TypeScript runner's own exit on no matching tests was read only from the run in the UI row. Check what your runner does."
    - The red-evidence half is the deliberate break held by the tests part.
    - Tried on Go tickets only.
    - "v1 evidence, not yet a source: own bugs (8 faults; 6 of 159 named tests never existed)"
  note: "Merges the Go row, the UI row and the handbook rule; each language has its own check."
agents.tickets.4:
  slug: purpose-and-proof
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. commitlint 21.2.4 body-empty and trailer-exists for Verdict, plus a land step that checks the purpose line differs from the ticket title, the verdict hash equals the tree and test files come first in the summary. Plant: a change with an empty-body message is refused; a change whose quoted verdict names another tree is refused. Control: a change with a distinct purpose line and a current verdict passes"
  open:
    - "Presence check only: a paraphrase of the ticket title passes the purpose test; boilerplate is the known way round and the rest stays for the reader."
    - The tree-bound verdict half belongs to the land check of the gates part.
    - "v1 evidence, not yet a source: D (practitioner consensus, not a measurement)"
agents.tickets.5:
  slug: one-concern-per-change
  since: 0.1.0
  level: process
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class our-cli. diff-size and post-land rework per ticket from the delivery record, blocking a change over the size line until it is answered. Plant: an oversize diff blocks until answered. Control: a diff under the line passes"
    "2":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class our-cli. an issue-shape check that refuses an issue with no dated owner quote or a missing Today, Want, Done when or Design section. Plant: an issue with no Done when section is refused. Control: an issue with every section passes"
  review_question: "Is this one concern, and is the rework count beside the diff size?"
  open:
    - "A concern count is judgement; it would become a rule only with a measured ceiling, and the criterion itself gives no limit."
    - "The plan gate is not a Go row; there is no UI plan gate yet."
  note: "Merges the Go and UI rows and the reference's one-concern rule; the pull request template is a tool."
agents.tickets.6:
  slug: done-claim-carries-artefact
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the land check requires Evidence lines in the change text that point at existing run-record files. Plant: a change whose Evidence line points at no file is refused. Control: an Evidence line pointing at an existing run record passes"
  review_question: "Does the artefact answer the question it names, with measured numbers rather than a picture?"
  open:
    - "Half: presence is checkable, adequacy is review."
    - "Applies to the web part's changes."
    - "Proposed for lack of a source; the v1 evidence was: A (one project's measure)"
agents.tickets.7:
  slug: fault-becomes-a-plant
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the land check requires a ticket labelled fault to touch a plants or journeys path, a glob held in the rule data, before it closes. Plant: a fault ticket closed with a diff touching no plant path is refused. Control: a fault ticket whose diff adds a plant passes"
  review_question: "Is the plant this fault ticket added the right plant for the fault?"
  open:
    - "Half: that a plant path was touched is checkable; that it is the right plant is review."
    - "v1 evidence, not yet a source: A (five recurrence pairs)"
agents.tickets.8:
  slug: register-with-permanent-ids
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "a register test that parses the register, fails an open row with no issue link and a duplicate id, and resolves every cited register id in code, tests and docs. Plant: an open row with no issue link fails; a test citing a register id with no row fails; a reused id fails. Control: a register whose open rows all link issues and whose ids are unique passes"
  relates:
    docs.links.2:
      how: see
base/arch/rules/decisions.yaml:
  summary: "Structural choices are written down before code, as one file each with a status, supersession links and a link to the check that holds them. Who rules a kind of change, and which alternative was tried and lost, are recorded in the same place, so a reader and an agent can find why the shape is what it is."
arch.decisions.1:
  slug: one-file-per-decision
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the companion docs check reads the container the repo declares (front matter validated against a JSON Schema by santhosh-tekuri/jsonschema v6.0.3, Apache-2.0, released 6 Aug 2026; or the log's or notes' numbered entries): status enum, supersedes and superseded-by symmetric, check link or the word instruction, ids unique and never reused, every cited id resolves; links resolved by the repo's own offline link test. Plant: a decision with no status fails; a supersedes link whose target does not point back fails; a cited id with no decision fails. Control: a complete pair passes"
  open:
    - "Note, 8 Nov 2026: a slug is a permanent id and one home, so an id need not be a number; records already numbered keep their numbers (arch.decisions.5)."
    - "The front-matter schema plugin first tried was rejected for its age (its row in the docs part's tools is replaced); no schema tool has been tested end to end and no plant is recorded."
arch.decisions.2:
  slug: structural-change-needs-a-ruled-record
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. commitlint 21.2.4 trailer-exists for a Door trailer and body-empty at land (both fired in a run) plus a header check on the record; the diff-conditional half (a diff that adds a package or dependency needs the trailer) is the land step's own check. Plant: a message with no Door trailer exits 1, with one exits 0; a diff adding a dependency without the trailer fails at land. Control: a message with the trailer passes"
  relates:
    arch.structure.1:
      how: see
  open:
    - "The message form is held by commitlint, which reads only the message; the diff condition is ours and its plant is owed."
    - "Proposed for lack of a source; the v1 evidence was: D"
arch.decisions.3:
  slug: who-rules-is-recorded
  since: 0.1.0
  level: process
  kind: instruction
  strength: Review
  review_question: "Who ruled this change, and is that the person this kind of change belongs to?"
  open:
    - "Rulings come from the operator, the owner lane and the leads; the record names who ruled and no gate can judge whether the ruling was right."
arch.decisions.4:
  slug: second-design-recorded
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the decision index test of arch.decisions.1 requires a Rejected part per decision and a reason per rejected item. Plant: a decision whose rejected item has no reason fails. Control: a decision with each alternative and its reason passes"
  review_question: "What was the second design for this interface, and why did it lose?"
  relates:
    arch.decisions.1:
      how: see
    arch.structure.5:
      how: see
  note: "The driver question for a new module or repository is in arch.structure.5. v1 review check (review is not a v2 check class): a required field in the change template (presence only) and a model lens that judges whether the alternatives were real"
arch.decisions.5:
  slug: no-shared-counter
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      fix: never
      note: "the rulebook check refuses a provisional id on the main branch and a numeric id the lock file does not hold; the docs test refuses two records with one id. Plant: two decision records with one id fail; a provisional rule id on main fails. Control: two records with distinct slugs pass"
  relates:
    arch.decisions.1:
      how: see
  open:
    - "Proposed until the checks exist. Slug ids for new decisions are a planned step; ids for rules assigned at landing are step 11, built only when two rule changes first collide. Until then whoever dispatches the work assigns the number in the ticket."
base/arch/rules/layers.yaml:
  summary: "Code is divided into named layers and modules, and which may import which is written down as data and checked by a tool. Imports run one way, every file sits in one layer, cycles are refused, a module is reached only through its public entry, and the rules are generated from one declared graph rather than typed by hand."
arch.layers.1:
  slug: imports-run-one-way
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "a layer test in the companion Go checks: the layer table in rule data (package globs to layer, allowed layer edges), direct imports loaded per package with go/packages, any edge not in the table fails, and the breach baseline is one file per entry that only shrinks. Plant: an entry package importing database/sql fails and the test lists the edge. Control: the same import from the store layer passes"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "ESLint with eslint-plugin-boundaries 7.4.1 rule boundaries/dependencies (the replacement for the deprecated element-types), element types generated from the layer table, a per-edge message naming the reason; imports in .ts, .tsx and, through astro-eslint-parser, in .astro frontmatter and <script> blocks (the glob **/*.astro/*.{js,ts} must be listed). Plant: a file in the lowest layer importing from a page file fails, in a .ts file, in .astro frontmatter and in an .astro script block; the same import pointing down passes. Control: the same import pointing down passes"
  open:
    - "Nobody has seen the Go layer test fail (no plant recorded), so the plant must be run once per repo when it is adopted, and adopting repos need the baseline generated once from today."
    - "The ESLint plugin option mode file is deprecated and untested in 7.4.1, measured under the former 14-day window; pin the version outside tools.yaml's window and re-run the plants. The text-rule fallback stays until the plugin passes the 10 plants on both sites."
