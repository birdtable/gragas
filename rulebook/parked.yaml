    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint `import-x/no-default-export` at error with the same path list. Plant: a default export in a module outside the list fails. Control: a named export passes"
ts.modules.2:
