      tier: "1"
      note: "the layer test reads the write handle's importers and fails any package other than the executor and the store adapters; a source test fails a throw or panic that leaves the executor. Plant: a command that imports the write handle and writes directly fails. Control: the same command calling the executor's verb passes"
arch.ports.15:
  slug: a-library-enters-as-an-adapter
