base/arch/rules/templates.yaml:
  summary: "A new unit starts from a template or generator that already has the shape the gate accepts, and later template changes reach existing projects. The template records its version, asks few questions and knows which files the repository owns."
arch.templates.1:
  slug: template-per-kind-records-version
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
