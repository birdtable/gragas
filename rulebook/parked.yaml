      note: "matrix in the shared test package with the environment table, driving the pty with a pty library, asserting zero ESC bytes Force variables set are CLICOLOR_FORCE and FORCE_COLOR, together with NO_COLOR=1; the matrix is uitest. Plant: a command printing an escape code directly with fmt.Print(\"\\x1b[31m\") fails under NO_COLOR; the four copies fail under forced colour with TERM=dumb. Control: output through the shared module passes"
  relates:
    cli.config.3:
