  open:
    - "Not run on `.tsx`. The assertion style `never` did not flag `as const`, confirmed in a trial."
    - "v1 evidence, not yet a source: C (118 non-null assertions in one donor baseline)"
ts.type-safety.3:
  slug: suppression-comments-need-a-reason
  since: 0.1.0
  level: function
  kind: rule
