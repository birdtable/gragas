  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Does this commit tier parse every JSON file and every schema block of the theme?"
  relates:
    gates.command.28:
      how: see
    gates.command.17:
      how: see
  open:
    - "Planned check: the members file holds the parse member at commit with its file count in the report. No tool key is bound yet; the stack has no tool record in this rulebook."
liquid.cycle.2:
