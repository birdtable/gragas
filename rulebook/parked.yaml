      note: "boundary rule allowing only the composition file to import every module manifest, and a check that its list equals the graph file. Plant: a second file importing every manifest fails; a manifest missing from the composition list fails. Control: the composition file importing every manifest passes"
  relates:
    arch.ports.11:
      how: see
    arch.ports.12:
      how: see
  open:
    - "The Go form is arch.ports.11 and arch.ports.12; no separate Go check is chosen."
    - "Some plants and controls of this rule were written at the merge from the sources' description of the check, and have not been run."
arch.ports.14:
  slug: one-executor-for-every-write
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
