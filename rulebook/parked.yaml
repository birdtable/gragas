program/web/rules/accessibility.yaml:
  summary: "Keyboard, focus, contrast, names, motion and zoom: what a page must give every person, checked by tools where a tool can see it."
web.accessibility.1:
  slug: axe-finds-nothing-new
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. `@axe-core/playwright` through the kit on every page state at both widths and schemes, compared with a shrink-only known-list file; the story runner with the accessibility test set to error. Plant: a new page state with an unlabelled input fails; a known-list entry removed after a fix cannot be re-added. Control: a page with a labelled input passes"
  open:
    - "The engine failed the violation page on landmark and heading rules until the control had a main element and an h1; the label rule accepts a non-empty placeholder, so a placeholder-only input is not a plant."
    - "One site's result is a null on a shell, not a zero."
    - "Proposed for lack of a source; the v1 evidence was: A: 42 percent of the donor's stories; 3 rules on one page of ours"
web.accessibility.2:
  slug: built-html-valid
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "3"
      note: "html-validate `html-validate:recommended` over built HTML, or over `page.content()` for client-rendered apps. Plant: an input with no label and an id used twice fail. Control: the corrected page passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: C: 11 of 32 plants, no unique catch"
web.accessibility.3:
  slug: heading-outline
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "3"
      note: "axe `heading-order` and `page-has-heading-one` in the accessibility run, plus html-validate `heading-level` on built HTML. Plant: a page jumping from h1 to h3 fails. Control: a page with consecutive levels passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: C"
web.accessibility.4:
  slug: status-not-by-colour-alone
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "the status part's required label prop, `no-restricted-syntax` banning status classes and status colour tokens outside the part, and the kit's status check on `[data-status]` text. Plant: a span with a status-bad class and no text outside the status part fails. Control: the status part with a label passes"
  open:
    - "No tool caught the planted case, so this is a different mechanism (a shape ban plus a required prop) not yet shown to work."
    - "Half holds: it stops the known pattern; a colour-only cue in a new component class is not seen."
    - "Proposed for lack of a source; the v1 evidence was: B: the one miss of 32"
web.accessibility.5:
  slug: reduced-motion
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "the kit's reduced-motion check reads the running animations after emulating reduced motion. Plant: a spinner with a running animation under reduce fails. Control: the same spinner marked essential passes"
  open:
    - "Trialled on Chromium only: it failed a running spinner and passed once the page neutralised it."
web.accessibility.6:
  slug: text-grows-without-loss
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the kit's text-spacing check plus axe `meta-viewport`. Plant: a button label that clips at the raised spacing fails; `user-scalable=no` fails the engine. Control: a label that wraps at raised spacing passes"
web.accessibility.7:
  slug: meaning-has-a-reader
  since: 0.1.0
  level: release
  kind: rule
  strength: Record
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class record. the release tag check requires a valid `a11y-pass.json`. Plant: a tag with no record file fails the presence check. Control: a tag with a valid record passes"
  review_question: "Who walked this release with a screen reader, and where is the record?"
  open:
    - "Proposal: split into a record that exists for the tag (a trivial rule) and the pass (review). A presence check alone does not make the row a rule, so it stays Record until promoted."
    - No report has run a screen reader.
    - "Proposed for lack of a source; the v1 evidence was: B"
web.accessibility.8:
  slug: template-a11y-lint
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "`eslint-plugin-astro` `flat/jsx-a11y-strict` for templates; the component form is react.lint.3. Plant: an alt-less image, click without key, empty anchor, untitled iframe, autofocus and positive tabindex each fail in a template (and in a component under react.lint.3). Control: the clean control passes"
  relates:
    react.lint.3:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: C: 8 of 32 plants in 0.35 s"
web.accessibility.9:
  slug: names-have-a-floor
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the kit's names check over the accessibility tree plus the axe rules above. Plant: a link named \"here\" fails; an image with `alt=\"IMG_0043.png\"` fails. Control: a descriptively named link passes"
  open:
    - False-positive rate on real code is unknown.
    - "Proposed for lack of a source; the v1 evidence was: C"
web.accessibility.10:
  slug: silent-change-announced
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the kit's silent-update check plus the notice part's typed timer prop. Plant: a toast that appears silently fails; an error notice with an auto-dismiss timer fails the type check. Control: a toast in a live region passes"
  open:
    - Timing is judgement. The notice part is planned.
    - "Proposed for lack of a source; the v1 evidence was: C"
  note: The one-toast-system rule in the parts concern states the same no-auto-dismiss clause for the notify wrapper.
web.accessibility.11:
  slug: dialog-contract
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the kit's dialog check on every overlay, plus the per-stack lint above. Plant: a div dialog that does not return focus fails the check; `<div role=\"dialog\">` in a template fails the lint. Control: a native dialog passes"
  relates:
    react.components.2:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: A"
web.accessibility.12:
  slug: click-has-key
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the kit's click-keyboard check plus the lint rules above. Plant: a div with a click handler and no tabindex fails. Control: a button passes"
  open:
    - Trialled on Chromium only.
    - "Proposed for lack of a source; the v1 evidence was: C"
web.accessibility.13:
  slug: keyboard-operable
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the kit's keyboard check (extended), plus a single focus-ring token and the outline rule of the styling concern. Plant: a modal that traps on the first stop fails; a focus ring hidden behind a sticky header fails. Control: a page whose controls are all reached in order passes"
  review_question: "Does the reading order make sense?"
  open:
    - "Half holds: reading order sense is review."
    - "Proposed for lack of a source; the v1 evidence was: B"
web.accessibility.14:
  slug: contrast-every-state
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the accessibility run after each forced state of the six-states check. Plant: error text on a pale pink ground below 4.5 to 1 fails in the error state. Control: error text above 4.5 to 1 passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: C: the token check found it before any page used the pair"
  note: Depends on the forced states of the six-states rule.
web.accessibility.15:
  slug: control-contrast
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the kit's control-contrast check. Plant: a 2 to 1 input border fails. Control: a 3 to 1 border passes"
web.accessibility.16:
  slug: plant-corpus-caught
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "the matrix script over the shared plant corpus. Plant: removing the heading-order rule leaves the heading plant uncaught and fails. Control: the full stack passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: C"
web.accessibility.17:
  slug: apca-reported-not-gated
  since: 0.1.0
  level: package
  kind: rule
  strength: Record
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. the contrast test of the tokens package prints Lc beside the ratio and returns no exit status for it. Plant: a test fails if the report omits APCA, and a check fails if anything gates on it. Control: a report that prints Lc and gates only on the ratio passes"
  review_question: "Does the contrast report print APCA beside the ratio, and does any gate use it?"
  open:
    - "The APCA package carries a non-standard licence (last published 2022); read it before shipping, or compute APCA with the colour library if it supports it (to be checked). Licence question for the standards owner."
    - "The source verdict is best-practice; the report-only nature makes the plant a presence check."
    - "Proposed for lack of a source; the v1 evidence was: C"
web.accessibility.18:
  slug: lighthouse-report-only
  since: 0.1.0
  level: release
  kind: measure
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "4"
      note: "a config check refuses a Lighthouse score assertion. Plant: a config asserting a Lighthouse score fails the check. Control: a report-only config passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: C: one alt-less image scored 0.84"
program/web/rules/content.yaml:
  summary: "Every visible word, number, date and brand name comes from typed, checked configuration and one formatter, so a page can change language or brand without code changes."
web.content.1:
  slug: no-sentence-in-view
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "`eslint-plugin-i18next` `no-literal-string` (jsx-text-only plus attribute lists) and `no-restricted-syntax` on literal assignment to textContent, innerText, title and placeholder, with bulk suppressions for old files. Plant: a sentence in an h1 and `el.textContent = \"Something went wrong\"` each fail. Control: `{t(\"dash.title\")}` passes"
  open:
    - "Templates and a literal title attribute fired in the template stack; frontmatter constants and script strings need the textContent selector, which was not planted. Not run on components."
    - "The marker-part and message-kernel names are one codebase's and belong to react."
    - "v1 evidence, not yet a source: A: 981 and 1,844 literals in two sites; about 8,400 in all"
web.content.2:
  slug: one-formatter
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "ESLint `no-restricted-properties` and `no-restricted-syntax` outside the formatter module, and a golden table run by both the TypeScript and Go formatter tests. Plant: `bytes.toFixed(1) + \" GB\"` in a view file fails; a changed rounding rule in one of the two formatters fails the golden table. Control: `formatBytes(n)` passes"
    "2":
      binding: go
      class: test-kit
      tier: "0"
      note: "the Go formatter runs the same golden table. Plant: a Go formatter with a different rounding rule fails the table. Control: the matching formatter passes"
  review_question: "Is there a stateable invariant here, and is it tested by generated input?"
  open:
    - "Half holds: no tool demands a stateable invariant, so the property-test clause stays review. The pattern scan misses `>> 10`, `** 10`, `Math.pow`, a direct `Intl.NumberFormat` and a hand plural through a lookup table; the forms are kept as plants and the real gate is the import ban."
    - "One format exists today (one locale); locale-specific grouping is decided at the language trigger. The reference retired its \"no i18n library\" clause in favour of a message kernel."
    - "v1 evidence, not yet a source: A: 1.5 GB read four different ways"
web.content.3:
  slug: plurals-one-function
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "`no-restricted-syntax` on the equality-with-1 conditional and on `Intl.PluralRules` outside the formatter. Plant: `n === 1 ? \"file\" : \"files\"` in a view file fails. Control: `plural(n, \"file\")` passes"
  open:
    - "It fires on non-plural `=== 1 ?` expressions (known); allowed with a reason and a baseline."
    - "Proposed for lack of a source; the v1 evidence was: A: 12 or more Go helpers"
web.content.4:
  slug: time-zone-stated
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "ESLint `no-restricted-syntax` selectors on date formatting calls lacking a timeZone option, outside the formatter. Plant: `new Intl.DateTimeFormat(\"en\")` with no zone fails. Control: the formatter's call with `timeZone` passes"
  open:
    - "The selector using `:has` has not been run. The pattern scan was trialled on trees."
    - "Proposed for lack of a source; the v1 evidence was: A: 7 web sites"
web.content.5:
  slug: dates-one-module
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "`no-restricted-imports` on other date libraries and `no-restricted-syntax` on raw `Date` arithmetic outside the date module. Plant: adding days with raw millisecond arithmetic outside the date module fails. Control: the same through the date module passes"
  open:
    - "The reference named one date library; the pick belongs to the stack choice (see the supply-chain rules). Native platform dates are the first choice under the platform-first rule."
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.content.6:
  slug: locale-one-place
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "3"
      note: "axe `html-has-lang` and `html-lang-valid` in the accessibility run, and `no-restricted-properties` outside the locale module. Plant: a page without html lang fails axe; reading `navigator.language` in a view fails the lint. Control: a page whose lang follows the locale constant passes"
  open:
    - "Half holds: fonts per script is review."
    - "Proposed for lack of a source; the v1 evidence was: D"
web.content.7:
  slug: brand-written-once
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "cspell `flagWords` (or `no-restricted-syntax`) outside the brand file, and generated-constant checks for the banner. Plant: the product name typed in a template fails. Control: the name read from the brand file passes"
  open:
    - "Existing literals need a baseline (counts only fall); the brand scan was trialled on trees."
