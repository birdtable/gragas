service.contract.8:
  slug: replay-and-conflict
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "v1 class shared-code. shared helper walking write operations and subscribed handlers, calling each twice and comparing store state, with key-reuse conflict assertions. Plant: a handler that appends a row or sends a call on every invocation fails the twice test; a key reused with a changed body returning success fails. Control: a handler that is idempotent passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "shared Go test helper calling every contract route twice and hashing the state folder; a retried write with the same key replays the stored outcome. Plant: a handler that appends a log line on each call fails; a key reused with a changed body must return conflict. Control: an idempotent handler passes"
  open:
    - "In Go there is no stored-outcome replay for daemon requests yet: the rule is held for a repeat run that changes nothing or says so."
    - Whether the twice test runs in tier 2 or tier 4 is not timed.
    - "Built because every rule binds from adoption; if the operator would rather not build for evidence D this part becomes a best practice."
service.contract.9:
