service.contract.16:
  slug: goal-already-holds-is-success
  since: 0.1.0
  level: function
  kind: rule
  strength: Review
  review_question: "Does any caller need to know the goal state was already reached, and is the rule stated on the operation?"
  open:
    - "No plant: a seeded handler that swallows a real not-found as success must be flagged by the reviewer."
  note: "Extends the replay and not-found-versus-conflict rules: those say how to tell conflict from missing, not that an already-done command is a success."
service.contract.17:
  slug: eventual-effects-stated
  since: 0.1.0
  level: function
  kind: instruction
  strength: Review
  review_question: "Which effects of this command complete after the response, and where does the description say how a caller sees completion?"
  open:
    - "No plant: a seeded command that writes an outbox row and describes itself as complete must be flagged."
  note: "Applies to command operations whose handlers write the outbox. Nearest: the command-route shape rule fixes the route form, not what a 2xx promises."
service.contract.18:
  slug: provider-names-no-consumer
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "a repository test with the reader-name list, run whole-word over shipped code, examples and config. Plant: a config comment that names the page that reads the API fails. Control: shipped files that name no reader pass"
service.contract.19:
  slug: answers-carry-meaning-not-presentation
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "a whole-word test over every JSON field name in the generated contract and every config key, against the place-word list. Plant: a field named card_title fails. Control: a field named title passes"
  open:
    - "v1 evidence, not yet a source: target: two design records of one program (no presentation in answers or config, no icon, colour, tile, card order or heading; a field named after a place on a page is renamed before merge; a whole-word test over json tags, with B2's suffix kinds)"
service.contract.20:
  slug: units-in-keys-sentences-with-inputs
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a lint over the generated contract refusing a numeric field with no unit suffix outside the count and id list, and a test per sentence field that parses the numbers out of the sentence and compares them with the fields beside it. Plant: a numeric field named memory with no unit fails, and a sentence that says 3 beside a field of 4 fails. Control: memory_mb with memory beside it, and a sentence that matches its fields, pass"
  relates:
    web.structure.4:
      how: see
program/service/rules/cycle.yaml:
  summary: "What a service whose tests need a real database, queue or container adds to the moments of the development cycle: one shared container per package started in the suite's setup with a database per test cloned from a template, images pinned by digest and pulled before the lock, the integration tier as a member of push or release, the cross-service tier at release that measures state, and the deploy as a release member run by the hub. These lines add members to the core moments and never a moment of their own."
service.cycle.1:
  slug: one-container-per-package-and-a-database-per-test
  since: 0.1.0
  level: package
  kind: instruction
  strength: Lens
  review_question: "How many containers does this package start per run, where does the migration run, and how does each test get its database?"
  relates:
    tests.isolation.3:
      how: see
    tests.runners.5:
      how: see
    tests.doubles.2:
      how: see
  open:
    - "Planned check: the container count in the test member's report, one per package. No tool key is bound yet."
service.cycle.2:
  slug: images-by-digest-pulled-before-the-lock
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Where is this image's digest pinned, which step pulls it, and does any start call pull?"
  relates:
    gates.command.24:
      how: see
    gates.command.19:
      how: see
    supply.provenance.7:
      how: see
  open:
    - "Planned check: the tools pins file lists each image with its digest and the tools step pulls it. No tool key is bound yet."
service.cycle.3:
  slug: the-integration-tier-is-a-member
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Which tier of this service holds the integration tests, and how many database tests did the last run skip?"
  relates:
    gates.command.17:
      how: see
    gates.command.30:
      how: see
    tests.admission.5:
      how: see
    service.authz.2:
      how: see
  open:
    - "Planned check: the members file holds the integration member in push or release, and the report's skip count for it. No tool key is bound yet."
service.cycle.4:
  slug: the-cross-service-tier-measures-state
  since: 0.1.0
  level: release
  kind: instruction
  strength: Lens
  review_question: "What state does this cross-service tier read back after each request, and how does it find the rows it wrote?"
  relates:
    tests.journeys.6:
      how: see
    tests.journeys.5:
      how: see
    gates.command.30:
      how: see
  open:
    - "Planned check: the tier's report lists the state reads per journey and the marker. No tool key is bound yet."
service.cycle.5:
  slug: the-deploy-is-a-release-member-run-by-the-hub
  since: 0.1.0
  level: release
  kind: instruction
  strength: Lens
  review_question: "Is this service's deploy a release member with an after edge to the tier, who runs it, and does the publish workflow run the push tier first?"
  relates:
    supply.release.1:
      how: see
    gates.command.31:
      how: see
    supply.workflows.5:
      how: see
  open:
    - "Planned check: the members file holds the deploy member at release with its after edge, and the publish workflow's first job is the push tier. No tool key is bound yet."
program/service/rules/errors.yaml:
  summary: "Errors are handled, never swallowed. Each service has one closed list of error codes, listed in its contract; every error carries a request id, and the message is for developers only."
service.errors.1:
  slug: no-swallowed-errors
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-empty and an ast-grep rule failing a catch block that returns a literal or a default value. Plant: an empty catch fails; a catch returning an empty list fails. Control: a catch that rethrows or maps the error passes"
    "2":
      binding: go
      class: preset-rule
      tier: "1"
      note: "errcheck and a rule failing a discarded error. Plant: an ignored error return fails. Control: a handled error passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "Beyond goal-already-holds-is-success in the contract concern, whose count of catch-and-continue handlers signals swallowing dressed as ensure."
service.errors.2:
  slug: error-code-closed-list
  since: 0.1.0
  level: type
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a typed code list and a test failing any thrown code not in the list, plus a diff of the committed list against the last release that fails on a changed meaning. Plant: a thrown string not in the list fails. Control: a listed code passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "exit codes held in one tested table and a test over the typed error set. Plant: an exit code outside the table fails. Control: a table code passes"
    "3":
      binding: any
      class: preset-config
      tier: "1"
      note: "the casing lint of service.contract.10 run over the error-code enum in the generated contract. Plant: an error code in a casing other than the declared one fails. Control: codes in the declared casing pass"
  relates:
    service.contract.10:
      how: see
service.errors.3:
  slug: message-is-developer-diagnostic
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "contract tests asserting the user-facing text is mapped from the code and the message field is absent from the public error body. Plant: a public error body that carries the exception message fails. Control: a body with only code and request id passes"
  note: In the front end a machine code is separate from its sentence in a closed documented set.
service.errors.4:
  slug: contract-lists-error-codes
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tool: spectral
      tier: "1"
      note: "Spectral rule failing an error response whose body does not reference the shared error-code enum, and a test that the enum covers the platform codes. Plant: an error response with a free-text code fails. Control: a response referencing the enum passes"
    "2":
      binding: any
      class: test-kit
      tier: "2"
      note: "a contract test that drives each error path, a request refused before the handler and a request through the proxy to a stopped program, and asserts a non-2xx status with the JSON error body; a lint refusing an error field in any 2xx schema. Plant: a 200 answer with an error field fails, and a proxy that answers an empty 502 fails. Control: a 4xx or 5xx with the JSON error body passes"
  open:
    - "v1 evidence, not yet a source: practice; target: a design record of one program (every error is a non-2xx status with a JSON error body, a 200 with an error inside or a proxy's empty 502 is a defect)"
service.errors.5:
  slug: error-carries-request-id
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "an end-to-end test requesting a failing route and a gateway-refused route, asserting the error body and header carry a request id that appears in the logs. Plant: a gateway refusal with no request id fails. Control: an error with an id found in the logs passes"
  open:
    - "In Go, the error shown to a person carrying a quotable run or request id is a gap with no row yet."
    - "Proposed for lack of a source; the v1 evidence was: practice"
program/service/rules/events.yaml:
  summary: "An event is one fact with one definition, owned by its emitter: named by one pattern, wrapped in a base envelope, validated before it leaves, and listed in a catalogue that names its owner and who may subscribe."
service.events.1:
  slug: payload-defined-once
  since: 0.1.0
  level: type
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a test failing an event schema declared outside the shared events package, and a diff of the committed schema file against the regenerated one. Plant: an event schema declared inside a service fails; a committed schema file that differs from the generated one fails. Control: an event imported from the shared package passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a surface listing test over the shared message package and a duplicate-shape scan. Plant: a second declaration of a boundary shape fails. Control: one shared shape passes"
service.events.2:
  slug: event-name-pattern
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a catalogue test matching every registered event name against the pattern, and that an active family has a catalogue entry naming an owner. Plant: a name with capitals or without a version fails. Control: a conforming name passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that journal and event names are one closed set in one pattern. Plant: a name outside the set fails. Control: a conforming name passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.events.3:
  slug: publish-only-owned-families
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a catalogue-driven scan failing a publish call whose event family names another owner. Plant: a service publishing a family owned by another fails. Control: publishing its own family passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.events.4:
  slug: payload-extends-envelope
  since: 0.1.0
  level: type
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a type test that every registered payload schema extends the envelope schema, and a lint on key casing against the declared casing. Plant: a payload without an event id fails. Control: a payload extending the envelope passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that every versioned file and message carries a version field. Plant: a message without a version fails. Control: a versioned message passes"
  relates:
    service.contract.10:
      how: see
service.events.5:
  slug: validate-before-publish
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "the funnel publish function parses the payload with the registered schema and a unit test that an invalid payload throws. Plant: publishing a payload missing a required field fails. Control: a valid payload publishes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "The outbox rule outbox-holds-public-contract adds validation inside the transaction, before the commit."
service.events.6:
  slug: one-fact-from-consumers
  since: 0.1.0
  level: type
  kind: instruction
  strength: Review
  review_question: "Does this family carry one fact, and does any consumer need a field to know what happened? Which consumer needs each field?"
  open:
    - "No plant: a seeded schema with a type field and a nullable field only for one type must be flagged."
    - "With agents: they copy the whole entity into the event because it is the shortest path (inference)."
  note: "Extends event-name-pattern and payload-extends-envelope: names already separate families, so the residual is a discriminator inside the payload."
service.events.7:
  slug: catalogue-metadata
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "catalogue schema test requiring the four fields, plus a scan of subscriptions in the infrastructure against the visibility field. Plant: a subscription to an internal family from another domain fails; an entry with no data class fails. Control: a public family subscription passes"
  open:
    - "With agents: holds (inference)."
  note: "Extends event-name-pattern: that test fails an active family with no entry naming an owner; the other three fields are new. publish-only-owned-families stops a service publishing another family but nothing stopped it subscribing to another internal one."
program/service/rules/evolution.yaml:
  summary: "A released event schema changes by the program's declared reader mode: breaking changes get a new version, compatibility is stated per family and checked in both directions, and an old family is retired against a date."
service.evolution.1:
  slug: breaking-change-new-version
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "2"
      note: "the schema diff step against the last release failing a change to a live family without a new version name. Plant: removing a required field from a live family fails. Control: an additive optional field passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that a versioned file declares its handling of older and newer and a breaking change fails the release check. Plant: a breaking change without a version bump fails. Control: an additive change passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.evolution.2:
  slug: compatibility-by-reader-mode
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "schema diff reading the reader mode and, for independent readers, the family's compatibility field and the matching directions, plus a consumer test iterating the committed schema history; for owned readers, a check that a breaking change raised the version and touched every listed consumer. Plant: independent readers: removing a required field from a live family fails, and adding a required field without a default fails the backward direction; owned readers: a breaking change with the version unchanged fails. Control: an additive optional field passes both directions; an owned-reader break with the version raised and every consumer moved passes"
  relates:
    service.contract.2:
      how: see
  open:
    - Tier 2 or 3 depending on where the history fixtures live.
    - "With agents: holds, because agents change producers and consumers at a high rate (inference)."
  note: "Extends breaking-change-new-version, which says breaking without a direction."
service.evolution.3:
  slug: breaking-change-migration-clock
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "catalogue gate reading the reader mode: for independent readers it fails a deprecated family past its sunset and a new subscription to a deprecated family without a recorded exit; for owned readers it fails a dual write with no recorded reason and a replaced name with no gone-test. Plant: independent readers: a live family with a field removed and no new family fails, a deprecated family past its sunset fails, a new service subscribing to a deprecated family fails; owned readers: an old name kept beside its replacement fails. Control: an independent-reader family within its sunset passes; an owned-reader replacement that deletes the old name with a test passes"
  open:
    - "An additive field that changes meaning passes the diff and needs a human reader (inference)."
  note: "Extends breaking-change-new-version: that names the version and diffs the schema; the migration and its end date were missing."
program/service/rules/health.yaml:
  summary: "A service says whether it is alive and whether it is ready, and every service has the same alarms from day one."
service.health.1:
  slug: liveness-shallow-readiness-deep
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a start test with a broken dependency: liveness stays green, readiness turns. Plant: a liveness handler that checks the dependency fails the test; a readiness handler that ignores it fails too. Control: a liveness that ignores the dependency and a readiness that reports it passes"
  open:
    - "Whether the services expose a health route at all was not checked; this is inference."
  note: "Beyond born-with-same-alarms, which says what alarms each service has and not what a health route may check."
service.health.2:
  slug: born-with-same-alarms
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "an infrastructure scan failing a service stack that does not use the shared alarm component. Plant: a service stack without the shared alarms fails. Control: a stack using the component passes"
  open:
    - "In Go, alerting on failing health for a deployed program is a gap with no row yet."
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "The component itself is the rule of the SST part (alarms); this rule is the service obligation to use it. They would be held by one check."
program/service/rules/jobs.yaml:
  summary: "Services that run scheduled or background jobs record every run the same way, so one view shows what ran, when, and how it ended."
service.jobs.1:
  slug: one-job-run-record
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a contract test that the service's job runs validate against the shared job-run schema and are listed by the shared operations endpoint. Plant: a job that writes its own ad hoc run record fails the schema test. Control: a run written by the shared recorder passes"
  note: "Placed in DynamoDB by the first pass; it is a service rule whatever the store."
program/service/rules/logs.yaml:
  summary: "Logs are structured JSON from one logger owner, carry a correlation id, never hold secrets or bodies, and are the source of metric filters that match real lines."
service.logs.1:
  slug: structured-logs-with-correlation
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-console and an ast-grep rule failing a log call outside the shared logger. Plant: console.log in a service file fails. Control: a call through the shared logger passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "forbidigo on log.Print and fmt.Print and log.Fatal outside main, and a test that the slog handler adds version and run id. Plant: a fmt.Println in a daemon fails. Control: a slog call passes"
    "3":
      binding: any
      class: test-kit
      tier: "2"
      note: "a snapshot test that captures a real emitted line and compares its top-level keys with the committed field list. Plant: a renamed top-level field with the list unchanged fails. Control: a line whose keys equal the list passes"
service.logs.2:
  slug: secrets-redacted-no-body-logging
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tool: ast-grep
      tier: "2"
      note: "a logger test that plants a canary in every redacted key, reads the real emitted line and asserts redaction, and an ast-grep rule failing a log call that passes a body object. Plant: a log line holding a token value fails. Control: a redacted key passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that no secret value is printed by the slog handler. Plant: a logged secret fails. Control: a redacted value passes"
service.logs.3:
  slug: rejections-logged-at-warn
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a bootstrap test rejecting a request and asserting the log level is warn. Plant: a rejection logged at error fails. Control: a warn line passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.logs.4:
  slug: one-logger-owner
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing a pino( call or a new Logger construction outside the runtime package. Plant: a pino or logger construction in a service fails. Control: the runtime package constructing the logger passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard rule allowing slog handler construction in the one logging package only. Plant: a second handler construction fails. Control: the owner passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.logs.5:
  slug: metric-filter-matches-real-line
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a test extracting each metric filter pattern from the infrastructure code and asserting a log call in source emits a matching line. Plant: a filter whose pattern matches no emitted line fails. Control: a filter matching an emitted line passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
program/service/rules/outbound.yaml:
  summary: "Calls to other services go through generated clients and one shared client constructor that owns signing, timeouts, trace forwarding, failures and retries. Hosts come from configuration, and a consumer of an outside API stays below its limit."
service.outbound.1:
  slug: clients-generated-from-callee-contract
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a gate step that every client package is the output of the generator from a published contract or has a ticketed missing-entry, and that no client file is hand-edited. Plant: a hand-written client module fails; a client whose contract is not published and not listed fails. Control: a generated client passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that each provider has one adapter and a boundary shape has one generated source. Plant: a second hand-written adapter fails. Control: one adapter passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.outbound.2:
  slug: every-call-has-timeout
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "the shared client constructor typed with a required timeout and an ast-grep rule failing a fetch or client construction without one. Plant: a client constructed with no timeout fails. Control: a client with a timeout passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "forbidigo on http.Get and a default client, plus a lint requiring a timeout or context on every client. Plant: a default http client fails. Control: a client with a timeout passes"
service.outbound.3:
  slug: signing-in-one-client-package
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "import restriction on the signing library to the client package. Plant: a service that imports the signing library fails. Control: the client package passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard and forbidigo on signing primitives outside the one owner package. Plant: a signing primitive used outside the owner fails. Control: the owner passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.outbound.4:
  slug: no-callee-host-literal
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing a URL or gateway identifier string literal in source files outside the config module. Plant: a source file with a callee host literal fails. Control: a host read from the config module passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "In Go, one function builds identifiers and URL writing is confined to one owner. Beyond the SSRF rule, which concerns a host that arrives in a request."
service.outbound.5:
  slug: forward-trace-and-caller-token
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a client test calling a stub callee and asserting the trace header and caller token arrive. Plant: a client that drops the trace id fails. Control: a client forwarding both passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.outbound.6:
  slug: client-failures-throw
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "client tests against a stub returning 500, an unknown host and a signing error, asserting a thrown error each time. Plant: a client returning undefined on a 500 fails. Control: a thrown error passes"
service.outbound.7:
  slug: one-retry-policy
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing a loop with a catch and a setTimeout or sleep outside the shared constructor. Plant: a hand-rolled retry loop fails the scan. Control: the shared constructor retry passes"
    "2":
      binding: ts
      class: test-kit
      tier: "2"
      note: "behaviour test running the client against an always-failing handler and asserting attempts under the budget and no retry of a non-idempotent call. Plant: a client without a budget fails; a retried non-idempotent call fails. Control: a budgeted client passes"
  open:
    - "The attempt count and the 10 percent budget are examples, not measured."
    - Which of the four retry layers are active on a path was not checked.
  note: "Extends every-call-has-timeout and clients-generated-from-callee-contract, which say nothing of what the retry policy must be. A Go binding is reserved: the shared client keeps back-off for later."
service.outbound.8:
  slug: outbound-host-from-config
  since: 0.1.0
  level: function
  kind: rule
  strength: Review
  review_question: "Can any part of this outbound address come from a request?"
  open:
    - "Review until a plant exists: a seeded handler that fetches body.url must be flagged."
    - "An agent passes a URL straight through (inference)."
  note: "Beyond no-callee-host-literal: that keeps hosts out of source and says nothing of a host that arrives in a request."
service.outbound.9:
  slug: third-party-concurrency-ceiling
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "infrastructure scan failing a queue consumer marked as calling an outside API when it sets no MaximumConcurrency or the value is not a named constant with the limit beside it. Plant: a marketplace-calling consumer with no concurrency cap fails the scan. Control: a consumer capped below the documented limit passes"
  review_question: "What does a replay of this queue do to the API it calls?"
  open:
    - "With agents: holds (inference)."
  note: "Extends subscription-has-dead-letter-redrive and the concurrency-cap rules in the AWS part, whose guard already reads the queue maximum concurrency but ties it to no limit."
program/service/rules/outbox.yaml:
  summary: "An event leaves a service through one funnel and one outbox, written in the same transaction as the change it announces, shaped as the public contract, and published idempotently with failures read and kept."
service.outbox.1:
  slug: one-funnel-imports-bus-client
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "import-restriction rule allowing the bus client package in the funnel module only. Plant: a handler importing the bus client directly fails. Control: the funnel module importing it passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard rule allowing the bus client package in the one effect wrapper only. Plant: a program package importing the bus client fails. Control: the wrapper passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.outbox.2:
  slug: one-outbox-implementation
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing an insert into the outbox table outside the shared toolkit. Plant: an insert into the outbox table from a service fails. Control: the toolkit write call passes"
    "2":
      binding: go
      class: preset-rule
      tier: "1"
      note: "import rule and duplicate-implementation scan limiting write-ahead intent code to the shared package. Plant: a second implementation of an intent journal fails. Control: the shared package passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.outbox.3:
  slug: outbox-written-in-open-transaction
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: G
      note: "toolkit test that the outbox write function requires a transaction argument, and a scan failing any outbox write outside it. Plant: an outbox write outside a transaction fails. Control: a write inside the toolkit transaction call passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that the intent is written before the effect and the journal is append-only with atomic replace. Plant: an effect run before its record is written fails. Control: intent then effect passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.outbox.4:
  slug: outbox-publish-idempotent-replayable
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "relay test publishing the same row twice and asserting one delivery key, a replay of a range of rows, and the production sweep being created. Plant: a relay that publishes a duplicate on retry fails. Control: a replay of a past range passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.outbox.5:
  slug: failed-outbox-rows-kept
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing a delete on the outbox table, and a toolkit test that a failed row is retained. Plant: a delete of a failed row fails. Control: marking a row failed and keeping it passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.outbox.6:
  slug: outbox-holds-public-contract
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: G
      note: "toolkit test that hands the writer an event failing its schema and asserts the transaction rolled back and no outbox row exists; a second test asserts the outbox payload equals the contract and holds no internal column names. Plant: an invalid event must not persist the business change; an outbox row copied from the table own columns fails. Control: a contract-shaped event passes"
    "2":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "a scan for outbox payloads built from a table row object. Plant: an outbox write whose payload is a table row fails. Control: a payload built from the contract type passes"
  open:
    - "Argued, not measured; no case from the reference estate."
    - "With agents: an agent writes the internal struct straight into the row because it is the shortest path (inference)."
  note: "Extends validate-before-publish (validation at publish time, after the commit) and outbox-written-in-open-transaction."
service.outbox.7:
