program/cli/rules/environment.yaml:
  summary: "A program behaves correctly in each condition the terminal standards name: colour off for NO_COLOR, a pipe, a dumb terminal, CI and the flag; width capped; no query unless rendering; no question when nobody can answer; no animation while nobody watches; plain output with the same facts; colour depth matched. One conformance function runs the rows against each program's real binary."
cli.environment.1:
  slug: no-colour-when-told
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
