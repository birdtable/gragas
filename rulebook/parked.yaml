    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "matrix test running each mutating command with --apply twice on a fixture and comparing the tree hash after the second run with the first; exit is 0 or the documented nothing-to-do outcome. Plant: a command that appends a line on every run fails. Control: an idempotent write passes"
  relates:
    cli.commands.1:
      how: see
cli.commands.3:
  slug: lock-record-undo
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "two-process test plus a go/analysis check that every command with the mutates annotation acquires the store's declared mechanism before its first write helper; run-record and undo assertions; a destructive-annotation matrix test over --yes, a missing --confirm and a wrong name. Plant: a mutating command that skips the lock lets a second writer succeed and fails the test; a destructive command that runs on --apply --yes alone fails. Control: a command taking the lock gives the second writer the busy exit code, and a destructive command run with --confirm and its exact name passes"
  relates:
    cli.commands.24:
      how: see
    cli.environment.8:
      how: see
cli.commands.4:
  slug: writes-stay-in-scope
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
