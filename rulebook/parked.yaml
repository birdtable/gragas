    - The same compare-without-writing rule for non-terminal output is tests.generated.5.
    - "Proposed for lack of a source; the v1 evidence was: C"
cli.look.9:
  slug: typographic-glyphs
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: go
