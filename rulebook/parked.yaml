lang/ts/rules/schema.yaml:
  summary: "One schema library holds the model of the program's data. JSON Schema, types, DDL and API contracts are generated from it and held by regenerate-and-diff, the live database is checked against the model and never the other way, and what the model exports parses back to the same value."
