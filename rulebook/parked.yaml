  level: type
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "a layout test: interfaces whose method sets touch an adapter-only import or a port value type are declared only in the port package (or a slot package listed in rule data); the port package holds no function bodies beyond the absent value; method count per port reported with no limit. Plant: an interface over a process-spawning call declared in a command package fails; a function with logic in the port package fails. Control: the same interface in the port package with its adapter under host/<platform> passes"
    "2":
      tool: golangci-lint
      key: iface
      fix: auto
      note: "v1 class our-plugin. analyzer iface as a report for in-program seams (union across GOOS, wired implementers by SSA MakeInterface, capability roles and the port package excluded, zero-implementer seams listed) plus golangci-lint iface (identical, unused, opaque) and interfacebloat as config rules. Plant: a wrapper interface over a file read in a core package is listed. Control: a port in the port package with one adapter is not listed"
  review_question: "Is this interface a platform or edge port that belongs in the port package, and if it is an in-program seam, where is its second implementation written down?"
  relates:
    arch.ports.5:
      how: see
    arch.ports.1:
      how: see
    arch.ports.15:
      how: see
  open:
    - "The in-program seam half is still a report; only the layout test gates."
  note: "This is the Go form. Related to arch.ports.1, which it shapes, and arch.ports.15, which holds how a port grows."
arch.ports.11:
  slug: wire-by-hand
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: depguard
      fix: never
