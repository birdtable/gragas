    "2":
      binding: ts
      class: preset-config
      tool: eslint
      tier: "1"
      note: "Biome `noEnum` and `noNamespace` at error, or ESLint `no-restricted-syntax` on an enum declaration and `@typescript-eslint/no-namespace`. Plant: an enum declaration fails the lint. Control: a literal union passes"
