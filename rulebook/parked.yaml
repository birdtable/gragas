program/cli/rules/process.yaml:
  summary: "Every external module and program sits behind exactly one adapter package that records every outward effect and names each program and verb it may run in one closed table. An adapter runs a program by absolute path with a fixed argv, validated values, an output cap and a deadline; a child used as a plug-in gets a bare environment and a versioned, size-capped protocol."
cli.process.1:
  slug: outward-effects-through-one-wrapper
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: forbidigo
      fix: never
      note: "forbidigo with type analysis on exec.Command, exec.CommandContext, os.StartProcess and syscall.ForkExec outside the runner and tests (selector bans, held by the golangci preset, whose comment on forbidigo names this rule), gosec G204, and a go/analysis pass resolving the program name of each exec call against the adapter's table. Plant: exec.Command outside the runner fails; a program name read from a config string and passed to the runner fails the resolving pass; a verb not in the table fails the programs test. Control: the runner package called with a name from the adapter's table passes"
  relates:
    cli.process.2:
      how: see
    store.consistency.4:
      how: see
    store.consistency.5:
      how: see
  open:
    - The counts of the former owner-exec import ban are macOS numbers.
    - "One repo has the import test (oneinterface_test.go); depguard was planted in an earlier trial; the inference that both calls run a program without os/exec is from the third review round, not run."
    - "The resolving pass is to build; until it exists the closed table is held by the programs test alone."
  note: "Moved from store.consistency.5, which kept the effect record as the journal of store.consistency.4."
cli.process.2:
  slug: how-an-adapter-runs-a-program
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tool: ast-grep
      tier: "1"
      note: "runner test with a fake program that sleeps past the deadline, one that writes past the cap, and a caller value starting with a dash; an ast-grep rule for a port method taking a []string argv; a non-absolute path refused by the runner. Plant: a runner call by bare name fails; a child that never exits keeps the test past its deadline and fails; a port method Run(args []string) is reported. Control: an absolute path, a fixed argv and a checked name pass"
  relates:
    supply.scans.5:
      how: see
  open:
    - Shell strings and the option terminator are also supply.scans.5.
cli.process.3:
  slug: plug-in-child-protocol
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "plug-in runner test with a fixture plug-in that prints its environment, one that answers an unknown version, one that answers over the cap, and one whose message holds escape sequences. Plant: a plug-in that sees a variable other than PATH and LANG fails; an unknown reply version accepted fails. Control: a plug-in with a bare environment and a known version passes"
  relates:
    cli.errors.4:
      how: see
program/daemon/rules/access.yaml:
  summary: "A daemon that serves a local page or API is reachable only by expected callers: being local is no identity, peer credentials or the gate on every request, one admission check, expected Host names, no change from another origin, identity believed only from the gate's own connection, and no route that leaks what a caller may not see. Servers and clients carry timeouts and body caps, and a served page gets its security headers in one place."
daemon.access.1:
  slug: only-expected-callers
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "table test comparing the route and command tables with a caller list that refuses wildcards; peer-credential test from another user; a test that a command reaches the core only through the admission check; the gate door package exists. Plant: a route or a state-changing command added with no entry fails, and a request from a loopback address with no identity that is admitted fails. Control: every route and command listed and admitted through the one check passes"
  relates:
    service.authz.8:
      how: see
  open:
    - "A test from another user or address is proposed; no plant was recorded in the catalogue."
daemon.access.2:
