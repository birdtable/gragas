      class: preset-rule
      tier: "1"
      note: "a rule failing a server constructor whose reach argument is not a constant. Plant: a reach read from a flag or environment fails. Control: a constant reach passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
program/service/rules/config.yaml:
  summary: "Configuration is read once, in one module, from the environment, and the infrastructure that sets the environment is held to the same schema."
service.config.1:
