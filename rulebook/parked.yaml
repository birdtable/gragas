    - "Planned check: a test over the platform table and the gate's legs that lists each declared platform with no leg, and each test that reads the operating system to skip itself. Plant: a declared platform with no leg fails. Control: every declared platform has its leg passes. No tool key to bind to: it is later work. The rule was adopted, so it is active and read in review until a check binds it; a member's own platform claim is gates.command.30."
