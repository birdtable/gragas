      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion sync lays down configs, scripts and gates per kind and writes the version and the source hash to a lock file; sync --check compares. Plant: a synced file deleted makes sync --check fail. Control: an untouched synced tree passes"
  open:
