lang/ts/rules/packages.yaml:
  summary: "A published package shows a consumer only what was chosen: its exports map has one subpath per unit and no root barrel, and every entry is proved to resolve in the packed tarball, which is the only place a consumer's view can be seen."
ts.packages.1:
