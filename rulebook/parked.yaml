    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a manifest check that names one schema library and refuses a second schema library or a schema-owning query builder. Plant: a manifest with two schema libraries fails. Control: a manifest with one schema library and a typed query builder that takes generated types passes"
    "3":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a round-trip test that exports each model shape and parses it back, failing on any difference or on an empty model list. Plant: a shape whose export drops an optional field fails the round trip. Control: a shape that parses back equal passes"
  open:
    - "The data parts still describe types generated from the live schema; they follow this rule's direction when they are rewritten."
lang/ts/rules/type-safety.yaml:
  summary: "The type system is only as good as its holes. This concern bans the ways out of it (explicit any, assertions, suppression comments), makes outside data enter through a parse, gives each kind of id its own type, and measures the share of values that escape."
ts.type-safety.1:
  slug: no-explicit-any
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
