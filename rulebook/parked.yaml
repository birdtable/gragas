  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. A config check that every `off` setting in a shared lint config has an adjacent comment naming the measured reason. Plant: A rule turned off with no comment fails. Control: A rule turned off with its measured reason passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.exemptions.9:
  slug: parked-item-reentry-trigger
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. A date check over the watch-list file failing when a recheck date has passed. Plant: A watch-list entry whose recheck date is yesterday fails. Control: An entry with a future date passes."
  open:
    - "The Go side holds no recheck date or trigger list for a banned module; only a named owner is held."
    - "Proposed for lack of a source; the v1 evidence was: practice"
base/gates/rules/hooks.yaml:
  summary: "Hooks are the standing gate on a developer or agent machine: the pre-push hook runs the whole gate. They are installed from one committed file, armed so that a repo cannot be left unarmed without a check noticing, held to a measured time budget, and cannot be bypassed by a flag. A check too slow for the budget moves to the release workflow, never to push CI."
gates.hooks.1:
  slug: pre-push-runs-the-gate
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "2"
      note: "The committed hook file runs the one gate command on the pushed range; the hook exits non-zero on an unresolvable range and reports its wall time to the budget check of gates.hooks.4. Plant: A hook file that runs only lint, not the gate command, fails the hook-shape check; a push whose range cannot be resolved fails. Control: A hook that runs the gate command passes."
  relates:
    gates.hooks.4:
      how: see
  note: "Merges the push-hook rule, the push-time root-file check and the push half of the hook-shape row (pre-commit check-only, push gates the pushed range, a bad range fails closed)."
gates.hooks.2:
  slug: hooks-armed
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. An `armed` check (exists as a make target in five repos): hooks path set, hook mode executable in the index, hook text names the gate; installation refuses outside a git repo and with a hooks path override. Plant: A hook without the executable bit fails; installation with a hooks-path override fails. Control: A repo armed by the first gate run passes."
  note: "Merges the Go armed-check, the fail-closed install rule and the hook-installed part of the shared standing-gates row."
gates.hooks.3:
  slug: pre-commit-check-only
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "The shared hook file's commit job runs the supply-chain config check in parallel in check-only mode; a test asserts that no commit job is allowed to modify the tree. Plant: A commit job that rewrites a staged file fails the check-only test. Control: The shipped commit job passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: own measure"
gates.hooks.4:
  slug: hooks-stay-light
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. Hook wall time measured by the pre-push wrapper against the budget in the gate config; a workflow-trigger check that no workflow holding a gate member runs on push or pull request (supply.workflows.1). Plant: A hook slowed past the budget for the recorded runs fails; a member moved to a push-triggered workflow fails. Control: A hook inside the budget passes; a slow member in the tag-triggered release workflow passes."
  relates:
    gates.hooks.3:
      how: see
gates.hooks.5:
  slug: bypass-flags-refused
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: hook
      tier: "0"
      note: "Deny list in the committed agent settings for `git commit` and `git push` with `--no-verify`, `-n` and the hook-disable variable, backed by the land recompute. Plant: An attempt to run `git commit --no-verify` in a test session is refused. Control: A normal commit passes."
  relates:
    gates.exemptions.5:
      how: see
  open:
    - "The deny half is held; the count of bypass attempts from the log is a report that stops nothing."
    - "A scan of the reflog and run log for the flag is proposed, not built."
    - "v1 evidence, not yet a source: C (seen in the platform lane)"
  note: "Split out of the hook-weight rule, the no-escape-hatch rule and the standing hook row."
gates.hooks.6:
  slug: hook-extends-shared-template
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Shared gate command's structural check reads the hook file and requires every shared job to be present. Plant: A hook file with a shared job removed fails. Control: A hook file that extends the template passes."
    "2":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The same check reads the repo hook list and requires the shared jobs to be included. Plant: A repo hook list missing a shared job fails. Control: A hook list that includes them passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: own measure"
gates.hooks.7:
  slug: secrets-scanned
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tool: gitleaks
      tier: "1"
      note: "A secret scan (gitleaks) run at commit by the shared hook file. Plant: A staged file containing a secret-shaped token fails the commit scan. Control: A staged file without one passes."
  open:
    - "Held in two reference repos and lifted into the shared set; the full secret-scanning rule set belongs to the supply part."
    - belongs in supply
gates.hooks.8:
  slug: lighter-builder-hook
  since: 0.1.0
  level: program
  kind: rule
  strength: Answered
  relates:
    gates.hooks.1:
      how: refines
    gates.hooks.4:
      how: refines
    tests.selection.16:
      how: see
  open:
    - "Proposed on purpose: the owner decides after the measured push time. It conflicts with gates.hooks.1 and .4 as they stand, so it cannot become active without changing them."
gates.hooks.9:
  slug: the-hook-runs-the-tier-and-nothing-else
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Is this hook one call of the runner, does any logic sit in the hook file, and does a tag push from a hosted workflow run it again?"
  relates:
    gates.hooks.1:
      how: see
    gates.hooks.4:
      how: see
    gates.hooks.5:
      how: see
    agents.guards.2:
      how: see
  open:
    - "Planned check: the hook file is held to the template's shape (one call of the runner) and the hosted release workflow sets the variable that tells the hook it is a workflow. No tool key is bound yet."
base/gates/rules/land.yaml:
  summary: "Main moves only by a reviewed merge of a tree the full local gate passed, bound to that tree by a local stamp, or, where a repo runs the lander, by a commit the land check accepts. There a verdict is bound to the tree it judged, recomputed by the lander and never taken from the author, and a plan carries its own hash."
gates.land.1:
  slug: main-moves-only-on-accepted-commit
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Branch protection refuses a direct push to main; the lander runs the checks on origin/main plus the squash and squash-merges only on green. Plant: A change whose merged tree has a red member is not merged; a direct push to main is refused. Control: A change whose merged tree passes is squash-merged."
  relates:
    gates.hooks.1:
      how: see
    gates.land.12:
      how: see
  open:
    - "No tool key is bound yet to the check above: the lander that runs the checks on origin/main plus the squash is the lander's card and the no-lander path has no check that main moved to the exact tree that ran; until a key resolves, the rule is read in review. Plant for the future key: a fast-forward to a commit other than the one the hook passed is refused."
gates.land.2:
  slug: verdict-bound-to-tree
  since: 0.1.0
  level: release
  kind: rule
  note: "Merges the verdict-bound-to-tree rules of the Go and web sides, the amend rule and the rule that a hand-in is read from the ref. The recompute half is gates.land.3."
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Land step reads the verdict record keyed by tree id from the stored record and refuses a verdict whose tree differs from the tree being merged, and ignores any session stamp. Plant: Land ignores a stamp with no stored record; a verdict for a different tree is refused. Control: A verdict for exactly the merged tree passes."
  relates:
    gates.land.3:
      how: see
  open:
    - "The lander setting that makes the refusal required is unset; the refusal waits on a fix in the delivery tool."
gates.land.3:
  slug: lander-recomputes-verdict
  since: 0.1.0
  level: release
  kind: rule
  note: "Retired. No verdict record exists to recompute: the lander runs the checks itself on the merged tree (gates.land.1), and no stored verdict or hash record is accepted."
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The land check recomputes the hash over tree, base and rule set from the record and compares; a mismatch is red. Plant: A hand-typed summary with a plausible hash is refused; a summary computed on an older base is refused. Control: A verdict the gate wrote itself on the current base passes."
  relates:
    gates.land.1:
      how: see
  open:
    - "Recompute is new; the tree-keyed verdict it extends exists in one repo only."
gates.land.4:
  slug: plan-hash
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The plan carries a sha256 over changes, rules and result; the lander recomputes it and refuses a mismatch. Plant: A hand-edited plan with a stale hash is refused. Control: An unedited plan passes."
  relates:
    gates.land.1:
      how: see
  open:
    - "Hash is trialled in an affected-set script; recompute and refusal are to build."
    - "The Go side has no plan hash yet, only a skipped-package list."
gates.land.5:
  slug: wrong-base-refused
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The land check compares the plan's base and head with the main tip, merge-base and gated commit. Plant: A plan whose base is one commit behind main is refused with the rerun message. Control: A plan on the current tip passes."
  open:
    - "On the Go and web sides the verdict is bound to the tree so a stale base fails, but no row refuses by base and names the rerun."
    - "Proposed for lack of a source; the v1 evidence was: A"
gates.land.6:
  slug: land-conditions-modular
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "3"
      note: "A test that the runner discovers every condition file and that no condition file is imported by name from the runner. Plant: A condition that is added by editing the runner fails the discovery test. Control: A condition added as a file with its spec passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: C"
gates.land.7:
  slug: land-tier-reach
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The land plan selects tests from the change's reach and requires the always-full list; the release job runs the full suite at least every third release. Plant: A land plan that omits an always-full check fails. Control: A plan with the always-full list and selected tests passes."
  relates:
    gates.command.6:
      how: see
gates.land.8:
  slug: full-red-lock
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. The release recipe runs the release tier in a fresh checkout of the commit to be tagged and refuses the tag on red. Plant: A release whose tier has a red member is refused. Control: A release whose tier is green tags."
  open:
    - "The lander machine is named in the source; the rule holds for any lander."
    - "No tool key is bound yet to the check above: the release recipe's run of the release tier in a fresh checkout is the work of the gate rules' Taskfile check and the release script; until a key resolves, the rule is read in review. Plant for the future key: a release whose tier has a red member is refused."
gates.land.9:
  slug: proof-debt-bound
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The land check counts lands (or releases) since the last full-green and refuses past the bound. Plant: A land that is the fourth since the last full green is refused. Control: The third passes."
  open:
    - "The bound is 3 lands in the source and 2 tags in our decisions; the number is a guess and is data."
    - "Proposed for lack of a source; the v1 evidence was: A"
gates.land.10:
  slug: artefact-records-its-tree
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The check reads the artefact's build stamp and compares its commit and dirty flag with the tree. Plant: An artefact built from an older tree is refused. Control: An artefact built from the current tree passes."
  open:
    - "No Go row ties the binary under test to the tree, and no web row records the source tree on the built page; both are gaps."
    - "Proposed for lack of a source; the v1 evidence was: A"
gates.land.11:
  slug: cache-trust
  since: 0.1.0
  level: release
  kind: rule
  note: "Retired. The target keeps no stamp, no cache key and no cached result: each repo's tiers run every time from its own Taskfile, so nothing is trusted that a run did not just produce."
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The land check recomputes the cache key and compares it with the key recorded in the summary; failures are never written. Plant: A cache hit written by an untrusted runner or under a different lockfile is refused. Control: A trusted hit under the recomputed key passes."
gates.land.12:
  slug: train-gated-on-merged-tree
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The train builder type-checks and runs the merged tree of all changes once before any lands. Plant: Two branches that each pass, one adding a required port method and one adding an implementer without it, must fail on the merged tree. Control: Two compatible branches pass on the merged tree."
  relates:
    gates.land.1:
      how: see
  open:
    - "Lives in the delivery tool's land step, under a hold."
gates.land.13:
  slug: verdict-survives-clean-rebase
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Verdict keyed to the git patch id; the land step accepts a verdict whose patch id equals the change's. Plant: A clean rebase of a change whose verdict is stored is accepted without a rerun; a rebase that alters the patch is rerun. Control: A change with no stored verdict is gated."
  open:
    - "Proposed for lack of a source; the v1 evidence was: A"
gates.land.14:
  slug: heavy-run-refused-if-verdict-exists
  since: 0.1.0
  level: process
  kind: rule
  note: "Retired. The target keeps no stamp, no cache key and no cached result: each repo's tiers run every time from its own Taskfile, so nothing is trusted that a run did not just produce. A heavy run is no longer refused on the strength of a verdict that exists."
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. A heavy wrapper that checks the verdict store for the tree before running. Plant: A second full gate on a tree that has a verdict is refused. Control: A first full gate runs."
  open:
    - "v1 evidence, not yet a source: A (98 of 201 heavy runs at a reference team)"
gates.land.15:
  slug: the-stamp-is-a-claim
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  note: "Retired. The target keeps no stamp, no cache key and no cached result: each repo's tiers run every time from its own Taskfile, so nothing is trusted that a run did not just produce. No stamp is a claim of any kind."
  review_question: "What is in this stamp's key, who reads the stamp, and does any member read a source the key does not pin by digest?"
  relates:
    gates.land.11:
      how: see
    gates.land.2:
      how: see
    tests.selection.7:
      how: see
    gates.land.16:
      how: see
  open:
    - "Planned check: the stamp's key fields are listed in the runner's report, and a test writes a stamp on a changed tree and sees the runner refuse it. Plant: a stamp keyed to the commit alone is refused. Control: a stamp keyed to the tree is served. No tool key is bound yet."
    - "gates.land.1 says the hook and the release read the local stamp. Under this rule they read it to skip a rerun of the same key and for nothing else; the release's own proof is the tier on a fresh clone of the tag."
gates.land.16:
  slug: one-proof-per-train
  since: 0.1.0
  level: process
  kind: instruction
  strength: Lens
  review_question: "What tree is this proof keyed to, how many pushes does this landing make, and what is the next train built on?"
  relates:
    gates.land.12:
      how: see
    gates.land.13:
      how: see
    gates.land.15:
      how: see
  open:
    - "Planned check: the landing record names the candidate tree id and the proof's key, and a landing that ran a proof for a tree id the record already holds green is a finding. The first half is built: the landing script prints the candidate's tree id and head commit before the judge runs, and cmd/gragas-dev/land_test.go holds the line on a passing and a red run. The finding is not. What holds now: the printed tree id and head commit, by that test. What does not: one proof per tree, one push per landing and the next train's base have no check. No tool key is bound: the gragas tool has no preset, so no key of it resolves, and an unresolved checks row raises checks-unresolved, a baseline that may only fall. The rule stays as it is until a key holds it."
gates.land.17:
  slug: the-base-judges-the-head
  since: 0.1.0
  level: process
  kind: instruction
  strength: Lens
  review_question: "Is this landing judge built from the base, does this change alter a file the judge reads, and if so is it the expand step or the contract step?"
  relates:
    gates.protection.1:
      how: see
    gates.protection.3:
      how: see
    gates.land.3:
      how: see
  open:
    - "Planned check: the landing script builds the judge from the base revision and refuses a head that changes a judge file's format in one step (the base's judge fails to read it). No tool key is bound yet."
gates.land.18:
  slug: a-red-names-the-last-green-main
  since: 0.1.0
  level: process
  kind: instruction
  strength: Lens
  review_question: "Who waits on this hand-off, did they get a notice, and does this red message name the last green main?"
  relates:
    gates.measures.5:
      how: see
    agents.delivery.1:
      how: see
  open:
    - "The landing script's red message carries the main commit id the run judged against, held by cmd/gragas-dev/land_test.go. Plant: a head with no verdict for a protected path ends red, naming the base's main commit. Control: a head with its verdict prints no red line. What holds now: the red message's main commit, by that test. What does not: the notice to the agent that waits and the logged wait have no check. No tool key is bound: the gragas tool has no preset, so no key of it resolves, and an unresolved checks row raises checks-unresolved, a baseline that may only fall. The rule stays as it is until a key holds it."
base/gates/rules/measures.yaml:
  summary: "Numbers that the gates and the rulebook report. A number is produced by a script from the baseline or gate data and never typed by hand, a metric that cannot be measured prints null with its reason, and a measure with no honest limit opens a recorded decision instead of failing the build."
gates.measures.1:
  slug: numbers-by-script
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. A number check: render every page from baseline and gate data and diff the committed pages. Plant: Change one figure by hand; the diff fails. Control: A render that matches passes."
  open:
    - "Needs the page generators, which are unfinished."
  note: Merges the number rules from both sides and the census kind.
gates.measures.2:
  slug: null-not-zero
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The baseline format prints null with reason; a schema test rejects a numeric 0 for an unmeasurable metric. Plant: A failed measurement printing 0 fails. Control: null with a reason passes."
  open:
    - "The baseline does this for two repos (V-61, V-62); the plant is in the baseline traps."
gates.measures.3:
  slug: decision-point-alarm
  since: 0.1.0
  level: process
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class our-cli. Thresholds as data and a queue writer; a level set below today's value writes one item and leaves the build green. Plant: A level set below today's value writes one item and leaves the build green. Control: A level above today's value writes nothing."
  review_question: "Which measure crossed its threshold, and where is the recorded decision?"
  open:
    - "Enforcement review: by its own text it stops nothing, so the writer could be tested; the land block is the Answered form."
gates.measures.4:
  slug: switch-needs-a-test
  since: 0.1.0
  level: file
  kind: measure
  strength: Review
  review_question: "Which boolean switch has no test of its non-default value and no ticketed exemption?"
  open:
    - "Report first, a list; a switch with no test is listed (plant planned). Best practice half of the parameters-file row."
    - "Proposed for lack of a source; the v1 evidence was: D"
gates.measures.5:
  slug: review-rounds-and-refused-pushes-are-counted
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Where is this count kept, and who writes it?"
  relates:
    gates.measures.1:
      how: see
    agents.review.6:
      how: see
  open:
    - "Planned check: a run's time record gains a refused-push field, and the reviewer's verdict record takes a round number. Neither exists; the work is a follow-up ticket."
gates.measures.6:
  slug: a-green-carries-its-counts
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "How many did each member run in this green, how does that compare with the count on the merge base, and has this new instrument been seen red?"
  relates:
    gates.plants.8:
      how: see
    gates.plants.1:
      how: see
    tests.selection.8:
      how: see
  open:
    - "Planned check: a member's count is made on the merge base and on the head and compared in the same run. Plant: a member whose count fell fails landing, and a package with no tests is red. Control: equal or higher counts pass. No tool key is bound yet."
gates.measures.7:
  slug: wall-time-excludes-queue-time
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Does this report's wall time start at the first member, and are the queue wait and the slot hold on their own lines with the load?"
  relates:
    tests.measures.1:
      how: see
    tests.measures.2:
      how: see
    gates.command.29:
      how: see
  open:
    - "Planned check: the runner's report has the three lines and the budget line names which one it judged. No tool key is bound yet; the shared runner is later work."
base/gates/rules/own-rules.yaml:
  summary: "Bans, structural patterns and generated-file checks written for a repo's own code. Bans name the replacement and the owner, project domain rules are checks with plants, and a derived file is generated and checked for drift."
gates.own-rules.1:
  slug: bans-name-the-owner
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint `no-restricted-imports` and `no-restricted-syntax` lists in the shared preset, each entry with a message naming the owner and the fix. Plant: A banned import fails with a message naming the owning package. Control: The owner's own import passes."
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard and forbidigo ban lists with messages naming the owner. Plant: A banned call outside the owner fails with the message. Control: The owner's call passes."
  open:
    - "Proposed for lack of a source; the v1 evidence was: own measure"
gates.own-rules.2:
  slug: domain-rules-are-checks
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-rule
      tier: "1"
      note: "Custom lint rules and structural patterns in the shared preset or the repo's own rule folder, registered in the rule table with a plant. Plant: Each rule's planted violation fails. Control: Each rule's clean control passes."
  relates:
    gates.plants.14:
      how: see
  open:
    - "The source row bundled five unrelated small rules; the examples here are their generic shapes."
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "At the cross-part move the project-specific example, a banned toast import in the builder paths, was merged into the private overlay's builder rule. The banned call in one feature area names no area in the source, so it stays here as a generic example."
gates.own-rules.3:
