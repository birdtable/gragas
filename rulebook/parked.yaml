base/tests/rules/isolation.yaml:
  summary: "A test gives the same answer on any machine at any load and in any order. It inherits nothing from the run that started it, waits on events and not on time, binds no fixed port, touches the machine only in named places and never changes shared machine state. A verdict says which machine it ran on."
