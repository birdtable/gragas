      tier: "3"
      note: "journey list JSON Schema (ajv) requiring risk, owner and a cap on count; identical risk text reported; cross-program journeys list their programs. Plant: a journey with no risk or no owner fails. Control: a journey with both passes"
    "2":
      binding: go
