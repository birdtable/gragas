base/supply/rules/health.yaml:
  summary: "What is kept after intake. A dependency stays maintained or is removed, and nothing is in production that is a prerelease or a 0.x major unless it entered through a labelled pilot."
supply.health.1:
  slug: dependency-is-maintained
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "4"
      note: "host API archived and pushed_at per direct module; an OpenSSF Scorecard maintained check is a candidate. Plant: an archived module fails. Control: an active module passes"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. companion lock-age extended with the newest release date per direct dependency; older than 12 months fails unless an exception record carries a finished note. Plant: a scratch dependency whose last release is older than 12 months fails. Control: a recent one passes"
  open:
    - The Go script is proposed and was not planted.
    - "Proposed for lack of a source; the v1 evidence was: D: practice; one archived Go module in the baseline"
supply.health.2:
  slug: prerelease-only-through-a-pilot
