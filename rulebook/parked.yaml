base/code/rules/size.yaml:
  summary: "File and function size, complexity and parameter counts, and the reports that watch them. Complexity and parameters only fall; length is a measure read beside a count of tiny single-use helpers, so splitting alone is never progress; only the extreme tail of file length is gated. A merge-candidate report supplies the opposite pull."
code.size.1:
  slug: file-length
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. baseline metric FILES_OVER_LINE_CAP printed as a report (line count over tracked, non-generated .go files), with the shrink-only ratchet on the 1000-line tail (one baseline file per entry); a file past the tail that is not in the baseline fails. Plant: a file grown past 1000 lines fails the ratchet. Control: a file between 300 and 1000 lines prints and passes"
    "2":
      binding: ts
      class: fact
      tool: eslint
      tier: "2"
      note: "v1 class our-cli. companion size: lines per file by type read from the repo, a report of files over 300, 400 and 800, and a failure only on a rising count of files over 1000 against a committed count file (shrink-only), excluding the generated-file list; ESLint max-lines can count per file but not the shrink-only total. Plant: a fixture file of 1001 lines raises the count and fails; a fixture of 301 lines prints and passes; a generated file on the exclusion list does not count. Control: a fixture of 301 lines prints and passes"
  relates:
    code.size.6:
      how: see
  open:
    - "The three report lines and the 1000-line tail are guesses. No fault traces to file size, and no instrument covers a file split too far."
    - "Conflict with the donor's rule, which fails a file over 300 lines; the ruling here is report at 300 and gate the tail. The ratchet exists in one repo's file baseline."
    - "The Ousterhout book is silent on files. The ratchet exists in one repo's file-baseline."
    - "v1 evidence, not yet a source: own measure (no harm shown); C (10 of 95 and 13 of 328 web files over 300)"
code.size.2:
  slug: function-length-beside-helpers
  since: 0.1.0
  level: function
  kind: measure
  strength: Answered
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. a report of funlen (lines, not statements; the donor's lint rules were max-lines, max-lines-per-function, max-params and cognitive complexity) and the fixed helper count (go/types referrer count: functions of 20 lines or fewer with exactly one referrer by call or value), read per change as the partner of code.size.3. Plant: a 56-line function chopped into 13 helpers adds 13 helpers in all three forms; a 159-line flat table adds none. Control: a flat table adds no helper"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. companion shape: a TypeScript-compiler walk over .ts, .tsx and .astro frontmatter and scripts counting functions over 50 lines and the fixed helper count as a pair per change; a falling length count with a rising helper count prints as no progress and the change fails the ratchet. Plant: a chopped 160-line function (13 one-use helpers) reads as no progress; a flat 159-line table prints and does not fail. Control: a flat 159-line table prints and does not fail"
  review_question: "Can the new function be understood without opening its caller?"
  open:
    - The 100-line exit as a failing condition was dropped because a flat table fires like a nest. The 20-line cut is a guess.
    - "The web form uses an approximate score (a trial script), not sonarjs, which is LGPL-3.0 (the standards owner should read the licence before a shared preset ships it). Exporting a helper beats a private-only count, so the fixed count is the one to build."
    - "Conflict with the donor's rule, which fails a function over 50 lines; the sources here demote it to a measure, with a pairing that fails the cheap cure."
    - "v1 evidence, not yet a source: own measure; the research recommends measure for length and a pair for the helper count"
code.size.3:
  slug: complexity-only-falls
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: gocognit
      fix: never
      note: "golangci-lint gocognit (v1.2.1; 1.3.0 ships with golangci-lint 2.15.0) min-complexity 20 with tests off; a companion ratchet counts findings per run and fails on a rise against a committed per-function baseline. Plant: a 160-line nest scores 143 and fires; a 159-line flat table scores 0; extracting 13 helpers lowers the count but the baseline is not lowered. Control: a flat 159-line table scores 0 and passes"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "2"
      note: "eslint-plugin-sonarjs 4.2.2 cognitive-complexity at 20, ESLint core complexity, all errors, with ESLint bulk suppressions (--suppress-all, eslint-suppressions.json) as the shrink-only baseline for existing debt. Plant: a nested function over cognitive 20 fails. Control: a flat function under the limit passes"
  relates:
    code.size.2:
      how: see
  open:
    - "The rule bounds growth; the helper pair denies credit and does not fail the cheap cure. The tool's version changes between 2.14.0 and 2.15.0, so rerun the plant when pinning."
    - "One repo's config holds 30, so the line of 20 needs a config change; in the web stack the trial recorded counts only and no plant."
    - "Conflict with the donor's line of 15 per function."
    - "v1 evidence, not yet a source: own measure (nine commits extract helpers to get under a limit)"
