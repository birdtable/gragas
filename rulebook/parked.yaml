      tool: eslint
      tier: "0"
      note: "eslint-plugin-check-file 3.3.2 folder-naming-convention with a regex deny-list of layer nouns and catch-alls (util, common, helpers, misc, other, types, models) and ls-lint 2.3.2 for names of non-code files. Plant: a folder named helpers and a file named stuffandthings.ts must each fail. Control: a table-conforming name passes"
  review_question: "Does the phrase describing this package need the word \"and\"?"
  open:
    - "user-defined-bad-names was not run in the trial; the 'needs the word and' half is review."
    - "v1 evidence, not yet a source: practice; C for the web form (a name lint is cheap and gameable, so the question stays beside it)"
arch.structure.8:
