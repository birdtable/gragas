base/docs/rules/freshness.yaml:
  summary: "The docs folder holds documents that are true now and records marked as records. Each doc carries its type, status and version or date in one form the repo declares, a document that is not generated shows the date it was written, a current fact appears only where a check holds it, a decision is never edited in place, and a generated doc names the command that makes it."
