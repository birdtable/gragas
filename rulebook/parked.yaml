  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tool: golangci-lint
      tier: "1"
      note: "go/parser test over basic literals plus forbidigo on the style constructors The AST test inspects *ast.BasicLit strings for the spellings \\x1b, \\033 and \\u001b and for hex colour literals outside the shared terminal module and the generated file (app/ fails, ui/ passes); forbidigo bans the constructors Padding(, Margin( and Width( outside the module. Plant: the escape strings \"\\x1b[31m\" and \"\\033[1m\" in the app folder fail. Control: the same inside the module passes"
  open:
    - "gocritic ruleguard did not load rules in three attempts, so the AST test is used instead."
    - "Proposed for lack of a source; the v1 evidence was: C"
cli.look.5:
  slug: closing-words-closed-set
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: go
