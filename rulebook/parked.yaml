    "2":
      binding: go
      class: test-kit
      tier: "3"
      note: "shared test that sends a request with Host: evil.example to the page handler and expects refusal, lifted from the program that has it. Plant: a handler without a Host check returns 200 and fails. Control: a handler that refuses unexpected hosts passes"
  open:
    - A browser rebinding run was not done.
daemon.access.3:
  slug: same-origin-change-only
