      tier: "2"
      note: "a repository test (a shared imports helper) listing packages that import the database package, the driver or write state paths, against a shrink-only allow list; depguard as the shared form. Plant: a handler importing the database package fails. Control: the store package importing it passes"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-imports on storage client packages outside the store layer. Plant: a handler importing a storage client fails. Control: the store layer importing it passes"
  relates:
    dynamodb.writes.1:
      how: see
  open:
    - "v1 evidence, not yet a source: own measure (read; no failure seen)"
  note: "The engine-specific versions are dynamodb.writes.1 and the Postgres client import rule; this is the general rule they bind."
store.seams.2:
  slug: port-agnostic-at-intent
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: analyzer
      tier: "1"
      note: "v1 class our-plugin. a go/analysis analyser in the companion module over interfaces listed as store ports in rule data (generic method names, string parameters named like sql, untyped maps and any, the database package's types, Begin/Tx/Commit/Rollback method names) and over core packages' exported signatures. Plant: a port with Exec(sql string, args ...any), BeginTx, or a method returning sql.Rows fires; a core function taking map[string]any fires while the same in an adapter passes. Control: ReserveName(name, owner) passes"
    "2":
      binding: ts
      class: preset-rule
      tier: "2"
      note: "a type check over the port files banning generic verbs, a SQL string parameter, an untyped record on a port surface, and a method that takes a transaction handle. Plant: a port with exec(sql, ...args) fails. Control: reserveName(name, owner) passes"
  review_question: "Would a second engine have to invent a meaning for any method here, and which one? Name one capability of this engine the port forbids the core to use."
  open:
    - "This rests on an operator ruling, not on a finding; the evidence is that seams earn their keep through testability."
    - "The scan's known way round is renaming exec to apply and passing the SQL in a struct, so the review question stays."
    - Four of the review questions stay review.
    - "v1 evidence, not yet a source: operator; the plants were run in a trial and a scope fix recorded"
  note: "Held by the analyser (Go), a type check (web) and the review question for what no scan sees."
store.seams.3:
  slug: store-opened-in-one-place
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "2"
      note: "forbidigo on sql.Open outside the store package, a pragma read-back test, an ast-grep rule on string literals matching foreign keys off, and a full-sync read-back test. Plant: a DSN with foreign keys off outside the runner fails; an unrebuildable store opened without full sync fails the read-back. Control: foreign keys on and the runner pass; a rebuildable store passes"
  relates:
    store.seams.2:
      how: see
    store.seams.6:
      how: see
  open:
    - "A DSN built from pieces defeats the literal match; the read-back test is the backstop."
    - "Two consumers with different needs, so the open-store code is not to be extracted into a shared module."
    - "This is written for an embedded file store; the relational-server counterpart is the Postgres connection rule."
store.seams.4:
