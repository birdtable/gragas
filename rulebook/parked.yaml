program/web/rules/cycle.yaml:
  summary: "What a web front end with stories, design tokens or browser end-to-end tests adds to the moments of the development cycle: story renders with the accessibility engine at push for a design system and at land for an application, the story build as a member, counted plays, one contrast check over every token pair, a small browser smoke set at push and the sharded full suite at release, with waits on conditions and a teardown that unroutes. These lines add members to the core moments and never a moment of their own."
web.cycle.1:
  slug: every-story-renders-with-the-accessibility-engine
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "At which moment do this project's stories render with the accessibility engine, is the engine at error, and does every skipped story carry an owner and an expiry?"
  relates:
    web.accessibility.1:
      how: see
    web.testing.11:
      how: see
    gates.exemptions.4:
      how: see
  open:
    - "Planned check: the members file has the story member at push for a library and at land for an application, and the runner config sets the engine to error. No tool key is bound yet."
web.cycle.2:
  slug: the-story-build-is-a-member
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Is the story build a member of this push tier with its cost listed?"
  relates:
    gates.command.23:
      how: see
    gates.command.28:
      how: see
  open:
    - "Planned check: the members file holds the story build member. No tool key is bound yet."
web.cycle.3:
  slug: plays-are-counted-and-share-the-page
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "How many plays did this land run count, how does that compare with the base, and is each story opened once per width?"
  relates:
    gates.measures.6:
      how: see
    web.testing.11:
      how: see
  open:
    - "Planned check: the story member's report carries a play count compared with the base's. No tool key is bound yet."
web.cycle.4:
  slug: one-contrast-check-over-every-pair
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Does this project's contrast check cover every pair its roles allow, in both themes, in one member?"
  relates:
    web.tokens.8:
      how: see
    web.tokens.9:
      how: see
  open:
    - "Planned check: the contrast member's report carries the pair count and the theme count. No tool key is bound yet."
web.cycle.5:
  slug: a-small-browser-smoke-set-at-push
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Which journeys are in this project's push smoke set, does the member declare net and os, and is its skip red at land?"
  relates:
    gates.command.30:
      how: see
    tests.journeys.4:
      how: see
    web.delivery.2:
      how: see
  open:
    - "Planned check: the members file holds the smoke member with net and os and a journey count under a stated cap. No tool key is bound yet."
web.cycle.6:
  slug: the-full-browser-suite-at-release-sharded-by-duration
  since: 0.1.0
  level: release
  kind: instruction
  strength: Lens
  review_question: "How are this project's release shards balanced, where is each journey's duration recorded, and is any red journey carried without a listed entry?"
  relates:
    gates.command.27:
      how: see
    gates.exemptions.4:
      how: see
    tests.flakes.6:
      how: see
  open:
    - "Planned check: the release member's report carries each shard's wall time and the spread between the slowest and the fastest. No tool key is bound yet."
web.cycle.7:
  slug: browser-waits-are-conditions-on-a-fake-clock
  since: 0.1.0
  level: file
  kind: instruction
  strength: Lens
  review_question: "Does this journey sleep anywhere, is each fixed budget scaled by the printed factor, and do the page's timers run on the fake clock?"
  relates:
    tests.runners.8:
      how: see
    tests.isolation.6:
      how: see
    tests.measures.11:
      how: see
  open:
    - "Planned check: a scan of journey files for a timeout wait with no stated reason, and the load factor on the report's first lines. No tool key is bound yet."
web.cycle.8:
  slug: teardown-unroutes-and-actions-re-resolve
  since: 0.1.0
  level: file
  kind: instruction
  strength: Lens
  review_question: "Does this project's teardown fixture unroute every handler and wait for those in flight, and does any journey hold an element across a re-render?"
  relates:
    tests.journeys.6:
      how: see
    tests.isolation.1:
      how: see
  open:
    - "Planned check: the shared fixture file holds the unroute call and a scan finds no element handle held across an await. No tool key is bound yet."
program/web/rules/delivery.yaml:
  summary: "What goes with a UI change to review, what runs at land, and how a built page is embedded, configured and watched once deployed."
web.delivery.1:
  slug: change-carries-pictures
  since: 0.1.0
  level: process
  kind: rule
  strength: Record
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class record. a land check on the change description and its generated screenshot matrix. Plant: a UI change with no pictures is refused at land. Control: a change with the matrix attached passes"
  review_question: "Does this change show the screen at phone, tablet and desktop, light and dark, and does the done claim name the question it answers?"
  open:
    - "The gated version lives in the picture-matrix rows of the testing concern; this rule asks the change to show it."
    - "Held as Record: the source verdict is a best practice, so it binds when promoted."
    - "Proposed for lack of a source; the v1 evidence was: D"
web.delivery.2:
  slug: browser-checks-at-land
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the land command reads the plan and requires a browser step for a change touching a page source. Plant: a change touching a page source with the browser step removed from the plan fails. Control: a plan with the browser step passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: A: no fault in one site's record was found by its normal check"
web.delivery.3:
  slug: agent-looks-at-its-page
  since: 0.1.0
  level: process
  kind: rule
  strength: Session
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. the session reader of the agent's own session record checks that a screenshot was opened before review was requested. Plant: a session that asks for review with no screenshot opened is flagged. Control: a session that opened a screenshot first passes"
  review_question: "Did the agent open a screenshot of the page before asking for review?"
  open:
    - "Looking cannot be measured; the artefact-presence rule holds the files. A stop hook demanding a screenshot is Claude-only and proves no looking."
    - The check is not built.
    - "Proposed for lack of a source; the v1 evidence was: A: 21 of 72 found by the builder"
web.delivery.4:
  slug: design-rubric
  since: 0.1.0
  level: file
  kind: rule
  strength: Lens
  review_question: "Which single thing on this screen is the primary action, and what was de-emphasised to make it so?"
  open:
    - "The rubric's content is provisional (read in outline)."
    - "The reference's rubric is the platform guidelines' rubric; a canvas screen is exempt and has its own rubric. No rubric gate exists as a catalogue row."
    - Lens verdicts bind once promoted.
    - "v1 evidence, not yet a source: A: two sites"
  note: "v1 review check (review is not a v2 check class): the rubric lens, an agent reading every surface against the written rubric, with its verdict stored like the other lens verdicts"
web.delivery.5:
  slug: new-surface-signed-off
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. a route-list diff against the sign-off file in the land check. Plant: a new route page with no sign-off entry is refused. Control: a route with an entry passes"
  review_question: "Did the operator see this surface, or is it in the sampled set?"
  open:
    - "Half holds: presence of sign-off; taste is judged."
    - "v1 evidence, not yet a source: A: two sites"
  note: "Split from the design-rubric criterion, which bundled the rubric lens and the operator's signature."
web.delivery.6:
  slug: per-person-state-local
  since: 0.1.0
  level: program
  kind: rule
  strength: Lens
  review_question: "Is any per-person state here stored where the next person on the same device would see it?"
  open:
    - "A lint on storage keys would catch only the common pattern; a model lens reads the rest. Lens verdicts bind once promoted."
    - "Proposed for lack of a source; the v1 evidence was: A: three cases"
  note: "v1 review check (review is not a v2 check class): a lint on storage keys for the common pattern and a model lens question for the rest"
web.delivery.7:
  slug: build-output-static
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a test after the build asserts no server entry, and the Go embed directive fails on an empty directory. Plant: a build with an adapter emitting a server folder fails. Control: the static build passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: C"
web.delivery.8:
  slug: typed-env-schema
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "ESLint `no-restricted-syntax` on environment member access outside the schema module, with the framework's schema configured. Plant: reading a secret from the environment object in a component fails. Control: an environment read through the schema passes"
  relates:
    react.config.1:
      how: see
  open:
    - "The two source rows were twins for two frameworks (a template-stack form and a component-stack form); the second was moved to react.config.1 at the cross-part move."
    - Same pattern as the one-network-module rule.
    - "Proposed for lack of a source; the v1 evidence was: C and D"
    - "v1 reference, not yet a source: framework environment-variable guides"
web.delivery.9:
  slug: no-secret-in-bundle
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tool: gitleaks
      tier: "3"
      note: "gitleaks 8.30 `dir` on the built output with `--redact` at land and release; the other secret scanner was rejected for its licence (AGPL-3.0). Plant: a 20-character key-shaped token in a one-line minified bundle fires the access-token rule with file and line; the control is a clean build. Control: a clean built output exits 0"
  open:
    - Entropy-only secrets without a known prefix may escape.
    - "Proposed for lack of a source; the v1 evidence was: D"
web.delivery.10:
  slug: embedded-cache-headers
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "3"
      note: "the shared helper's test of cache headers for hashed assets and the entry file. Plant: no-cache on a hashed asset fails. Control: immutable on hashed files and revalidation on the entry pass"
  open:
    - "Proposed for lack of a source; the v1 evidence was: C"
web.delivery.11:
  slug: deployed-page-has-a-listener
  since: 0.1.0
  level: deploy
  kind: rule
  strength: Record
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. the release step checks that a monitor entry (health URL) exists for the deployed page; a scripted failure proves the notification. Plant: a stopped server must produce one notification. Control: a monitored page passes"
  review_question: "Who is notified when this page's health poll fails?"
  open:
    - "Notification is run-time operations; only the entry is checkable."
    - "Held as Record: the source verdict is a best practice."
program/web/rules/forms.yaml:
  summary: "Forms are built from the design system field, validated by schema, with errors mapped from the server and no silent loss of unsaved work."
web.forms.1:
  slug: field-label-and-linked-errors
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "axe `label`, `aria-valid-attr-value` and `autocomplete-valid` in the accessibility run, the field part's required label prop, and a journey with invalid data. Plant: an input with a placeholder and no label fails axe `label`; an invalid field whose message is not linked fails the journey. Control: a labelled field with a linked message passes"
  open:
    - "Vacuous today: no form in either site."
    - "Built because every rule binds from adoption; if the operator would rather not build for evidence D, it becomes a best practice."
    - "Proposed for lack of a source; the v1 evidence was: D: no form exists to measure"
web.forms.2:
  slug: focus-first-invalid
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a journey submits an invalid form and asserts the active element is the first invalid control or the summary. Plant: a form that leaves focus on the submit button fails. Control: a form that moves focus to the first invalid control passes"
  open:
    - Vacuous today. Whether focus goes to the first invalid control or the summary is open.
    - "Proposed for lack of a source; the v1 evidence was: B"
web.forms.3:
  slug: one-form-pattern
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "a manifest ban list on form libraries the stack does not allow (every one on the template stack; the component-stack ban is react.client-state.2). Plant: importing a form library in a template-stack project fails; on the component stack, the React rule's plants. Control: the mapping module passes"
  relates:
    react.client-state.2:
      how: see
  open:
    - "The mapping helper's source (a server 400 with problem details) and its stable machine codes are the contract with the service parts."
    - "Proposed for lack of a source; the v1 evidence was: D"
web.forms.4:
  slug: schema-validation-message-keys
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "the no-hardcoded-text rule of the words concern applied to schema message arguments. Plant: a schema with a string literal message fails. Control: a schema carrying a message key passes"
  relates:
    react.client-state.2:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.forms.5:
  slug: unsaved-changes-guarded
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a journey per form in the shared kit. Plant: a dirty form that navigates away silently fails. Control: a dirty form that confirms passes"
  relates:
    react.routing.8:
      how: see
  open:
    - The source needs a product ruling on blocking versus warning.
    - "The source row marked it judgement with no check; the dirty-navigation test is mechanical, and what counts as lost is the test's assertion. Vacuous today."
    - "Proposed for lack of a source; the v1 evidence was: D"
web.forms.6:
  slug: destructive-asks-first
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "3"
      note: "v1 class compiler. the button part's closed variant type plus a kit journey on the confirm dialog. Plant: a danger button in a feature file fails the type check; a confirm dialog opened with focus on Delete fails the journey. Control: a confirm dialog with focus on Cancel and an outcome noun passes"
  open:
    - "Half holds: whether to ask is review. A raw danger class on a hand-built button is the no-hand-built-twin ban."
    - "Proposed for lack of a source; the v1 evidence was: D"
web.forms.7:
  slug: copy-and-link-labels
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "`no-restricted-properties` on `navigator.clipboard`, the stack's ambiguous-link-text rule, the no-target-blank rule (html-validate on templates, react.lint.3 on components), and a clipboard journey in the kit. Plant: `<a href=\"/x\">here</a>` fails; `navigator.clipboard.writeText` in a page file fails; a copy button that shows nothing on denial fails the journey. Control: a copy part showing \"Copied\" and \"Could not copy\" passes"
  relates:
    react.lint.3:
      how: see
  open:
    - The build is lint plus kit test.
    - "Proposed for lack of a source; the v1 evidence was: C"
web.forms.8:
  slug: form-detector
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. the shared runner's third result (\"not applicable: 0 inputs\") and its summary of counts. Plant: a repository with one form and the field check removed fails; with the check present it runs. Control: a repository with no form passes with \"not applicable: 0 inputs\""
  open:
    - "Depends on the shared runner's third result, owned by the enforcement runner."
    - "Proposed for lack of a source; the v1 evidence was: J: the count is a mechanical read; the reading of it is a judgement"
web.forms.9:
  slug: record-page-read-first
  since: 0.1.0
  level: file
  kind: rule
  strength: Review
  review_question: "Is this record page read-first, with an explicit edit step and one form pattern?"
  open:
    - "No check yet; the golden page and review hold it. Related to the unsaved-changes rule."
    - "Proposed for lack of a source; the v1 evidence was: practice"
program/web/rules/layout.yaml:
  summary: "Pages hold at every width from phone to desktop, in every supported engine, with no overflow and with pictures that do not shift the page."
web.layout.1:
  slug: no-horizontal-scroll
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the shared Playwright kit's `checkOverflow` plus axe `scrollable-region-focusable` and a label check. Plant: a table 352 px wide in a 390 px page with no scroll box fails. Control: the same table in a focusable scroll box passes"
  open:
    - "Trialled on Chromium only: it failed a 700 px table and passed the scroll-box control."
    - The journeys of two sites assert parts of this and are unproven as a rule.
    - "Proposed for lack of a source; the v1 evidence was: A, heaviest: 27 of 144"
web.layout.2:
  slug: long-text-tested
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the kit's `checkOverflow` run with the long-text fixture generator. Plant: a card that clips a 300-character title fails. Control: one that wraps passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: A"
  note: "Related to the pseudo-locale story rule in the testing concern, which lengthens words by translation instead of by fixture."
web.layout.3:
  slug: no-layout-shift
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the kit's `checkShift`, a performance observer on layout-shift entries plus the landmark box diff. Plant: a shell that inserts a banner above content after load fails. Control: a reserved-height banner passes"
  open:
    - "Layout-shift entries exist in Chromium only; WebKit has none, so the box diff carries the second engine."
    - "Whether a shift is acceptable stays judgement; timing-dependent on one site's shell."
    - "Proposed for lack of a source; the v1 evidence was: A: still failing on a PC"
web.layout.4:
  slug: breakpoints-are-tokens
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "Stylelint 17 core `media-feature-name-value-allowed-list` for width features, with the breakpoints generated from the token source, `media-feature-name-disallowed-list` for `pointer`, `hover` and `any-pointer`, and a class ban on arbitrary min and max variants and pointer-coarse. Plant: `@media (min-width: 777px)` and `@media (pointer: coarse)` fail; `(min-width: 40rem)` from the list passes; `(width >= 50rem)` fails. Control: a media query using a token width passes"
  open:
    - "The width literal list must include the range syntax or ban it, as the plant shows."
    - "Proposed for lack of a source; the v1 evidence was: D: 6 and 4 widths by one count, 8 and 6 by another"
web.layout.5:
  slug: target-size
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "axe `target-size` under the `wcag22aa` tag plus the kit's `checkTargets` on a touch project. Plant: a 30 px icon button on the touch project fails. Control: a 44 px button passes"
  open:
    - "v1 evidence, not yet a source: A and B"
web.layout.6:
  slug: press-does-not-move
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "the kit's press-stability check. Plant: a button with a scale transform on its active state fails. Control: a colour-only active state passes"
  open:
    - "The source row was marked an instruction with a review-lens question; the mechanical check was proved on a trial and kept as a rule."
    - "Proposed for lack of a source; the v1 evidence was: A: one case"
web.layout.7:
  slug: viewport-height-units
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "Stylelint `declaration-property-value-disallowed-list` for 100vh on height properties, and the utility lint's restricted-class rule for h-screen and arbitrary vh heights. Plant: `height: 100vh` and `h-screen` fail. Control: `100dvh` and `h-dvh` pass"
  open:
    - The utility-class form uses the same plugin as the theme rule and was not separately planted.
    - "Half holds: safe-area is review."
program/web/rules/parts.yaml:
  summary: "The design system is the only source of interface parts; pages compose catalogued parts, never hand-built twins, and every new part ships with a catalogue entry."
web.parts.1:
  slug: platform-first
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. the banned-package list in the dependency check of our CLI, plus `jsx-a11y/prefer-tag-over-role` (in the template form for Astro) and html-validate `prefer-native-element` and `no-redundant-role`. Plant: adding a date library to the dependencies fails; `<div role=\"button\">` fails. Control: a native `<button>` passes"
  open:
    - "Half holds: the package and the role on the wrong element are rules; whether a gap really needs ARIA is review."
    - "Proposed for lack of a source; the v1 evidence was: B for the principle"
web.parts.2:
  slug: no-hand-built-twin
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "`no-restricted-syntax` with one selector per catalogued part (for example the JSX opening element named button, table, dialog, select), generated from the parts catalogue and scoped by `files` to feature folders, with a shrink-only baseline per part. Plant: a raw `<button>` in a feature file fails; the same element inside the button part passes; with an empty catalogue the check prints \"not applicable: 0 inputs\". Control: a feature that uses the catalogued part passes"
  relates:
    react.components.3:
      how: see
  open:
    - "The scan cannot fail until the catalogue exists. The gate is the element ban outside the part; the shape scan is advice."
    - "Proposed for lack of a source; the v1 evidence was: A: F4 in three sites (3, 1 of 144, 2)"
  note: "Kept whole in the web part at the cross-part move: the merge had marked the React raw-markup set of the ban as belonging in react, but the JSX selector form works on `.tsx` and on `.astro` templates alike, so no part of the ban is React only. The React raw-HTML funnel is react.components.3."
web.parts.3:
  slug: page-patterns-checked
  since: 0.1.0
  level: process
  kind: rule
  strength: Review
  review_question: "Which screen guidelines have neither a check nor a stated reason for staying text?"
  open:
    - "The split noted this as a gap in the reference: the guidelines were not yet turned into checks."
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.parts.4:
  slug: page-does-not-wrap-itself
  since: 0.1.0
  level: file
  kind: rule
  strength: Review
  review_question: "Does this page wrap itself in a card or panel the shell already provides?"
  open:
    - "No row bans a page wrapping itself, so it is a gap; the page-patterns rule proposes the lint (\"no card as a page root\"). The design rubric's note that a page does not wrap itself in what the shell gives states the same."
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.parts.5:
  slug: one-page-archetype
  since: 0.1.0
  level: file
  kind: rule
  strength: Review
  review_question: "Does this page use the shell, the header, and the list or record archetype, or does it invent its own?"
  open:
    - "Held by the golden page and review; no lint states 'uses the archetype'."
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.parts.6:
  slug: own-part-for-own-shape
  since: 0.1.0
  level: file
  kind: rule
  strength: Review
  review_question: "Is a general part stretched here to draw a shape that has, or needs, its own part?"
  open:
    - "Related to the closed-props rule and to the icon-only accessible name rule; no check yet."
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.parts.7:
  slug: closed-part-props
  since: 0.1.0
  level: file
  kind: rule
  strength: Review
  review_question: "Do this part's props match the catalogue entry, and does the control follow the one value and change contract?"
  open:
    - "No check yet; the catalogue lists each part's props, which would let a type test hold the naming."
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.parts.8:
  slug: value-has-its-part
  since: 0.1.0
  level: file
  kind: rule
  strength: Review
  review_question: "Is any id, copyable value, secret, status or permission on this page shown as plain text?"
  open:
    - "No check yet; the raw-element scan covers only the element, not the kind of value."
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.parts.9:
  slug: one-toast-system
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "`no-restricted-imports` on any other toast library, and the no-hardcoded-text rule on the notify wrapper's arguments. Plant: importing a second toast library fails; calling notify with a string literal fails. Control: notify called with a message result passes"
  open:
    - "The shadcn toast copy was replaced by the design system's own notice part; the no-auto-dismiss clause is checked by review."
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.parts.10:
  slug: icon-registry
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "`no-restricted-syntax` on the svg element outside the icon registry folder (components and templates) and `no-restricted-imports` on every icon package except in the one icon module; for templates the generated sprite is compared by the generate-with-check loop. Plant: an inline `<svg>` in a page file fails; importing a second icon package anywhere fails. Control: an icon named through the registry passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: C: 99 names in one site; 3 inline shapes and 6 glyphs in another"
web.parts.11:
  slug: parts-catalogue-as-data
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the catalogue check of our CLI: the catalogue data file against the part files, generated from props with react-docgen where it applies; for templates checked against each part file's exported Props; `tsc` and the template checker reject an unknown prop. Plant: a part file with no catalogue entry fails; a catalogue entry whose file is gone fails; a prop used that the part does not declare fails the type check; a new gating primitive with no row fails. Control: a part with its entry and declared props passes"
  open:
    - "Nothing in the repo is a catalogue today; every dependent row is vacuous until it exists. The file format is open. The doc manifest of the story tool is a preview and unproven on the template stack."
    - "The agent-lookup half (query before writing) is an instruction held by the session; no hook proves the look-up."
    - "Proposed for lack of a source; the v1 evidence was: A: the audit above"
web.parts.12:
  slug: example-per-state
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the examples check of our CLI compares the catalogue with the stories; a story runner renders each story and runs the accessibility engine. Plant: adding a part to the catalogue with no story fails; adding the story passes. Control: a part with a story for every declared state passes"
  open:
    - "No story framework exists for the template stack, so its gallery is ours."
    - "Proposed for lack of a source; the v1 evidence was: D: the comparison is about 30 lines; the story tool itself is configuration"
web.parts.13:
  slug: extract-at-three
  since: 0.1.0
  level: program
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. a report from the second-copy scan (a clone detector plus a subtree-shape count per site, seeded by the copy census); a shape with three or more copies in one site prints as a candidate. Plant: a fixture with the same 8-line JSX block in three files prints as a candidate. Control: a block in two files is not a candidate"
  open:
    - "The source verdict is a best practice. A failing gate on shape count would fire on correct code (shape counts misread real code); it would change if an exception list is agreed as the way to silence a candidate."
    - The copy census exists as a measure and is unproven as a gate.
    - "Proposed for lack of a source; the v1 evidence was: A: not across sites today, yes inside one site; report only"
web.parts.14:
  slug: kit-self-contained
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "1"
      note: "a test in the shared kit renders every exported part from the catalogue with no provider (render to a string for templates; the component render is react.testing.3). Plant: a part that needs host config or a host i18n library to render fails the render. Control: a part that works bare passes"
  relates:
    react.testing.3:
      how: see
  open:
    - "No fault in our record; built because every rule binds from adoption. If the operator would rather not build for evidence D, this becomes a best practice."
    - "Proposed for lack of a source; the v1 evidence was: D"
web.parts.15:
  slug: kit-dependencies
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "the dependency check of our CLI on the kit's manifest (peers only) and `no-restricted-imports` of program packages in the kit. Plant: adding a data-fetching library to the kit's dependencies fails. Control: only declared peers pass"
  open:
    - "The form peer is TanStack Form (decision on TanStack always); the reference named a different peer and a different data library."
    - "Proposed for lack of a source; the v1 evidence was: practice"
web.parts.16:
  slug: one-ui-kit
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "`no-restricted-imports` plus the manifest ban list in the dependency check. Plant: importing a button from a second component library fails. Control: the shared part passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
web.parts.17:
  slug: design-named-parts
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a browser test per page reads the design file's named parts and numbers and asserts each part exists in the shipped page with the expected widths and sizes. Plant: removing a part's `data-part` attribute fails; a card 5 px off its design size fails. Control: a page matching its design file passes"
  promoted:
    "on": "2026-11-05"
    trial: "the organisation made numbers on named parts the judge of rendered UI, so this rule binds."
  relates:
    web.testing.5:
      how: see
  open:
    - "No repository has a machine-readable design file yet; until one exists the parts and their numbers are a committed parts file beside the page, read by the same test."
web.parts.18:
  slug: typed-templates
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tool: astro-check
      tier: "1"
      note: "v1 class compiler. the template stack's own checker (astro check) and `tsc --noEmit` for components; a tagged-template stack has no typed template check, so its gap is declared and listed. Plant: a string passed to a numeric prop fails in a template and in a component. Control: a correctly typed prop passes"
  open:
    - Not planted in a repository today.
    - "No typed template check exists for the tagged-template stack (its analyser was last released in January 2024)."
    - "Proposed for lack of a source; the v1 evidence was: C: the stack report calls this the weak link of the static path"
web.parts.19:
  slug: behaviour-test-by-role
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "3"
      note: "`eslint-plugin-playwright` `no-raw-locators` and `prefer-native-locators` as errors; the same spec run against each build. Plant: a spec using `page.locator(\".card > div\")` fails the lint. Control: a `getByRole` spec passes on both builds"
  open:
    - "'On any stack' is shown only by running the spec against both builds in the pilot."
    - "Proposed for lack of a source; the v1 evidence was: C"
web.parts.20:
  slug: component-folder-shape
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "`eslint-plugin-project-structure` `folder-structure` with a required-children rule per framework spelling (an alternative that checks only names does not check that a sibling must exist). Plant: a component folder missing its test file fails; a complete folder passes. Control: a complete folder passes"
  open:
    - "The required-children behaviour was not run (only the option's existence was verified); fall back to the text rules."
    - "The folder shape names both test-file spellings until one site's files migrate."
    - "Proposed for lack of a source; the v1 evidence was: D: new folders only until old ones are moved"
web.parts.21:
  slug: charts-from-design-system
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "the supply-chain ban list and `no-restricted-imports` on chart libraries outside the design system. Plant: importing a chart library in an app file fails. Control: the same chart through the design system's chart part passes"
  open:
    - "The reference held the chart library as an optional peer of the design system; a shared part needs two consumers."
    - "Proposed for lack of a source; the v1 evidence was: practice"
program/web/rules/permissions.yaml:
  summary: "No request is sent without its permission, every gated surface shows a designed state for allow, deny, loading and degraded, and failure denies."
web.permissions.1:
  slug: no-request-without-permission
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "`no-restricted-imports` and `no-restricted-syntax` banning the raw query, mutation and fetch calls outside the three allowed folders; the zero-requests sweep proves it end to end. Plant: a raw query call in a feature file fails; a gated read fired before the grant is known fails the sweep. Control: the same read through the gated query passes"
  open:
    - "The primitive names are one codebase's; the rule is generic and the names belong to the react part."
    - "A site's own gated-read wrapper is unproven."
    - "Proposed for lack of a source; the v1 evidence was: D; C for one site's gated-read wrapper (unproven)"
web.permissions.2:
  slug: writes-gated-like-reads
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "the raw-mutation ban of the no-request rule plus `no-restricted-syntax` on a bare permission assert in handlers. Plant: a handler calling a bare can-run assert fails; a raw mutation call fails. Control: a gated mutation through the guarded helper passes"
  open:
    - "The guarded helper names are one codebase's and belong to react."
    - "Proposed for lack of a source; the v1 evidence was: D (ledger L-99)"
web.permissions.3:
  slug: unknown-denies
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "the zero-requests sweep renders every page while permissions are loading and degraded and fails on any gated request. Plant: a page that fetches a gated list while permissions are loading fails. Control: a page that waits for allow passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D; C for the first site's wrapper"
web.permissions.4:
  slug: no-fail-open-permission-api
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "`no-restricted-imports` and `no-restricted-syntax` on each fail-open helper, kept in a ban list. Plant: importing a fail-open helper fails. Control: the gated check passes"
  open:
    - "The ban list names are one codebase's retired helpers and belong to react."
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.5:
  slug: gate-status-closed-set
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "`no-restricted-syntax` on a hand-built `enabled` option fed by a permission check and on reading `isPending` from a gated result, plus switch exhaustiveness on the gate status. Plant: hand-rolling the enabled flag fails; branching on a raw pending flag fails. Control: a switch over the four gate statuses passes"
  open:
    - The query-library flags named are React-library specific and belong to react.
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.6:
  slug: source-declares-permission
  since: 0.1.0
  level: type
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "v1 class compiler. the list definition type makes the permission field required (or a public flag), and a lint on tabs and panels reading gated data. Plant: a list definition with neither a requirement nor a public flag fails the type check. Control: a definition naming its permission passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.7:
  slug: routes-gated
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a route-list test iterates the router's routes and fails on one with neither a gate nor an allow-list entry with a reason. Plant: a route added with no gate and no allow-list entry fails. Control: a gated route passes"
  open:
    - "The route descriptor form (before-load helper) is router specific and belongs to react."
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.8:
  slug: hidden-panel-fetches-nothing
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "the zero-requests sweep with one grant asserts that only that permission's reads fire. Plant: a tab with its panel mounted but hidden that fetches under no grant fails the sweep. Control: a panel that mounts only with its permission passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.9:
  slug: nav-matches-target
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a test compares each navigation entry's requirement with its target route's requirement. Plant: a navigation entry whose permission differs from its target page's fails. Control: matching requirements pass"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.10:
  slug: permission-registry
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "2"
      note: "`no-restricted-syntax` on string literals shaped like a permission outside the registry, plus the generate-with-check loop on the registry file. Plant: a raw permission string in a page fails; a hand-added registry entry fails the regenerate compare. Control: a descriptor read from the registry passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.11:
  slug: designed-gated-states
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a gated-surface test renders each state with the mock identity provider and asserts the designed state and no live denied control. Plant: a denied button that remains enabled fails; a section that appears then vanishes fails. Control: a surface drawing all four states passes"
  open:
    - "Controls that stay live when denied were found in the source and fixed by hand; no check existed."
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.12:
  slug: disabled-while-loading
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a gate test asserts a disabled control is present while permissions are loading. Plant: a gate in disable mode that renders null while loading fails. Control: a disabled control while loading passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
  note: "Related to the layout-shift rule, which holds the outcome; this holds the cause."
web.permissions.13:
  slug: bounded-capability-wait
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a test holds the capability call open past the bound and asserts the surface ends as degraded and an unrelated page still renders. Plant: a capability call with no timeout hangs the test and fails. Control: a call that times out into degraded passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.14:
  slug: zero-requests-sweep
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a Playwright sweep in the shared kit using the gated-read wrapper and the mock identity provider that models loading. Plant: a page that fetches a gated list before the grant is known fails the sweep; the count of pages swept below the route count fails. Control: a page that fires only the identity request passes"
  open:
    - "No fault in our record; built because every rule binds from adoption."
    - Applies where a door names the visitor.
    - "Proposed for lack of a source; the v1 evidence was: D; C for one site's wrapper"
web.permissions.15:
  slug: permission-test-fixture
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "1"
      note: "a test that the fixture's loading mode yields null service views, as production does. Plant: a fixture whose loading mode returns a granted set fails. Control: the fixture with null service views passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
web.permissions.16:
  slug: no-fan-out-for-unseen-data
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "the request budget counter on a list page under a grant that hides one column. Plant: a list that fires one request per row for an unreadable column exceeds its budget and fails. Control: a list that skips the hidden column passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D"
  note: The budget half of the source row is the request-budget rule in the states concern.
web.permissions.17:
  slug: no-identity-has-no-sign-in
  since: 0.1.0
  level: program
  kind: rule
  strength: Lens
  review_question: "Which route, form or outgoing call of this program asks a visitor who they are, or sends proof of it?"
  open:
    - "No tool sees a sign-in surface by itself: an import ban names one provider's client, not the class. The zero-requests sweep (web.permissions.14) could fail on an identity or session call under this kind, and a check row waits on that sweep."
program/web/rules/speed.yaml:
  summary: "Budgets for the bundle, the dependency list and the work a page does on load, and the rules that keep them from growing."
web.speed.1:
  slug: byte-budget
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tool: size-limit-with-bundler-plugin
      tier: "3"
      note: "size-limit with its file plugin over the built output, gzip, one limit per kind and chunk class from the parameters file; exit 1 on any breach. Plant: a 400 KB script copied into a scratch build output must exit 1 naming the file. Control: the clean build passes"
  open:
    - "Adoption goes through the shrink-only baseline of the ratchet, because 19 chunks are over today."
    - "Proposed for lack of a source; the v1 evidence was: A: 300 KB first visit, 98,304 bytes core"
web.speed.2:
  slug: static-first
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. a built-output scan of our CLI against the allowed-scripts list. Plant: a built content page with one added script fails. Control: the same page listed with a reason passes"
  open:
    - "Which runtime a content site may ship is unsettled; the check only holds the per-page allow list."
    - Build only if no HTML-validator rule does it.
    - "Proposed for lack of a source; the v1 evidence was: C"
web.speed.3:
  slug: route-splitting
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tool: size-limit-with-bundler-plugin
      tier: "3"
