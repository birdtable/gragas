base/gates/rules/exemptions.yaml:
  summary: "A limit is an exemption with an exit. Every lint disable names its rule and gives a reason, unused ones are refused, suppressions are counted and only fall, and every exemption, disable and baseline uses one record format with a reason that names an artifact, an owner and an expiry."
gates.exemptions.1:
  slug: directive-names-rule-and-reason
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: nolintlint
      fix: auto
      note: "golangci-lint nolintlint with `allow-unused: false`, `require-explanation: true`, `require-specific: true`. Plant: A nolint with no linter is reported (\"should mention specific linter\"); a nolint:errcheck with no reason is reported (\"should provide explanation\"). Control: A nolint naming the linter with a reason passes (control not run)."
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint eslint-comments rules (require-description, no-unlimited-disable) in the shared preset. Plant: A blanket disable comment and a disable with no description each fail. Control: A disable naming the rule with a description passes."
  relates:
    gates.exemptions.4:
      how: see
  open:
    - "Debt: adopt with a ratchet, since the first run reports hundreds of findings, mostly in tests."
    - "The TypeScript rule names are from the preset design; their plant has not been run."
  note: "Merges the Go nolint rule, the TypeScript description rule, the TypeScript no-blanket rule and the plain \"every lint disable carries a reason\"."
gates.exemptions.2:
  slug: unused-directive-error
  since: 0.1.0
  level: word
  kind: rule
  examples:
    bad:
      lang: go
      code: "x := f() //nolint:gosec // one more directive than at the merge base\n"
    good:
      lang: go
      code: "x := f() // the finding is fixed, so no directive is added\n"
  checks:
    "1":
      tool: golangci-lint
      key: nolintlint
      fix: auto
      note: "nolintlint with `allow-unused: false`. Plant: An unused nolint directive is reported. Control: A used directive passes."
    "2":
      binding: ts
      class: preset-config
      tool: eslint
      tier: "1"
      note: "ESLint `reportUnusedDisableDirectives: error` and bulk suppression failing on an unused entry. Plant: A disable comment over a line with no finding fails. Control: A used disable passes."
    "3":
      tool: gragas
      key: directive
      fix: never
      note: "The directive key of the gragas preset, which gragas check computes: a disable directive is counted, and one more than at the merge base is a finding. Plant: a new nolint line is a finding. Control: the same count passes (internal/core/audit/repo_test.go)"
gates.exemptions.3:
  slug: block-disable-reenabled
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint eslint-comments `disable-enable-pair` in the shared preset. Plant: A block disable with no matching enable fails. Control: A disable and enable pair passes."
  open:
    - "Go answer: not applicable, no open block exists, so there is no Go check."
    - "Proposed for lack of a source; the v1 evidence was: practice"
gates.exemptions.4:
  slug: one-exit-record
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. An exceptions check: one record format (path or rule, reason naming an artifact, owner, expiry) in JSON validated by a schema; parses lint comments, allow files and baselines; fails a missing owner, an expired entry or an unresolvable artifact id. Plant: An entry with a past expiry fails; an entry whose reason names a nonexistent ticket fails; a vulnerability ignore with a past date exits 1 (the same with a future date exits 0). Control: A current entry with a resolving reason and an owner passes."
  relates:
    gates.ratchets.4:
      how: see
  open:
    - "Weakest build among the Go rows: if not wanted, the reason rule covers it and this row falls to best practice."
    - "The Go side needs the same parser; one home in the shared package."
    - A renewals count is shown but no renewal limit is decided.
  note: "Merges the Go exit-record half, the web record format, the ticket-and-expiry rule and the ticket-and-expiry half of the old gate rule. The baseline-owner half is gates.ratchets.4."
gates.exemptions.5:
  slug: suppressions-counted-only-fall
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Shared ratchet counting `//nolint` and `//lint:ignore` lines per repo, split by test and non-test filename, with baseline files per class. Plant: Add a nolint:gosec in a non-test file; the count rises and fails. Control: Removing one lowers the count."
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The same ratchet over disable comments, ts-ignore directives and skipped tests. Plant: A new disable comment fails the count. Control: Removing one passes."
  relates:
    gates.hooks.5:
      how: see
  open:
    - "Built baseline split exists in the baseline tool; no repo gate yet."
    - "Proposed for lack of a source; the v1 evidence was: own measure"
  note: "Merges the Go count rule with the suppression half of the no-escape-hatch rule; the bypass-flag half is gates.hooks.5."
gates.exemptions.6:
  slug: exemption-counted-shrink
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. Exemption list as exception records counted in the shrink-only baseline; unused exemption reported (lift of an existing mechanism with its self-test). Plant: An unused exemption is reported; a new exemption raises the count and is refused. Control: A used, counted exemption passes."
  relates:
    gates.exemptions.4:
      how: see
    gates.protection.1:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: A"
gates.exemptions.7:
  slug: extend-rather-than-exempt
  since: 0.1.0
