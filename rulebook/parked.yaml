program/web/rules/structure.yaml:
  summary: "How a web front end is laid out: layers that import one way, thin pages and routes, modules with a public entry, and what a project shares with other sites."
web.structure.1:
  slug: network-one-module
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "ESLint `no-restricted-globals` for fetch, EventSource, XMLHttpRequest and WebSocket, plus `no-restricted-properties` for the same names on window, globalThis and self, plus `no-restricted-syntax` for a destructured alias and bracket access; all scoped to everything except the gateway folder and including the virtual-file glob of embedded scripts. A second `no-restricted-syntax` rule fails a fetch whose first argument is neither a string literal nor a member of the gateway module. Plant: each of the five forms (bare fetch, window.fetch, globalThis.fetch, destructured alias, bracket access) in a page file and in an embedded script must fail. Control: the same call inside the gateway folder passes"
  review_question: "Can any part of this outbound address come from a request?"
  open:
    - "The bare-global form is trialled (the linter flagged bare fetch and none of the window, globalThis, destructured and bracket forms until the extra rules were added); the destructured alias and the gateway-folder exemption were not planted."
    - "Proposal: split into call sites (a rule) and request-derived hosts (review only; no sink exists yet to plant). Until then outbound hosts are held by the review question."
    - Without the virtual-file glob a fetch inside an embedded script passed silently.
    - "v1 evidence, not yet a source: A: both sites pass today; outbound hosts, no fault found"
web.structure.2:
  slug: raw-markup-funnel
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "the framework's no-raw-HTML ESLint rule (an Astro set-html rule; the React rule is react.components.3) plus `no-restricted-properties` on the property names above and `no-restricted-syntax` for the computed form, scoped outside the funnel module; an import ban on the sanitiser outside the funnel. Plant: each of the five bypasses found in trial (DOMParser plus innerHTML, createContextualFragment, setHTMLUnsafe, srcdoc, el[\"innerHTML\"]) fails outside the funnel and passes inside it. Control: the same write inside the funnel module passes"
  relates:
    react.components.3:
      how: see
  open:
    - The older text rule stays until the ESLint form passes the same five plants.
    - "Proposed for lack of a source; the v1 evidence was: D as to faults"
web.structure.3:
  slug: entry-only-wires
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "the boundaries plugin with an `entry` element type that may import only wiring elements, plus `no-restricted-syntax` on function declarations over the limit, plus a ban on client calls, query hooks and markup in route files. Plant: an entry file declaring a 40-line function fails, and a route file calling a query hook fails. Control: an entry that only imports and calls start() passes"
  relates:
    react.routing.11:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: C: both entries comply"
web.structure.4:
  slug: page-orchestrates-model-decides
  since: 0.1.0
  level: file
  kind: rule
  strength: Lens
  review_question: "Is this page one orchestrator; does it recompute anything a server of ours could hand over; and where did its own rules go?"
  relates:
    service.contract.20:
      how: see
  open:
    - "Blocked as a check: only the line count is mechanical, and the cheap cure (move lines into a helper) passes it. A rule on what the model folder may import (the layer rule) holds one direction only."
  note: "v1 review check (review is not a v2 check class): a model lens question on pages; a line limit (`max-lines-per-function`) narrows it but cannot tell whether the rules moved"
web.structure.5:
  slug: pure-layers
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "a pure element type in the boundaries rule whose imports exclude DOM modules, plus `no-restricted-globals` for document, window, localStorage, sessionStorage and navigator in the pure folders; the port-and-branch report is a shape query in the shape tool. Plant: a pure-layer file touching document.title fails. Control: the same logic taking a plain value passes"
  open:
    - "Half holds: the ban is a rule; the port-and-branch report is a report. A fixture with one such function must be counted before the report is trusted."
    - "v1 evidence, not yet a source: D (Unit Testing Principles, Practices, and Patterns, Khorikov)"
web.structure.6:
