base/supply/rules/bumps.yaml:
  summary: "How versions move. A dependency bump is its own change, shared modules and tools stay at one version everywhere, consumers stay within a currency window of the latest shared release, related modules are tagged together, and a shared release plans who pays for each bump."
supply.bumps.1:
  slug: bump-is-its-own-change
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. companion lock-diff compares the manifest and lockfile with the base; more than one direct change in a commit fails, and the message must carry a Trial line. Plant: two direct bumps in one commit fail; a commit with a bump and a source edit fails. Control: one bump with a Trial line passes"
    "2":
      binding: go
      class: preset-config
      tier: "3"
      note: "a diff scan on go.mod together with non-module files, a recipe in the shared makefile fragment. Plant: a commit with a go.mod bump and a source edit fails. Control: a go.mod-only commit passes"
  open:
    - "The reference rule leaves a bump of an existing dependency out of its sign-off, so this rule is what covers bumps."
    - Astro bumps of one repository are out of scope under a ruling of the operator.
    - "v1 evidence, not yet a source: D; the cost is small because the lock diff is built for the age and family rules"
supply.bumps.2:
  slug: currency-window
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. companion report currency lists each consumer's go.mod require of the shared module against the latest tag and its date, and the lockstep pairs; a release check of the shared module fails a breaking surface change (supply.release.2) whose change does not update the callers in the kept repositories. Plant: a breaking change to the shared module with an unfixed caller in a kept repository fails. Control: a consumer two tags behind is reported and passes"
  relates:
    arch.measures.6:
      how: see
  open:
    - "A five-working-day window was set once; lag is now reported instead of gating."
    - "How a check in the shared module's repository finds callers in other kept repositories without hosted CI is to be built."
supply.bumps.3:
  slug: related-modules-tagged-together
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. a release script check that the root and sub-module tags match, in the owner repository only. Plant: a mismatched tag fails. Control: matching tags pass"
  open:
    - "How a removed name is handled is open, either deprecate it first with a go:fix inline directive, or break with no alias kept (the repositories' own rule)."
    - "go:fix inline across modules is untested."
    - "Blocked: the new platform lane waits for a hold."
supply.bumps.4:
  slug: release-plans-who-pays
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. release step refuses a breaking tag without a changelog section listing what consumers change; consumer lag report from tag dates and lock requirements. Plant: a breaking tag with no consumer section is refused; a fixture consumer one tag behind reads 1. Control: a tag with the section passes"
  open:
    - "Half of this holds, since the changelog section is enforced and the lag is only a report."
    - "v1 evidence, not yet a source: A at the reference source; the 0.14.0 changelog shape"
supply.bumps.5:
