  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. a diff check in the docs check (a date-only change) fails an as-of change with no other content change in the same file, and a section supersession note whose target does not link back fails. Plant: a doc whose only change is its date fails; a superseded-section note naming a note with no back link fails. Control: a date moved with its content passes"
  relates:
    docs.freshness.7:
      how: see
  open:
    - "Proposed; the plant was not run."
docs.freshness.4:
  slug: current-fact-only-where-checked
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "the gate regenerates each generated reference doc and fails on a diff. Plant: a generated reference doc edited by hand fails. Control: a freshly generated doc passes"
  review_question: "Does this doc say what is built and what is only designed?"
  open:
    - "The built-against-designed clause is review; only the generated-reference part has a check."
    - "v1 evidence, not yet a source: A (one product doc still said \"Build to it today\" for a frozen tree)"
docs.freshness.5:
  slug: decision-files-link-both-ways
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. the docs check reads the declared container, fails a decision whose text changed after it landed (other than its superseded mark), a supersession without the back mark, a reused number and a cited number that does not resolve. Plant: a decision superseding another without the back link fails; an edit to a landed decision's text fails. Control: a new decision with links in both directions passes"
docs.freshness.6:
  slug: stubs-reported
  since: 0.1.0
  level: file
  kind: measure
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "2"
      note: "ESLint no-restricted-syntax (Biome form is a GritQL plugin) on throw new Error(\"not implemented\") and TODO returns, as a report. Plant: a fixture stub is counted. Control: a real body is not counted"
  open:
    - The false-positive rate is unknown.
    - "Proposed for lack of a source; the v1 evidence was: A"
docs.freshness.7:
  slug: generated-docs-from-one-source
  since: 0.1.0
  level: file
  kind: rule
  status: later
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. a shared generate-and-diff step in gragas that runs each generated doc's named command and fails on a difference or on a generated file with no generator line. Plant: a hand edit to the generated command table fails; a generated file with no generator line fails. Control: a freshly generated doc passes"
  open:
    - "Planned: binds once the shared generator or test exists in gragas."
  note: "The command-registry rule itself is in the CLI part; this is its docs half."
docs.freshness.8:
  slug: no-chain-in-authored-files
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      fix: never
      note: "the listing's check fails an authored file that holds a changes chain key and fails a changed listing with no new note. Plant: a chain line appended by hand fails. Control: a note file added with the regenerated listing passes"
  relates:
    docs.freshness.1:
      how: see
  open:
    - "Proposed until the listing check reads notes. That is a planned step (surface notes replace the digest chain); it has no tool key to bind to until then."
base/docs/rules/glossary.yaml:
  summary: "Every program owns a glossary of its terms, and a check holds it to the code. A word the project has retired fails where it is typed, in code, comments and docs, and the failure names the right word. Words that two programs share have one definition, with a machine code kept apart from its sentence."
docs.glossary.1:
  slug: glossary-held-to-code
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. a glossary data file lists each term, its page and its banned alternates; (a companion glossary check) fails on the built pages when the first use of a term on a page does not link to its glossary anchor, and the retired-word check (cspell flagWords) fails the alternate names. Plant: a page that uses an alternate name fails; a page that mentions a term without the link fails. Control: a page that uses the term with its link passes"
  review_question: "Is this a new name for a thing the glossary already names, and is every published schema or event a term?"
  relates:
    docs.glossary.2:
      how: see
  open:
    - "Half holds: names and links are checks; whether a new name is the same thing as an old one is review."
    - "Planned only: no link check exists yet."
    - "v1 evidence, not yet a source: A (word faults 7, 3 and 2 in three repos)"
  note: "Held for words in code by docs.glossary.2. Glossary-to-code consistency (every published schema or event is a term) is a check the part still has to design."
docs.glossary.2:
  slug: retired-word-fails
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "0"
      note: "typos (crate-ci/typos) over identifiers, comments and docs with a retired-words file mapping each word to its right word under extend-words; fallback cspell flagWords with word->replacement entries, and ignoreRegExpList for retired identifiers kept as code names. Plant: a retired word in a comment, in an identifier and in a markdown file each fails and names the right word. Control: a file using the right word passes"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-syntax with an Identifier or Literal selector holding the retired names as a regex and the right word in the message, no plugin (Biome form is a GritQL plugin on the same names). Plant: an identifier or string literal using a retired word fails with the right word in the message. Control: the right word passes"
    "3":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "forbidigo or ast-grep with the right word in the message. Plant: an identifier using a retired word fails with the right word in the message. Control: the right word passes"
  open:
    - "A retired word that is also a normal word needs a context rule that the typos tool cannot give: list it as exact-case only."
    - "cspell splits camelCase and so sees single words only: names belong to the identifier scan."
    - "Whether the shared list's home is the standards repository is proposed, not settled."
    - "v1 evidence, not yet a source: own measure (a spell tool found 181 hits of the old organisation name in one repo, which has a retired-words check)"
  note: Merges the retired-word rule from the spell-check row with the per-program retired-identifier rules.
docs.glossary.3:
  slug: shared-word-sets
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "a test compares the documented table of codes with the Go constants (TestExitCodesDocumented) against the ruled set 0 to 6. Plant: adding an exit code constant that is not in the table fails; deleting a table row fails. Control: a matching table passes"
    "2":
      binding: any
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. other shared word sets live in one JSON file consumed by Go and TypeScript through the generator, with a schema separating a machine code from its sentence. Plant: a shared word set defined twice fails the generator check. Control: one definition passes"
  open:
    - "Unproven in two repos: the table-against-constants test."
    - If the operator would rather not build for evidence D this becomes a best practice.
  note: "Exit codes have one home in the code part; the other shared word sets are planned."
docs.glossary.4:
  slug: no-internal-names-for-users
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a scan of the exported printed strings, the README and the how-to guides against the repo's exported identifiers, the jargon list and the citation resolver's id patterns. Plant: a help line naming an internal package fails; a README line citing a decision id fails; an error naming a register row fails. Control: the same line in a design note passes, and plain words in the README pass"
base/docs/rules/links.yaml:
  summary: "Every link, anchor, cited rule or ticket id and path named in docs and comments resolves, offline, and the check runs at the cheapest tier. External links are checked by a separate, non-blocking step of the release recipe, never as a gate step and never on a schedule. A version or a CI claim named in prose is held to the file that owns it."
docs.links.1:
  slug: no-broken-links
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "the repo's own offline link test, file links and anchors, over docs at tier 1. Plant: a link to a missing file, a link to a missing heading in another file and a link to a missing own anchor each fail. Control: three good links pass"
    "2":
      binding: any
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. a separate external-links command (with the network and a cache) called as a non-blocking step of the release recipe, writing its result into the release record; a test fails a gate config that calls it. Plant: a gate step that checks external links fails the config test; a release record with no external-link result fails. Control: a release whose record carries the external-link result, red or green, passes"
  open:
    - "UI repositories had no row for this; the part now applies to them."
docs.links.2:
  slug: cited-ids-resolve
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a shared citation resolver (companion cite) over comments in .ts, .tsx and .astro files and docs resolving id patterns against the standards index and decision files. Plant: a comment citing a decision number that does not exist fails. Control: a valid citation passes"
  open:
    - "Weakest build in the set: the comment version has no measured faults."
    - "Needs an allow list for runtime paths: one repo alone had 8 false hits."
    - "v1 evidence, not yet a source: D (seven repos' agent files held dangling references)"
docs.links.3:
  slug: backticked-path-resolves
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. the citation resolver fails a backticked path that does not exist unless the comment is marked dead-path with a reason, a prose version that differs from the lockfile, and a CI sentence whose command and trigger no workflow file holds. Plant: a comment citing a missing path fails; a doc naming a dependency at a version the lockfile does not hold fails; a doc saying CI runs the tests on push with no such workflow fails. Control: a path that exists, and a dead-path marked comment, pass; a version equal to the lockfile passes"
docs.links.4:
  slug: comments-hold-no-restated-facts
  since: 0.1.0
  level: word
  kind: instruction
  strength: Review
  review_question: "Does this comment repeat a fact that already has an owning file or table?"
  open:
    - "Commented-out code has its own tool in the code part; a hand-read commented-code detector flagged 3 candidates and all 3 were false."
base/docs/rules/markdown.yaml:
  summary: "Markdown in docs follows one shipped configuration, the same for every repository that takes this part, so structure is checked the same way everywhere."
docs.markdown.1:
  slug: shipped-markdown-config
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "3"
      note: "markdownlint-cli2 with the shipped configuration that turns line length (MD013) off. Plant: a document with a heading level skipped or a duplicate sibling heading fails. Control: a well-formed document passes"
  relates:
    docs.freshness.1:
      how: see
  open:
    - markdownlint-cli2 0.24.0 was planted once and is not yet a gate.
    - "No UI catalogue row named it; the part now applies to UI repositories too."
    - "Proposed for lack of a source; the v1 evidence was: practice (default rules gave 62,000 findings)"
  note: The front-matter half of the same row is docs.freshness.1.
base/docs/rules/samples.yaml:
  summary: "Code samples in documentation use the real interfaces and are checked to compile, guide steps run as written, each kind of README has a fixed shape, a change in visible behaviour touches its doc in the same commit, and one program is kept as the worked example of every rule."
docs.samples.1:
  slug: doc-code-compiles
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. extract fenced Go blocks (a small goldmark script or an extract-only tool) into a scratch package in the module and run go vet; fragment blocks skipped and counted with a ratcheted count. Plant: a doc block calling a removed function fails; a fragment block is skipped and counted. Control: a compiling block passes"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. every import in a documentation code fence resolves, extended to type-check each fence, with the repo's own offline link test for links in docs against the real barrels. Plant: a fence importing a missing symbol fails. Control: a fence with real imports passes"
    "3":
      binding: any
      class: test-kit
      tier: "4"
      note: "a guide-steps test that cuts the install and upgrade blocks from the guide and the changelog and runs them in order in a clean container or machine. Plant: an upgrade step whose block was deleted fails; a step whose command no longer exists fails. Control: a guide whose steps all run passes"
  open:
    - "The Go half is unsure: what would change it is a stale block found in a ticket."
  note: "Merges the Go row, the TypeScript row and the import half of the UI citation row."
docs.samples.2:
  slug: readme-three-questions
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a structure check per README kind: the three headings and the AGENTS.md link for a directory, the four parts for a package, the ordered parts for a product, with the commands table compared with the help output. Plant: a directory README with a missing heading fails; a package README with no import part fails; a product README with install after getting started fails. Control: a README in the shape of its kind passes"
  review_question: "Does the README actually answer what its parts ask, or is a placeholder paragraph under each heading?"
  open:
    - "Whether it answers the questions is semantic; a structure check is mechanical and beaten by a placeholder paragraph."
docs.samples.3:
  slug: change-touches-doc
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion docs-touch fails when a --json field, flag, exit code, command, config key or written file in the manifests changed in a commit and no file under the docs folder or the README changed in that commit and its message has no docs: none line. Plant: rename a flag with no doc change and no trailer fails; a new config key with its doc in the next commit fails. Control: a doc change in the same commit, or the trailer, passes"
  open:
    - "Needs the command manifest (a row of the code part)."
    - "docs: none costs nothing to write, so any agent can write it for free."
docs.samples.4:
  slug: worked-example-program
  since: 0.1.0
  level: program
  kind: instruction
  strength: Review
  review_question: "Does the worked example still follow every rule that links to it?"
  open:
    - "No Go row named a reference program; the UI part holds it for UI."
    - "Proposed for lack of a source; the v1 evidence was: practice"
docs.samples.5:
  slug: project-profile-page
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. a structure check that each project's profile page has the exact headings. Plant: a profile page missing a heading fails. Control: a complete page passes"
  open:
    - "No Go or UI catalogue row; the heading list is not written yet."
    - "Proposed for lack of a source; the v1 evidence was: practice"
base/docs/rules/spelling.yaml:
  summary: "Words on screen, in docs and in comments are spelled right against a project word list that sits on one shared base, in one chosen spelling variant."
docs.spelling.1:
  slug: spell-check-docs-and-comments
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "cspell 10.4.0 over source, docs and comments with a project dictionary file; words for product terms; tier 1 on staged files and tier 2 on all. Plant: a misspelt word in a comment, a template and a markdown file fails. Control: a word on the project list passes"
  open:
    - "The reach over docs and comments is planned, not run as a gate."
    - "No Go rule checks prose spelling today; this check is the gap-filler."
    - "v1 evidence, not yet a source: C (1,457 and 1,909 unknown words, untuned)"
  note: Merges the spell-check clause of the retired-word row with the screen-text spelling row and the shared spelling base.
docs.spelling.2:
  slug: one-spelling-variant
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "typos with the en-gb locale, which flags American spellings, run on markdown, HTML and Astro files; the spell check word list for code and comments. Plant: a line with \"color\" fails. Control: a clean British sentence passes"
  relates:
    docs.voice.1:
      how: see
    docs.voice.2:
      how: see
  note: "The voice rules (docs.voice.1 and docs.voice.2) carry the rest of the writing style."
docs.spelling.3:
  slug: word-list-imports-shared-base
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "a check that the repository's spelling file imports the shared spelling base (a part of the check-reexports command). Plant: a spelling file with no import of the base fails. Control: a spelling file that imports the base passes"
  open:
    - Applies to Go repositories only once a spell check for them exists.
    - "Proposed for lack of a source; the v1 evidence was: practice"
base/docs/rules/voice.yaml:
  summary: "How the product writes: the point comes first, punctuation is plain, headings are in sentence case and spelling follows the chosen variant. Docs and text the program prints are two registers: printed text is plain fact with no aside. A number claims no more than its source. Punctuation and the filler list are checks; tone and order are instructions."
docs.voice.1:
  slug: plain-punctuation-and-headings
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "a plain scan for the em dash over every tracked text file. Plant: a line with an em dash in a doc and in a data file fail; a doc with a semicolon passes. Control: a clean sentence passes"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-syntax (Biome form: a GritQL plugin) on string literals that contain an em dash, and on printed-string literals that contain a semicolon. Plant: a source string with an em dash fails; a printed message with a semicolon fails. Control: a string without either passes"
    "3":
      binding: go
      class: test-kit
      tier: "1"
      note: "the golden test of printed output fails a line with an em dash or a semicolon. Plant: a golden line with a semicolon fails. Control: a golden with plain punctuation passes"
  open:
    - "The semicolon rule did not fire in Astro files when tried; the em dash and spelling rules did."
    - "Planned scan; the plant was not run as a gate."
    - "A repo whose own rule format uses the em dash as a separator changes its format."
    - "Sentence-case headings have no check: the prose-style checker that held them was dropped from the register, and whether one comes back is the operator's decision."
  note: "Split from the voice row, which bundled punctuation, spelling and tone."
docs.voice.2:
  slug: point-first-tone
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "Vale 3.26.0 with the vale preset (presets/vale): an existence rule for the repo's filler list and one for the not-X-but-Y form, over docs and the exported printed strings. Plant: a doc line with a listed filler word fails; a doc line in the not-X-but-Y form fails. Control: a plain sentence passes, and with a rule removed its plant passes"
  open:
    - "Vale 3.26.0 is pinned in tools.yaml on darwin, linux and windows, and task tools places it in .tools/bin, but no gate runs the preset's test yet: that test and the gate's member are not built, so this check names no tool key and the rule's check stays planned. The preset was run with Vale 3.26.0 by hand: both plants fail and the control passes."
  review_question: "Does the text lead with its point, does it say only what is true of the code today, and does any printed line carry an aside?"
  relates:
    docs.voice.1:
      how: see
    docs.spelling.2:
      how: see
  note: "The other half of the voice row; the punctuation half is docs.voice.1 and the spelling half docs.spelling.2."
docs.voice.3:
  slug: numbers-carry-their-source
  since: 0.1.0
  level: word
  kind: rule
  strength: Review
  review_question: "Does each figure in this doc say when, on what machine and by whom it was measured, and does it claim more precision than its source?"
  open:
    - "No pattern check yet; a scan for a number with a unit and no date nearby would be a candidate."
base/gates/rules/command.yaml:
  summary: "Every check runs through one shared gate command. Each rule has one home tier with a written budget, a planner picks what a tier runs from declared scope rules and fails closed to a full run, and gate scripts are written so that a failure can never be swallowed."
gates.command.1:
  slug: one-gate-command
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The gate command's own test walks the rule registry and fails when a registered check is not reachable from the command at its home tier, or when a hook or land job calls anything but the command. Plant: A check registered with a home tier but missing from the command fails; a hook that runs a private list of checks fails. Control: Every hook and the land job calling only the one command passes."
    "2":
      binding: go
      class: preset-config
      tier: "2"
      note: "One shared `check` make target from a shared Makefile fragment that the hooks also call. Plant: A check target defined in the Makefile but not reachable from `check` fails. Control: All check targets reachable from `check` passes."
  relates:
    gates.command.4:
      how: see
  open:
    - "Today one TypeScript repo's pre-push hook runs only the fast gate subset, so the one-command rule is not yet true there."
  note: "Same rule as the shared gate script, the one gate command per tier and the gate orchestration kind (see tools). The scope-planning half of the TypeScript source is gates.command.4."
gates.command.2:
  slug: runs-without-helper-tool
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "3"
      note: "Run the gate in a clean clone with a minimal PATH (`env -i PATH=<minimal> make check`), using the shared hook and Makefile fragment; a recipe in the shared fragment using standard tools only. Plant: A Makefile line that calls the helper CLI fails the clean-clone run. Control: The shared fragment alone passes."
gates.command.3:
  slug: home-tier-and-budget
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. Rule-table schema with required `tier` and `budget` fields; the gate runner reads the tier from the table; a test fails when a tier's measured wall time in the gate summary exceeds its budget. Plant: A rule row without a tier fails the schema; a check slowed past its tier's budget fails the budget test. Control: A row with tier and budget, and a check inside budget, passes."
  open:
    - "Tiers exist today as tables in design notes, not as data; a staged-file hook run was timed at 1.9 s (trial) and is the only tier timing seen."
    - "v1 evidence, not yet a source: own measure; D (operator source)"
  note: "Merges the tier-per-rule rule from the Go side and from the web side (each rule names its tier and its budget); also the \"each rule has one home tier\" half of the shared gate command."
gates.command.4:
  slug: plan-from-scope-rules
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. The gate planner reads the declared scope-rule file when selection is on; the plan lists each selected check with the reason the selector chose it; with selection off the gate runs every member uncached. Plant: A changed path in a mapped class that selects nothing for its tier fails the planner test; a gate run with cached test results fails. Control: Each mapped class selects its declared checks; a full uncached run passes."
  relates:
    gates.hooks.4:
      how: see
    gates.command.1:
      how: see
  note: "Split out of the TypeScript source that also holds the one gate command (gates.command.1)."
gates.command.5:
  slug: planner-fails-closed
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. Planner test: each of the listed fail-closed cases (global path, unknown path, unowned or doubly owned file, bad range, dirty tree, failed graph build) yields the full scope with a reason. Plant: A planted unknown path yields a full run; a planted change to the selector yields a full run. Control: A mapped, owned path in a clean tree yields only its declared scope."
gates.command.6:
