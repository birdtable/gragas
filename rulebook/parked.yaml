    "2":
      binding: ts
      class: preset-config
      tier: "0"
      note: "Biome `useImportType` at error, with the layer rule in the separate boundary checker. Plant: a type used only as a type but imported as a value fails under Biome. Control: an explicit type import passes"
  open:
    - "v1 evidence, not yet a source: C (the plugin's import kind was tried)"
