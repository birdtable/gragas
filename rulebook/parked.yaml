  level: type
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "golden harness in the shared test package with the update flag refused under the gate variable and a per-component coverage assertion The golden harness is uitest.Golden. Plant: running the gate with the update flag fails, and a component with only a plain golden fails coverage. Control: a component with plain and tagged goldens at three widths passes"
  relates:
    tests.generated.5:
      how: see
