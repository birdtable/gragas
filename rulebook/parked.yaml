program/service/rules/bootstrap.yaml:
  summary: "Every service entry is built by one shared bootstrap that runs the same steps in the same order. A service writes business code only; plumbing, data-layer helpers and the exposure mode are owned once and never copied."
service.bootstrap.1:
  slug: one-shared-bootstrap
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep or import-restriction rule failing an import of any request-middleware, logger or validator library outside the shared bootstrap package. Plant: a handler file that imports the middleware library directly fails. Control: the same import inside the bootstrap package passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard or import-rule table naming the shared run helper as the only importer of the plumbing packages. Plant: a program package importing the plumbing package directly fails. Control: the run helper importing it passes"
  open:
    - "The reference estate lists the plumbing libraries by name; the allow-list of banned imports is to be built per product from its own bootstrap."
service.bootstrap.2:
  slug: no-local-plumbing-copy
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rules for the known shapes of each plumbing step and handler factory outside the shared package, with a shrink-only count in the ratchet. Plant: a new local handler factory fails. Control: a service that imports the shared factory passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a ratchet counting copies of shared steps outside the shared module, failing when the count rises. Plant: a copied step added to a program fails the count. Control: a program using the shared module passes"
  open:
    - The starting count of copies is to be measured per product.
    - "Proposed for lack of a source; the v1 evidence was: own measure"
service.bootstrap.3:
  slug: no-local-data-plumbing
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rules for hand-written error-code tables, integer parsers, certificate bundle loading and key builders outside the shared data toolkit. Plant: a local SQLSTATE table in a service fails. Control: the shared toolkit call passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "import and forbidigo rules limiting store opening, error mapping and key building to the one owning package. Plant: a second package opening a store connection fails. Control: the owner package passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "Related to no-local-plumbing-copy: that rule counts copies of request steps; this one covers the data layer."
service.bootstrap.4:
  slug: route-unit-closed-files
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "1"
      note: "a repo test walking route folders and failing on a folder missing the handler, contract or schema file, or holding an unlisted file. Plant: a route folder without a schema file fails. Control: a complete folder passes"
    "2":
      binding: go
      class: test-kit
      tier: "1"
      note: "a repo test over the commands folder layout and the layer table. Plant: a command outside the commands folder fails. Control: a command in its home passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.bootstrap.5:
  slug: route-contract-closed-keys
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "contract builder typed to the closed key set, plus an ast-grep rule failing any other key. Plant: a route contract with a params key fails. Control: a contract with path, query, body and headers passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "strict decoding of command and config declarations with unknown fields refused, and the command tree compared with a stored file. Plant: a declaration with an unknown key fails to load. Control: a declaration with known keys loads"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.bootstrap.6:
  slug: pinned-request-order
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "a shared bootstrap test sending an unauthenticated request through every registered route and asserting the handler is never called, and a test asserting the step order list. Plant: a route whose handler runs without a verified identity fails. Control: every route refusing before the handler passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.bootstrap.7:
  slug: exposure-mode-explicit
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
