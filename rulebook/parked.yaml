base/code/rules/comments.yaml:
  summary: "A comment says why and never what, and none narrates a change. A TODO names an issue, commented-out code is refused, a suppression carries a reason, and an interface comment states the contract a reader cannot read from the body."
code.comments.1:
  slug: comment-says-why
  since: 0.1.0
  level: word
  kind: instruction
  strength: Lens
  review_question: "Could someone who never saw this code write this comment from the adjacent lines?"
  open:
    - "This lens was the weakest in the trial and needs a better prompt. Whether a comment says why is semantic, so no mechanical check holds it."
    - "v1 evidence, not yet a source: practice (a study of 60 Go bugs found none)"
code.comments.2:
  slug: todo-names-an-issue
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: ast-grep
      tier: "3"
      note: "tier 1: an ast-grep 0.51.1 rule on comment nodes, a regex for TODO and not TODO(#NNN); tier 3: todocheck (MIT, v0.6.1) checks that the named issue exists and is open. Plant: // TODO fix this and /* TODO later */ are reported; // TODO is not (run). Control: a TODO comment and a string containing TODO pass"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "ESLint core no-warning-comments for todo and fixme with unicorn/expiring-todo-comments, or a small local rule (not no-restricted-syntax), so the tracked form passes (todo-plz ticket-ref is the donor's equivalent), in one shared pattern. Plant: // TODO fix this with no issue id fails. Control: TODO passes"
  open:
    - "The open-issue half rests on todocheck, not run; its last tag is from 2023, so pin a commit or drop that half and keep the ast-grep form. The expiring-todo rule exists but was not run."
    - "The two Go sources disagree on godox; the amended sources say to settle it before marking this a tool."
    - "v1 evidence, not yet a source: practice; D for the web side"
code.comments.3:
  slug: no-commented-out-code
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: gocritic
      fix: auto
      note: "golangci-lint gocritic with enabled-checks [commentedOutCode]. Plant: a block of commented-out calls fails (3 of 3 planted groups flagged, 0 of 1 prose control). Control: a prose comment with code-like words passes"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "sonarjs/no-commented-code (fired on a commented const statement) with a plugin or small rule for the forms it misses; eslint-plugin-etc was rejected (last published 2023-05, peers ESLint 8). Plant: // const x = compute(1, 2); fails. Control: a prose comment passes"
  open:
    - A plugin build would be one small ESLint rule over comments if no maintained one passes.
code.comments.4:
  slug: interface-comment-states-the-contract
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: revive
      fix: auto
      note: "golangci-lint revive exported scoped to the port and shared-package paths in rule data (with the golangci exclusion preset for comments off) and godoclint (doc-comment form). Plant: an exported port method with no comment, and an exported port func whose comment does not start with its name, are both reported. Control: an exported helper in a command package with no comment passes"
    "2":
      tool: golangci-lint
      key: godoclint
      fix: never
      note: "Held by the golangci preset, whose comment on godoclint names this rule."
  review_question: "Does this port's comment state units, absence, ownership, invariants and ordering where they apply, and could any comment here have been written from the name or the line below?"
  relates:
    arch.shared.9:
      how: see
  open:
    - "Half holds; the cheap cure is a filler comment, which the review question asks about. The golangci comments exclusion preset is from memory, not checked."
  note: The web check of the comment is a review question with no check.
code.comments.5:
  slug: comment-hygiene
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. comment-hygiene check of comment-block length against the standard, decoration lines and restated ruling ids, with a shrink-only count of long inline comment groups. Plant: a four-line inline comment group raises the count and fails; a decoration line fails. Control: a three-line comment passes"
  relates:
    code.comments.1:
      how: see
  open:
    - "Conflict in the sources, kept: the Go row ratchets inline comment groups at three lines and the donor standard says 2 to 3 lines, while a web comment-length ratchet was rejected and an interface comment may rightly be longer than a function body (code.comments.1 drops the length clause). The decision between them is open."
    - "The check is a gap in the web rulebook; no stock linter has these three rules."
    - "Some plants and controls of this rule were written at the merge from the sources' description of the check, and have not been run."
code.comments.6:
  slug: suppression-carries-a-reason
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "0"
      note: "@eslint-community/eslint-plugin-eslint-comments require-description (fired on an undescribed eslint-disable-next-line). Plant: an eslint-disable with no reason fails. Control: an eslint-disable with a reason passes"
  open:
    - "Some plants and controls of this rule were written at the merge from the sources' description of the check, and have not been run."
base/code/rules/config.yaml:
  summary: "How code reads its configuration: in one package, through a reader with a default and a doc row per key, and with no literal service address, path, port or name of one installation outside the loaded config."
code.config.1:
  slug: no-address-fallback
