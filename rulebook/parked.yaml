base/arch/rules/measures.yaml:
  summary: "Numbers that show whether the structure is holding: coupling, the cost of adding a provider, change coupling across a boundary, the exported surface, how shared packages age and how repositories move together. Most are reports first; where a guessed ceiling would be beaten by a cheap cure the line is a rise that blocks until the change says why."
arch.measures.1:
  slug: coupling-per-package
  since: 0.1.0
  level: package
  kind: measure
  strength: Answered
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. companion report from go list -json: Ca, Ce and instability per package; a package not in the baseline whose Ce exceeds the ceiling fails; a rise in a package's Ce blocks until answered. Plant: a new package importing 15 siblings fires the ceiling check; the cheap cure (a facade that imports the 15 and is imported by the package) drops Ce and passes, which is why the answered form is wanted. Control: a package with the same Ce as before passes"
  open:
    - "The ceiling is a guess with no fault behind it; the report half is mechanical and the ceiling is not a rule until a number has data. A prototype script exists with a known-positive check (an imported package has Ca of at least 1); no plant for the ceiling."
arch.measures.2:
  slug: cost-of-adding-a-provider
  since: 0.1.0
  level: program
  kind: measure
  strength: Answered
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. companion report on a commit that adds an adapter, counting files and folders touched outside adapter paths; touching core files blocks until answered. Plant: an add-adapter commit that edits core files is reported and blocks until answered. Control: an add-adapter commit that touches only the adapter passes"
  relates:
    arch.ports.1:
      how: see
  open:
    - "It could become a rule if the count of core files touched by an add-adapter commit were bounded, but a bound needs data from real adds (none yet)."
    - "Some plants and controls of this rule were written at the merge from the sources' description of the check, and have not been run."
    - "v1 evidence, not yet a source: own measure; no fault in our record"
