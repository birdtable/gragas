      note: "sloglint in golangci-lint (attr-only, no-global, context options; to verify) plus a run-the-binary test that parses logs for level and time and a canary secret that must not appear. Plant: a log of a canary token, prompt or address fails, and a file log that grows past its cap fails. Control: a log line with level, time and no canary passes"
  relates:
    go.logging.2:
      how: see
  open:
    - "Secret-free needs the canary test; the sloglint option set is to verify."
  note: The version-and-run-id rule for every log line is go.logging.2.
daemon.logging.2:
  slug: journal-priority-prefix
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "terminal test that sets JOURNAL_STREAM and asserts each line carries the systemd priority prefix; without it no prefix The prefix is <N>, the systemd priority; the test runs through uitest. Plant: a line without a prefix under the variable fails. Control: a prefixed line passes"
daemon.logging.3:
  slug: audit-file-and-plain-words
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that the audit writer opens its file append-only in the state folder and that a journal-only audit fails; a test that drives a failing tool and asserts the person's answer holds none of the tool's text while the log does. Plant: an audit written only to the journal fails, and an answer that carries a service manager's raw message fails. Control: an append-only audit file and an answer in the program's own words pass"
program/daemon/rules/notify.yaml:
  summary: "A daemon's notifications are a contract with a person's attention: one closed list of events with a versioned payload, held equal to an example file, sent through channels behind an interface, and sent only on a change, with a quiet baseline, a rate limit, quiet hours and no timer of their own."
daemon.notify.1:
  slug: closed-event-list
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that encodes every event in the closed list and compares the set and each payload with the example file, both ways. Plant: an event added in code and missing from the example file fails, and a field renamed in code fails. Control: a list equal to the example file passes"
daemon.notify.2:
  slug: changes-only-quiet-baseline
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "a table test: an unchanged state sends nothing, a fresh install sends nothing, a second send within the limit is dropped, a quiet-hour good event is held and a bad one passes; and the timer analyser of daemon.resilience.6 finds no timer in the notify package. Plant: a fresh install that sends a notification for every subject fails, and a notify package with its own ticker fails. Control: a change after a baseline sends one notification passes"
  relates:
    daemon.lifecycle.5:
      how: see
program/daemon/rules/outbound.yaml:
  summary: "A daemon that calls out keeps its credentials where they were sent: a client carrying a credential follows no redirect, a request to an owner-configured address is signed and dialled at the address it checked, kept records never hold a channel's address or token, and a shared public allowance is spent within a daily budget."
daemon.outbound.1:
  slug: no-redirect-signed-dialled-checked
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "tests on the shared client constructor: a credentialed request to a stub that redirects must fail naming the callee; a webhook to a stub asserts the header token, the signature over timestamp and body, a single resolve and a dial to the checked address; an http address outside private ranges is refused. Plant: a client that follows a redirect with an Authorization header fails, and a token in the query string fails. Control: the shared client refusing the redirect and signing the body passes"
  relates:
    daemon.access.5:
      how: see
    service.outbound.2:
      how: see
  note: "daemon.access.5 and service.outbound.2 hold timeouts; this rule adds where a credential may travel."
daemon.outbound.2:
  slug: channel-secrets-out-of-records-daily-budget
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "a canary test that configures a channel with a canary address and token, drives a failure and reads every record, answer and log line for the canary; a test that the budget table has an entry for every shared-allowance client and that the call past the budget is skipped. Plant: a channel status answer carrying the webhook address fails, and a registry client with no daily budget fails. Control: an answer naming the channel only, and a budgeted client, pass"
program/daemon/rules/resilience.yaml:
  summary: "A daemon bounds its work, reads only on request with a measured idle budget, and recovers: a request body cap, a cap on concurrent requests and bounded queues; every goroutine recovers at its edge; failed work parks with a reason and a redrive path. A retried path is safe twice and retries come from one constructor."
daemon.resilience.1:
  slug: bounded-work
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "test that sends more than the cap and sees a refusal. Plant: a handler with no cap accepts the oversized request and fails. Control: the capped handler refuses it"
  relates:
    daemon.units.3:
      how: see
daemon.resilience.2:
  slug: goroutine-recovers-at-its-edge
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "start test with a panic in a goroutine, asserting recovery at the edge or a supervised restart within the limit The start test is a panic-in-goroutine test. Plant: a goroutine that panics and takes the process down with no restart fails. Control: a goroutine that recovers passes"
  relates:
    go.concurrency.2:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
daemon.resilience.3:
  slug: failed-work-parks
  since: 0.1.0
  level: program
  kind: instruction
  strength: Review
  review_question: "Where does this failed work park, with what reason, and how is it redriven?"
  open:
    - "Dead-letter redrive is review; no check is named."
    - "Proposed for lack of a source; the v1 evidence was: practice"
daemon.resilience.4:
  slug: retried-path-safe-twice
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: R
      note: "v1 class shared-code. shared twice-call helper plus a list of writing routes from the contract; a test fails when a writing route lacks a twice-test. Plant: an append-on-every-call handler fails. Control: an idempotent handler passes"
  relates:
    cli.commands.6:
      how: see
    cli.commands.2:
      how: see
  open:
    - "Proposed plant for a repeated idempotency key; no duplicate-effect fault in a daemon of ours so far."
daemon.resilience.5:
  slug: one-retry-constructor
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: ast-grep
      tier: R
      note: "ast-grep ban of a sleep inside a loop around a call, and depguard ban of retry libraries. Plant: a hand-rolled retry loop fails. Control: a call through the retry constructor passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
daemon.resilience.6:
  slug: no-polling-reads-on-request
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tier: "2"
      note: "a syntax rule refusing time.NewTicker, time.Tick and a sleep inside a loop outside the packages listed with a recorded decision; a test that runs the daemon idle with no requests and asserts no probe or read is made. Plant: a ticker that samples the machine every minute with no recorded decision fails. Control: a read on request through the shared short cache passes"
  relates:
    daemon.resilience.7:
      how: see
daemon.resilience.7:
  slug: measured-idle-budget
  since: 0.1.0
  level: release
  kind: measure
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. a release check that every recurring run and probe in the run table has a budget entry with a measured value, a method, a machine and a date no older than its last change. Plant: a new recurring run with no budget entry fails. Control: a run with a measured budget dated after its last change passes"
program/daemon/rules/units.yaml:
  summary: "A daemon runs under the operating system's service manager (launchd on macOS, systemd on Linux) from one rendered template per manager: the files are well formed, the unit runs with the least identity that can reach what it serves and a sandbox, it restarts on failure only with a backoff, and each state file has one writer."
daemon.units.1:
  slug: unit-files-well-formed
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "plutil -lint on the rendered plist (macOS), the unit-render test of daemon.units.2, systemd-analyze verify on a Linux host. Plant: a malformed plist fails. Control: the rendered plist passes"
  open:
    - "The plutil plant was run in an earlier trial; the Linux verify step needs a Linux host."
daemon.units.2:
  slug: least-identity-and-sandbox
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "render each manager's template and byte-compare to a golden; systemd-analyze security --threshold N on Linux; plutil -lint on macOS and a test that the plist sets no root identity; a test that the notes carry a trust-line section. Plant: a systemd template dropping a sandbox directive fails, and a plist run as root fails. Control: the full template for each manager passes"
  open:
    - "Security threshold behaviour is from source, not run."
daemon.units.3:
  slug: restart-on-failure-only
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "unit-render test with one row per manager asserting restart on failure only, a backoff and a limit (systemd Restart=on-failure, RestartSec, StartLimitBurst; launchd KeepAlive SuccessfulExit false, ThrottleInterval), that a one-shot job's plist or unit has no load-time or keep-alive key and is written outside the login-loaded folder, and that the health document carries a restart count. Plant: a unit with Restart=always, a plist with KeepAlive true on an idle-exit daemon, and a one-shot plist in the LaunchAgents folder each fail. Control: restart on failure with a backoff and a limit, and a one-shot job in the state folder, pass"
  relates:
    daemon.lifecycle.5:
      how: see
    daemon.resilience.1:
      how: see
  note: "Split from the daemon bounds-and-supervision row; the other parts are daemon.resilience.1 to 3. Rewritten with daemon.lifecycle.5 (idle by default) as the target asks."
daemon.units.4:
  slug: one-writer-no-widening
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "a table test of state files, writers and folder owners against the code's write paths, and a route-table test that refuses a writing route with no named design. Plant: a second writer of one state file fails, and a privileged write into a person-owned folder fails; a passed POST route with no design fails. Control: one writer per file in its own folder, and read-only passed routes, pass"
  relates:
    store.seams.4:
      how: see
  note: "store.seams.4 records writers per seam; this rule binds the privilege of each writer."
program/pages/rules/cycle.yaml:
  summary: "What a repository of HTML pages with no build, or a repository of Markdown or nothing, adds to the moments of the development cycle: links that resolve offline against a reviewed baseline, a ledger that matches the pages, a rendered golden and a narrow-width property per page with the accessibility engine, a members file that says when there is no push tier, and a pack that rebuilds on a fresh clone. These lines add members to the core moments and never a moment of their own."
pages.cycle.1:
  slug: links-resolve-offline-against-a-baseline
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Does this commit tier check every link offline, and how long is the baseline today against the first run?"
  relates:
    docs.links.1:
      how: see
    gates.ratchets.1:
      how: see
    supply.secrets.1:
      how: see
  open:
    - "Planned check: the members file holds the link member at commit and the baseline is a registered baseline. No tool key is bound yet; the docs part's link checker is the candidate."
pages.cycle.2:
  slug: the-ledger-matches-the-pages
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Does this commit tier compare the ledger with the pages both ways, and is the ledger generated or written?"
  relates:
    docs.freshness.1:
      how: see
    gates.own-rules.3:
      how: see
  open:
    - "Planned check: the members file holds the ledger member at commit with both counts in the report. No tool key is bound yet."
pages.cycle.3:
  slug: a-golden-a-narrow-property-and-the-engine-per-page
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Which width is each page's golden, who updated it last, does the narrow run check overflow, and does the engine run over every page?"
  relates:
    tests.journeys.8:
      how: see
    web.accessibility.1:
      how: see
    gates.command.30:
      how: see
  open:
    - "Planned check: the members file holds the render member with os and net fields and a page count in the report. No tool key is bound yet."
pages.cycle.4:
  slug: no-code-means-no-push-tier-and-says-so
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Does this repository's members file say what its push tier runs, and does it say when that is only the commit members?"
  relates:
    gates.command.23:
      how: see
    gates.plants.8:
      how: see
  open:
    - "Planned check: the runner refuses a repository with no members file and prints the file's statement for one with no push members. No tool key is bound yet."
pages.cycle.5:
  slug: the-pack-rebuilds-on-a-fresh-clone
  since: 0.1.0
  level: release
  kind: instruction
  strength: Lens
  review_question: "Does this release build the pack and the index from a fresh clone of the tag, and what does the build do when it finds no earlier output?"
  relates:
    gates.command.21:
      how: see
    supply.release.10:
      how: see
  open:
    - "Planned check: the release member's report names the two outputs and their sizes. No tool key is bound yet."
program/service/rules/authz.yaml:
  summary: "Who may call what is declared on every route in one permission grammar, denied by default including reads, held in a catalogue generated from code, and enforced by shared code. Identity comes from the gate, one source per socket and never forwarded; a service keeps no login; only the identity owner touches the provider; and a change that opens a new door answers a threat question."
service.authz.1:
  slug: route-declares-caller
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "contract lint failing an operation with no security requirement and no permission extension. Plant: an operation with neither fails. Control: a declared operation passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a route-list test failing a daemon route with no declared callers. Plant: a route with no declared callers fails. Control: a declared route passes"
    "3":
      binding: any
      class: test-kit
      tier: "2"
      note: "a test over the permission declaration: every permission has three parts in the declared casing, no owner part is another program's reserved name, and a grant naming a permission not declared on this machine is refused. Plant: a permission with two parts, a part in a second casing, or a grant for an undeclared subject fails. Control: a declared three-part permission and a grant for it pass"
  relates:
    service.contract.10:
      how: see
  open:
    - "In Go, a per-route declared caller list for daemon routes is a gap with no row yet."
service.authz.2:
  slug: access-catalogue-regenerated
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "gate step regenerating the catalogue from the route declarations and failing on a diff with the committed file. Plant: a route added without regenerating the catalogue fails. Control: a regenerated catalogue passes"
service.authz.3:
  slug: identity-never-from-body
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing reads of actor or user identity fields from the validated request body. Plant: a handler that reads actor id from the body fails. Control: one reading it from the auth context passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a daemon test that a request with a forged caller field in the body or header is attributed to the peer credentials. Plant: a forged caller header accepted fails. Control: the peer credential used passes"
    "3":
      binding: any
      class: test-kit
      tier: "2"
      note: "a test over the actor type refusing a system actor with an empty subject, and a schema check that no verb input carries an actor field. Plant: a system write recorded with no job as subject fails. Control: a system write naming its job passes"
service.authz.4:
  slug: server-refuses-what-page-hides
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "3"
      note: "a Go route-list test held by the daemon repository: every contract route requested without a grant, expecting 401 or 403, count equal to the contract count. Plant: removing the server check on one route (the page hides it) fails; a tested route count below the contract count fails. Control: all gated routes refusing a visitor passes"
    "2":
      binding: ts
      class: test-kit
      tier: "3"
      note: "the same route-list helper over the generated contract in a service test. Plant: a gated route answering a visitor with no grant fails. Control: a refused route passes"
  open:
    - "The route-list test is planned, not built."
  note: "Held in Go (daemon tests) and named in the front-end part for the page half. The target programs hold the route list."
service.authz.5:
  slug: field-visibility-one-owner
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "import and ast-grep rules limiting the field filter and scope enforcement to the shared authorisation package. Plant: a handler that deletes fields by hand to filter output fails. Control: the shared filter call passes"
    "2":
      binding: go
      class: preset-rule
      tier: "1"
      note: "import rule giving one package the redaction function, and a test that a secret is never printed. Plant: a secret value printed fails. Control: a redacted value passes"
service.authz.6:
  slug: permissions-point-at-live-definitions
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a registry test resolving every permission mapping to a definition with status active. Plant: a mapping to a retired permission fails. Control: a mapping to an active one passes"
service.authz.7:
  slug: no-handrolled-credential-checks
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rules failing token verification or HS-family signing calls and identity-service HTTP calls outside the identity owner package. Plant: a handler that decodes a token by hand fails. Control: verification through the shared bootstrap passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "gosec enabled and forbidigo on credential check primitives outside the one owner package. Plant: a hand-written token check outside the owner fails. Control: the owner package passes"
    "3":
      binding: any
      class: preset-rule
      tier: "1"
      note: "a dependency ban on OpenID Connect client and password-hashing libraries, and a route lint refusing a login route, outside the identity owner. Plant: a service that adds a login route and a password hash fails. Control: a service that reads identity from the gate passes"
  relates:
    service.authz.15:
      how: see
service.authz.8:
  slug: catalogue-conformance-fails-closed
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "v1 class shared-code. shared conformance test run in every service and daemon, sending a request with no identity to every route and static path in the catalogue and asserting a refusal unless the route is marked public with a reason. Plant: a read route or a static file served to a request with no identity fails, and a catalogue-less service that serves any route fails. Control: a service with a conforming catalogue passes"
service.authz.9:
  slug: only-identity-owner-touches-provider
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "import-restriction rule allowing the identity provider SDK in the identity owner package only. Plant: a service importing the identity provider SDK fails. Control: the owner package passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard rule limiting the credential store package to the one owner. Plant: a second package opening the credential store fails. Control: the owner passes"
service.authz.10:
  slug: identity-provider-settings-pinned
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rules over the infrastructure code: every app client sets ExplicitAuthFlows and the user pool carries ignoreChanges: ['schemas']. Plant: an app client with no explicit auth flows fails; a pool without the ignore entry fails. Control: both present passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.authz.11:
  slug: cors-allow-list-safe
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tool: ast-grep
      tier: "1"
      note: "a unit test and ast-grep rule over the allow-list builder: it rejects the wildcard origin and the privileged header names. Plant: a builder call that produces origin star or the privileged header in allow-headers fails. Control: an explicit origin list passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a daemon test that a cross-site request is refused and only expected hosts are answered. Plant: a request from an unexpected host answered fails. Control: an expected host passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
service.authz.12:
  slug: boundary-change-threat-question
  since: 0.1.0
  level: process
  kind: instruction
  strength: Review
  review_question: "What is newly reachable through this change, by whom, and what would an attacker try first?"
  open:
    - "No plant as a gate: a seeded diff that grants an internal-plane invoke to a public route must be flagged by the reviewer lens."
    - "An agent answers in seconds and can invent the answer, so on sensitive paths the answer needs a reader (inference)."
  note: "Beyond route-declares-caller, which only guarantees a new route is not unguarded; it does not ask whether the new door opens something nobody considered."
service.authz.13:
  slug: issued-tokens-hashed
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a store test that issues a token and a secret, reads the raw rows and asserts the token's plain value and the secret's plain value are absent, and that a second read of the token returns nothing. Plant: a token stored in plain text fails, and a secret row readable without the key fails. Control: a hashed token and an encrypted secret pass"
  relates:
    cli.config.4:
      how: see
    supply.secrets.2:
      how: see
  note: "cli.config.4 and supply.secrets.2 hold secret references and file modes; this rule covers secrets at rest in a store."
service.authz.14:
  slug: reads-filtered-to-the-asker
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a shared authorisation test that calls every list, item and writing route as a caller holding only part of the permissions, and asserts filtered lists, not found for hidden items, and a bare refusal for act without read. Plant: a list that returns 403 for a partly hidden set fails, and an item route that answers 403 for an item the caller may not read fails. Control: a filtered list and a not-found answer pass"
service.authz.15:
  slug: one-identity-source-per-socket
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a door test that sends a proxy identity header to a listener of another source and asserts it is ignored, sends the header twice and asserts 400, and a test that the role map lives in the program's own file; a code search refusing an outbound request that carries identity or permission headers. Plant: a proxy header believed on the local socket fails, and a request with two identity headers that is admitted fails. Control: a header believed only on its own socket passes"
service.authz.16:
  slug: person-only-acts-and-access-history
  since: 0.1.0
