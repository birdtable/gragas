  open:
    - "The rebuild order was tested by hand on one SQLite version; the runner is proposed and the plants are proposed."
    - "No shared package; the pattern is written down and not extracted."
  note: "The Postgres counterpart (numbered migrations, expand and contract) is in the postgres part."
