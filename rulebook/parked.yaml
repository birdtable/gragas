lang/go/rules/concurrency.yaml:
  summary: "Code is sequential by default and a goroutine needs a measured reason. Goroutines have an owner that waits for them and stops them, locks are released on every path, the root context lives only at the edge, an interrupt, and SIGTERM where the system sends one, stop a program cleanly, and a package that starts goroutines is tested with the race detector and a leak check."
go.concurrency.1:
  slug: context-only-at-the-edge
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: forbidigo
      fix: never
      note: "golangci-lint forbidigo with type analysis on the two calls, exclusion rules for cmd main files and test files, existing hits in a shrink-only list; contextcheck and noctx for missing propagation forbidigo runs with analyze-types: true. Plant: context.Background() in an internal store package fails. Control: the same call in cmd main is not reported"
    "2":
      tool: golangci-lint
      key: contextcheck
      fix: never
      note: "Held by the golangci preset, whose comment on contextcheck names this rule."
  open:
    - The two propagation linters were priced at 27 and 10 hits.
    - "Proposed for lack of a source; the v1 evidence was: own measure"
go.concurrency.2:
  slug: goroutine-has-an-owner
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: revive
      fix: auto
      note: "ast-grep rule on go statements outside the owner-helper allow list with a shrink-only list, plus go vet waitgroup and the revive concurrency rules The revive rules are datarace, waitgroup-by-value and forbidden-call-in-wg-go; the leak library is uber-go/goleak v1.3.0 (MIT, 24 Oct 2023). Plant: go func(){ for { } }() in a package fires, and a test leaving it running fails the leak check. Control: errgroup.Go with Wait passes"
    "2":
      tool: golangci-lint
      key: govet
      fix: auto
      note: "Held by the golangci preset, whose comment on govet names this rule."
  review_question: "Who waits for this goroutine, and what stops it on cancel?"
  relates:
    go.concurrency.6:
      how: see
  open:
    - Correct shutdown order is review.
    - "goleak was last tagged in 2023; alive but slow."
    - "Proposed for lack of a source; the v1 evidence was: own bugs (5 of 60)"
go.concurrency.3:
  slug: locks-released-on-every-path
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tier: R
      note: "goconcurrencylint rule GCL1001 (a mutex locked and not unlocked on some path), with its wait-group rule left off. Plant: a method returning early between Lock and Unlock reports GCL1001. Control: a method with an explicit Unlock and one with defer pass"
  review_question: "Who is the one writer of this state, and what does this lock guard?"
  open:
    - "A lock-without-defer syntax rule was tried first and rejected: 9 of 9 sampled hits were deliberate short critical sections (122 hits in six clones)."
    - "The rule is Hard and active, and its check row names no tool key, so its standing is planned, derived until a key resolves (the shared module's issue 635). Searched 12 Nov 2026: the pinned golangci-lint 2.15.0 lists no linter for a lock taken and not released (help linters names none); go vet copylocks reports a copied lock only; staticcheck SA2003 reports a deferred Lock only. goconcurrencylint GCL1001 (v0.6.0, MIT) is the match, but it ships to golangci-lint only as a module plugin, which needs a custom binary built by golangci-lint custom, and golangci/golangci-lint#6496 to add it to the stock binary is open. A preset that enabled it would fail on the stock binary. Binding waits for that pull request to land in a release; a custom-built binary is not taken (the shared module's issue 635)."
    - "The wait-group rule gave 1 hit, a false positive; keep it off. The tool is young and small: pin it."
    - A guarded-by annotation analyzer exists but needs annotations on every field and was not run.
    - "v1 evidence, not yet a source: own bugs (5 of 60)"
go.concurrency.4:
  slug: clean-stop-on-signal
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tool: ast-grep
      tier: "2"
      note: "shared matrix interrupt test over the built binary, plus an ast-grep ban on signal.Notify outside the shared serve helper. Plant: a program that ignores the interrupt makes the test time out. Control: a NotifyContext program passes"
  open:
    - Practice-only marginal assertion on the matrix helper.
go.concurrency.5:
  slug: state-cleared-with-its-cause
  since: 0.1.0
  level: type
  kind: instruction
  strength: Lens
  review_question: "What clears this new state when the thing that caused it stops?"
  open:
    - "A test that stops the thing and asserts the tree is empty can be written per feature; it is a test, not a check."
    - "Candidate form is the leak check plus a shared stop-then-assert-empty helper, with a model asking what clears new state."
    - "v1 evidence, not yet a source: own bugs (5 of 60)"
go.concurrency.6:
  slug: race-and-leak-checks
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "2"
      note: "race flag in the release gate and the race make target; a pre-push hook step that runs it for packages whose go statements changed; companion check goroutine-tests (go/packages finds production packages with go statements and requires goleak.VerifyTestMain or the goroutineleak profile in that package's tests); a recipe form uses go list -f. Plant: a package with a goroutine and no leak check fails; a push that changes a go statement without the race step fails the hook; a release workflow without the race run fails the workflow check. Control: a package with the test-main verifier passes"
  open:
    - "Which leak check is open (conflict C-28)."
go.concurrency.7:
  slug: sequential-by-default
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule for a go statement with no measurement comment above it, and forbidigo on go statements, tickers, timers and AfterFunc in adapter packages (path rule over the host folder). Plant: a go statement with no comment above it fires; time.NewTicker in internal/host/linux fires. Control: a go statement with a measured-gain comment in the core passes"
  review_question: "Does the measurement cited at this goroutine show the gain it claims?"
  relates:
    go.concurrency.2:
      how: see
  open:
    - "The owner of every goroutine is go.concurrency.2; idle by default is the daemon part's."
lang/go/rules/cycle.yaml:
  summary: "What a Go project adds to the moments of the development cycle: format and tidy as diffs at commit, the parallel-test linters, the build settings in the stamp key, and the module graph fetched for every platform. The core moments and their rules are the tests and gates parts; these lines add members and never a moment."
go.cycle.1:
  slug: format-and-tidy-as-diffs
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Do the format and tidy members of this commit tier list differences and exit non-zero, or do they write?"
  relates:
    gates.command.28:
      how: see
    gates.hooks.3:
      how: see
    supply.install.11:
      how: see
  open:
    - "The tidy member runs (make tidy, tests in cmd/gragas-dev/tidy_test.go), but no check row names it: a check that binds no preset tool key counts in checks-unresolved, checks-without-fix and, on this instruction, advisory-with-checks, and each baseline may only fall. tools/ is held to go.mod and go.sum in full, because the installer puts tools/go.sum back as committed after it primes the module cache. The format half has no check either."
go.cycle.2:
  slug: parallel-test-linters-with-a-stated-reason
  since: 0.1.0
  level: package
  kind: instruction
  strength: Lens
  review_question: "Are the two parallel-test linters on in this project's lint preset, and does each serial test carry a serial comment naming its state?"
  relates:
    tests.runners.4:
      how: see
    gates.command.22:
      how: see
  open:
    - "Planned check: the shared lint preset enables both linters; the preset does not yet, and the binding waits for it. Plant: a test file with no parallel call and no serial comment fails. Control: the same file with the comment passes."
go.cycle.3:
  slug: build-settings-in-the-stamp-key
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  note: "Retired. There is no stamp and no key for it to hold the Go build settings: the tiers run every time, so the settings are read from the environment of the run itself."
  review_question: "Which build settings are in this stamp's key, are they read from the go tool, and what does the runner do under a workspace file?"
  relates:
    gates.land.15:
      how: see
    gates.land.11:
      how: see
  open:
    - "Planned check: the runner's report lists the key's fields and a test changes each setting and sees a new key. No tool key is bound yet; the shared runner is later work."
go.cycle.4:
  slug: module-graph-for-every-platform
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Does the tools step download the whole module graph, and does the one cross-compile smoke run with the network blocked?"
  relates:
    gates.command.21:
      how: see
    supply.install.2:
      how: see
    supply.release.7:
      how: see
  open:
    - "Planned check: the cross-compile member runs under the network block on a fresh clone in the tier's own test. No tool key is bound yet."
lang/go/rules/errors.yaml:
  summary: "Go returns errors as values, so the language needs its own rules: every error is handled or returned, wrapped with %w and context, handled once, panics are for programmer errors, only main exits and endings are mapped to exit codes in one place, and an error is typed again after it crosses a boundary."
go.errors.1:
  slug: no-swallowed-errors
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: errcheck
      fix: never
      note: "golangci-lint errcheck with check-type-assertions and check-blank on for non-test code. Plant: os.Remove(path) with the result dropped fails, and an unchecked type assertion fails. Control: the handled form passes"
    "2":
      tool: golangci-lint
      key: ineffassign
      fix: never
      note: "Held by the golangci preset (default: standard turns it on): most of what it reports is an err overwritten before it is read, which is an error swallowed"
  open:
    - "The plant was never recorded in a repo: run it once per repo at adoption."
go.errors.2:
  slug: wrap-with-w
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: errorlint
      fix: auto
      note: "golangci-lint errorlint (errorf %w, comparison, type assertion on wrapped errors); wrapcheck stays off because it contradicts do not annotate when it adds nothing. Plant: fmt.Errorf(\"read: %v\", err) fails, and err == io.EOF on a wrapped error fails. Control: %w and errors.Is pass"
  review_question: "Does this wrapped error say what was being done, not only that it failed?"
  open:
    - "Half: the %w and comparison half is the rule; the context half is review. The plant exists from an earlier linter trial."
go.errors.3:
  slug: panics-for-programmer-errors
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: forbidigo
      fix: never
      note: "golangci-lint forbidigo with type analysis on the builtin panic outside main and tests with a shrink-only allow list; errcheck check-type-assertions for the unchecked assertion (forcetypeassert was skipped as a duplicate) forbidigo runs with analyze-types: true. Plant: panic(\"boom\") fails, and x := v.(string) fails. Control: a panic in a path excluded by the exclusion rules passes"
    "2":
      tool: golangci-lint
      key: errcheck
      fix: never
      note: "Held by the golangci preset, whose comment on errcheck names this rule."
  review_question: "Can this panic reach a caller of the package's API?"
  open:
    - Run with golangci-lint 2.14.0. Whether a panic crosses a package API is review.
    - "Proposed for lack of a source; the v1 evidence was: own measure"
go.errors.4:
  slug: only-main-exits
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: revive
      fix: auto
      note: "golangci-lint revive deep-exit plus forbidigo as a second net, with max-issues-per-linter and max-same-issues set to zero so repeats are not hidden; an ast-grep count of functions that map to exit codes, which must be one. Plant: os.Exit(3) and log.Fatalf in a non-main package each fail; a second switch from error to exit code in a command package fails the count. Control: main calling os.Exit with the code from the one mapping function passes"
    "2":
      tool: golangci-lint
      key: forbidigo
      fix: never
      note: "Held by the golangci preset, whose comment on forbidigo names this rule."
  relates:
    cli.exit.1:
      how: see
  open:
    - "Test main calling exit is legal in old Go, so test files are path-excluded."
go.errors.5:
  slug: error-string-style
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: staticcheck
      fix: auto
      note: "golangci-lint staticcheck ST1005 enabled once the style is ruled, with a written exception list in rule data. Plant: errors.New(\"Cannot open file.\") fails. Control: errors.New(\"cannot open file\") passes"
  open:
    - "Blocked on the style ruling (conflict C-15); the mechanism is ready once settled."
    - "Proposed for lack of a source; the v1 evidence was: practice"
go.errors.6:
  slug: nil-flows-checked
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "nilaway with the module included, run at tier 3; findings ratcheted per package against a baseline file that only falls; the tool pinned by pseudo-version in a tools module Invocation: nilaway -include-pkgs=<module> ./... Plant: a map lookup then field read and a nil pointer then field read give two findings. Control: the guarded forms give none"
  open:
    - "Advisory plus a ratchet: the count cannot rise, nothing else fails. It fails the rule definition only if the ratchet is skipped."
    - "The tool has no tagged release (pushed Oct 2026, source says)."
    - "Proposed for lack of a source; the v1 evidence was: practice"
go.errors.7:
  slug: handle-once
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tier: R
      note: "errlogreturn as a standalone analyzer or a plugin: reports a function where one error reaches a logger and a return on the same path; conservative, so log and return on different branches pass. Plant: slog.Error then return fmt.Errorf in one branch reports both lines. Control: a function that only returns passes, and a boundary function that logs then returns an exit code passes"
  review_question: "Does a caller branch on this sentinel or typed error, and is the error both logged and returned here?"
  open:
    - "Half: the log-and-return half is the rule; sentinel-only-when-branched is review."
    - "The tool is days-old in practice (first release Oct 2026): pin the version and keep the plant as its selftest. Four other repos not run."
go.errors.8:
  slug: errors-typed-across-boundaries
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rules for err.Error() compared with == or passed to strings.Contains, HasPrefix or EqualFold, plus a round-trip test per boundary encoding every word and decoding it back to errors.Is equality. Plant: if err.Error() == \"busy\" fails; a word added to the list with no decode case fails the round-trip test. Control: errors.Is(err, ErrBusy) after a wire round trip passes"
  relates:
    cli.errors.2:
      how: see
lang/go/rules/layout.yaml:
  summary: "What only a Go module has: the layout template every program starts from, whether init functions exist, whether the module carries local replace directives, and how shipped binaries are built."
