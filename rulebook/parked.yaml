data/store/rules/seams.yaml:
  summary: "How code meets a store, whatever the engine. Entry code never touches a store and calls a typed function of the store's one package; the seam is declared by its consumer in domain words; a store is opened in one place; who writes each store and who owns each schema number is on record; and a store says whether it can be rebuilt."
store.seams.1:
  slug: entry-code-never-touches-a-store
