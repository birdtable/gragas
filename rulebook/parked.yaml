base/tests/rules/measures.yaml:
  summary: "Every tier's suite has a wall-time budget for the whole run and per package, measured on the machine that runs it and recorded per tree with the load, so a suite written by agents cannot grow unnoticed to hours. Coverage is reported and never a threshold in the inner loop, a time limit is judged on medians, and size and deletion candidates are reports."
tests.measures.1:
  slug: wall-time-recorded
  since: 0.1.0
  level: program
  kind: measure
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. runner writes a times file per run with tier, seconds and the load (the load average where the system gives one, else the tree's CPU time); schema test fails a summary without time or load. Plant: a summary without load fails the schema. Control: a summary with time and load passes"
  open:
    - "The times file shape was trialled in the web notes; the Go summary fields exist in one repo, which also records load."
    - "v1 evidence, not yet a source: own measure (operator direction)"
tests.measures.2:
  slug: budget-file-only-falls
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. budget file with a ceiling and a measured floor per tier (whole, and selected where selection is on) and per package; raising a ceiling is refused unless the same change carries a new floor measurement; a ratchet on packages over 5 s. Plant: raising a budget with the old floor is refused, and a test package slowed past the ratchet fails. Control: an unchanged budget passes, and a raised ceiling with a new floor measured in the same change passes"
  open:
    - The margin between floor and ceiling is set per repo at adoption.
    - "The web catalogue's starting figures are guesses; the Go budgets come from the first measurement."
tests.measures.3:
  slug: release-time-budget
  since: 0.1.0
  level: release
  kind: measure
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "4"
      note: "a hard timeout-minutes on the release job set to the red line; the tier budgets are targets only. Plant: a release job with no timeout fails the config check. Control: a job with the red-line timeout passes"
  open:
    - The 20 minutes is labelled a guess until a release is measured step by step.
tests.measures.4:
  slug: deletion-candidates-listed
  since: 0.1.0
  level: program
  kind: measure
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. report from failure history and per-test coverage, and churn by path class per release. Plant: a fixture history with one known candidate must list it. Control: a history with no candidate lists none"
  open:
    - "The window length is a guess; the report says so. Report only."
tests.measures.5:
  slug: coverage-reported
  since: 0.1.0
  level: program
  kind: measure
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "gate scan bans a coverage floor (a coverage-threshold tool or any fail-under) in Makefile or workflow; the record keeps -cover with no floor The gate scan is gatescan; it bans a coverage-floor tool such as go-test-coverage or any fail-under line. Plant: a Makefile line with a coverage threshold fails. Control: -cover only passes"
    "2":
      binding: ts
      class: preset-config
      tier: "4"
      note: "coverage runs only at the slowest tier as a reported percentage, and the runner config carries no threshold. Plant: a coverage threshold in the runner config fails the read-back. Control: reporting only passes"
  open:
    - "The web catalogue has no row of its own, and no per-changed-file report exists for the web side."
tests.measures.6:
  slug: timing-limits-on-medians
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. comparison helper that runs each side at least three times in one window on one host and compares medians (hyperfine gives runs and median in JSON); a limit judged on fewer runs is refused by the helper. Plant: a limit judged on one run per side is refused. Control: three runs per side pass"
  open:
    - "Judging a limit without the helper is not caught; hyperfine was not run."
    - "Proposed for lack of a source; the v1 evidence was: own measure"
tests.measures.7:
  slug: performance-ceilings
  since: 0.1.0
  level: process
  kind: instruction
  strength: Review
  review_question: "How many runs and at what load produced this ceiling, and what margin was applied to the 99th percentile?"
  open:
    - "No check holds it; carved out of the cached-result row, which is a number method."
    - "Proposed for lack of a source; the v1 evidence was: D"
tests.measures.8:
  slug: test-size-classes
  since: 0.1.0
  level: function
  kind: measure
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. size-class report by build tag or name, with a tracer report of what each test touched; enforcement by running small tests under a no-network sandbox, which go-proc's sandbox gives where the system has a block; where it has none the run is refused by name (sandbox.ErrNoBlock) and never made unblocked. Plant: a small test that opens a socket fails under the sandbox. Control: a small test touching only temp passes"
  open:
    - "Enforcement is unsolved in Go; sandbox-exec on macOS and a network namespace on Linux were not tried."
    - The must-enforce strength Hard is a proposal that the sandbox run is built.
    - "Proposed for lack of a source; the v1 evidence was: practice"
tests.measures.9:
  slug: loaded-host-pass-is-a-finding
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Did this tier pass its budget on a quiet host, or only because the host was busy?"
  relates:
    tests.measures.2:
      how: refines
    tests.measures.7:
      how: see
    gates.command.7:
      how: see
  open:
    - "Planned check: the gate's report prints the unjudged clause in its first lines and the stamp records the run as unjudged. That is a change to gate code and to gate/budgets.yaml, both protected paths, and is later work."
tests.measures.10:
  slug: a-budget-is-the-floor-times-a-margin
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Where is this tier's floor written, with what date, machine and load, and is the budget 1.5 times it?"
  relates:
    tests.measures.2:
      how: see
    tests.measures.9:
      how: see
    gates.command.7:
      how: see
  open:
    - "Planned check: the budgets file holds a floor row with date, machine and load for each tier and the budget equals the floor times 1.5, held by a test over the file. No tool key is bound yet; the floors are measured by later work."
tests.measures.11:
  slug: a-third-of-the-timeout-is-a-finding
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "How long does this test take on an idle host, what is its timeout, and is the first over a third of the second?"
  relates:
    tests.runners.5:
      how: see
    tests.runners.8:
      how: see
    tests.flakes.4:
      how: see
  open:
    - "Planned check: the runner reads per-test times from the test tool's output and lists each over a third of its timeout. No tool key is bound yet."
tests.measures.12:
  slug: an-inconclusive-timing-has-a-bound
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Is this timing judged against a reference from the same run, what happens to an inconclusive reading, and after how many does it lock?"
  relates:
    tests.flakes.4:
      how: see
    tests.measures.6:
      how: see
    tests.measures.9:
      how: see
  open:
    - "Planned check: the budget member records each inconclusive reading with the load and counts them against the bound. No tool key is bound yet."
base/tests/rules/runners.yaml:
  summary: "One runner runs the unit tests in the gate tiers from one shared preset, with its worker count derived from the slots the job tool gives it and heavy tests serialised across sessions."
tests.runners.1:
  slug: unit-tests-in-the-gate
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "2"
      note: "the gate's rule table names the unit-test step for every program, run over the whole tree uncached, or fed by the selector (tests.selection.1) where selection is on. Plant: a program with no unit-test step in the gate list fails; a cached unit-test run with selection off fails. Control: a program with the step passes"
  relates:
    tests.selection.1:
      how: see
  open:
    - "Integration tests run at the land step and journeys at their own tier; the unit tier is the floor."
tests.runners.2:
  slug: workers-from-slots
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "2"
      note: "ESLint no-restricted-syntax on numeric literals for the worker options in the unit-test and browser-test configs; the value must derive from the slot variable (Biome form is a GritQL plugin on the same literals). Plant: workers set to 4 in a config file fires. Control: workers derived from the slot variable passes"
    "2":
      binding: go
      class: preset-config
      tier: "2"
      note: "the parallelism flag set from the slot variable in the shared Makefile fragment. Plant: a hard-coded parallelism number in the gate command fails the gate scan. Control: a derived value passes"
  open:
    - "The Go form is inferred; the catalogue states the rule in terms of the TypeScript runners."
    - "Proposed for lack of a source; the v1 evidence was: D"
tests.runners.3:
  slug: one-runner-preset
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "2"
      note: "every runner config extends the shared preset, read back from the resolved config. Plant: a config that does not extend the preset fails. Control: a config extending it passes"
    "2":
      binding: go
      class: preset-config
      tier: "2"
      note: "race, leak-check and shuffle flags set once in the shared Makefile fragment. Plant: a gate command without the shared flags fails the gate scan. Control: the shared fragment passes"
  open:
    - "One runner in every project is the ruling (Vitest everywhere)."
tests.runners.4:
  slug: tests-parallel-by-default
  since: 0.1.0
  level: program
  kind: rule
  review_question: "Does this test run in parallel, and if it runs alone, does its code say which process state it needs?"
  relates:
    tests.runners.2:
      how: see
    tests.isolation.1:
      how: see
    tests.isolation.10:
      how: see
  examples:
    bad:
      lang: go
      code: "func TestParse(t *testing.T) {\n    // no t.Parallel: paralleltest reports it\n}\n"
    good:
      lang: go
      code: "func TestParse(t *testing.T) {\n    t.Parallel()\n}\n"
  checks:
    "1":
      tool: golangci-lint
      key: paralleltest
      fix: never
      note: "The shared preset enables paralleltest, which reports a test that never calls t.Parallel; a serial test says its reason in the suppression. Plant: a test with no t.Parallel is reported. Control: a parallel test, and a serial one with its reason, are not. Held by TestThePresetShowsASerialTestRedAndOneWithItsReasonGreen in internal/preset_parallel_test.go."
    "2":
      tool: golangci-lint
      key: tparallel
      fix: never
      note: "The shared preset enables tparallel, which reports a parallel parent over a subtest that is not. Plant: a half-parallel test is reported. Control: a fully parallel one is not. Same test."
  open:
    - "A count of serial tests per package in the tier report is not built yet. The packages still serial are listed in gate/serial-packages.txt, a baseline that may only fall."
tests.runners.5:
  slug: setup-once-per-package
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "How many times does this package do its expensive setup in one run, and could it do it once?"
  relates:
    tests.isolation.3:
      how: see
  open:
    - "Planned check: per-test cost in the tier report, with the tests over a stated share of the package's wall time listed beside the setup they repeat. No tool key is bound yet."
tests.runners.6:
  slug: race-detector-at-push
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Is the race detector on for this package at push, and if the package is heavy, has its race run been asked for in this change?"
  relates:
    tests.runners.3:
      how: see
    gates.hooks.4:
      how: see
  open:
    - "Planned check: the gate's member table names the race flag for the light members and no heavy race member in any tier. The members change in gate/members.yaml, a protected path with its own verdict, and is later work."
tests.runners.7:
  slug: race-off-at-push-names-a-daily-run
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "If this project runs no race detector at push, who runs it on main each day, and where does a red go?"
  relates:
    tests.runners.6:
      how: see
tests.runners.8:
  slug: fake-clocks-for-waits
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Does this test sleep or wait on a timer, and could its clock be fake?"
  open:
    - "Planned check: a list of time.Sleep and real-timer waits in test files with a stated reason beside each. No tool key is bound yet."
tests.runners.9:
  slug: one-test-run-per-module
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "How many times does this tier invoke the test tool for this module, and where is the per-package timeout written?"
  relates:
    tests.runners.1:
      how: see
    tests.runners.4:
      how: see
    tests.measures.5:
      how: see
  open:
    - "Planned check: the members file has one test member per module and the member's command is one invocation. Plant: two test members for one module fail. Control: one member passes. No tool key is bound yet."
tests.runners.10:
  slug: the-tree-reading-package-is-lean
  since: 0.1.0
  level: package
  kind: instruction
  strength: Lens
  review_question: "Does this tree-reading package take one snapshot in setup and scan it in parallel, and which race member covers it if it runs without the detector at push?"
  relates:
    tests.runners.4:
      how: see
    tests.runners.5:
      how: see
    tests.runners.6:
      how: see
  open:
    - "Planned check: the tier report lists the tree-reading package's wall time and its share of the test member, and the members file names the on-demand race member that covers it. No tool key is bound yet."
tests.runners.11:
  slug: the-gates-own-tests-are-ordinary-tests
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Where do this gate's own tests run, and does any member run them again as a step of its own?"
  relates:
    gates.plants.12:
      how: see
    tests.runners.5:
      how: see
  open:
    - "Held today by a test of gragas, not a bound check: TestTheGeneratedCopyBuildsVetsLintsAndFailsItsStubs in cmd/gragas-new runs the command generator's checks in the test member, parallel, with the copy made once; its plant is a template that gives a global variable, which the lint of the copy refuses, and its control is the clean template, which passes. Left to build: a tool key in a preset that checks the members file has no member whose command is the gate's own test suite outside the test member, so the row can be added without raising the baselines of checks-unresolved, checks-without-fix and advisory-with-checks."
tests.runners.12:
  slug: a-runner-setting-is-proved-on-the-whole-suite
  since: 0.1.0
  level: program
  kind: instruction
  strength: Lens
  review_question: "Does this change touch the runner's pool, isolation or workers, and was the whole suite run under it on every claimed host?"
  relates:
    tests.runners.3:
      how: see
    tests.isolation.12:
      how: see
    gates.command.16:
      how: see
  open:
    - "Planned check: a change to the runner config file is a protected path whose verdict names the whole-suite run on each platform. No tool key is bound yet."
base/tests/rules/selection.yaml:
  summary: "A repo whose full suite fits its push budget runs it whole and uncached at every push, and a full uncached run always satisfies the gate. Selection by change is a tool a repo turns on only when its suite is too slow to run whole; the selection rules below bind only where it is on. There, selection fails closed: what it cannot place selects everything, every skip is named and proved, global checks always run whole, and a full run backstops the selector at least every third release."
tests.selection.1:
  slug: selector-from-the-change
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. the gate's push step runs the whole suite uncached unless the gate config declares selection on with a measured whole-suite time; a cached or partial run without that setting fails the gate. Plant: a push step that runs only the changed packages with no selection setting fails; a cached test result at push fails. Control: a whole uncached run passes"
    "2":
      binding: go
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. where selection is on, the selector library lifted from our CLI repo's package selector; the plan prints the global checks and the gate fails if one is absent. Plant: a plan that omits the vet step for a small change fails, and a failing package behind a changed one is selected. Control: the full plan passes"
    "3":
      binding: ts
      class: test-kit
      tier: "1"
      note: "v1 class shared-code. where selection is on, a rule table with a scope field; the runner refuses the affected option on a global-scope check. Plant: the affected option on the type check is refused, and a cross-file type error is caught by the whole run. Control: a global check run whole passes"
  relates:
    tests.selection.2:
      how: see
  open:
    - A cross-file plant for the global-check rule is planned and not run.
tests.selection.2:
  slug: unplaced-selects-everything
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. selector tests with a planted failing journey behind a changed command (it must be selected) and an unmapped path (it must select all). Plant: an unmapped path selects fewer than everything. Control: an unmapped path selects all and names why"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. selector returns ALL with the reason for any path not in the path-class table; lifted from two repos' pickers The Go-repo picker lifted is the gate-set selector; the other is the browser-test picker. Plant: a path in no class selects everything and names why. Control: a placed path selects its tests"
  open:
    - "Settled: selection is optional and binds only where a repo turns it on; a full uncached run always satisfies the gate."
    - "v1 evidence, not yet a source: operator direction; A"
tests.selection.3:
  slug: every-input-counted
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. recorded-reads tracer and selector lifted from the trialled version, plus a lint rule requiring the inputs tag on a test that reads files, globs or spawns. Plant: a test reading a fixture file is selected when that fixture changes, and one that reads without declaring fails lint. Control: a declared test passes"
  open:
    - "Recorded as written; a read behind an unset branch is not recorded."
    - "The tracer is not in any repo; the first adoption proves it on the runner and migrates the files."
    - "v1 evidence, not yet a source: A (44 of 87 test files)"
tests.selection.4:
  slug: opaque-tests-always-run
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. the opaque list; a test that spawns an opaque program is selected for any change. Plant: a test spawning an opaque program is selected for an unrelated change. Control: a test with seen inputs is selected only by its inputs"
  open:
    - "Trialled; not in any repo."
    - "Proposed for lack of a source; the v1 evidence was: C (1 to 2 per suite)"
tests.selection.5:
  slug: selector-change-selects-all
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "1"
      note: "the path-class table puts the selector, its map, its rules, the hooks and the table itself in the all class; a unit test fails any selector file not in it. Plant: editing the reach map selects everything. Control: an unrelated edit selects its own tests"
    "2":
      binding: go
      class: test-kit
      tier: "3"
      note: "the same all-class entries for the Go selector, its journey map and the gate's plan data. Plant: editing the journey map selects fewer than all journeys. Control: editing a command selects its journeys"
  open:
    - "Today one repo's reach map and picker select nothing."
    - "Proposed for lack of a source; the v1 evidence was: A"
tests.selection.6:
  slug: cache-only-when-visible
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "2"
      note: "packages from the machine-read list run with the count flag set to one. Plant: a machine-reading package run from cache fails. Control: the same package with the cache off passes"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. cache key built from check, command, input content ids and lockfile, and stored with a from-run or from-cache mark. Plant: a result keyed without the lockfile is refused. Control: a fully keyed result is accepted"
  relates:
    tests.isolation.7:
      how: see
    tests.journeys.3:
      how: see
    tests.measures.7:
      how: see
  open:
    - "Built inside the verdict store; the cache tools on the market are banned as workspace tools."
  note: "The stale-build half of the source row is tests.journeys.3; the performance-ceiling half is tests.measures.7."
tests.selection.7:
  slug: no-test-twice
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. tree-keyed record from the JSON test summary hash; the gate refuses a second run on a recorded tree except the admission repeat The record is the go test -json summary, hashed with the tree. Plant: a second run request for a recorded tree is refused. Control: a new tree runs"
  open:
    - "v1 evidence, not yet a source: own measure (operator direction)"
tests.selection.8:
  slug: skipped-is-not-a-pass
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. plan file kept (not only printed); the verdict has a not-run section and a schema check fails a verdict with none; the runner fails a zero-test run. Plant: a verdict that omits a skipped browser step fails, and a run that found zero tests fails. Control: a verdict naming every skip passes"
    "2":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the same verdict format and not-run section in the Go gate summary. Plant: a skipped package with no line in the verdict fails. Control: every skip named passes"
  open:
    - "Settled: selection is optional and binds only where a repo turns it on."
tests.selection.9:
  slug: skips-proved
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. run record lists each skipped package with its reason keyed to the tree; land replays a planted failing package; verdict line per skipped journey. Plant: a skipped package with no reason fails, and a planted journey must be selected. Control: every skip carrying a reason and the planted unit selected passes"
  relates:
    tests.selection.10:
      how: see
  open:
    - "Settled: selection is optional; the tier rule holds only where a repo turns selection on."
    - "v1 evidence, not yet a source: own measure"
  note: "Merges the package-skip record and the journey-skip proof, since one verdict format holds both."
tests.selection.10:
  slug: selector-oracle
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. oracle scripts that delete a read input, run all and compare (trialled); a release job runs them on every third tag and on selector change The trialled scripts are oracle.mjs, gen-muts.mjs and rescore.mjs. Plant: a selector with one input deleted from its map is caught. Control: a complete map passes"
    "2":
      binding: go
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. the same oracle method over the Go selector's map, run at the release step. Plant: a selector with one import edge removed from its map is caught. Control: a complete map passes"
  relates:
    tests.selection.1:
      how: see
  open:
    - "As it stands the oracle has run on script tests only and cannot run on a browser grid; recorded, not redesigned."
    - "No target product selects today, so the rule binds no target yet."
tests.selection.11:
  slug: no-import-only-selector
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. plain-text scan of package scripts, the Makefile, workflow files and rule data for the changed-only flag; a substring scan so a wrapper still contains the text. Plant: the flag in a workflow fails. Control: a workflow without it passes"
  open:
    - "Shared with the forbidden-command scan; a flag built from two strings would escape, reviewed by a planted bypass list."
    - "Proposed for lack of a source; the v1 evidence was: A (0 tests selected on a site change)"
tests.selection.12:
  slug: full-run-backstop
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. release job runs the full no-cache suite every third tag, writes the choice into the tag, holds a lock file on red and a bisect script. Plant: a deliberate miss in the map is caught by the full run. Control: a tag recording a full run within three releases passes"
    "2":
      binding: go
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. the release command refuses a tag whose record shows more than two selected releases since the last full run. Plant: a third selected release in a row is refused. Control: a full run resets the count"
  open:
    - "No target product selects today, so the rule binds no target yet."
    - "Nothing here has run; the lock file and bisect script are the on-a-miss procedure."
  note: "Merges the whole-suite backstop and the third-release full run. A miss becoming a fixture is a person's act."
tests.selection.13:
  slug: release-proves-what-is-unproved
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. where selection is on, the release-ready command refuses a tag with no recorded scoped plan or no full-grid age, and prints the age of the last whole run. Plant: a tag with no plan record is refused, and a fixture history prints the age. Control: a tag with a plan record passes"
    "2":
      binding: any
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. the release command looks up a whole-run verdict keyed to the tree hash and reruns the full gate when none exists. Plant: a release of a tree whose only verdict names another tree reruns the gate. Control: a release of a tree with its own whole-run verdict skips the rerun and names the verdict"
  open:
    - "Nothing was run; the release command is a build under a hold."
tests.selection.14:
  slug: plan-step-stays-cheap
  since: 0.1.0
  level: program
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: R
      note: "v1 class record. plan-step time recorded in the times file with the load; past the line the gate blocks until the question is answered, measured unloaded. Plant: a synthetic suite of 8,700 tests plans under 2 s on a quiet host; a planted slow plan is flagged. Control: a plan under the line passes"
  review_question: "Is the selector's plan time, measured on an unloaded host, past 2 seconds, and if so where is the index?"
  relates:
    tests.flakes.4:
      how: see
  open:
    - "A watched number: the plan time is recorded with the load, and past the line it blocks until answered."
    - "Proposed for lack of a source; the v1 evidence was: C"
tests.selection.15:
  slug: page-scoped-receipts
  since: 0.1.0
  level: program
  kind: rule
  status: later
  open:
    - "Design only, not built; binds only where a repo turns selection on."
tests.selection.16:
  slug: selection-after-the-floor-is-measured
  since: 0.1.0
  level: program
  kind: rule
  strength: Answered
  relates:
    tests.selection.1:
      how: refines
    gates.command.4:
      how: see
  open:
    - "Proposed on purpose: the owner decides after the measured floors of the concurrency and parallelism rules (gates.command.18, tests.runners.4) are in. The rule becomes active, or is retired, with that decision."
tests.selection.17:
  slug: language-split-is-a-row-of-selection
  since: 0.1.0
  level: program
  kind: rule
  strength: Answered
  relates:
    tests.selection.16:
      how: refines
  open:
    - "Proposed on purpose, with tests.selection.16; it follows that decision."
cloud/aws/rules/iam.yaml:
  summary: "Every deployed unit runs with its own identity and only the grants its job needs. No grant uses a wildcard, and the few powerful grants (publishing, invoking, database connect) exist only on the declared path."
aws.iam.1:
  slug: no-wildcard-grants
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule over the infrastructure code failing a star (\"*\") in an action or resource of any policy statement, run in every service gate. Plant: a policy statement with action star or resource star fails. Control: a statement naming exact actions and a resource passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that the CI token is read-only and scoped and that a unit sandbox comes from the template. Plant: a CI token with write scope fails. Control: a read-only scoped token passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
aws.iam.2:
  slug: powerful-grants-on-declared-path
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rules over the infrastructure code: a publish grant naming a bus other than the shared bus, an execute-api:Invoke grant not built by the internalInvokeGrant helper, and an rds-db:connect grant for any role but the unit application role (<svc>_app). Plant: a function granted publish on an arbitrary bus fails; a handwritten invoke permission fails; a connect grant for the owner role fails. Control: grants through the declared helpers pass"
  open:
    - The three exact grant shapes are named from the reference estate and need translating to each product shared constructs.
cloud/aws/rules/limits.yaml:
  summary: Concurrency caps come from shared defaults and are not used as a throttle.
aws.limits.1:
  slug: concurrency-caps-from-defaults
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing a reserved-concurrency setting outside the shared component defaults and any in the development stage, and a rule on a cap paired with a queue source. Plant: a reserved concurrency on a queue-triggered function fails. Control: a queue maximum concurrency on the event source passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "Related to the service rule third-party-concurrency-ceiling, which reads the queue maximum concurrency."
cloud/aws/rules/resources.yaml:
  summary: "Anything that holds state survives a stack deletion, and every storage bucket is private and encrypted at rest with no switch to turn either off."
aws.resources.1:
  slug: state-bearing-resources-retained
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule over the infrastructure code failing a database table, bucket or queue construct without the retain-on-delete setting. Plant: a table declared without retention fails. Control: a table with retention passes"
  open:
    - "In Go, keeping user state on removal or uninstall is a gap with no row yet."
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "The retention of imported identity, IAM and DNS resources is the SST rule imported-resources-retained."
aws.resources.2:
  slug: buckets-closed-and-encrypted
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing a raw bucket construct, and a unit test of the shared bucket component asserting all four blocks and encryption are always set and no option disables them. Plant: a bucket built without the component fails; a component option that turns public access on fails. Control: the component bucket passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
cloud/lambda/rules/bundle.yaml:
  summary: "Each function bundle is held under a size budget, because package size drives cold start."
lambda.bundle.1:
  slug: bundle-size-budget
  since: 0.1.0
  level: package
  kind: measure
  checks:
    "1":
      binding: ts
      class: preset-config
      tool: size-limit-with-bundler-plugin
      tier: "2"
      note: "size-limit with its bundler plugin, one entry per handler with a byte limit in the package manifest. Plant: a handler bundle over its limit fails. Control: a bundle under the limit passes"
  open:
    - "No limit value is chosen; it should be set from measured bundle sizes of existing handlers."
    - "Proposed for lack of a source; the v1 evidence was: own measure"
cloud/lambda/rules/identity.yaml:
  summary: "Each function runs under its own pinned role name with the shared baseline grants, and further permissions come only through managed policy ARNs on the role."
lambda.identity.1:
  slug: grants-through-managed-policy-arns
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule over the infrastructure code failing a standalone role policy attachment or inline policy on a function role. Plant: a function role built with an attachment resource fails. Control: managed policy arns on the role pass"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
lambda.identity.2:
  slug: pinned-role-name-and-baseline
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule over the infrastructure code failing a function whose logical name is absent from the role-name table or whose role omits the baseline policy. Plant: a function added with no role-name entry fails. Control: a function in the table with the baseline passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
cloud/lambda/rules/runtime.yaml:
  summary: A function handler is built by the shared runtime. Middleware and plumbing libraries are imported only by the one package that owns their concern.
lambda.runtime.1:
  slug: plumbing-library-imported-by-owner
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "import-restriction rule (ESLint no-restricted-imports or an ast-grep rule) allowing the middleware engine only in the shared runtime package, and a dependency-allow-list check on package manifests. Plant: a service package importing the middleware engine directly fails. Control: the runtime package importing it passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "The service rule one-shared-bootstrap states the same for every entry; this is the Lambda binding naming the handler middleware engine."
cloud/sst/rules/alarms.yaml:
  summary: Every service gets the same alarms from one shared component.
sst.alarms.1:
  slug: shared-alarm-component
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "an infrastructure rule failing a service stack that does not instantiate the shared alarm component, and a unit test that the component creates the three alarm types. Plant: a stack without the component fails. Control: a stack using it passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "The service obligation to use it is the service rule born-with-same-alarms; one check holds both."
cloud/sst/rules/constructs.yaml:
  summary: "Infrastructure is declared through shared constructs only. Names, log settings and the stage are set in one place each, and infrastructure code never imports application source."
sst.constructs.1:
  slug: shared-constructs-only
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rules failing sst.aws.Function, aws.dynamodb.Table and aws.apigateway.* constructors, the bundler override key, layers, local component imports and the bare network configuration in the infrastructure code. Plant: a raw function construct fails. Control: the shared function construct passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
sst.constructs.2:
  slug: program-name-in-one-place
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing a string literal equal to the program name outside the one service definition file. Plant: the program name as a literal in a second file fails. Control: a reference to the service definition passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
sst.constructs.3:
  slug: log-format-and-stage-in-one-place
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rules failing a logFormat option, a LogGroup and a read of $app.stage outside the shared component and the stages file. Plant: a function setting its own log format fails; a stage read in a handler file fails. Control: the shared component and stages file pass"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
sst.constructs.4:
  slug: infra-never-imports-application
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "an import-boundary rule on the infrastructure folders forbidding imports from the application source folders. Plant: an infrastructure file importing a handler module fails. Control: one importing the shared constructs passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard or a layer-table test: deploy code imports no program package. Plant: a deploy package importing a program package fails. Control: deploy code with its own helpers passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
cloud/sst/rules/deploy.yaml:
  summary: "The infrastructure tool is pinned to one exact version, and every deploy goes through one guard that refuses to destroy state."
sst.deploy.1:
  slug: sst-exact-pinned
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "a check over package manifests failing a version range on the tool and its components package, a second version in the lockfile, and any dependency with a local-path protocol. Plant: a manifest with a caret range on the tool fails; a link: dependency fails. Control: an exact version passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "Related to the supply-chain pin rules; kept here because the pin is for the infrastructure tool."
sst.deploy.2:
  slug: deploy-through-guard
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "v1 class shared-code. the shared deploy guard run in the land step on the plan output, failing on delete or replace of state-bearing resources. Plant: a plan that replaces a table fails. Control: a plan that only updates a function passes"
  open:
    - "A deploy path that bypasses the guard (a direct deploy command) is not yet caught."
    - "Proposed for lack of a source; the v1 evidence was: practice"
cloud/sst/rules/state.yaml:
  summary: Resources the stack imports and does not own survive its removal.
sst.state.1:
  slug: imported-resources-retained
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule over the infrastructure code failing an imported identity, IAM or DNS resource without retain-on-delete. Plant: an imported user pool without retention fails. Control: an imported pool with retention passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "Beyond the AWS rule state-bearing-resources-retained, which covers state the stack owns."
data/dynamodb/rules/keys.yaml:
  summary: "A DynamoDB table is designed from the questions it must answer. Keys are built in one place, every query maps to a written access pattern, and the design states how hot one partition key can get."
dynamodb.keys.1:
  slug: keys-from-the-key-builder
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-syntax on template literals and string concatenation that build a key prefix outside the key-builder module. Plant: a handler that writes `USER#${id}` itself fails. Control: the same key from the key builder passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "forbidigo on key-prefix string literals outside the store package. Plant: a key prefix literal in a handler fails. Control: the key builder's own literal passes"
dynamodb.keys.2:
  slug: access-pattern-list
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a test iterates the key builder's query functions and fails when one is not named on the access-pattern list. Plant: a query function on an unlisted index fails; a list line naming a function that does not exist fails. Control: every query function listed passes"
  review_question: "Which access pattern is not on the list, and how would it be added?"
  open:
    - "Agents add a global secondary index to make a new query work, which locks in an unplanned pattern; the review question is the guard until the test exists."
    - "v1 evidence, not yet a source: practice (argued from the modelling guidance, no fault in our record)"
dynamodb.keys.3:
  slug: hot-partition-stated
  since: 0.1.0
  level: program
  kind: instruction
  strength: Review
  review_question: "What is the highest write rate any single value of this partition key will see, and what happens on a read after a write through an index?"
  open:
    - "Measure: the service's throttle counts per table, read at release."
    - "No plant yet: a seeded table keyed on the current date, with every write on one value, must be flagged."
    - Look up current per-partition throughput figures before quoting any.
    - "v1 evidence, not yet a source: practice (argued from the service builders' own account)"
  note: "Agents pick a key from the entity's natural fields, such as a date or a tenant, which concentrates writes."
data/dynamodb/rules/migrations.yaml:
  summary: A change to the item shape or the indexes is either additive or a planned migration whose backfill is resumable and safe to run twice.
dynamodb.migrations.1:
  slug: backfill-safe-to-run-twice
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "the backfill runs twice in a test against a local table, and the second run changes nothing. Plant: a backfill that appends instead of setting fails the run-twice test. Control: an idempotent backfill passes"
  review_question: "What do old and new readers see while the backfill is half done?"
  note: "Agents write the one-off script and run it once; the run-twice test is the guard."
data/dynamodb/rules/queries.yaml:
  summary: "Reads answer a question through a key or an index. A scan is for migrations and exports only, and a filter expression never does the real work of a query."
dynamodb.queries.1:
  slug: no-scan-on-request-path
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep rule failing ScanCommand and FilterExpression outside allow-listed migration and export paths. Plant: a Scan in a handler's action file fails. Control: the same call in an allow-listed migration passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "forbidigo on the DynamoDB Scan call outside allow-listed paths. Plant: a Scan call in a handler fails. Control: a Scan in an allow-listed migration passes"
  review_question: "Does any query rely on a filter expression for its result, and is the access-pattern list missing a line?"
  open:
    - "Measure: items scanned against items returned, per action, from the response counts. No limit is set until one is measured."
data/dynamodb/rules/writes.yaml:
  summary: "Writes go through one shared toolkit that keeps them correct under races and retries. Each action does one storage command, uniqueness and check-then-write use conditions, and an expiry attribute is checked by the reader rather than trusted to deletion."
dynamodb.writes.1:
  slug: entry-code-never-imports-sdk
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-imports on the DynamoDB client packages outside the store layer. Plant: a handler importing the DynamoDB client fails. Control: the store layer importing it passes"
    "2":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard denying the AWS DynamoDB SDK module outside the store package. Plant: a command package importing the SDK fails. Control: the store package importing it passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "This is the DynamoDB binding of the general rule that entry code never imports a storage client, held in the store part."
dynamodb.writes.2:
  slug: one-command-per-action
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-imports between action files, and an ast-grep rule counting storage commands per action file. Plant: an action file that sends two commands, or imports a sibling action, fails. Control: an action with one command passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
dynamodb.writes.3:
  slug: writes-through-the-toolkit
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-imports and no-restricted-syntax on PutCommand, UpdateCommand and DeleteCommand outside the toolkit and the delete allow list. Plant: a raw update in a service action fails; a delete outside the allow list fails. Control: a write through the toolkit passes"
    "2":
      binding: any
      class: test-kit
      tier: "1"
      note: "the toolkit conformance suite, run at every toolkit release. Plant: a toolkit write that drops its version check fails the suite. Control: the released toolkit passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
dynamodb.writes.4:
  slug: conditions-and-transaction-tokens
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: G
      note: "the toolkit conformance suite runs two concurrent creates with the same unique value and expects one success and one typed conflict, and retries a transaction with the same token and expects one write. Plant: a toolkit write that skips its condition lets both creates through and fails the test. Control: the conditional write passes"
  open:
    - The idempotency window of a client token is to be re-checked against current AWS documentation.
    - "v1 evidence, not yet a source: practice (a study of application-level uniqueness checks broken by races)"
dynamodb.writes.5:
  slug: reader-checks-expiry
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: G
      note: "a toolkit read-helper test inserts an item whose expiry is past and still present, and asserts the helper does not return it. Plant: a read helper that does not compare the attribute fails. Control: the helper that compares it passes"
  open:
    - Verify the current deletion delay in AWS documentation before quoting it.
data/postgres/rules/client.yaml:
  summary: "How code reaches Postgres. Entry code never imports the database client; one shared package opens the connection, owns the pool, the certificate bundle and the integer parser; the number of connections the services can open is computed and checked under the cluster limit; and transactions open only through one helper that retries serialisation failures and states what each transaction protects."
postgres.client.1:
  slug: entry-code-never-imports-the-client
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-imports on the Postgres client and query builder packages outside the store layer. Plant: a handler importing the database client fails. Control: the store layer importing it passes"
  relates:
    store.seams.1:
      how: see
  open:
    - "The source row gives no tier or plant; both are proposed here to match the store rule."
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "This is the Postgres binding of the general store rule store.seams.1; entry code never imports a storage client."
postgres.client.2:
  slug: one-package-owns-the-connection
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-imports and no-restricted-syntax on pool construction and type-parser registration outside the shared package. Plant: a new Pool constructed in a service fails. Control: the shared package constructing it passes"
  open:
    - "The source row gives no plant; the plant is proposed. A web page opens no database, so the rule does not reach the web."
    - "Proposed for lack of a source; the v1 evidence was: practice"
postgres.client.3:
  slug: connection-budget-computed
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "3"
      note: "a script multiplies each function's concurrency setting, read from infrastructure, by the toolkit's pool maximum and fails above the cluster limit. Plant: a function whose concurrency times pool size exceeds the limit fails. Control: a budget under the limit passes"
    "2":
      binding: ts
      class: test-kit
      tier: G
      note: "a toolkit test runs SHOW statement_timeout and SHOW idle_in_transaction_session_timeout on a fresh pooled connection. Plant: a pool built with no timeouts fails the read-back. Control: a pool with both timeouts passes"
  open:
    - "Inference on the function runtime; whether a managed pooler is in use was not checked."
    - "The measure (connection count, oldest open transaction) is read by hand and has no limit."
postgres.client.4:
  slug: transactions-through-one-helper
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tool: eslint
      tier: G
      note: "a toolkit test forces a serialisation failure on a real container and expects a retry and then a typed error; a raw transaction call outside the helper fails ESLint no-restricted-syntax. Plant: a helper without the retry fails the forced-failure test; a transaction opened outside the helper fails. Control: the helper with a bounded retry passes"
    "2":
      binding: go
      class: preset-rule
      tier: "1"
      note: "a scan (analyser) for a transaction opened outside the one helper, and a helper retry test for error 40001. Plant: a transaction begun outside the helper fires; a helper that does not retry 40001 fails its test. Control: the helper passes"
  open:
    - "No Go repository uses Postgres today, so no check can be planted yet; the pack binds a repository when it adopts Postgres."
    - "v1 evidence, not yet a source: practice; an incident of Postgres 12.3 admitting a write-skew cycle at the serialisable level"
postgres.client.5:
  slug: transaction-states-invariant-and-level
  since: 0.1.0
  level: function
  kind: rule
  strength: Lens
  checks:
    "1":
      binding: any
      class: test-kit
      tier: G
      note: "a write-skew pair (two concurrent transactions each reading a sum and then inserting) run at the helper's chosen level must end with the invariant held or a retried failure. Plant: a write-skew pair run at the default level breaks the invariant and fails. Control: the same pair at the chosen level holds or retries"
  review_question: "Which invariant does this transaction protect, which anomaly would it suffer at this level, and what does the code do on a serialisation failure?"
  relates:
    postgres.engine.1:
      how: see
    postgres.client.4:
      how: see
  open:
    - Which release shipped the fix for the Postgres 12.3 finding was not checked.
  note: "Separate from postgres.client.4, which is the plumbing; this is the choice, held by review."
postgres.client.6:
  slug: revision-in-the-body-compare-and-set
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: G
      note: "a toolkit test with two writers, one stale, and a missing row, expecting a conflict for the stale write and not found for the missing one. Plant: an update without the revision in its condition lets the stale write through and fails. Control: the compare-and-set helper passes"
  relates:
    store.consistency.3:
      how: see
  open:
    - "The source row names no plant; this one is proposed."
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: This is the Postgres and request-body binding of store.consistency.3.
data/postgres/rules/engine.yaml:
  summary: "The engine version is part of the contract. Tests run on the version production runs (an in-process build of the same major counts, a server build for roles and connections), a version below a floor or on a known-bad list fails, and a short contract suite pins what the data layer relies on."
postgres.engine.1:
  slug: tests-on-the-production-engine-version
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "the container's or the in-process build's SHOW server_version compared with the version in the deployment definition and with a floor file, a tag on tests that need roles or connections that refuses the in-process engine, and a contract suite run once per named engine. Plant: a container older than the declared version fails; an in-process build of another major fails; a role test run in process fails; a version on the known-bad list fails; a contract case with two concurrent writers must end with exactly one winner. Control: a matching version passes"
  relates:
    store.schemas.5:
      how: see
  open:
    - "The managed service's own version labelling and which minor releases carry which fixes were not checked."
    - "The neighbouring engine's incident is as reported by a news article; the company's own post-mortem was not read."
  note: The embedded-store form is store.schemas.5.
data/postgres/rules/indexes.yaml:
  summary: "An index has a reason and a cost. A migration that adds an index names the query it serves and the write path that pays for it, and unused indexes are listed at release from the engine's statistics."
postgres.indexes.1:
  slug: new-index-names-its-query
  since: 0.1.0
  level: file
  kind: rule
  strength: Review
  review_question: "For this index, which query uses it and which write path pays for it?"
  open:
    - The exact statistics view that lists unused indexes was not read.
    - "No plant exists; a seeded migration that adds an index on every column of a new table must be flagged."
data/postgres/rules/migrations.yaml:
  summary: "How the schema changes. Migrations are numbered in order and append-only, the schema stays equal to the model's DDL, a start backs up before it migrates, a destructive migration has a written plan, each migration stays compatible with the running version (expand, migrate, contract) and the contract step has a date, the migration text follows conventions, and a lock lint and a lock timeout stop a migration that would queue the application behind a lock."
postgres.migrations.1:
  slug: numbered-in-order-schema-in-parity
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: sql
      class: test-kit
      tier: "2"
      note: "a test that migration numbers are consecutive, that each landed migration's checksum equals the recorded one, and that the schema after replaying every migration on a container equals the committed schema file and the DDL the model generates. Plant: a gap in numbering fails; an edited landed migration fails its checksum; a schema that differs from the model's DDL fails. Control: consecutive numbers, unchanged checksums and a schema equal to the model's DDL pass"
  relates:
    postgres.queries.1:
      how: see
    store.schemas.2:
      how: see
  open:
    - "The source row gives no plant; both are proposed. For the embedded-store counterpart see store.schemas.2."
postgres.migrations.2:
  slug: no-destructive-migration-without-a-plan
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: sql
      class: preset-config
      tier: "2"
      note: "a migration-text check that a drop or destructive change is accompanied by a plan note in the migration header. Plant: a migration that drops a column with no plan note fails. Control: the same migration with a plan note passes"
  open:
    - "The source row gives no tool or plant; both are proposed."
    - "Proposed for lack of a source; the v1 evidence was: practice"
postgres.migrations.3:
  slug: expand-migrate-contract
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: sql
      class: preset-config
      tool: squawk
      tier: "2"
      note: "Squawk over each changed migration for changes that break running code (a not-null column without a default, a rename). Plant: a rename of a column in use fails Squawk. Control: an additive migration passes"
  open:
    - "The squawk rule names were read from its documentation; its exit code and configuration were not confirmed."
postgres.migrations.4:
  slug: contract-step-has-a-date
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "a migration header carries contract-by when it adds a replacement; the register check fails an entry past its date. Plant: an expand migration with no date fails; a leftover past its date fails. Control: a dated expand with its contract in time passes"
  review_question: "Which readers will be alive during this deploy?"
  note: Held by the date check for the date and by the review question for the readers.
postgres.migrations.5:
  slug: migration-text-conventions
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: sql
      class: preset-config
      tier: "1"
      note: "a migration-text lint for the class header, the notes, the ban on down scripts and risky extensions, and ON DELETE on every REFERENCES. Plant: a migration that creates an extension, or a REFERENCES with no ON DELETE, fails. Control: a conforming migration passes"
    "2":
      binding: any
      class: test-kit
      tier: "2"
      note: "a start test with a planted failing migration asserting a backup was taken before it, the store equals the backup afterwards, and the program exited non-zero. Plant: a start that leaves a half-applied migration and keeps running fails. Control: a restored store and a refused start pass"
  open:
    - "The source row gives no tool or plant for the text lint; both are proposed."
postgres.migrations.6:
  slug: lock-lint
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: sql
      class: preset-config
      tool: squawk
      tier: "2"
      note: "Squawk on migration .sql files with the rules named in the detail. Plant: CREATE INDEX without CONCURRENTLY fires, and a migration with no lock timeout fires. Control: a concurrent index with a lock timeout passes"
  open:
    - "No repository uses Postgres, so nothing can be planted in a real repository today."
    - The alternatives Atlas and eugene were considered and not run.
    - "v1 evidence, not yet a source: practice (the payment company's incident)"
    - "v1 reference, not yet a source: operator points 36 and 46"
postgres.migrations.7:
  slug: runner-sets-timeouts-and-aborts
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: sql
      class: test-kit
      tier: "3"
      note: "a runner test on a container with two connections that reads SHOW lock_timeout in the migration session and holds a lock on the target table while the migration runs. Plant: a runner with no timeout hangs until the test's own limit and fails. Control: a migration taking a strong lock with a timeout set aborts and passes"
  relates:
    postgres.migrations.6:
      how: see
  open:
    - "The migration ran in milliseconds in test, which is the agent-side failure (inference)."
  note: Different from postgres.migrations.6 in that the lint reads text and this reads the live session.
data/postgres/rules/queries.yaml:
  summary: "Queries are checked against the schema before they run. They are typed from the one data model, built with a typed query builder, the live schema is checked against the model, parser behaviour is tested against a real database, status guards come from the transition table, and storage errors map to one error envelope in one place."
postgres.queries.1:
  slug: queries-typed-from-the-model
  since: 0.1.0
  level: type
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "2"
      note: "regenerate the table types from the model and fail on a diff, with the typed query builder as the only way to write queries, checked by tsc; a dependency ban on a second schema library. Plant: a hand-edited table type fails the regenerate step, and a migration that renames a column the model does not fails the replay comparison. Control: types regenerated from the model, and a migration matching the model's DDL, pass"
  relates:
    postgres.migrations.1:
      how: see
  open:
    - "The source rows give no plant; the plant is proposed here."
    - "A service that today generates types from the live schema contradicts this rule; such services are dormant until their own target is read."
    - "In Go the counterpart is a query generator with the generated code regenerating with no diff, reserved and not yet adopted."
postgres.queries.2:
  slug: parser-tested-against-the-real-database
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "2"
      note: "a round-trip test of integer width, time and decimal forms against a Postgres container, and a formatter ignore entry for generated query output. Plant: a parser that truncates a 64-bit value fails the round trip; a formatter that rewrites generated output fails the regeneration diff. Control: the configured parser passes"
  relates:
    store.schemas.4:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "The embedded-store counterpart is store.schemas.4 (a round-trip test of stored form and width)."
postgres.queries.3:
  slug: status-guards-from-the-transition-table
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "an ast-grep rule banning a hand-written status comparison in a query outside the builder. Plant: a hand-written WHERE status = in a repository fails. Control: a guard from the builder passes"
  open:
    - "The source row gives no plant or tool; both are proposed."
    - "Proposed for lack of a source; the v1 evidence was: practice"
postgres.queries.4:
  slug: storage-errors-mapped-in-one-place
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tool: eslint
      tier: "2"
      note: "a toolkit test that every SQLSTATE the service can raise maps to the envelope and that no raw database message reaches a response; ESLint bans a local error table. Plant: a handler that returns a raw database message fails the test. Control: the mapped envelope passes"
  open:
    - "The source row says the mapping lives in the shared toolkit; the test is proposed."
data/postgres/rules/schema.yaml:
  summary: "What the replayed schema must hold. Naming, check constraints, audit columns and exclusive arcs hold in the live schema, SQL laws are tested in SQL, fact tables are append-only, libraries keep their own schema, the application role reaches every table after replay, uniqueness behind a check-then-insert is a constraint read back from the catalogue, and a generated rules catalogue is regenerated in the gate."
postgres.schema.1:
  slug: naming-checks-audit-columns-live
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: sql
      class: preset-config
      tool: schemalint
      tier: "2"
      note: "schemalint on the live schema after replay, with its rules for casing, inflection, mandatory columns, primary keys, references and types, plus a catalogue query refusing a pair of text kind and id columns with no foreign key and no exclusive-arc check, and a test that every check constraint and trigger is named in a SQL test. Plant: a table with no primary key or a mixed-case name fails; a subject_kind and subject_id text pair fails; a check constraint with no SQL test fails. Control: a conforming table passes"
  open:
    - "The source rows give no plant; the plant is proposed."
postgres.schema.2:
  slug: app-role-reaches-every-table
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: sql
      class: test-kit
      tier: "2"
      note: "a catalogue test after replay that reads grants, triggers and not-null flags, plus a scan of updates for created fields. Plant: a table with no grant for the app role fails; an update that sets a created field fails. Control: a fully granted table passes"
  open:
    - "The source row gives no tool or plant; both are proposed."
    - "Proposed for lack of a source; the v1 evidence was: practice"
postgres.schema.3:
  slug: unique-constraint-behind-check-then-insert
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: sql
      class: test-kit
      tool: ast-grep
      tier: "3"
      note: "a catalogue test asserting a unique index for each natural key in the registry, and an ast-grep scan for select-then-insert on the same key. Plant: dropping the index fails the catalogue test; two concurrent inserts with the same key must end with one row and one typed conflict. Control: the indexed key passes"
  relates:
    store.schemas.3:
      how: see
  open:
    - "It is one framework; the finding is about where an invariant must live, and the cheap form of the test is a plant."
    - "v1 evidence, not yet a source: a study of one framework (Bailis and colleagues)"
  note: The embedded-store counterpart is store.schemas.3.
postgres.schema.4:
  slug: generated-rules-catalogue-regenerated
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "3"
      note: "regenerate the catalogue in the gate and git diff --exit-code; not applicable with the count while no generator exists. Plant: a stale catalogue fails. Control: a freshly generated catalogue passes"
  relates:
    supply.provenance.4:
      how: see
  open:
    - "It could be merged into supply.provenance.4; it is kept apart because the catalogue is a service-level file."
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "Same intent as supply.provenance.4 (regenerating leaves no diff) for a service's generated rules catalogue."
postgres.schema.5:
  slug: append-only-table-refuses-change
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: sql
      class: test-kit
      tier: "2"
      note: "a SQL test that, as the superuser, updates and deletes a row in every table marked append-only and expects both to fail. Plant: an append-only table whose trigger is dropped fails. Control: a table whose trigger refuses both passes"
postgres.schema.6:
  slug: library-tables-own-schema
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: sql
      class: test-kit
      tier: "2"
      note: "a catalogue test after replay that every table outside the program's schema belongs to a listed library schema with a pinned version, and that no program migration names a library schema. Plant: a library's table created in the program's schema fails. Control: the library's tables in its own schema pass"
  relates:
    postgres.migrations.1:
      how: see
data/store/rules/consistency.yaml:
  summary: "How concurrent writers and outward effects stay correct whatever the store. A lock is a kernel advisory lock with a deadline, a lock that guards correctness across hosts hands out a fencing token, a mutation carries a version precondition, the intent is written before the effect, and every outward effect goes through one recording wrapper."
store.consistency.1:
  slug: kernel-advisory-lock
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "forbidigo (analyze-types) on Flock and FcntlFlock outside the lock package, a plain-text SYS_FLOCK check, depguard on the third-party flock module, and a claim test. Plant: unix.Flock, an alias of it and unix.FcntlFlock fire; a raw syscall of the flock number fires the plain-text check. Control: the lock package passes"
  open:
    - "The pattern misses one of five planted forms (a POSIX record lock, FcntlFlock with F_SETLK, and the raw syscall pass), so the plain-text check stays."
    - "The shared claim helper in the platform environment is proposed; the rendered depguard config needs an owner-lock rule."
    - "v1 evidence, not yet a source: own measure (read; the claim shape verified)"
store.consistency.2:
  slug: fencing-token
  since: 0.1.0
  level: function
  kind: rule
  strength: Review
  review_question: "Can a paused holder of this lock still write after its lease ends, and what refuses it?"
  relates:
    store.consistency.3:
      how: see
  open:
    - "No plant exists; a seeded change that takes an advisory lock or a lease row and writes without a conditional check must be flagged."
    - "v1 evidence, not yet a source: practice (a published argument separating locks for efficiency from locks for correctness)"
  note: "Agents reach for a lease and stop there (inference)."
store.consistency.3:
  slug: version-precondition
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "a store test with two writers (one stale) and a missing row, asserting the stale write's values are absent. Plant: an update without the version in the condition fails the two-writer test; a stale write and a missing row must give different typed errors. Control: the conditional update passes"
  open:
    - "v1 evidence, not yet a source: practice (not measured)"
  note: "The kernel-lock rule does not cover this; the engine-specific forms are in the Postgres and DynamoDB parts."
store.consistency.4:
  slug: intent-before-effect
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "a per-effect test with a failing journal, and a test that a refused second run writes no record. Plant: an effect before its journal write fails. Control: journal first passes"
  review_question: "Can this message go out for a change that then rolls back?"
  open:
    - "The outbox half is review; the claim-before-begin construction in the platform environment is proposed."
    - "v1 evidence, not yet a source: own measure (read; the order verified)"
store.consistency.5:
  slug: outward-effects-through-one-wrapper
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard owner-exec on os/exec, forbidigo on os.StartProcess and syscall.ForkExec outside the runner, and gosec G204. Plant: exec.Command outside the runner fails. Control: the runner package passes"
  relates:
    store.consistency.4:
      how: see
  open:
    - belongs in cli
    - "The split agent doubted whether this could be a rule of the CLI program part or of the architecture base, and it is kept here because the effect record is the journal of store.consistency.4."
    - The owner-exec counts are macOS numbers.
data/store/rules/recovery.yaml:
  summary: "Data that cannot be rebuilt has a backup that has been restored. Backup uses the engine's own interface, a restore drill proves it, and a stateful program survives being killed at random points."
store.recovery.1:
  slug: restore-drill
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test that backs up a populated store through the engine's API, restores it to a new path, runs the engine's integrity check and compares counts with a fixture minimum. Plant: a backup taken by a plain copy during writes fails integrity or counts; a corrupted page fails the integrity check. Control: a clean backup restores and passes"
    "2":
      binding: any
      class: test-kit
      tier: "4"
      note: "a drill started by dispatch that restores to a new cluster, runs the integrity query and compares counts with a fixture minimum. Plant: a backup of a corrupted page fails the integrity step; a drill over an empty store fails the minimum count. Control: a clean restore passes"
  relates:
    store.seams.6:
      how: see
  open:
    - "The configuration of the managed store (automated backups, point-in-time restore) was not inspected; this rule is about proving it, not whether it is switched on."
    - "The known way round is a drill over an empty store, so the minimum count comes from the fixture (inference)."
  note: Moved from the AWS cloud part because the drill is store-level.
store.recovery.2:
