lang/ts/rules/lint.yaml:
  summary: "The lint engine is a project parameter (Biome or ESLint) with one shared strict config, type-aware where it is cheap, running the rules the compiler cannot: promises, type-only imports and schema-library misuse. Every rule is an error, and each rule names its Biome form or says it is ESLint-only."
ts.lint.1:
  slug: type-aware-correctness
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tool: typescript-eslint-strict-type-checked
      tier: "2"
      note: "oxlint with oxlint-tsgolint (no-floating-promises, no-misused-promises, no-unsafe-* set by the preset) at tier 2, and the typescript-eslint strict-type-checked preset at the land tier. Plant: a floating promise in a `.ts` file fails; the awaited twin passes. Control: an awaited promise in the same file passes"
    "2":
      binding: ts
      class: preset-config
      tier: "2"
      note: "Biome `noFloatingPromises` and `noMisusedPromises` at error in the one Biome config. Plant: a floating promise in a `.ts` file fails under Biome. Control: an awaited promise in the same file passes"
  relates:
    ts.lint-config.5:
      how: see
  open:
    - "One rule was compared between the fast tool and ESLint, not the whole preset."
    - "The fast tool reads scripts and frontmatter, not `.astro` markup. Version 1.91.0 was young when measured under the former 14-day window; re-run on the newest release outside tools.yaml's window."
    - "v1 evidence, not yet a source: C (measured cost of typed lint)"
ts.lint.2:
