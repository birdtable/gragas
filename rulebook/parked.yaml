      fix: never
      note: "golangci-lint forbidigo with type analysis (analyze-types: true) on the JSON encoder and marshal calls in the command path, with path exclusions for the shared root and a one-file-per-entry shrink-only allow list; an ast-grep rule for a struct field with a json tag in a command-layer package. Plant: json.NewEncoder(os.Stdout) in a command file fails, and a struct with json tags in cli/own fails. Control: the same code in the allowed root file, and the tagged type in core/api, pass"
  relates:
    go.layout.1:
      how: see
cli.output.3:
  slug: golden-help-and-json
