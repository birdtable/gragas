web.structure.10:
  slug: provider-adapter
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "`no-restricted-syntax` on string and template literals matching the service path prefixes (rule data) outside the adapter folder, scoped with files and including embedded page scripts. Plant: fetching a service path literal in a layout helper fails. Control: the same string in the adapter file passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: A: seven files and eight literals in one repo; none in another"
  note: "The Go twin is the provider rule of the Go language part; only the page-side adapter is stated here."
web.structure.11:
  slug: shared-shape-consumer-list
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. the contract check of our CLI: reads the page's consumer field list, reads the provider's golden generated from its types, and fails on a field the page reads that the golden lacks. Plant: renaming a read field in the golden fails; adding a field passes; dropping a route fails; a removed optional field must fail (owed). Control: a golden that adds a field and keeps every read field passes"
  open:
    - "How the provider's land reaches a list held in another repository with no per-push pipeline is unsettled."
