program/cli/rules/errors.yaml:
  summary: "An error or a warning for a person names where to read more or what to type and quotes an id; an error in JSON is structured; a refusal is one value (a word from a closed list, what was observed, the valid choices and a line to paste) printed unchanged by the CLI, the API and the audit; a command never throws past its executor; and no word reaches a terminal except through the shared module, which strips control sequences from text the program did not write."
cli.errors.1:
  slug: error-names-the-next-step
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "matrix test over a failing command with and without --json, with a golden on the error output with the id masked; a warning constructor with a required pointer and a source test for warnings built without it. Plant: an error with no next step fails; a constant run id (two runs print the same id) fails; a doctor warning with no more line fails. Control: a unique id per run and a warning built by the constructor pass"
  review_question: "Is the next step this error names useful to someone who has not read the code?"
  relates:
    cli.commands.8:
      how: see
cli.errors.2:
  slug: refusal-carries-its-next-step
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tool: golangci-lint
      tier: G
      note: "v1 class compiler. refusal constructor with required word and hint parameters (ui.Refuse(word, next)); forbidigo on the refusal struct literal (ui.Refusal{} and ui.Ending{}) outside the shared module (verified: it catches the literal form in trial T5b); a three-surface test per word. Plant: a refusal built without the hint does not compile; a ui.Refusal{} literal in a program fails forbidigo; an API body that rewords the refusal fails the three-surface test. Control: a refusal built by the constructor and printed unchanged on all three surfaces passes"
cli.errors.3:
  slug: words-only-through-the-module
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: forbidigo
      fix: never
      note: "golangci-lint 2.14.0 forbidigo with patterns for the print family and direct stdout and stderr writes outside the shared terminal module, plus a go/ast test for sentence-like literals passed to writers forbidigo patterns cover fmt.Print*, fmt.Fprint* aimed at os.Stdout or os.Stderr, and os.Stdout.Write, outside the shared terminal module (path exclusion); the same rule reads os.Getenv and os.LookupEnv of NO_COLOR, PAGER and TERM outside the module. Plant: fmt.Println(\"done\") in a command package fails and fmt.Println(userInput) fails. Control: the same through the module's say function passes the same words through ui.Say pass."
  open:
    - "Fired on print calls in the trial. Output through other writers (a buffered writer over stdout) is a hole forbidigo cannot see; the escape-byte matrix check covers it."
cli.errors.4:
  slug: untrusted-text-sanitised
