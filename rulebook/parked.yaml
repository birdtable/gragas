    - "v1 evidence, not yet a source: practice; config only"
arch.ports.12:
  slug: entry-point-is-thin
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: gochecknoglobals
      fix: never
      note: "gochecknoglobals with an allow list of the registry, machine and default-path variables named in rule data, plus an ast-grep rule on main's length, from its current baseline. Plant: a 120-line main fails; an unlisted mutable package variable fails. Control: a 15-line main with a testable run function and a listed registry passes"
    "2":
      binding: go
      class: test-kit
      tier: "1"
      note: "a test per write-once value: a second set panics, a read before the set panics, and a source test that only files under cmd call the setter outside _test.go files. Plant: a setter called from a command package fails; a second set in a test does not panic and fails. Control: one set in main before any read passes"
  open:
    - "The 80-line limit is a guess; the rule becomes firmer with a fault from a fat main."
arch.ports.13:
  slug: one-composition-root
  since: 0.1.0
