  open:
    - "Proposed for lack of a source; the v1 evidence was: C"
cli.look.10:
  slug: screen-reader-use-recorded
  since: 0.1.0
  level: release
  kind: instruction
  strength: Record
  review_question: "Who used the terminal programs with a screen reader for this release, on which date and version, and what did they find?"
  open:
    - "The tag refuses without a named person's record; the presence check is the only mechanical part."
    - Promotion needs the record paired with a review question that checks its content.
    - "Proposed for lack of a source; the v1 evidence was: C"
program/cli/rules/output.yaml:
  summary: "What a script, an agent or a person reads from a command line program: one JSON document on stdout with a contract version field the program names once, one object per line for a stream, one shared result type, result types declared once in the API package, the human answer on stdout with a path on every applied line, the same answer from the CLI and the API, unknown with a reason for anything not read, numbers no finer than their source, golden snapshots of help and JSON, a command tree compared with the last tag under the program's declared reader mode, and the shared flags registered once."
cli.output.1:
  slug: json-one-document
