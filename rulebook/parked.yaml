  open:
    - "The reference setting was a template value; whether the direct-dependency exact-pin rule conflicts with it is not settled."
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.bumps.6:
  slug: shared-config-carries-readable-version
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. the sync command stamps the source version in the vendored copy and the preflight reads it. Plant: a vendored copy without a stamped version fails. Control: a stamped copy passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.bumps.7:
  slug: shared-check-tools-move-together
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "a manifest check on the shared package that its check tools are regular dependencies and its lint and compiler tools are peers with ranges. Plant: a check tool declared as a peer fails. Control: the declared split passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.bumps.8:
  slug: a-library-release-reaches-its-consumers
  since: 0.1.0
  level: release
