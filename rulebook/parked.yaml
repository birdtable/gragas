program/cli/rules/cycle.yaml:
  summary: "What a program that draws a screen adds to the push moment of the development cycle: one golden per output at the width a person reads, narrow widths as properties, a pty journey that reads until its final frame, and goldens for the accessible and plain modes where they differ. These lines add members to the core moments and never a moment of their own."
cli.cycle.1:
  slug: one-golden-width-and-narrow-properties
  since: 0.1.0
