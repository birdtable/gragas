data/store/rules/schemas.yaml:
  summary: "Stored shapes are declared and checked. A data file is data and validates against a schema, a versioned file carries its version and has a stated upgrade and downgrade path, a status vocabulary is declared once and compared, a store that returns a time or an integer proves the stored form, and each engine has a contract suite with a version floor."
