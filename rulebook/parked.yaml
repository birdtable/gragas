  open:
    - "Not run on `.tsx` files."
    - "On `.astro` the untyped rule is carried by oxlint because the typed rules cannot read the virtual script files."
    - "v1 evidence, not yet a source: C (the donor repo's own lint, plus a trial on `.ts` files)"
  note: "A related rule in the Go part bans an empty interface in an exported signature; the two are separate checks."
ts.type-safety.2:
  slug: no-type-assertions
