base/arch/rules/structure.yaml:
  summary: "How a program grows: every new concern lands in exactly one door of a table, a change is complete when it lands, moves change no behaviour, a project declares its kind and stack, and things that change together live together in the same folder shape across a kind."
arch.structure.1:
  slug: one-door-per-concern
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. commitlint 21.2.4 trailer-exists for a Door trailer at land (body-empty also fires; the rule is machine-read from the commit message) plus the structure check that fails a new plumbing or shared-concern folder in a program; the diff-conditional half (a package file or dependency added needs the trailer) is the land step's check. Plant: a message with no Door trailer exits 1, with one exits 0; a new folder for a shared concern in a service fails. Control: a change with the trailer and a door from the table passes"
  relates:
    arch.decisions.2:
      how: see
  open:
    - "Half the check is commitlint (the message form); the diff condition is ours."
    - "The Go form has no per-change door statement today, only the concern table and the shared-package entry rule."
arch.structure.2:
  slug: extension-lands-complete
  since: 0.1.0
  level: process
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. the land check compares the change against the extension checklist (rule row with a check and a plant, a catalogue row, an example, docs) and fails a change that adds one and not the others. Plant: a change adding a rule row without its plant fails. Control: a change adding the row, check, plant and docs passes"
  open:
    - "The checklist check is described by the sources only as one change record; the exact mechanism is to be built."
    - "Some plants and controls of this rule were written at the merge from the sources' description of the check, and have not been run."
    - "Proposed for lack of a source; the v1 evidence was: practice"
arch.structure.3:
  slug: moves-change-no-behaviour
  since: 0.1.0
  level: process
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion move-commit check: a commit whose subject starts with move: may contain only renames at 100% similarity (git diff -M100% --name-status) and import-path and package-clause edits (a diff filter that strips import blocks and package lines leaves empty); other commits are not checked. Plant: a move commit that renames a file and edits a function body fails. Control: a pure rename with updated imports passes"
  open:
    - "Opt-in by the commit subject, so an agent that omits the marker passes; making it automatic needs a rename-detected-with-edit heuristic that fires on legitimate refactors. The must-enforce record asks for detecting a rename with edits from git and blocking until split or answered."
    - "v1 evidence, not yet a source: practice; no fault in our record"
arch.structure.4:
