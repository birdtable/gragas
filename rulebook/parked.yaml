# The values of the old rule files with no field at format 3, by rule id (or part, kind, layer, source or file), then field, in the old files' order. No program reads this file.
kind site:
  note: "No target product is a site yet: the parts that bind to it are dormant."
kind cloud-service:
  note: "No target product is a cloud service yet: the parts that bind to it are dormant."
kind docs:
  note: "No target product is a docs-only repository yet: the parts that bind to it are dormant."
kind no-identity:
  note: "A trait that switches rules off is a kind like any other (S73 of the spec, docs/spec.md). The first product of this kind is the explorer, which gragas does not build yet (README.md), so no source shows an instance. The claim that no sign-in exists is held by web.permissions.17, a review question until a tool can see a sign-in surface."
kind static-data:
  note: "A trait that switches rules off is a kind like any other (S73 of the spec, docs/spec.md). The first product of this kind is the explorer, which gragas does not build yet (README.md), so no source shows an instance."
part arch:
  split: base-arch
  description: "Modules, layers, ports, no cycles, decision records and reuse of shared code."
  builds_on: []
  bindings:
    - go
    - ts
    - any
part code:
  split: base-code
  description: "Size, duplication, dead code, naming and comments."
  builds_on: []
  bindings:
    - go
    - ts
    - any
part tests:
  split: base-tests
  description: "Deterministic tests, whole-suite runs with optional selection by change, property and mutation tests, test runners."
  builds_on: []
  bindings:
    - go
    - ts
    - any
part gates:
  split: base-gates
  description: "One gate command, tiers, plants, ratchets, suppressions, measures and the rule registry."
  builds_on: []
  bindings:
    - go
    - ts
    - any
part supply:
  split: base-supply
  description: "Lockfiles, provenance, secrets, licences, version bumps, releases and CI workflow hygiene."
  builds_on: []
  bindings:
    - go
    - ts
    - any
part docs:
  split: base-docs
  description: "Docs held to the code, glossaries and retired words."
  builds_on: []
  bindings:
    - go
    - ts
    - any
part agents:
  split: base-agents
  description: "Agent instruction files, finding what exists, hooks, review questions and tickets."
  builds_on: []
  bindings:
    - go
    - ts
    - any
part go:
  split: lang-go
  description: "What only Go has: errors and panics, context, goroutines, package layout and Go tooling."
  builds_on: []
  when:
    facets:
      - go
  bindings:
    - go
part ts:
  split: lang-ts
  description: "What only TypeScript has: strict compiler, the lint engine (Biome or ESLint), Node ESM, modules and type coverage."
  builds_on: []
  when:
    facets:
      - ts
  bindings:
    - ts
part py:
  split: lang-py
  description: "What only Python has: the formatter and linter as checks, exact pins or hashes, the venv behind the pins, byte-compile and import smoke, tests with workers and a type check, a replay golden."
  builds_on: []
  when:
    facets:
      - py
  bindings:
    - any
part cli:
  split: app-cli
  description: "Command-line programs: exit codes, --json, terminal look, flags and environment."
  builds_on: []
  when:
    kinds:
      - cli
      - daemon
  bindings:
    - go
    - ts
    - any
part daemon:
  split: app-daemon
  description: "Long-running processes: service-manager units, restarts, health and local servers."
  builds_on:
    - cli
  when:
    kinds:
      - daemon
  bindings:
    - go
    - ts
    - any
part service:
  split: app-service
  description: "Backend services: bootstrap, API contracts, authorisation, events and outbox, outbound clients, logs."
  builds_on: []
  when:
    kinds:
      - service
  bindings:
    - go
    - ts
    - any
part web:
  split: app-web
  description: "Web front ends: structure, design parts, tokens, states, forms, accessibility, words and speed."
  builds_on: []
  when:
    kinds:
      - web-app
      - site
  bindings:
    - go
    - ts
    - any
part pages:
  split: app-pages
  description: "HTML files a person looks at with no build, and repositories that hold Markdown or nothing: links that resolve offline, a ledger that matches the pages, a rendered golden per page, and a members file that says when there is nothing to run."
  builds_on: []
  when:
    kinds:
      - site
