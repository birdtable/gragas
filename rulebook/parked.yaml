      class: preset-config
      tool: eslint
      tier: "1"
      note: "a GritQL plugin for Biome, or ESLint `n/no-process-exit`, on gate files. Plant: a `process.exit(1)` in a gate file fails the lint. Control: `process.exitCode = 1` passes"
