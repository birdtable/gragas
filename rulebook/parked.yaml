  level: type
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "golden for the table component at widths 80, 60 and 40, plain and role-tagged The golden is uitest.Golden. Plant: the current table that drops and cuts a column at 40 fails the golden. Control: a wrapping table passes"
cli.look.8:
  slug: component-goldens
