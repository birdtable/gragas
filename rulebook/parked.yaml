    "2":
      binding: go
      class: preset-config
      tier: "3"
      note: "a scan of direct requirements for pseudo-versions and prerelease tags against the allow file. Plant: a direct pseudo-version with no pilot entry fails. Control: a recorded pilot passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: D: zero direct pseudo-versions today in six repositories, and 25 indirect lines"
base/supply/rules/install.yaml:
  summary: "How dependencies get into a build. One pinned package manager installs from the lockfile only, direct versions are exact, nothing runs at install time unless named, the build and type-check run with the network blocked, no import resolves to a package nobody declared, and the toolchain is one version."
supply.install.1:
  slug: install-from-the-lockfile-only
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "go mod verify, GOFLAGS=-mod=readonly, and a scan that bans -mod=mod and go get in gate and release scripts. Plant: a gate or release script that runs go get, or a tampered module cache, fails. Control: a clean tree passes"
    "2":
      binding: ts
      class: preset-config
      tier: "3"
      note: "the package manager pinned by the manifest field, install with --frozen-lockfile only, and an only-allow guard in the preinstall hook; strict peer dependencies on. Plant: an install with a changed manifest and a stale lockfile fails; a second package manager fails. Control: a frozen install passes"
  open:
    - "go mod verify offline and the tampered-cache refusal were planted in a trial; the Go gate-script scan is proposed and was not planted."
    - "v1 evidence, not yet a source: practice; a package manager that refuses a young locked entry passes where another does not"
supply.install.2:
  slug: build-and-check-offline
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "3"
      note: "build and type-check run under a sandbox runtime with an empty allowed-domain list, and are refused by name where the system gives no block. Plant: a node fetch of the registry under the sandbox with no allowed domains fails; a build step that fetches at build time fails. Control: the offline build step passes"
    "2":
      binding: go
      class: preset-config
      tier: "3"
      note: "go-proc's network block with GOFLAGS=-mod=readonly and GOPROXY=off; where it gives none (sandbox.ErrNoBlock) the step is refused by name, never run unblocked. Plant: a build step that fetches at build time fails. Control: a build that reads only the module cache passes"
  open:
    - "The macOS means is not chosen. The sandbox runtime was run on macOS (exit 1 on the plant, a 403 on the connect); the Linux path is from its README and was not run. The sandbox runtime is below version 1.0, so using it needs a pilot record."
    - No gate proved a build with the network off before this rule.
supply.install.3:
  slug: package-manager-pinned-in-manifest
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "a settings check that reads the manifest field and requires the manager name and a minimum version. Plant: a manifest with no manager pin fails. Control: a manifest pinning the manager and its minimum version passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "In Go the same idea is a pinned toolchain version that a preflight checks before the gate, so a stale toolchain cannot skip a flag."
supply.install.4:
  slug: exact-versions
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tool: syncpack
      tier: "1"
      note: "syncpack semver groups with an exact range, a separate group for peers that allows ranges; npm-package-json-lint prefer-absolute-version rules as a second opinion. Plant: a caret range in dependencies and a tilde range in devDependencies each fail. Control: exact pins pass"
  relates:
    supply.release.9:
      how: see
supply.install.5:
  slug: lagging-peer-range-on-record
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "3"
      note: "strict peer dependencies so an unmet peer fails the install; every peer rule or override entry carries an exception record naming reason, owner and expiry. Plant: a shared package whose peer range excludes the installed tool major fails the install. Control: the same install with a recorded override passes"
  open:
    - "The record check is the exception-record parser, not yet built."
    - "Proposed for lack of a source; the v1 evidence was: C: a lint plugin lagged a major linter, and a build plugin needed a peer-ignoring switch"
supply.install.6:
  slug: install-scripts-off
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "strict dependency-build setting true with the named build list, read back from the resolved config, last value wins. Plant: the setting off fails the read-back; a package with a script that is not named fails. Control: the setting on with a named package passes"
  open:
    - "v1 evidence, not yet a source: C: the setting is held in the web template"
supply.install.7:
  slug: install-script-allowlist-schema
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "a settings check that validates the allowlist against a schema of package, owner and reason of ten or more characters. Plant: an entry with a short reason fails; a file that does not parse fails. Control: a complete entry passes, and an absent file passes"
  open:
    - "The reference check carries no expiry on an allowlist entry; our exception record adds one."
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.install.8:
  slug: no-phantom-imports
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tool: knip
      tier: "2"
      note: "knip with unlisted, unresolved and binaries issue types set to error, a non-flat node_modules layout, and a frozen install that fails when the lock and manifest disagree; a workspace check that the root manifest's dependencies are imported by no package and that each package's declared siblings equal the siblings its import rules allow. Plant: an import of a package that is not in the manifest fails; a binary run by name that is not declared fails; a root dependency imported by a package fails. Control: a declared import passes"
  relates:
    arch.layers.12:
      how: see
  open:
    - knip needs its framework plugin active or it reports files used only from template files as unused. Not re-run.
supply.install.9:
  slug: toolchain-one-version
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion preflight on every gate host (runtime against the pinned file, manager against the manifest, frozen install dry check). Plant: a host with the wrong runtime major fails. Control: a matching host passes"
    "2":
      binding: ts
      class: preset-config
      tier: "1"
      note: "sherif 1.13.0 over the workspace manifests (one version per dependency, workspace links for siblings). Plant: two packages declaring different versions of one dependency fail; a sibling declared by a published version fails. Control: one version per dependency and workspace links pass"
    "3":
      binding: go
      class: preset-config
      tier: "1"
      note: "one pinned version per tool in the tools module, run by the gate and never fetched at run time, with the preflight naming missing ones. Plant: a gate host with a missing or wrong tool version fails the preflight. Control: a matching host passes"
supply.install.10:
  slug: check-tools-pinned-no-runner-fetch
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "1"
      note: "a test that fails if a package runner name appears in a shipped file, and a wrapper that runs each named tool from the package's own pinned install. Plant: a shipped script that calls the runner fails the test. Control: a script that calls the pinned install passes"
    "2":
      binding: go
      class: preset-config
      tier: "1"
      note: "tools pinned in the tools module and run by companion, with a scan that bans go run of a versioned package and go get in gate scripts. Plant: a gate script with go run of a package at a version fails. Control: a pinned tool call passes"
supply.install.11:
  slug: module-hygiene-tidy-and-go-version
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
