  relates:
    ts.lint-config.1:
      how: see
  open:
    - "The ticket pattern rule is written from the source's text; the minimum description length differs between sources (10 characters in the preset)."
ts.type-safety.4:
  slug: parse-outside-values
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "0"
      note: "no-restricted-syntax on an `as` assertion whose operand is a call to `json()` or `JSON.parse`, together with the assertion ban. Plant: `const u = (await res.json()) as User` fails. Control: parsing the result with the schema passes"
  relates:
    ts.type-safety.2:
      how: see
  open:
    - "The selector for the response-cast form is written from the source text, not run."
  note: "Narrower than ts.type-safety.2, which covers every assertion; this one names the form that crosses the trust boundary."
ts.type-safety.5:
  slug: typed-exports-of-core
  since: 0.1.0
  level: type
  kind: rule
  checks:
    "1":
      binding: ts
      class: analyzer
      tier: "1"
      note: "v1 class our-plugin. a type-aware lint rule over exported signatures of core-path files that resolves aliases and flags any, unknown and record types. Plant: a core function taking `Record<string, unknown>` fails; an adapter taking it passes. Control: a core function taking a named parsed type passes"
  open:
    - "The rule is argued, with no failure case in the record."
    - "The held-by tier is 1 or 2 in the source; set to 1 here."
    - "The alias-resolving scan is inference; the plugin is not built."
    - "v1 evidence, not yet a source: practice (argued from the principles report)"
    - "v1 reference, not yet a source: backend report B-04 section 4"
  note: "Held-by in the source is a gate at tier 1 or 2. Agents get round it with a type alias over the record, which is why the scan resolves the underlying type."
ts.type-safety.6:
  slug: branded-ids
  since: 0.1.0
  level: type
  kind: rule
