base/tests/rules/journeys.yaml:
  summary: "A journey drives the real thing end to end: the built binary run script-style, an install and start under the init system, a request and its answer, a browser page against the real server. Journeys are the dearest tests, so each is scoped to the change, declares what it exercises, justifies its place and runs on the shipped tree."
tests.journeys.1:
  slug: journeys-scoped-to-the-change
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. journey map file plus a test that every leaf command and route has a journey and every journey declares inputs; selector tests with a planted failing journey behind a changed command. Plant: a command with no journey fails, a journey with no declared inputs fails, and a planted journey behind a changed command is selected. Control: a complete map passes"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. reach map and pure picker lifted from the browser-test repo, with its unit test; add a freshness date per entry and a plan hash. Plant: a journey in no entry fails the test, and a glob matching nothing fails. Control: a mapped journey is selected by its paths"
  relates:
    tests.selection.2:
      how: see
    tests.selection.5:
      how: see
  open:
    - "Under discussion with the operator (D-G); recorded as written."
    - "Known holes in the reach map as it stands: the map and picker select nothing (tests.selection.5), no plan file or hash, a journey may not exercise what its paths draw, Go paths reach the page only where written, no freshness date per entry. A scoped run was not timed against a full one."
    - "The selector's cross-repo input is not built."
    - "v1 evidence, not yet a source: own measure; A"
