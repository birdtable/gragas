  relates:
    cli.errors.3:
      how: see
    cli.environment.1:
      how: see
  open:
    - "The matrix escape-byte check (cli.environment.1) with an escape-bearing fixture covers writers forbidigo cannot see."
cli.errors.5:
  slug: nothing-throws-past-the-executor
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "shared executor test driving every registered command with a malformed input and asserting a typed result, never an uncaught throw or panic. Plant: a command that throws on a malformed argument fails the test. Control: a command that returns a refused result passes"
  relates:
    arch.ports.14:
      how: see
  open:
    - The one executor and write port is arch.ports.14.
cli.errors.6:
