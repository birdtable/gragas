  checks:
    "1":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "A structural rule flagging a service address literal next to a configured address read. Plant: A literal service address used as a fallback fails. Control: The configured address alone passes."
    "2":
      binding: any
      class: test-kit
      tier: "1"
      note: "a word-list test over non-config, non-test source and the config defaults against the installation list kept outside the repository, plus a check that defaults are declared only in the config package. Plant: a default host name equal to a name on the installation list fails; a literal LAN address in a command file fails. Control: a neutral default port declared in the config package passes"
  relates:
    supply.secrets.4:
      how: see
    gates.own-rules.4:
      how: see
    web.delivery.8:
      how: see
  open:
    - Taken from one bundled source row of five small domain rules written as checks.
  note: "Moved from gates.own-rules.4, where the merge wrote it with the doubt that it belongs in code (config reading). The web form, a service base URL from one descriptor that throws when unset, is held in web.delivery.8."
base/code/rules/deadcode.yaml:
  summary: "Nothing ships that nothing uses: no unused file, export or dependency, and no stub left in shipped source. The tools are run by their output, since several exit with status 0 even with findings."
code.deadcode.1:
  slug: nothing-unused
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tool: golangci-lint
      tier: "2"
      note: "deadcode (golang.org/x/tools v0.52.0) -test ./... runs for each system of the project's list, by GOOS, on the one machine the gate runs on, as one step; golangci-lint likewise; a wrapper compares the dead-code output with a committed list and fails on any new line; go mod tidy with no diff. Plant: an uncalled exported function in main is listed and fails (a trial listed neverCalled with exit 0). Control: a function called from main is not reported"
    "2":
      tool: golangci-lint
      key: unused
      fix: never
      note: "Held by the golangci preset (default: standard turns it on): an unused identifier is reported."
    "3":
      binding: ts
      class: preset-config
      tool: knip
      tier: "2"
      note: "knip 6.44.1 (MIT) with the template's config and the astro and vite plugins active (needs the astro dependency present); entries are page routes, scripts and test files; unused files, exports and dependencies as errors with a shrink-only baseline. Plant: a new exported function nobody imports fails; an .astro component imported only from a page is not reported. Control: an .astro component imported only from a page is not reported"
  open:
    - "go:linkname is banned by code.deadcode.3, not left to the dead-code report."
    - The web finder needs a re-run on the newest Astro before binding.
code.deadcode.2:
  slug: no-stubs-in-shipped-source
  since: 0.1.0
  level: function
  kind: rule
  checks:
