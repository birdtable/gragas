data/store/rules/state-files.yaml:
  summary: "How a program keeps its own files on disk. Every path comes from one function, a state file is replaced whole only by the atomic write and the atomic write proves its promise, a move flushes before it removes, an append journal line is one write, secrets are written with their final mode, state on a network file system is refused where the format needs a local disk, and a path from outside is confined."
store.state-files.1:
  slug: one-function-makes-every-path
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "forbidigo or an AST test on the path literals outside the paths package with a shrink-only count. Plant: a literal path outside the paths package fails. Control: the paths package passes"
  open:
    - "The shared paths function is proposed; one program's resolver is the best starting body."
    - "Proposed for lack of a source; the v1 evidence was: own measure (read)"
store.state-files.2:
  slug: atomic-write-only
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "forbidigo (analyze-types) banning the write primitives outside the atomic-write package with a per-file shrink-only allow list. Plant: Rename, an alias of Rename, Root.Rename, Renameat, Link then Remove, Create, WriteFile and a CreateTemp helper outside the owner each fire. Control: the owner package passes"
    "2":
      binding: go
      class: test-kit
      tier: "2"
      note: "a test of the atomic-write helper that replaces a file with mode 0640 and a symbolic link to it, and asserts the mode, the owner and the link are kept and the target is replaced. Plant: a helper that replaces the link with a plain file, or writes mode 0644, fails. Control: the helper keeping mode, owner and link passes"
  open:
    - "The ban is path-blind (WriteFile for a log is also hit), so per-repository allow lists will be tens of lines."
    - "The shape rule flags only the direct copy (1 of 6 planted forms), so it is advice, not a gate."
    - Gaps in the shared write package are a create-exclusive helper and a copy.
store.state-files.3:
