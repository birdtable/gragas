program/cli/rules/exit.yaml:
  summary: "A command line program in any language ends with one of seven documented exit codes that a script can rely on, takes those codes from one owner package, and says its version, commit, toolchain and, where it has them, its server's version and API number, from what was stamped at build."
cli.exit.1:
  slug: documented-exit-codes
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "Go test in the shared repo-check package, lifted from two existing tests (the table-against-constants test and the five-codes test): parse the markdown table and the exit package's constants, fail on any difference, and run the built binary through the matrix for one refused, one failed and one missing-port path. Plant: set the refused code to 1 in a copy of the exit package, or change the document row for 5, or drop the row for 6, or exit 4 on a missing port, and the test fails. Control: the unchanged tree passes"
    "2":
      binding: ts
      class: test-kit
      tier: "2"
      note: "the same table-against-constants test over the program's own exit owner module, and a matrix run of the built CLI for one refused and one failed path. Plant: a refusal that exits 1 fails. Control: a refusal that exits 5 passes"
  relates:
    go.errors.4:
      how: see
  open:
    - "The check exists in two repos but nobody has seen it fail (no plant recorded), so the plant must be run once per repo at adoption."
    - One program moves at its next minor with a changelog entry.
  note: "The cost of the codes 0 to 5 falls on the three-code TypeScript program named in evidence: it remaps bad usage 1 to 2, refusal 1 to 5 and could-not-run 2 to 1. That breaks scripts that read its exit status, so the remap ships as a breaking change recorded in that program's changelog. Its three-code meaning is kept: bad usage stays usage and a person's mistake becomes refused."
cli.exit.2:
  slug: exit-codes-from-the-owner
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tool: ast-grep
      tier: "1"
      note: "ast-grep rules using the node-kind form (a pattern form matched nothing in the trial): const or var spec with an exit-like name and an int literal, and an exit call with an int literal, over non-test Go outside the owner; a dependency-list test of the leaf. Plant: const ExitBusy = 3, a grouped ExitFailed = 1, and os.Exit(3) are reported; os.Exit(code) is not. Control: the owner package's own constants pass"
  open:
    - "Real clones, non-test: const declarations 8 in one program, 0 in the others; the exit-call counts are in the trial record."
cli.exit.3:
  slug: version-from-build-info
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "2"
      note: "binary matrix in the shared test package, exec of the built program with --version and version --json; a repo-check test that each cmd folder has a test calling the matrix; comparison with go version -m. Plant: a binary whose --version prints nothing, one whose version --json prints two documents, one with a hard-coded version string, and a client whose JSON has no server key all fail. Control: a binary built from the hello-world kit program passes and reads its stamped tag and runtime build info"
  relates:
    cli.output.9:
      how: see
  open:
    - "The matrix is shared code; its alternative, each repo writing its own, is caught by the repo-check that demands the call."
  note: "Merges the --version rule with the rule that the version comes from build info; one matrix check holds both."
program/cli/rules/look.yaml:
  summary: "Every CLI takes its look from one module by version and exactly one module imports the terminal library. Colours come from one token file and are contrast-tested, sizes and escapes appear nowhere else, closing words and the dry-run footer are built by constructors, and components have goldens at three widths."
