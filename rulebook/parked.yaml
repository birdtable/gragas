  relates:
    supply.install.1:
      how: see
  open:
    - The same rule for JavaScript is the frozen-lockfile check in supply.install.1.
    - "Proposed for lack of a source; the v1 evidence was: own measure; one repository sat on an old Go version"
base/supply/rules/intake.yaml:
  summary: "What may enter a build at all. Each concern has one owner library chosen in a data file, alternatives are banned by name, a new dependency meets a bar and is justified in the change that adds it, and a second person signs it. Libraries that do what the platform already does stay out, and every ban names the condition under which it would be lifted."
supply.intake.1:
  slug: one-owner-per-concern
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "depguard rows generated from the ban table, with the issue cap set to zero so the first run is not truncated. Plant: an import of a banned library fails with a message naming the owner. Control: an import of the owner passes"
    "2":
      tool: golangci-lint
      key: gomodguard_v2
      fix: never
      note: "Held by the golangci preset, whose comment on gomodguard_v2 names this rule: a module the register bans is refused in go.mod, with the owner named as the one to use"
    "3":
      binding: ts
      class: preset-config
      tool: syncpack
      tier: "1"
      note: "syncpack lint with a config generated from the packages data file (one version group per allowed package, one banned group per banned name, a final banned catch-all so any unlisted direct dependency fails) plus ESLint no-restricted-imports generated from the same file for names in source. Plant: a banned name and an unlisted name in a scratch manifest each fail. Control: only listed packages with exact pins pass"
    "4":
      binding: any
      class: preset-config
      tier: "3"
      note: "JSON Schema check of the concern table requiring an owner and alternatives on every entry. Plant: a table entry without an owner fails. Control: a complete entry passes"
  open:
    - "The data file for web projects does not exist yet, so the web half is an instruction until it does."
    - "The reference list of decided libraries includes framework-specific picks; those belong in the framework part and are not copied here."
    - "v1 evidence, not yet a source: practice; the web side was named by the operator and evidenced by the current dependency count"
    - "v1 reference, not yet a source: Go language rulebook sources GL-1 and GL-5 (own reports)"
  note: "The depguard issue cap truncated the first planted run at 50 issues, hence the cap of zero. A concern that is not needed yet is named in advance and not added (a handbook point)."
supply.intake.2:
  slug: allow-file-and-falling-count
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tool: golangci-lint
      tier: "2"
      note: "a per-binary closure test comparing go list -deps of each main package with that binary's allow list in rule data, with the count cap and the empty-file refusal; golangci-lint gomodguard_v2 with the allowed-modules list generated from the union of the lists for the direct half. Plant: a guest binary that imports a host package fails; an import of a module that is off every list fails. Control: each binary linking only its listed packages passes"
  open:
    - "The direct half is off the shelf; the transitive cap is our own script and was planted 72 of 72 in a trial."
    - "v1 reference, not yet a source: Go estate dependency reports GL-2 and GL-3 (own reports)"
supply.intake.3:
  slug: new-dependency-bar
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "a facts script over the module proxy and the repository host API, plus a module-graph script, failing on bar items. Plant: a module with no licence fails. Control: a permissively licensed, active module passes"
  open:
    - "The standard-library sentence is a review item; the facts script is a recipe to write, not a program to build."
    - "Proposed for lack of a source; the v1 evidence was: practice"
    - "v1 reference, not yet a source: Go estate dependency report GL-5 (own report)"
supply.intake.4:
  slug: new-dependency-justified-and-signed
  since: 0.1.0
  level: process
  kind: rule
  strength: Lens
  review_question: "Does the pull request say why this dependency is needed, what it replaces, and does it carry a sign-off from someone other than its author?"
  open:
    - "The independent signature depends on a stored non-author verdict, which today cannot be told apart because every agent pushes as one identity."
  note: "v1 review check (review is not a v2 check class): protected-path rule requiring a stored non-author verdict on manifest changes; a model reads the justification in the pull request"
supply.intake.5:
  slug: standard-library-first
  since: 0.1.0
  level: package
  kind: rule
  strength: Lens
  review_question: "Does the standard library or a maintained tool already do what this new dependency, helper or part does, and which tools were surveyed?"
  relates:
    arch.ports.6:
      how: see
    arch.ports.20:
      how: see
  open:
    - Whether the standard library or a tool would do is semantic and not checkable by tool. A partial aid is a linter that flags helpers replaced by the standard library.
    - "v1 reference, not yet a source: Go standard library first (own report GL-5)"
  note: "v1 review check (review is not a v2 check class): a model checks whether the standard library covers the new module, beside the allow-file row that new modules already need, and a required survey field in the change template (presence only) for a new part"
supply.intake.6:
  slug: new-library-names-what-it-replaces
  since: 0.1.0
  level: process
  kind: rule
  strength: Lens
  review_question: "Does the change that adds this library say what it replaces, ban the alternatives and record the replaced use as debt?"
  open:
    - "The table row and the supply-chain gate are mechanical; whether the replaced use is named is judged."
  note: "v1 review check (review is not a v2 check class): the concern-table check (supply.intake.1) fails a library without a table row; a model reads the change for the replaced use and the debt entry"
supply.intake.7:
  slug: platform-duplicates-banned
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tool: syncpack
      tier: "1"
      note: "ban entries (name, reason, platform export that replaces it) in the packages data file become banned syncpack groups. Plant: a banned platform-duplicating dependency fails. Control: a manifest without one passes"
  open:
    - "An advisory plugin that reports dependencies with a native replacement exists; it was not run and is advice, not the gate."
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.intake.8:
  slug: ban-has-reentry-trigger
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-config
      tier: "1"
      note: "the packages data file validated by JSON Schema (ajv) requiring a re-entry field on every ban entry. Plant: a ban entry without a re-entry trigger fails. Control: an entry with one passes"
  open:
    - "Half of this holds: the schema half is enforced; whether the family is complete is judged by a person. Proposed to split it."
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.intake.9:
  slug: agent-fit
  since: 0.1.0
  level: package
  kind: instruction
  strength: Lens
  review_question: "Write a sample against this dependency's API with a model and score whether it is correct without prompting."
  open:
    - "No measure exists for agent fit; it would change if a repository logged how often agents misuse a dependency API."
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.intake.10:
  slug: test-only-module-absent-from-build
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "go list -deps without tests compared with the allow file; reports not applicable with the count while there are zero test-only modules. Plant: a test-only module in the production dependency list fails. Control: a clean list passes"
  open:
    - "Not applicable today: zero test-only modules."
    - "Proposed for lack of a source; the v1 evidence was: practice"
base/supply/rules/licences.yaml:
  summary: "Every dependency carries a licence on one shared allowlist. The check fails closed, exceptions are dated and narrow, a licence guessed from a file needs a clarification, and our own shared modules are checked for a licence file with their visibility known."
supply.licences.1:
  slug: licence-on-the-allowlist
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "2"
      note: "go-licenses check with --allowed_licenses and --ignore for our modules, in the gate command the pre-push hook runs. Plant: a dependency with a disallowed licence gives exit 1 and a not-allowed message. Control: the allowed list with our modules ignored exits 0"
    "2":
      binding: ts
      class: preset-config
      tier: "2"
      note: "pnpm licenses list over the lockfile against an allowlist in the packages data file with a stricter list for production dependencies, and a check that no MPL-2.0 package is patched (patchedDependencies) or vendored; license-checker with --onlyAllow is the alternative. Plant: a scratch dependency with GPL-3.0 fails; an MPL-2.0 package listed in patchedDependencies fails. Control: MIT passes; an unmodified MPL-2.0 package passes"
  open:
    - "Neither web tool was run; an existing check script in a web repository was read only. The Go tool was verified."
supply.licences.2:
  slug: licence-check-fails-closed
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "a test of the licence command with an empty tree, an uninstalled dependency, a missing licence and a non-SPDX string. Plant: an empty tree fails. Control: a tree of allowed licences passes"
supply.licences.3:
  slug: dated-licence-exceptions
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "the licence command rejects an exception naming more than one package or licence, a production dependency, or a past expiry date. Plant: an expired exception fails; an exception for a production dependency fails. Control: a current exception for a development dependency passes"
    "2":
      binding: go
      class: preset-config
      tier: "3"
      note: "a licence exception names the module, the reason and an expiry. Plant: an exception without an expiry fails. Control: a dated exception passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.licences.4:
  slug: licence-clarifications
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "3"
      note: "the licence command requires a clarification entry for a guessed licence and skips the own scope by name. Plant: a guessed licence with no clarification fails. Control: a clarified entry passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.licences.5:
  slug: shared-modules-have-licence-file
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "4"
      note: "repository view and a licence-file check on each shared module in go.mod, a recipe in the shared makefile fragment. Plant: a module without a licence file fails. Control: a module with one passes"
  open:
    - "v1 evidence, not yet a source: own measure; three released versions of the shared modules had none"
supply.licences.6:
  slug: licence-and-notices-ship
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a gate member that checks LICENSE and NOTICE at the root and regenerates each artifact's notices file from its bundled package list (go-licenses save or report for Go, the package manager's licence listing for web) and compares it with the shipped file. Plant: a new bundled dependency without a regenerated notices file fails; a missing NOTICE at root fails. Control: a notices file equal to the regenerated one passes"
    "2":
      tool: goreleaser
      key: archives
      fix: never
      note: "gragas check reads the repository's goreleaser config and reports an archive whose files do not carry LICENSE and NOTICE. A repo with no goreleaser config gets no finding. Plant: an archive listing no NOTICE is reported. Control: an archive listing both passes"
  examples:
    bad:
      lang: yaml
      code: "archives:\n  - formats: [tar.gz]\n    files: [LICENSE]\n"
    good:
      lang: yaml
      code: "archives:\n  - formats: [tar.gz]\n    files: [LICENSE, NOTICE]\n"
base/supply/rules/provenance.yaml:
  summary: "A file that came from somewhere else says where. A vendored file equals its source at a named version by hash, a part copied between sites records its origin, a generated file names the tool version that made it and leaves no diff when regenerated, and a fetched program is pinned and verified before use."
supply.provenance.1:
  slug: vendored-file-equals-source
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion tokens verify reads the version and sha256 in a lock file and compares them with the vendored file and the registry version. Plant: editing a vendored token file by one byte fails; a lock naming version 9 for a package at version 1 fails. Control: restoring the file passes"
  open:
    - "When tokens are consumed as a package dependency, the package manager's lock integrity covers it and this rule reduces to the lockfile check."
    - "Proposed for lack of a source; the v1 evidence was: A: a vendored header said version 9 against a source at version 1"
supply.provenance.2:
  slug: copied-part-records-origin
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. files placed by companion sync carry a copied-from header with a hash; the sync check fails when a header is missing or the hash differs from the source at that version. Plant: a synced file with its header removed fails; a drifted body fails. Control: an intact synced file passes"
  open:
    - "Half holds, for synced copies only. A hand copy dropped in with no header is not seen unless the cross-repository clone scan finds it (a known gap)."
supply.provenance.3:
  slug: generated-files-name-their-version
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "1"
      note: "a banner check that generated files start with the standard line and a version token. Plant: a generated file missing the banner fails. Control: a file with both passes"
  relates:
    supply.provenance.5:
      how: see
    supply.provenance.6:
      how: see
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "Split from a bundled source row that also held two other rules, kept as supply.provenance.5 and supply.provenance.6."
supply.provenance.4:
  slug: regenerating-leaves-no-diff
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "go generate ./... followed by git diff --exit-code; not applicable with count 0 while no go:generate line exists. Plant: a stale generated file fails. Control: freshly generated files pass"
  open:
    - The two repositories without Go files have a zero that says nothing.
supply.provenance.5:
  slug: one-token-file
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a single tokens source in the repository, with the sync and verify checks of supply.provenance.1 for every copy. Plant: a second token file that is not a recorded copy fails. Control: one source and its recorded copies pass"
  open:
    - "The source row reads only \"one token file\" inside a bundled row; this wording is an interpretation."
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.provenance.6:
  slug: recipes-work-on-mac-and-linux
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "a task in the Taskfile using standard tools only and no shell line of its own. Plant: a task that runs a shell pipeline fails. Control: a task that runs one program command passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.provenance.7:
  slug: fetched-program-pinned-and-verified
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "a test over image build files and fetch scripts that every download is followed by a signature or checksum verification against the publisher's https origin and a version read-back, with no fallback branch that skips the check. Plant: a download step with no checksum check fails; a checksum fetched over plain http fails; a verify step guarded by || true fails. Control: a pinned download verified against the publisher's checksum and read back passes"
  relates:
    supply.age.4:
      how: see
base/supply/rules/release.yaml:
  summary: "A release is built from a clean tagged main by one recipe after the full gate, and only the release workflow on the tag publishes. It is refused on an undeclared API break, builds the same bytes from any directory, carries a checksum, provenance and an SBOM where the publisher offers them and a plain-words changelog entry, is tested as the bytes that ship, and is built for every operating system it ships for."
supply.release.1:
  slug: publish-only-from-the-release-job
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "4"
      note: "the release recipe refuses a dirty tree, a branch other than main or a lightweight tag, and contains no git push (a scan of the recipe); the install step compares the installed version with the tag; a require-ci command refuses a publish unless CI is set. Plant: a release from a dirty tree is refused; a publish with the CI variable unset is refused; an install from an untagged build is refused. Control: a release from a clean annotated tag on main, published by the tag-triggered workflow, passes"
  relates:
    gates.land.1:
      how: see
    supply.release.5:
      how: see
    supply.release.6:
      how: see
    docs.links.1:
      how: see
    supply.workflows.1:
      how: see
  open:
    - "Neither the workflow linter nor the security audit checks the trigger set; the policy tool reads YAML 1.1, so the on key arrives as the string true and the policy reads that key."
    - The workflow-trigger half is held by supply.workflows.1.
supply.release.2:
  slug: undeclared-api-break-refused
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "4"
      note: "gorelease at the tag step before the tag is pushed, and apidiff for the report. Plant: removal of an exported function fails. Control: a compatible change passes"
  open:
    - "v1 evidence, not yet a source: own measure; apidiff found a real break in an exported listener"
supply.release.3:
  slug: same-bytes-from-any-directory
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "the release tool builds with the trim-path flag and a snapshot build is made twice from two directories and the binaries compared. Plant: a build without the flag gives two hashes. Control: a build with the flag gives one"
  open:
    - "A library ships no binary to build, so whether it is exempt is open."
    - "Proposed for lack of a source; the v1 evidence was: practice; the flag appeared in no repository"
supply.release.4:
  slug: release-checksum
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "4"
      note: "the release tool's checksum block, and a release check that the checksum file lists every artifact. Plant: a release without a checksum file, or a checksum file missing an artifact, fails. Control: a complete file passes"
  relates:
    supply.release.9:
      how: see
  open:
    - "Half rule, since the checksum is checked by a step but whether an SBOM or signature is due is a judgement no check can make because no check can say a consumer exists."
  note: "Retired: provenance and an SBOM are shipped wherever the publisher offers them, not when a third party asks. The checksum half moves to supply.release.9 unchanged."
supply.release.5:
  slug: tag-with-changelog-and-no-push
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "4"
      note: "a release check that the changelog entry for the tag exists and differs from the tool's untouched draft, that the version equals the tool's proposal or the named override, and a scan that bans git push in the release recipe. Plant: a tag without an entry fails; an entry identical to the generated draft fails; a recipe with git push fails. Control: a tag with a rewritten entry and a push-free recipe passes"
    "2":
      tool: goreleaser
      key: changelog.disable
      fix: never
      note: "gragas check reads the repository's goreleaser config and reports changelog.disable set beside release notes, since the entry a person wrote would then be dropped. Plant: both set is reported. Control: a config that does not disable the changelog passes"
    "3":
      tool: changie
      key: unreleasedDir
      fix: never
      note: "gragas check reads a repository's .changie.yaml, where it has one, and reports a change file not named <issue>-<kind>. The changelog tool is chosen per repo, so a repo with no .changie.yaml gets no finding. Plant: a misnamed change file is reported. Control: well-named files pass"
  examples:
    bad:
      lang: yaml
      code: "# .goreleaser.yaml, run with --release-notes: the changelog is turned off beside it\nchangelog:\n  disable: true\n"
    good:
      lang: yaml
      code: "# .goreleaser.yaml, run with --release-notes\nchangelog:\n  disable: false\n"
supply.release.6:
  slug: shipped-bytes-are-tested
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "4"
      note: "a release step before publish in the shared recipe that unpacks, runs version and one start test, and compares the digest. Plant: an archive with a wrong binary stops the release. Control: the right archive passes"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "4"
      note: "v1 class our-cli. a release step after the build that unpacks the archive, serves its page, runs one start test and compares the digest; fails before publish. Plant: an archive with a wrong file inside stops the release. Control: the right archive passes"
    "3":
      binding: any
      class: preset-config
      tier: "4"
      note: "a release step that unpacks the function bundle, invokes its handler and compares the hash with the test run's and with the deployed code hash. Plant: a bundle with the wrong handler inside stops the release. Control: the right bundle passes"
    "4":
      binding: any
      class: test-kit
      tier: "1"
      note: "a test that reads the release workflow: the publish job needs every other job, no if or continue-on-error key exists, and the publish job has no checkout step. Plant: a workflow with continue-on-error on the test job fails; a publish job with a checkout step fails. Control: a workflow whose publish needs every job and only promotes artifacts passes"
  open:
    - Whether this step would have caught the four faults is not traced.
    - Whether the check runs at tier 3 or tier 4 for a function bundle is not fixed.
supply.release.7:
  slug: every-shipped-os-compiled
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "2"
      note: "v1 class compiler. go vet ./... for each system of the list, by GOOS, on one machine. Plant: a file that does not compile fails. Control: a package that compiles passes"
supply.release.8:
  slug: binary-size-recorded
  since: 0.1.0
  level: release
  kind: measure
  strength: Record
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: R
      note: "v1 class our-cli. the stripped build size recorded in the baseline, with the release failing if the metric is not written"
  review_question: "Was the stripped binary size written to the baseline for this release?"
  open:
    - "Proposed for lack of a source; the v1 evidence was: practice; one binary measured 16,103,074 bytes stripped"
supply.release.9:
  slug: release-ships-checksum-provenance-and-sbom
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "4"
      note: "the release tool's checksum block and a release check that the checksum file lists every artifact; a test over the release config that provenance, SBOM and signature are on for every publisher the config marks as offering them once the repo is public; a Dockerfile check that the base is pinned by digest and a USER line names a non-root user. Plant: a checksum file missing an artifact fails; a public repo's publish without provenance on a registry marked as offering it fails; an image base by tag fails. Control: a release with a complete checksum file passes, and a public repo's with provenance and SBOM too"
  relates:
    supply.release.4:
      how: see
  note: "Successor of supply.release.4, whose checksum half it keeps."
supply.release.10:
  slug: the-release-members-and-their-order
  since: 0.1.0
  level: release
  kind: instruction
  strength: Lens
  review_question: "Does this release run on a fresh clone of the tag, is the dry run a member with its cost, and which members need the tag?"
  relates:
    supply.release.1:
      how: see
    supply.release.3:
      how: see
    gates.command.17:
      how: see
  open:
    - "Planned check: the members file holds the dry-run member at release with a cost, and the release recipe clones the tag before it runs. No tool key is bound yet."
supply.release.11:
  slug: a-hosted-release-workflow-maps-to-members
  since: 0.1.0
  level: release
  kind: instruction
  strength: Lens
  review_question: "Which member does each job of this release workflow run, how many times does it install, and is each artifact built twice and compared?"
  relates:
    supply.workflows.5:
      how: see
    supply.release.3:
      how: see
    gates.measures.6:
      how: see
    gates.command.18:
      how: see
  open:
    - "Planned check: the workflow linter's job list is compared with the members file. No tool key is bound yet."
base/supply/rules/scans.yaml:
  summary: "Known-vulnerable code is found before it ships. A scan of dependencies runs in the full gate the land job runs before main, over the source or lockfile, and a second scan runs over the artifact that ships. A security static analyser runs with every exclusion named, and the three code habits it guards (parameterised SQL, argument-list child processes, secure randomness and constant-time compare) are held explicitly."
supply.scans.1:
  slug: known-vulnerability-scan-at-push
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "2"
      note: "govulncheck pinned in the tools module, source mode in the gate command the pre-push hook runs, output text read and not the exit code only. Plant: a module with a known vulnerable dependency version that is reachable in code fails. Control: a clean module passes"
    "2":
      binding: ts
      class: preset-config
      tier: "2"
      note: "The package manager audit at high severity over the lockfile in the gate command the pre-push hook runs, with ignores carrying a reason and expiry. Plant: lodash 4.17.15 and minimist 0.0.8 in a scratch lock fail at high severity. Control: a lock of clean packages exits 0"
  relates:
    gates.hooks.4:
      how: see
    supply.scans.7:
      how: see
  open:
    - "Both scans need the network; a run with no network exits as could not run, never as a pass."
  note: "Retired: the scan's home is the full tier, which the land job runs on the merged tree before main, not the pre-push hook. The rest of the rule moves to supply.scans.7 unchanged."
supply.scans.2:
  slug: shipped-artifact-scanned
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "govulncheck in binary mode on the release artifact, output text read. Plant: a binary built from a vulnerable dependency fails. Control: a clean binary passes"
  open:
    - "The exemption of a library, which ships no binary to scan, is open."
    - "Proposed for lack of a source; the v1 evidence was: practice"
supply.scans.3:
  slug: security-analyser-with-named-exclusions
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: gosec
      fix: never
      note: "gosec in golangci-lint with G201, G202, G204 and G404 enabled by name and exclusions listed with reasons. Plant: a query built with fmt.Sprintf fires. Control: a parameterised query passes"
  relates:
    supply.scans.4:
      how: see
    supply.scans.6:
      how: see
  open:
    - "Half of the source row is this rule and half is practice (two extra scans); the extra scans are held by supply.scans.4 to supply.scans.6 and are not built."
supply.scans.4:
  slug: sql-parameterised
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "gosec G201 and G202 plus an analyser or ast-grep scan for SQL strings outside the store package. Plant: a query concatenated from a variable fires, and so does one built with Sprintf. Control: a parameterised query passes"
  open:
    - "The gosec part is configured; the scan for SQL strings outside the store package is proposed and not built."
  note: Postgres-specific SQL rules sit in the postgres part.
supply.scans.5:
  slug: child-process-argument-list
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tier: "1"
      note: "gosec G204 plus a scan for exec.Command with sh, bash or zsh and a non-literal argument. Plant: exec.Command(\"sh\", \"-c\", value) with data in value fires. Control: a literal script passes"
  open:
    - The shell scan is proposed and not built.
supply.scans.6:
  slug: secure-randomness-and-constant-time-compare
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tier: "1"
      note: "gosec G404 and an analyser for == on values named token or secret. Plant: a session token from math/rand fires, and a token compared with == fires. Control: crypto/rand and a constant-time compare pass"
  open:
    - "The compare scan is not built and stays practice; constant-time compare was already in two repositories."
supply.scans.7:
  slug: known-vulnerability-scan-before-main
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "2"
      note: "govulncheck pinned in the tools module, source mode in the full tier of the gate command the land job runs, output text read and not the exit code only. Plant: a module with a known vulnerable dependency version that is reachable in code fails. Control: a clean module passes"
    "2":
      binding: ts
      class: preset-config
      tier: "2"
      note: "The package manager audit at high severity over the lockfile in the full tier of the gate command the land job runs, with ignores carrying a reason and expiry. Plant: lodash 4.17.15 and minimist 0.0.8 in a scratch lock fail at high severity. Control: a lock of clean packages exits 0"
  relates:
    gates.command.1:
      how: see
    supply.scans.1:
      how: see
  open:
    - "Both scans need the network; a run with no network exits as could not run, never as a pass."
base/supply/rules/secrets.yaml:
  summary: "No secret and no private name is committed, and a finding is reported without the value. Configuration holds a reference to a secret and never the value, and the credential a CI job uses is read-only and scoped to what it needs."
supply.secrets.1:
  slug: no-secret-committed
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tool: gitleaks
      tier: "1"
      note: "gitleaks pinned, with its staged-file scan at commit and a full-history scan in the gate command the pre-push hook runs, config chosen explicitly, findings reported as rule, file and line. Plant: a fake key-shaped string in a staged file fails and the finding shows no value; a key-shaped string in an old commit fails the pre-push scan. Control: a clean diff passes"
  relates:
    gates.hooks.7:
      how: see
  open:
    - "A second scanner (an AGPL-licensed one) was not run and kept second because of its licence; the alternatives are to be checked."
    - The commit scan was held in two reference repos and lifted into the shared set of standing gates.
  note: "The same rule as gates.hooks.7 (secrets scanned at commit by a shared standing gate), which the merge wrote in the gates part and which was merged here at the cross-part move."
supply.secrets.2:
  slug: config-holds-secret-reference
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: ts
      class: test-kit
      tier: "1"
      note: "a typed schema that reads secrets through one required step, a scan of configuration files for secret-shaped values, and a bundle scan for secrets. Plant: a configuration with a secret value in place of a reference fails. Control: a reference passes"
  open:
    - "Where this binds for Go and for deployed functions is covered by program and cloud parts; this rule holds the supply-chain half (references only)."
supply.secrets.3:
  slug: no-secret-in-public-config
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: ts
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. A structural check over public environment files for secret-shaped key names. Plant: A public env file with a key named like a token fails. Control: Public values only passes."
  relates:
    gates.own-rules.5:
      how: see
    supply.secrets.2:
      how: see
  open:
    - Taken from one bundled source row of five small domain rules written as checks.
    - "Proposed for lack of a source; the v1 evidence was: practice"
  note: "Moved from gates.own-rules.5, where the merge wrote it with the doubt that it belongs in supply (secrets). Related to supply.secrets.2, which holds that configuration carries a reference and never the value; this one checks key names in public files."
supply.secrets.4:
  slug: private-names-never-in-the-repo
  since: 0.1.0
  level: file
  kind: rule
  examples:
    bad:
      lang: markdown
      code: "<!-- docs/thanks.md: a word of the private list in a tracked file -->\nReviewed by a person whose name is on the list.\n"
    good:
      lang: markdown
      code: "<!-- docs/thanks.md -->\nReviewed by the maintainer.\n"
  checks:
    "1":
      binding: any
      class: hook
      tier: "2"
      note: "a names check in the gate command and the pre-push hook: hashed whole-word match over tracked files, the branch name and the pushed range's messages against the list at the configured path, exit 2 when the list cannot be read; an author and committer email check on the pushed range in a public repo. Plant: a planted forbidden word in a commit message fails; an unset list path exits 2; a commit with a work email in a public repo is refused. Control: a tree, branch and messages free of listed words, with no-reply emails, pass"
    "2":
      tool: gragas
      key: names
      fix: never
      note: "The names key of the gragas preset, which gragas check computes: the hashed list at the names-file path against every tracked file and its path, and with --range each commit message since the merge base. Plant: a tracked file holding a listed word is a finding, naming the file and line. Control: a tree free of listed words passes (internal/core/audit/repo_test.go)"
base/supply/rules/workflows.yaml:
  summary: "Workflow files are code that holds credentials. The gate runs locally, so no workflow runs on push; no workflow starts itself, every workflow file passes a linter and a security audit with every action pinned to a commit, the token a job holds is read-only and scoped, and every shell script is linted wherever it is found."
supply.workflows.1:
  slug: no-workflow-triggers-itself
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "2"
      note: "a 20-line parse-based trigger check over workflow files, or a conftest policy over the on key (read as the string true under YAML 1.1) allowing only dispatch, call and tag push, run in the local gate. Plant: on push branches fails, and so do the scalar form, the inline list with dispatch and the quoted on form; a pull_request trigger fails. Control: dispatch only, and push with tags, pass"
  relates:
    gates.hooks.1:
      how: see
    gates.hooks.4:
      how: see
  open:
    - "Open decision on scheduled runs, held at \"none unless the age of the last whole run keeps growing\"."
supply.workflows.2:
  slug: workflows-linted-and-actions-pinned
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "2"
      note: "actionlint and zizmor --offline pinned in the shared gate pack, with the unpinned-uses audit checking action pins by commit; pinact is an alternative. Plant: injected faults in a workflow are found, and an unpinned action fails with the unpinned-uses error. Control: a clean pinned workflow passes"
  open:
    - "The tools disagree with one repository's own workflow comments on whether a finding matters."
    - "Whether the unpinned-uses audit checks pins by commit is to be verified; it failed an unpinned action in a trial."
supply.workflows.3:
  slug: ci-token-read-only-and-scoped
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "3"
      note: "zizmor excessive-permissions audit plus a conftest rule that top-level permissions is present. Plant: a workflow with write-all permissions fails. Control: a workflow with read-only top-level permissions passes"
  open:
    - "v1 evidence, not yet a source: own measure; one release token covers the whole owner"
supply.workflows.4:
  slug: every-shell-script-linted
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "1"
      note: "shellcheck over tracked files whose first line is a shell shebang, found by a finder script pinned in the shared gate pack. Plant: a shell script with an unquoted variable and no extension fails. Control: a clean script passes"
  open:
    - "Proposed for lack of a source; the v1 evidence was: own measure; 46 extensionless shell scripts against 40 with the extension"
supply.workflows.5:
  slug: workflows-run-the-one-gate-command
  since: 0.1.0
  level: deploy
  kind: rule
  checks:
    "1":
      binding: any
      class: preset-config
      tier: "2"
      note: "the trigger check of supply.workflows.1, and a test that reads each workflow and fails a job that runs a lint, test or scan tool directly instead of the gate command or a member listed as moved for time. Plant: a project workflow with its own push trigger fails; a release job running golangci-lint directly fails. Control: a tag-triggered release workflow that runs the gate command and then the fuzz member passes"
  relates:
    gates.hooks.4:
      how: see
    supply.workflows.1:
      how: see
  note: "Related to supply.workflows.1 by the same trigger set; this rule holds what a workflow may run."
base/tests/rules/admission.yaml:
  summary: "A test is worth keeping only if it can fail. New and changed tests pass a machine-run ladder at land, have a real assertion, take their expected value from somewhere other than the code, and are never weakened, skipped or focused without a recorded reason. Mutation testing and lint on the tests themselves hold this."
tests.admission.1:
  slug: admission-ladder
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gremlins
      tier: "3"
      note: "v1 class our-cli. companion admit, rebuilt in Go from the trialled ladder: unshuffled baseline on the target OS, several seeds, mutants on changed lines (gremlins is the candidate engine, to try), budget step, n/a share printed. Plant: a vacuous test, a flaky test and an order-dependent pair (plant owed) are each refused. Control: a good test is admitted"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. companion admit: select new and changed test functions from the diff, run the runner in file order, under several shuffle seeds, repeat, lint for no assertion, mutation tool on changed lines; refuse on any step The shuffle uses sequence.shuffle with a printed seed over the changed files. Plant: a test passing on the broken tree, one passing only in file order, an empty body, a log-only test and an assert of true are each refused The same ladder refuses a passing-on-broken-tree test, one that passes against the broken code. Control: a test with a real assertion inside budget passes"
  relates:
    tests.selection.7:
      how: see
  open:
    - "The budget step is not designed; mirror tests pass the ladder (review)."
    - "Mutation tool for TypeScript enters through the tool record; neither stack has it installed today."
    - "A trial on the Go side ran a vacuous test and a flaky test (refused) and a good test (admitted); the file-order-only plant is owed, since one seed admitted it."
    - "The Go ladder was trialled as ladder.py at 0.9 to 16 s a commit; the plant owed is a test that passes only in file order, which one seed admitted."
    - "v1 evidence, not yet a source: own bugs (4 of 15 drives); operator direction"
tests.admission.2:
  slug: no-vacuous-tests
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: analyzer
      tier: "1"
      note: "v1 class our-plugin. analyzer in the shared test-hygiene plugin: a test function with no route to an assertion or failure call; literal tautologies only The Go analyzer is noassert, built in the testhygiene plugin; it follows the trial form. Plant: an empty body, a log-only test, x != x, !true, DeepEqual(x, x) and if false each fire. Control: a real test passes"
    "2":
      binding: ts
      class: preset-rule
      tool: vitest
      tier: "1"
      note: "@vitest/eslint-plugin expect-expect, no-disabled-tests, no-focused-tests, no-commented-out-tests and no-conditional-expect at error, plus a syntax-tree rule for literal or identical assertion arguments; Biome form: `noFocusedTests` and `noSkippedTests` at error and a GritQL plugin for a test with no expect and for literal or identical assertion arguments. Plant: a test.only, a test.skip, a body with no expect and expect(true).toBe(true) each fire a test that passes on the broken tree is refused by the ladder (tests.admission.1). Control: a test with a real expectation passes"
    "3":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a test-shape scan: a loop over a run-time list in a test with no count assertion fails, a test with no cost comment above it fails; whether every guard has a refusing test is review. Plant: a test that ranges over a directory listing with no count check fails; a test with no cost line fails. Control: a test with a count assertion, a planted empty case and a cost line passes"
  review_question: "Which guard does this change add or touch, and which test drives it to refuse?"
  relates:
    tests.admission.1:
      how: see
    tests.admission.5:
      how: see
  open:
    - "The npm name eslint-plugin-vitest is stale at 0.5.4; use the scoped name @vitest/eslint-plugin."
    - "The expect-expect rule is met by any one expect including a tautology; the literal-argument rule is what adds the tautologies."
tests.admission.3:
  slug: test-can-fail
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tool: gremlins
      tier: "3"
      note: "gremlins with the efficacy threshold and the timeout coefficient set in its config file, run on the diff in core logic. Plant: a test asserting f(x) equal to f(x) leaves a mutant alive and fails the threshold. Control: a literal expected value kills the mutant"
    "2":
      binding: ts
      class: preset-config
      tool: stryker
      tier: "3"
      note: "Stryker with the vitest runner on shared packages and pure logic, threshold in config. Plant: a test that kills no mutant of the changed lines fails the threshold. Control: a test that kills it passes"
  relates:
    tests.generated.3:
      how: see
  open:
    - "Verified 5 Nov (gremlins v0.6.0): the threshold flag on the command line exits 0 at 83 percent efficacy, the same threshold in the config file exits 10; with default timeouts all six mutants of a 0.3 s package timed out (0 percent) until the timeout coefficient was set to 10, so the config must set both."
    - "Stryker is not in either stack's pins; it was not run."
    - "go-mutesting is dormant since 2024; other forks and ooze were not tried."
    - "No UI row holds test efficacy on its own (the web catalogue's mutation row covers rules and checks only)."
    - "v1 evidence, not yet a source: own bugs (4 of 15 drives)"
tests.admission.4:
  slug: expected-value-from-elsewhere
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: analyzer
      tier: "1"
      note: "v1 class our-plugin. analyser for an expected value computed by calling the function under test or a copy of its expression. Plant: a test asserting f(x) equal to f(x) and one using the code's own formula each fire. Control: a literal expected value passes"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "a small ESLint rule comparing the two expressions of an assertion structurally; catches only the trivial form (Biome form is a GritQL plugin on the same structural match) Web side config: no-restricted-imports and no-restricted-syntax in test files ban vi.mock and vi.stubGlobal of modules in the managed-dependency list (a data file on the protected list); the rule vitest/prefer-strict-equal does not help here. Plant: expect(f(2)).toBe(f(2)) is listed expect(f(x)).toBe(f(x)) is listed (the trivial form). Control: a literal control passes"
  review_question: "Where does this test's expected value come from, if not a literal, the spec or a recorded sample?"
  open:
    - "For web tests only the trivial form has a mechanical check (no market tool, and D evidence does not earn a plugin), so provenance stays a model lens: the best-practice strength there is Lens (a model checks where expected values come from)."
    - No fault in our record is traced to test dependence on the code.
    - "v1 evidence, not yet a source: D (Khorikov)"
tests.admission.5:
  slug: skips-counted
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: forbidigo
      fix: never
      note: "forbidigo on the skip calls outside files of a declared opt-in tier, with a shrink-only count per repo down to zero; an opt-in skip must carry the tier's command; skip counts per package from the JSON test summary. Plant: a new skip in a default-tier test fails; an opt-in skip whose message lacks the command fails. Control: an opt-in test that skips with its command when not asked for passes"
    "2":
      binding: ts
      class: preset-rule
      tool: vitest
      tier: "3"
      note: "@vitest/eslint-plugin no-disabled-tests, no-focused-tests and no-commented-out-tests at error (Biome form: `noSkippedTests` and `noFocusedTests` at error), with a zero count of skipped tests in the verdict of the default tiers. Plant: a test.skip or test.only in a default-tier file fails. Control: a suite with no skip passes"
    "3":
      binding: any
      class: test-kit
      tier: "3"
      note: "an opt-in tier run without its precondition must exit non-zero, never zero with skips. Plant: the root-only tier run as a normal user fails. Control: the same tier not asked for skips with its command"
  relates:
    tests.selection.8:
      how: see
  open:
    - "Flagging is a rule; whether the written reason is good is review."
tests.admission.6:
  slug: weakened-tests-flagged
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. diff scan of test file removals listing removed assertions, added skips and loosened comparison literals first in the change summary; a flagged change needs a reason line. Plant: a diff that removes an assertion, one that adds a skip and one that loosens a literal each fire, and a test added with no removal passes. Control: a test added only is not flagged"
    "2":
      binding: ts
      class: fact
      tool: vitest
      tier: "3"
      note: "v1 class our-cli. the same diff scan with the same list, over TypeScript test files TypeScript lint rules: no-focused-tests, no-disabled-tests and expect-expect from @vitest/eslint-plugin, not the stale eslint-plugin-vitest package. (Biome form is noFocusedTests and noSkippedTests, with a GritQL plugin for expect-expect). Plant: a diff that removes an expect fires; a focused test fires. Control: an added test passes"
  open:
    - "A removed assertion is not a lint finding; the scan lists it, so that half is a report and only skip and focus fail."
tests.admission.7:
  slug: refactor-test-edits
  since: 0.1.0
  level: process
  kind: measure
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. a report listing tests edited in commits whose message marks refactor or move, and surviving mutants on changed lines. Plant: a fixture commit marked refactor with a known test edit is listed. Control: a feature commit is not listed"
  open:
    - "Report only; no plant in the source."
    - "Proposed for lack of a source; the v1 evidence was: D"
tests.admission.8:
  slug: behaviour-change-has-a-test
  since: 0.1.0
  level: process
  kind: rule
  strength: Review
  review_question: "Does this change alter behaviour, and where is the test that fails before it and passes after, or why is there none?"
  open:
    - "No catalogue row of its own; the check is a diff that changes behaviour must carry a test change or say why not."
    - "The done-when of a ticket names a check that fails before the change (see the gates part)."
    - "Proposed for lack of a source; the v1 evidence was: practice"
tests.admission.9:
  slug: non-default-flag-tested
  since: 0.1.0
  level: file
  kind: rule
  strength: Review
  review_question: "Which value of this switch does the default not ship, and which test runs it?"
  open:
    - "No check named in the sources; the catalogue holds a related rule (a boolean key has reader, default and doc row) in the code part."
    - "The exemption's expiry is held by the process part."
tests.admission.10:
  slug: test-names-are-claims
  since: 0.1.0
  level: word
  kind: instruction
  strength: Lens
  review_question: "Does this test's name state what must hold, in plain English, and does every table case have a name?"
  open:
    - "A model question on new test names; clean in our trial. Candidate promotion needs a plant test that catches 9 of 10."
base/tests/rules/doubles.yaml:
  summary: "A managed store is tested against the real engine. A double stands only at an unmanaged edge, carries literal recorded bytes and asserts no calls on queries; which dependency is managed is written once per repo as data in a protected file. A test of an external program runs the real program on a fake account before it uses recorded bytes. Fixtures are the server's own output, and tests use made-up names."
tests.doubles.1:
  slug: managed-store-real-engine
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "storage tests run against the real engine from one helper with its own temp folder (tests.isolation.3), checked by the managed-dependency scan (tests.doubles.3). Plant: a hand double of a store marked managed fails the scan. Control: a real-engine test passes"
    "2":
      binding: ts
      class: test-kit
      tier: "1"
      note: "storage specs use the real engine started once in global setup (tests.isolation.3); the managed-dependency scan flags a double of a managed one. Plant: a spec that replaces the store client with a double fails. Control: a spec against the real engine passes"
  open:
    - "Whether a SQLite file a sibling program also reads counts as managed stays open (the reference case)."
tests.doubles.2:
  slug: no-own-module-mocks
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: depguard
      fix: never
      note: "depguard ban of mock libraries in the shared lint config, over go.mod and imports. Plant: an import of a mock library fails. Control: a hand-written fake passes"
    "2":
      binding: ts
      class: preset-rule
      tier: "1"
      note: "no-restricted-imports and no-restricted-syntax on module mock and global stub calls of paths inside the repo, in test files. Plant: a module mock of one of our own packages fails. Control: a double of an unmanaged external edge passes"
  relates:
    tests.doubles.4:
      how: see
    tests.doubles.3:
      how: see
  open:
    - "The TypeScript form bans mocks of named repository paths; the managed-or-unmanaged data file (tests.doubles.3) covers dependencies a path list does not name."
    - "v1 evidence, not yet a source: own measure (no mock library in any repo)"
tests.doubles.3:
  slug: managed-or-unmanaged-data
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. data file per repo plus a scan for a double of a dependency marked managed. Plant: a hand double of a dependency marked managed fails the scan. Control: a real-engine test passes"
    "2":
      binding: ts
      class: preset-rule
      tool: ast-grep
      tier: "1"
      note: "ast-grep or restricted-syntax scan for a module mock of a path marked managed in the data file The scan is an ast-grep search for vi.mock of a path marked managed; vi.stubGlobal is covered the same way. Plant: a module mock of a managed dependency fails. Control: a mock of an unmanaged one with literal recorded bytes passes"
  review_question: "Does this double assert on a query, and which dependency is it standing in for, managed or not?"
  relates:
    tests.doubles.5:
      how: see
  open:
    - "For TypeScript the mechanical form is config only (restricted imports); the query-assertion half stays review."
    - "A scan for hand doubles of managed dependencies is not built for Go; the mock-library ban is the rule half."
tests.doubles.4:
  slug: store-fake-injects-failure
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "2"
      note: "one contract suite per fake runs the same cases against the fake and the real adapter, including an unseeded call that must throw on the fake. Plant: a fake that returns a result the real adapter cannot fails the contract suite; a fake that returns a default for an unseeded call fails. Control: a fake pinned by its contract suite that throws on an unseeded call passes"
  review_question: "Which failure does this store fake inject, which contract test pins it, and does it throw on a call it was not seeded for?"
  open:
    - "A scan that a fake has a contract test is proposed only; the review question holds it until then."
tests.doubles.5:
  slug: fakes-from-the-contract
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-imports and no-restricted-syntax on network stub libraries outside the generated mock folder (Biome form: `noRestrictedImports` with the same list and a GritQL plugin for the stub calls). Plant: a hand-written network stub in a spec fails. Control: the generated handler passes"
  review_question: "Does this test stand in for an external program that offers a fake account or server, and if so why is the real program not run?"
  relates:
    tests.doubles.3:
      how: see
    tests.doubles.4:
      how: see
  open:
    - "The Go side has no generated fakes; its equivalent is tests.doubles.4."
    - Whether a fake account exists is review until the repo lists its external programs with their test accounts.
tests.doubles.6:
  slug: fixtures-are-server-output
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. fixtures check that regenerates the golden JSON in memory and diffs it; reverse check that every golden path is exercised by the demo world, shrink-only; schema walk for a sample of every enum member and nullable field; per platform, the examples command regenerates that platform's set and diffs it. Plant: a hand-edited fixture that differs from the golden fails, a new golden path absent from the demo world raises the count and fails, and a hand edit to one platform's example set fails. Control: a fixture equal to the golden passes"
  open:
    - "167 of 588 golden paths are absent from one repo's demo world today, so the shrink-only check needs a baseline."
    - "The reverse direction is planned; the forward direction is held in two repos."
tests.doubles.7:
  slug: made-up-names-only
  since: 0.1.0
  level: word
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. a stand-in scan of fixtures, stories, docs, tests and shipped examples that fails a name or address not on the committed stand-in list or outside the documentation ranges. Plant: a fixture naming a host not on the stand-in list fails; an example config with a non-documentation address or a real MAC fails. Control: a fixture using only listed stand-ins and documentation addresses passes"
    "2":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion scan of every tracked file, commit message and branch name against a roster of real names kept outside the repo or hashed, failing when the roster cannot be read; the alternative for the file half is the flagWords setting of the spell checker (cspell 10.4.0). Plant: a fixture containing a name on the roster fails; a commit message with one fails; a run with the roster missing fails. Control: made-up names pass"
    "3":
      binding: any
      class: hook
      tier: "2"
      note: "the pre-push hook refuses a commit whose author or committer email is not a no-reply address, in a repository marked public. Plant: a commit with a personal email in a public repository is refused at pre-push. Control: a no-reply email passes"
  open:
    - "The roster is not committed; the guard keeps hashes. A name on neither list in a free-text position is not found."
base/tests/rules/flakes.yaml:
  summary: "A red is never rerun to green. A result that is not reproduced is quarantined on first sight, ticketed and counted, with a cap and an expiry, and its rate is recorded per test with the machine load beside it. Timing assertions judge only on an undisturbed machine."
tests.flakes.1:
  slug: no-rerun-to-green
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. gate scan that parses Makefiles, shell gate scripts and workflow YAML and fails on a count above one outside the admission step, on a rerun-fails option and on retry steps or loops around the test command The scan fails on go test -count=3 (any -count=N with N above 1) and on gotestsum --rerun-fails; -count=1 is required by tests.selection.6 and allowed; the scan is gatescan. Plant: a Makefile line with a count of three and a workflow retry step each fail. Control: a count of one passes"
    "2":
      binding: ts
      class: preset-config
      tier: "2"
      note: "runner and browser-test configs read back with retries at zero, and a restricted-syntax rule on numeric retry options. Plant: a config with retries above zero fails. Control: retries zero passes"
  relates:
    tests.admission.1:
      how: see
    tests.selection.6:
      how: see
    tests.flakes.5:
      how: see
  open:
    - "The workflow half is a policy over workflow files (verified); the Makefile and shell half needs the scan, which is not built."
tests.flakes.2:
  slug: quarantine-cap-and-expiry
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "2"
      note: "v1 class our-cli. quarantine list as exception records with cap and expiry through the shared exception parser; a count and oldest-age line per repo. Plant: an entry past its date is reported. Control: an entry within its date passes"
  open:
    - "The row should split: the ban on reruns is a rule, the quarantine cap and expiry are guesses with no stopping check; the count and age line is report-only at first."
