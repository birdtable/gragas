      note: "a test that the fake fills every port, a test per platform adapter that every required port is filled, and a word-list test over the fake with the platform words of arch.ports.4 as data. Plant: a fake that leaves one port nil fails; a tool path literal in the fake fails. Control: a fake with every port filled by neutral in-memory values passes"
arch.ports.18:
  slug: consumers-read-the-capability-list
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      binding: any
      class: test-kit
      tier: "1"
      note: "a source test over consumer code for a comparison against a platform name list in rule data. Plant: a page condition comparing the platform field to \"linux\" fails. Control: the same condition reading the capability list passes"
  relates:
    arch.ports.5:
      how: see
arch.ports.19:
  slug: trust-line-is-a-type
  since: 0.1.0
  level: type
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "a go/ast test over the deciding packages: every selector on a peer-report type inside an if, switch or map index resolves to a field whose doc comment starts with may decide. Plant: a planted condition on a display-only field fails. Control: a condition on a may-decide field passes"
arch.ports.20:
  slug: read-the-machine-format
  since: 0.1.0
  level: package
  kind: rule
  strength: Lens
  review_question: "Does this program offer a machine format, and if so why is the adapter reading its text?"
  note: "v1 review check (review is not a v2 check class): review of each adapter's decode path; a source test lists adapters that split or regex-match a program's stdout without a recorded reason"
arch.ports.21:
  slug: entry-point-only-wires
  since: 0.1.0
  level: package
  kind: rule
  strength: Lens
  review_question: "Does this entry point build adapters, fill ports and call the core, and nothing else?"
  relates:
    arch.ports.12:
      how: see
    arch.ports.1:
      how: see
  open:
    - "Planned check: a generated layer test of what an entry point may import and declare (its size cap is arch.ports.12's). Plant: an entry point that imports os/exec or declares a method fails. Control: one that builds adapters and calls the core passes. No tool key to bind to: it is later work, and the rule stays proposed until one gives it a check."
arch.ports.22:
  slug: tooling-is-a-program
  since: 0.1.0
  level: program
  kind: rule
  strength: Lens
  review_question: "Does this script, hook or recipe reach the system through a thin call or a declared adapter, with no platform literal?"
  relates:
    arch.ports.1:
      how: see
  open:
    - "Planned check: a test over the repository's scripts, hooks and recipes that lists each shell step that is not a thin call or a declared adapter. Plant: a script with a platform literal fails. Control: a script that calls the repository's own program passes. No tool key to bind to: it is later work, and the rule stays proposed until one gives it a check."
arch.ports.23:
  slug: os-code-in-host-layer
  since: 0.1.0
  level: program
  kind: rule
  note: "Retired for arch.ports.24. A product keeps no host layer of its own: the platform ruling puts the knowledge of an operating system in the platform libraries, so the layer this rule spared is gone and the rule's checks follow the new id."
  review_question: "Does any file outside the host layer name an operating system, by import, by runtime.GOOS or by its file name or build tag?"
  relates:
    arch.ports.1:
      how: see
    arch.ports.22:
      how: see
    arch.ports.24:
      how: see
arch.ports.24:
  slug: no-os-names-in-a-product
  since: 0.1.0
  level: program
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: depguard
      fix: never
      note: "depguard os-host row in the shared config: golang.org/x/sys, github.com/gofrs/flock and github.com/shirou/gopsutil are importable from no folder, the row's slot staying \"$all\". Plant: an import of golang.org/x/sys/unix in any package fails. Control: a package that reaches the system through a platform library passes. The no-os-packages row denies syscall and golang.org/x/sys the same way"
    "2":
      tool: golangci-lint
      key: forbidigo
      fix: never
      note: "forbidigo on runtime.GOOS and runtime.GOARCH (the arch.ports.1 pattern), with no layer exempt. Plant: runtime.GOOS read in any package fails. Control: a package that asks a platform library what the system is passes"
    "3":
      tool: gragas
      key: os-files
      fix: never
      note: "The file-name and build-line half, the os-files key of the gragas preset, which gragas check computes: each Go file whose name ends in an operating system's suffix, or whose build line names one, and that no live row of the exemptions file names by its path; a folder the os-host row still spares (a project that has not moved its layer yet) is outside the check's reading, as before. Plant: x_linux.go in any folder is a finding. Control: the same file named by its row of the exemptions file is not, and nor is a file of no operating-system name (internal/core/audit/osfiles_test.go)"
  examples:
    bad:
      lang: go
      code: "// internal/report/size.go\nimport \"golang.org/x/sys/unix\"\n\nfunc Free(path string) uint64 {\n    var st unix.Statfs_t\n    _ = unix.Statfs(path, &st)\n    return st.Bavail\n}\n"
    good:
      lang: go
      code: "// internal/report/size.go asks the platform library that covers the need\nfunc Free(d disk.Port, path string) (uint64, error) {\n    return d.Free(path)\n}\n"
  review_question: "Does any file of this product name an operating system, by import, by runtime.GOOS or by its file name or build tag, or reach a system through anything but the platform library that covers the need?"
  relates:
    arch.ports.1:
      how: see
    arch.ports.22:
      how: see
    arch.ports.23:
      how: see
  open:
    - "The TypeScript side is held today by the explorer's own lint rows in explorer/eslint.config.js: osProperties (no-restricted-properties), osImports (no-restricted-imports) and osSyntax (no-restricted-syntax). No eslint preset key exists to bind them yet, so no check row names them; a row waits for one."
    - "The file and build-tag half is gragas's own check, not a linter's: no golangci-lint 2.15.0 linter reads a file name or a //go:build line (depguard and forbidigo read the imports and calls of the files the run's system builds, and a file of another system is not loaded at all), and ast-grep has no preset."
    - "The syscall import is held by the no-os-packages row of the shared config, not by a row of its own; a project's files that still import it are excluded by path in its overrides, each with the row that removes it."
base/arch/rules/shared.yaml:
  summary: "Code that more than one program needs lives in a small named set of shared modules with an owner, and reaching for it is easier than copying it. This concern covers what may be shared, when a piece enters or leaves the shared layer, how copies are found, counted and held equal, and how the shared surface is listed."
arch.shared.1:
  slug: small-named-set-of-shared-modules
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      binding: go
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. a go.mod scan across repositories for owned shared modules outside the named set, run as a census in the standards repo's gate. Plant: a new shared module in a go.mod fails. Control: the named modules only pass"
  open:
    - "Planned and blocked: the new platform lane cannot be created until the roster change that waits for the current hold is allowed. The scan is proposed and has no plant recorded."
    - "v1 evidence, not yet a source: own measure; operator decisions"
arch.shared.2:
  slug: shared-code-is-mechanism
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: go
      class: test-kit
      tier: "1"
      note: "TestUINamesNoTool extended: an AST test over the shared module's identifiers and string literals against a deny-list of program and domain words; plus a private-name scan of the shared kit. Plant: a style file with photo words fails; a neutral word passes. Control: a neutral word passes"
  review_question: "Is this mechanism or policy, and would a second program with other words use it unchanged?"
  open:
    - "Mechanism against policy is judgement; the lens was clean in the trial and has no plant."
    - "Held in Go only; the TypeScript side is a review question with no check."
    - "Some plants and controls of this rule were written at the merge from the sources' description of the check, and have not been run."
    - "v1 evidence, not yet a source: A (shared style file carried domain words); practice"
  note: "v1 review check (review is not a v2 check class): a model question on shared packages and shared parts; no automatic check"
arch.shared.3:
  slug: copies-counted-across-repos
  since: 0.1.0
  level: program
  kind: measure
  checks:
    "1":
      binding: any
      class: fact
      tool: jscpd
      tier: "3"
      note: "v1 class our-cli. the census script rebuilt as companion census with a shrink-only count per step; jscpd or dupl as candidate engines. Plant: a copy of a listed step in a second repo raises the count and fails. Control: the unchanged repos pass"
  open:
    - "The census exists as a read-only measure and is the host of the shrink-only count; no plant is recorded for the ratchet."
  note: "The census is a measurement behind the counts of copies; the same rule governs copies of shared plumbing steps counted across the services."
arch.shared.4:
  slug: second-copy-reported-in-the-change
  since: 0.1.0
  level: file
  kind: rule
  strength: Answered
  checks:
    "1":
      binding: ts
      class: fact
      tool: jscpd
      tier: "2"
      note: "v1 class our-cli. jscpd 5.4.2 with --ignore-identifiers --ignore-literals --min-lines 5 --min-tokens 30, a report in the change. Plant: an 11-line function copied with every identifier and literal renamed, defaults find 0 clones and with identifiers ignored exit 1 at 27% of lines. Control: two distinct files exit 0"
  relates:
    arch.shared.8:
      how: see
  open:
    - "Advice by the criterion; the model rule says a second copy blocks until moved or listed."
    - "Looser similarity and embedding modes of the clone detector exist but were not run (the embedding model is 548 MB)."
    - "Proposed for lack of a source; the v1 evidence was: D"
arch.shared.5:
  slug: independent-copies-listed
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: jscpd
      tier: "2"
      note: "v1 class our-cli. independent-copy list as exception records with reason and removal date; jscpd 5.4.2 --ignore-identifiers --ignore-literals finds clones not on the list; the 90-day divergence is a report. Plant: a clone not on the list fails; an expired removal date fails. Control: a listed copy within its date passes"
  relates:
    arch.shared.4:
      how: see
  open:
    - "The 90-day divergence report is proposed and was not measured; the reason is judgement, the presence of a reason a check. In Go it reads the list of arch.shared.6, which is a later step (G9) of the shared-code proposal."
    - "The baseline row for a deliberate copy exists today for one copy; the other Go copies are listed as the steps that remove them land. The row is the check, so the rule stays proposed until the clone pass of code.duplication.1 shows which clones are not on the list."
    - "Related rule: arch.shared.4 reports a copy found by shape."
arch.shared.6:
  slug: copies-held-byte-equal
  since: 0.1.0
  level: file
  kind: rule
  checks:
    "1":
      binding: any
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. companion sync --check inside the gate: byte-compares of listed copies to origin and of root configs to the template; manifest of path and sha256 per holder; .npmrc and the workspace file parsed by meaning and compared to the expected key map. Plant: one byte changed in a copy fails; a duplicate .npmrc key with the wrong last value fails. Control: an unchanged copy passes"
  open:
    - "One repo's check fails and is not in its gate; the platform check is proposed and a plant is owed."
    - "A per-repo ceiling that only falls is still to be set; copies are held by a check inside the path agents take."
    - "Proposed until the list and its repository test exist: step G9 of the shared-code proposal, which has no ticket yet. Plant for the Go list: one changed byte in a listed copy fails. Control: the difference the row allows passes."
arch.shared.7:
  slug: one-change-reaches-projects-by-bump
  since: 0.1.0
  level: package
  kind: rule
  checks:
    "1":
      tool: golangci-lint
      key: depguard
      fix: never
      note: "depguard owner-ui row (82 of 82 planted bans fired), a ban of the terminal-detection package and raw escape strings outside the shared UI module, and a copy check on the module's files. Plant: a terminal-library import outside the UI module fails; use of x/term fails. Control: the same import inside the module passes"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "1"
      note: "v1 class our-cli. sync --check fails on a copy of a shared rule file in a project (name list from the packages and a hash scan). Plant: a copied 78-line ESLint config fails; a one-line wrapper passes. Control: a one-line wrapper passes"
  open:
    - "The second half of the Go rule (no colour literal or terminal reads outside the shared module) is planned in the terminal rules of the cli part."
    - "v1 evidence, not yet a source: own measure; A (three byte-equal things)"
arch.shared.8:
  slug: shared-exports-protected-twice
  since: 0.1.0
  level: function
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-rule
      tool: golangci-lint
      tier: "1"
      note: "one forbidigo or depguard ban per primitive outside the owner, generated from the registry of arch.shared.15 with a shrink-only allow list, and one ast-grep 0.51.1 shape rule per export with a planted hit and a clean control; census ratchet. Plant: os.Rename onto a state path fails; a hand-written lock outside the lock package fails. Control: the call through the shared export passes"
    "2":
      binding: ts
      class: preset-rule
      tool: eslint
      tier: "1"
      note: "ESLint no-restricted-imports and no-restricted-syntax generated from the platform export table (primitive banned outside its owner), and ast-grep shape rules per export with planted copies and bypass fixtures, advice only. Plant: a hand-written atomic copy under another name; the ban half fires only on the primitive and the shape half on the renamed copy. Control: the call through the shared export passes"
  open:
    - "The forbidigo half was verified on 5 Nov (selector bans fire on aliases and method forms). Of the 17 exports in the platform list only the write and lock exports have any planted rule today; 0 of 13 web exports have either half."
    - "The ast-grep YAML rules missed cheap restructurings in one trial, so the shape half must carry its bypass fixtures."
    - "The web half is planned; the rule must be written by the person who owns the export."
    - "Proposed until the bans are rendered: the registry and the renderer are step G1 of the shared-code proposal. A ban appears only when its owner exists, so the digest ban comes with step G3 and the write ban with step G4; the bans that already pass land with G1."
arch.shared.9:
  slug: public-surface-listed
  since: 0.1.0
  level: release
  kind: rule
  checks:
    "1":
      binding: go
      class: preset-config
      tier: "3"
      note: "a recipe in the shared Makefile fragment: go doc -short listing regenerated per tag and diffed, with a mark column; a test that the listing's tag equals the go.mod version and that every exported name has exactly one mark. Plant: an exported func added without a regenerated listing fails; an export with no mark fails. Control: the regenerated listing with every export marked passes"
    "2":
      binding: ts
      class: fact
      tool: gragas
      tier: "3"
      note: "v1 class our-cli. companion surface: ts-morph 28.0.0 or @microsoft/api-extractor 7.60.1 writes a committed surface file per shared part (exported names, prop names, types and marks); the gate regenerates it and fails when it differs and the change carries no reason (a ticket or decision id in a trailer); publint and are-the-types-wrong run over the packed tarball to prove every exports entry resolves. Plant: adding a prop with no reason fails; an internal export listed in the exports map fails; an exports entry missing from the tarball fails. Control: the same diff with a ticket in the trailer passes"
  open:
    - "The reason is free (nearly every landing names a ticket) so the value is a visible diff, not the judgement. api-extractor is for libraries with declaration files; Astro components need the ts-morph route."
    - "The fingerprint is the reader's inference and the book has no width metric."
  note: Shares its engine with the Go listing check and the web surface check.
arch.shared.10:
  slug: shared-entry-conditions
  since: 0.1.0
