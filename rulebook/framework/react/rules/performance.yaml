format: 3
part: react
concern: performance
rules:
  - id: react.performance.1
    statement: "A budget exists for render cost under churn on any live list, counted in commits and rendered rows, not milliseconds."
    strength: must
    status: proposed
    origin: migrated
    scope:
      kinds:
        - web-app
    reasoning:
      definition: "A test counts commits and rendered rows for one update to a live list and asserts the count against a declared render budget. A rule-table list names each live list; a list with no matching render-budget test fails the pairing scan. The counter is the React Profiler, in a Vitest test (browser or jsdom)."
      pros:
        - "Solid's keyed list passed behaviour and failed churn; a count is deterministic, unlike time."
    relations:
      relates:
        - web.speed.6
  - id: react.performance.2
    statement: "Route-level code splitting is on per area, and development tooling never ships in the production bundle."
    strength: must
    status: proposed
    origin: migrated
    scope:
      kinds:
        - web-app
    reasoning:
      definition: "The router's automatic splitting setting (`autoCodeSplitting` true) is read back from the Vite config, and the entry chunk is held at the core budget of the web part's byte budget, so an unsplit app breaches it; chunk count is a report. A test-only module, and the router and query devtools, are absent from the non-test build."
      pros:
        - "No route budgets are asked for in the source; the core budget holds it."
    relations:
      relates:
        - web.speed.3
