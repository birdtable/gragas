format: 3
part: liquid
concern: cycle
rules:
  - id: liquid.cycle.1
    statement: "At commit every JSON file of the theme parses, comments allowed where the platform allows them, and every schema block in a section parses."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A theme's settings, templates and locales are JSON, and each section carries a schema block the platform reads. A file that does not parse is a page that does not render, found at publish otherwise. The check read 395 files in 0.06 seconds on the measuring host. It reads and never writes (gates.command.28)."
      pros:
        - A broken JSON file or schema block reaches the live theme if nothing parses it first.
    relations:
      relates:
        - gates.command.28
        - gates.command.17
    sources:
      - ref: liquid-reasons-stated
        backs: rule
  - id: liquid.cycle.2
    statement: "Every locale file has every key of the default locale; a new gap fails, and the gaps that exist today sit in a reviewed baseline with an owner that only shrinks."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "gates.ratchets.1 holds that debt is a shrink-only list frozen at adoption. The parity check compares each locale's keys with the default's, and the baseline holds the missing keys per file at adoption, so the member is green on the day it lands and red on the first new gap. The baseline's length prints in the report."
      pros:
        - "Eleven locale files of one organisation's theme miss 3 to 9 of 315 keys today; a check with no baseline would stay red and be ignored."
    relations:
      relates:
        - gates.ratchets.1
        - gates.ratchets.4
    sources:
      - ref: liquid-reasons-stated
        backs: rule
  - id: liquid.cycle.3
    statement: "At push every render, include, section and asset reference resolves to a file, and every block tag is closed."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "A reference to a snippet that does not exist and an unclosed conditional each render as an error on the live page. The check walks the templates, resolves each reference against the theme's folders and counts the tag pairs; a prototype did both in 0.06 seconds. It is a push member because it reads the whole theme, and it reads and never writes."
      pros:
        - "A missing snippet and an unclosed conditional were both found by a prototype of this check in one organisation's theme, and nothing else would have found them before the page rendered."
    relations:
      relates:
        - docs.links.1
        - gates.command.17
    sources:
      - ref: liquid-reasons-stated
        backs: rule
  - id: liquid.cycle.4
    statement: "The platform's theme linter runs at push with the repository's own config, as a member beside the reference check."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "The linter knows the platform's objects, filters and deprecations, which the reference check does not; the reference check runs in milliseconds, which the linter may not. Both are members, so a failure names one. The linter's cost was not measured on the host that studied the stack, so its moment is push until a measurement says otherwise (gates.command.3)."
      pros:
        - "A theme with no linter in its gate ships the deprecations and the misused filters the platform's own tool would have named."
    relations:
      relates:
        - liquid.cycle.3
        - gates.command.3
    sources:
      - ref: liquid-reasons-stated
        backs: rule
  - id: liquid.cycle.5
    statement: "At push the layout files are scanned for secrets, with an allowlist that holds a third-party widget's public embed id and nothing that is a credential."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "supply.secrets.1 holds the secrets scan; a theme's layout files are where a script tag with a key would sit. A public embed id of a widget looks like a secret to a scanner and is not one; it goes on the allowlist with its owner (gates.ratchets.1), and the list prints its length."
      pros:
        - "A trial secrets scan found hits that were not credentials in three repositories of one organisation, and a theme's layout carries exactly the kind of public id that a scanner flags."
    relations:
      relates:
        - supply.secrets.1
        - gates.ratchets.1
    sources:
      - ref: gitleaks-readme
        where: ".gitleaksignore"
        says: You can ignore specific findings by creating a .gitleaksignore file at the root of your repo.
        backs: check
  - id: liquid.cycle.6
    statement: "A release pushes the theme to an unpublished theme and renders the home, a product and a cart page as a preview before anything is published; a change is never deployed straight to the live theme, and the gate holds that rule, not a script alone."
    strength: may
    status: active
    origin: migrated
    reasoning:
      definition: "The store's command line pushes to a theme by id. The release member pushes to an unpublished one, then a render member fetches the three pages from the preview and fails on an error or an empty page. The live theme changes only by publishing the previewed one. A repository script that does this is the convention; the release tier is the rule, so a push that names the live theme fails the member. The cost was not measured on the host that studied the stack."
      pros:
        - A theme deployed straight to the live store is live before anyone has seen a page of it.
    relations:
      relates:
        - supply.release.1
        - gates.command.31
    sources:
      - ref: liquid-reasons-stated
        backs: rule
