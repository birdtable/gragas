kind: Changed
body: >-
  **A check below a pin that ends not ready says what cures its cause.** The next line was always
  `gragas tools`; now a history that cannot be opened is sent to the `programs.git` setting and the top
  folder of the repository, a missing merge base to fetching the base ref or setting `base-ref`, and a
  names file that cannot be read to `names-file`, and `gragas tools` stays for a tool that could not be
  asked. When more than one cause holds, the ending says which comes first and why.
time: 2026-11-23T00:30:00.00000+01:00
