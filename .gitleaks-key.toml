# The secret scan's second pass (Taskfile.yml, secrets-scan): gitleaks'
# private-key rule alone, with no allow-list. The first pass, .gitleaks.toml, extends
# gitleaks' default rules, and gitleaks 8.30.1 appends the default config's global
# allow-list (go.sum, go.mod, .svg, .png, .pdf, .bin, the lock files, any file named
# gitleaks.toml) to every config that extends them, with no key that drops it
# (config/config.go:487). This config extends nothing, so no path and no file type is
# exempt from it. The rule is the private-key rule of gitleaks 8.30.1's default config
# (config/gitleaks.toml): its id, regex and keywords as they are there.
title = "gragas: a private key at any path"

[[rules]]
id = "private-key"
description = "A private key, at any path and in any file type"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S-]{64,}?KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]
