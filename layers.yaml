    owner: internal/cli/root
  - path: github.com/birdtable/go-testkit
    owner: internal/config/testing
    # Test-only: the test helpers go-proc kept as testenv until v0.12.0, which
    # moved them to platform's go-testkit. Every importer names
    # it testenv, so no call site changed with the move.
    # A test that plants a link calls testenv.Link or
    # Links itself, which skip with testenv.NoLinks on a system that refuses
