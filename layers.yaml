# What only an edge or an adapter imports: the operating system, the network
# and other programs (arch.ports.1). A trailing $ matches the path exactly, so
# net/url and net/netip stay pure. The why is the message a breach shows.
# golang.org/x/sys is not listed: the preset's one os-host row refuses it in
# every package outside internal/host, so no layer row repeats it.
effects:
  why: "arch.ports.1: the core reaches the operating system, the network and other programs only through a port"
  packages:
    - os
    - os/exec
    - net$
    - net/http
    - syscall
    - unsafe
    - plugin
  # The calls of a package a pure layer may import that still reach the disk
  # or the process: refused in a pure package all the same. appdirs is a pure
  # library for HereWith, System and For alone, which read only what they are
  # handed; Here reads the home and the environment itself, Temp and
  # TempOverflow make and judge a folder, and Free reads a disk.
  calls:
    - github.com/birdtable/go-files/appdirs.Free
    - github.com/birdtable/go-files/appdirs.Here
    - github.com/birdtable/go-files/appdirs.Temp
    - github.com/birdtable/go-files/appdirs.TempOverflow
    - path/filepath.Abs
    - path/filepath.EvalSymlinks
    - path/filepath.Glob
    - path/filepath.Walk
    - path/filepath.WalkDir

# Each library, by import path prefix, and the one package that imports it
# (arch.ports.6); pure marks one a pure package may import. A library with no
# owner is imported nowhere in gragas. Test-only packages are exempt: the
# journeys hold the lock and use go-console's test helpers. Each package of the
# platform's libraries (go-files, go-run, go-console) is a row of its
# own, with its one adapter package.
external:
  - path: github.com/spf13/cobra
    owner: internal/cli/root
    within:
      - internal/cli/cmd/...
    # The old check and gen build their cobra commands in cli/legacy until the M6 cut-over (M6-21, M0a-20).
    also:
      - {owner: internal/cli/legacy, until: M6-21}
      - {owner: internal/host/term, why: "the kit draws help from the cobra command itself, so host/term draws the tree main hands it"}
  - path: github.com/spf13/pflag
    owner: internal/cli/root
  - path: github.com/birdtable/go-console/ui
    owner: internal/host/term
    # The command tree reaches the kit only through the Draw function main
    # fills from host/term; no file of cli/root imports it
    # (TestNothingOfTheKitIsImported holds them).
  - path: github.com/birdtable/go-console/shell
    owner: internal/config
    pure: true
    # The shell key and GRAGAS_SHELL are read by
    # shell.ParseDialect and refused naming shell.Dialects, so gragas keeps no
    # list of dialect names. A pure package imports only a pure library it
    # owns, so config owns it, as it owns appdirs. Pure: the package imports
    # the standard library alone and reads no system; HereDialect, which reads
    # the parent processes, is go-console/ui's.
    also:
      - {owner: internal/cli/root, why: "the plan, apply, way-back and next lines are quoted by shell.Quote, not by hand-written quoters; the root is the one line maker, and contract and legacy reach it through the session"}
      - {owner: internal/core/api, why: "test files only: its journal test reads the quoted line back"}
      - {owner: cmd/gragas, why: "its restore test hands JournalRestore the command tree's Liner over the host Journal, and main hands the root the dialect its lines are written for"}
      - {owner: internal/host/term, why: "HereDialect hands main go-console/ui's dialect of the shell gragas was started from, for the shell setting's auto"}
      - {owner: internal/host/tool, why: "a version run that exits non-zero is refused with its line to paste quoted by shell.Quote for the dialect main hands tool.Config, or, with none or an argv Quote refuses, the step in words; the hand-joined line it replaces quoted the path alone", files: [tool.go, locate.go, tests]}
      - {owner: internal/host/trust, why: "fixLine and handOver quote go-files' owner-and-mode fix steps for cmd or a POSIX shell with shell.Quote, in place of the hand-written quoters a refusal's fix line used"}
  - path: github.com/birdtable/go-console/uitest
    owner: internal/host/term
    # The frames of the plan form and of the terminal's look are held to
    # goldens through the console's test driver.
    also:
      - {owner: internal/cli/root, why: "its tests hold the plan frames to goldens, written with the one -update"}
      - {owner: internal/config/testing, why: "Golden calls uitest/golden.File, the one exact compare, and links its -update into every test binary"}
