# gragas's layer table: the one place its Go packages, their layers and the
# imports between them are written (arch.layers.1, .8, .9). `gragas-dev layers`
# (task gen) renders from it docs/layers.md, the ESLint boundary golden and the
# .golangci.yml (whole, from lint/base.yml and lint/project.yml), and `task generated-files` fails
# when any of them differs from this file. internal/layers_test.go holds the
# tree to it with go list: every package in one row, every import on an edge a
# row allows, tests included.
#
# The rows are the layers of docs/architecture.md section 3.1. A package that
# section 3 names and the repository does not have yet is listed under
# planned: with the layer it will join and the milestone that creates it, and
# the rows already say what it may import. The pull request that creates it
# moves it out of planned: and into its row's packages: in one change, and the
# docs test fails on either half alone.
# A command package below internal/cli/cmd is in the row of that folder already
# (patterns: internal/cli/cmd/...), so building one only deletes its line here;
# task gen renders what the planned: list says into docs/architecture.md.
#
# The folders are the Go program template's (go.layout.1, arch.structure.6),
# named as the template names them; a row the template does not name
# says why it sits where it does. A new package is a new line here first.
module: github.com/birdtable/gragas
renders:
  doc: docs/layers.md
  lint: .golangci.yml
  lint-base: presets/golangci-lint/.golangci.yml
  lint-project: lint/project.yml
  eslint: docs/explorer-boundaries.json

about: >-
  Where gragas's Go code lives, and what each package may import. The folders
  follow the Go program template of go.layout.1, with its names:
  the bounded contexts under `internal/core/`, the operations every command
  calls in `internal/core/api`, one port package with its fake, the adapters
  under `internal/host/<tool>/`, config, the command tree under
  `internal/cli/<group>/`, leaves, and `cmd/gragas`, which wires everything by
  hand. Two more tables follow the layers: the contexts, which never import one
  another, and the explorer's modules, which have the same contract in
  TypeScript.

# Each row: its packages (module-relative) that exist, what kind of layer it is,
# what it holds, where the template puts it, what of gragas its packages may
# import (their own package and the stand-ins come with every row, for tests),
# the exact standard packages a pure layer's non-test files may import (std:
# an allow list, so a new one is a reviewed line here), and the reason a
# forbidden import says. A row may name packages that do not exist yet in its
# may: and under planned:. A row with until: is temporary and is gone by that
# milestone.
#
# A row lists its packages one by one, or a folder under patterns: as folder/...,
# which holds every package below it, so a new package there is no new line
# here. A pattern is also a name a row may list in may:, and a library may be
# imported within one (external: within:). The lint rule of a pattern allows
# everything below its folder; the layers test holds each package to its row,
# so one package of a pattern may not import another.
#
# Every list is a block, one entry per line, so two pull requests that add to
# one list at different points merge. A list is in order, except the ones whose
# order the output shows: a row's packages, the contexts, the explorer's modules
# and the words of the platform and source sections (internal/layers_lists_test.go
# holds the file to it).
#
# Kinds: pure (non-test files import only the standard packages its std list
# names and no library but a pure one, arch.ports.1), edge (the entry and
# the command tree, which reach the process and the terminal), host (adapters, one per tool), stand-in
# (imported from _test.go files only), tests (_test.go files only).
layers:
  - layer: entry
    kind: edge
    packages:
      - cmd/gragas
    holds: "main: the signal context, every port filled with its adapter, the exit"
    template: "`cmd/<name>`: wires and registers, nothing else"
    may:
      - internal/apply
      - internal/cli/root
      - internal/config
      - internal/core/api
      - internal/core/plugins
      - internal/core/wire
      - internal/exit
      - internal/host/...
      - internal/model
      - internal/model/plugin
      - internal/port
      - internal/port/legacy
    why: "go.layout.1, arch.ports.13: cmd/gragas wires the adapters into the ports, checks the table of endings before anything runs and runs the command tree; it hands the plugin host the engine's codec (core/wire) and judgement of a manifest (core/plugins), since an adapter never imports the core (arch.layers.7); its test binds the Steps port main fills with a plugin scope, the types-only leaf model/plugin"

  - layer: entry-subset
    kind: edge
    packages:
      - cmd/gragas-subset
    holds: "main of the subset build: the same wiring as the entry with the Assets port filled by an adapter that answers port.ErrUnavailable, and no host/assets, so it links no embedded file"
    template: "`cmd/gragas-subset`: built by the gate in every run and shipped nowhere"
    may:
      - internal/cli/root
      - internal/config
      - internal/host/clock
      - internal/host/fs
      - internal/host/jsonschema
      - internal/host/toml
      - internal/host/trust
      - internal/model
      - internal/port
      - internal/port/legacy
    why: "arch.layers.13: the explorer stays separable, so the subset entry never imports host/assets"

  - layer: cli
    kind: edge
    packages:
      - internal/cli/root
    holds: "the command tree over the Terminal port and model.Screen, one package of commands per context, the lock and run record around a run that writes, --json rendered from the result types"
    template: "`cli/<group>`: the root and one group per context; it draws only through the Terminal port, so there is no `cli/ui`"
    may:
      - internal/cli/cmd/...
      - internal/cli/kit
      - internal/cli/legacy
      - internal/cli/planned
      - internal/cli/run
      - internal/config
      - internal/core/api
      - internal/digest
      - internal/exit
      - internal/model
      - internal/port
      - internal/port/legacy
      - internal/rendered
    why: "arch.ports.2: a command reaches the core through its operations and the world through the ports main fills; no adapter, no context"

  - layer: cli-cmd
    kind: edge
    patterns:
      - internal/cli/cmd/...
    holds: "the commands that live in a package of their own, one folder below internal/cli/cmd each: its row, its cobra command, its tests and its goldens. internal/cli/root/join_gen.go, written by gragas-dev gen commands, names them, so a new command is a new folder and no shared line"
    template: "`cli/cmd/<command>`: one package per command family; it draws only through the session the root hands it"
    may:
      - internal/cli/kit
      - internal/core/api
      - internal/exit
      - internal/model
    why: "arch.ports.2: a command package reaches the core through its operations and the run through the kit's session; no adapter, no context, no root and no other command"

  - layer: cli-planned
    kind: pure
    packages:
      - internal/cli/planned
    holds: "the commands decided and not built, one YAML file each, and the loader that reads them into rows; a built command deletes its file and adds its package below internal/cli/cmd in one change"
    template: "`cli/planned/<name>.yaml`: a row of the table of spec 15.1 that has no code yet, so it is data, absent from the command tree"
    may:
      - internal/cli/kit
      - internal/model
      - internal/ordered
    std:
      - embed
      - errors
      - fmt
      - io/fs
      - slices
      - strings
    why: "arch.layers.1: the planned list is data and a loader over the kit; it imports the kit, the model and the leaves, no library, no root"

  - layer: cli-kit
    kind: pure
    packages:
      - internal/cli/kit
    holds: "the row that declares a command and the registry that holds the rows to the rules of cli.commands.26, shared by the root and by every command package below internal/cli/cmd"
    template: "`cli/kit`: what every command shares, free of cobra, so a command package and the root both build on it"
    may:
      - internal/model
    std:
      - context
      - errors
      - fmt
      - slices
      - strconv
      - strings
    why: "arch.layers.1: the kit is a leaf of the command tree; it imports the model and the standard packages it lists, no library, no adapter, no root"

  - layer: cli-run
    kind: edge
    packages:
      - internal/cli/run
    holds: "the plan seam: the one form of the dry run, the question at a terminal and the apply, over a Host the root implements, so a command package never reaches the root to run a plan"
    template: "`cli/run`: the form every plan command ends in, free of cobra (arch.ports.6); the root says whether a command takes --apply and was given it"
    may:
      - internal/core/api
      - internal/model
    why: "arch.ports.2: the seam reaches the core through its operations; no adapter, no root, no cobra"

  - layer: legacy-cli
    kind: edge
    packages:
      - internal/cli/legacy
    holds: "the old check and gen, mounted behind the new root with their flags, annotations, output and exit codes as they were; they end and draw through the Host the root hands them"
    template: "Temporary. The old commands are one package until the contexts' commands replace them at the M6 cut-over; only cli/root imports it (M0a-20)"
    may:
      - internal/config
      - internal/core/api
      - internal/model
      - internal/port/legacy
    why: "arch.ports.2: a command reaches the core through its operations and the world through the ports the root hands it; no adapter, no context"
    until: M6

  - layer: coreapi
    kind: pure
    packages:
      - internal/core/api
    holds: "the operations every command calls (load, plan, apply, count), the JSON result types, and the one place the contexts meet"
    template: "`core/api`: the operations every client calls and their result types; the package is named coreapi, as arch.structure.7's check refuses api"
    may:
      - internal/apply
      - internal/canon
      - internal/core/agents
      - internal/core/audit
      - internal/core/contract
      - internal/core/format
      - internal/core/generate
      - internal/core/lifecycle
      - internal/core/link
      - internal/core/plugins
      - internal/core/plugintest
      - internal/core/project
      - internal/core/proof
      - internal/core/publish
      - internal/core/release
      - internal/core/rulebook
      - internal/core/wire
      - internal/digest
      - internal/exit
      - internal/markdown
      - internal/model
      - internal/model/contract
      - internal/model/plugin
      - internal/ordered
      - internal/pluginbundle
      - internal/port
      - internal/port/legacy
      - internal/readglob
      - internal/rendered
    std:
      - bytes
      - context
      - encoding/base64
      - encoding/json
      - errors
      - fmt
      - io
      - io/fs
      - maps
      - path
      - slices
      - strconv
      - strings
      - time
      - unicode/utf8
    why: "arch.layers.1: the operations import the contexts, the port and the leaves, nothing above them; internal/model/contract is the bundle a parent's rules are read from, turned into the context's argument here; internal/model/plugin is the plugin contract's types, which the import's bridge over the adapter reader gives link as a plugin's entries until Ports.Plugins is wired; internal/core/plugins is the plan rounds those entries are asked through, which its tests compose over the stand-in; internal/pluginbundle is the one judge of a bundle as read, which plugin list asks for the tool a row shows"

  - layer: core
    kind: pure
    packages:
      - internal/core/format
      - internal/core/audit
      - internal/core/link
      - internal/core/lifecycle
      - internal/core/project
      - internal/core/proof
    holds: "the bounded contexts, each its own package under internal/core/, listed under contexts: and pure"
    template: >-
      `core`: the decisions. The template keeps its core in one package, internal/core; gragas has nine
      contexts, and arch.ports.8 asks that no context import another, through an independence contract listing
      them, so each is its own package under internal/core/ (go.layout.1 names internal/core/ the
      domain) and the contexts: table is that contract. A context that reads another declares
      the interface on its own side; internal/core/api, the operations, is where they meet
    may:
      - internal/canon
      - internal/digest
      - internal/exit
      - internal/markdown
      - internal/model
      - internal/model/plugin
      - internal/ordered
      - internal/port
      - internal/rendered
    std:
      - bufio
      - bytes
      - cmp
      - context
      - encoding/hex
      - errors
      - fmt
      - go/build/constraint
      - go/parser
      - go/scanner
      - go/token
      - io
      - io/fs
      - path
      - regexp
      - slices
      - strconv
      - strings
      - time
      - unicode
    why: "arch.ports.1, arch.ports.8: a context imports the port and the leaves, never an adapter, the operating system, the network or another context; go/parser, go/token and go/build/constraint read a Go file's text up to its package clause, as audit's os-files reads it (arch.ports.24); internal/model/plugin is the plugin contract's generated types, which link reads a plugin's entries in"

  - layer: contract
    kind: pure
    packages:
      - internal/core/contract
    holds: "the contract context (domain 10): the one canonical encoder of every document, Validate against the schema of the contract version a document names, ReadBundle, and the findings-to-SARIF encoder"
    template: >-
      `contract`: a context like the core row's, in its own row for one leaf more: internal/model/contract, the
      generated types, which no other context reads yet. Each type's generated ToCanon and FromCanon turn a model
      value into canon's Value tree and a document that passed canon.Decode and its schema back into its model
      type, so the context reads and writes JSON through canon alone and imports no encoding/json
    may:
      - internal/canon
      - internal/exit
      - internal/markdown
      - internal/model
      - internal/model/contract
      - internal/ordered
      - internal/port
    std:
      - bufio
      - bytes
      - cmp
      - context
      - encoding/hex
      - errors
      - fmt
      - io
      - io/fs
      - path
      - regexp
      - slices
      - strings
      - time
      - unicode
    why: "arch.ports.1, arch.ports.8: a context imports the port and the leaves, never an adapter, the operating system, the network or another context; internal/model/contract is the one leaf more, and it reads and writes JSON through canon"

  - layer: legacy-core
    kind: pure
    packages:
      - internal/core/rulebook
      - internal/core/generate
    holds: "the domains the engine has before its contexts exist: rulebook (parts, rules, ids, standing, names), generate (rules.json, bindings.json, coverage.json and ids.lock)"
    template: >-
      Temporary. rulebook and generate are domains of the engine before its contexts, each its own package
      under internal/core/ with no import of the other: a domain that reads another declares the interface on
      its own side (generate's Book). The contexts of the core row replace them
    may:
      - internal/model
      - internal/ordered
      - internal/port/legacy
    std:
      - bufio
      - bytes
      - context
      - errors
      - fmt
      - io
      - io/fs
      - path
      - regexp
      - slices
      - strings
      - unicode
    why: "arch.ports.1, arch.ports.8: a domain imports the port and the leaves; another domain only through an interface it declares"
    until: M6

  - layer: apply
    kind: pure
    packages:
      - internal/apply
    holds: "the write path over the ports: input set, lock, intent, check, write, goal, close, recovery; it takes the plan function and the render function as arguments and runs them under the lock"
    template: "`apply`: the write path, which no context owns"
    may:
      - internal/apply/jwrite
      - internal/canon
      - internal/digest
      - internal/model
      - internal/port
    std:
      - context
      - encoding/hex
      - errors
      - fmt
      - io/fs
      - path
      - slices
      - strings
    why: "arch.layers.1: the write path imports the port and the leaves, never a context or an adapter"

  - layer: jwrite
    kind: pure
    packages:
      - internal/apply/jwrite
    holds: "the journalled write of one file in plain types: the old content kept, the copy and the step journalled, the write made and read back; and the roll back of a run from its copies, each record checked and each file held to what the run could have left before the first is put back; it names none of model, canon or port, so it can move to the library that owns files"
    template: "a leaf package"
    product: "gragas's until platform rules otherwise: the journalled write of one file, the owner's code in waiting for the library that owns files; no platform home is named in this table"
    may:
      - internal/digest
    std:
      - errors
      - fmt
      - slices
      - strings
    why: "arch.layers.1, arch.shared.8: the journalled write is the owner's code in waiting: it imports the digest leaf and nothing of the plan, the canonical form or the ports; shared package of the row: internal/apply/jwrite"

  - layer: dev
    kind: pure
    patterns:
      - internal/dev/...
    holds: "the engine's own generators, imported by cmd/gragas-dev (and cmd/gragas-generate for generate) and the repository tests only: layers (this table and what it renders), gate (the registry under gate/ and what it says about the tree), surface (the exports of the ports and the model, with their marks), measure (coupling, size and function numbers, and what blocks), newcommand (the files of a new command from the golden example) and templates/command (that example) and generate (the contract schemas turned into Go types, TypeScript types, zod and the field reference), join (the one generated file that names the command packages), scan (the hashed-names scan and the plant and control it proves itself on first) and census (the standard library's identifiers that differ by system, read from the files go list builds for each first-class system, and gate/os-api.txt's decision for each)"
    template: "`internal/dev/*`: the engine's own tooling, not shipped"
    carves:
      - internal/dev/generate/pluginwire
      - internal/dev/say
      - internal/dev/standin
    may:
      - internal/core/contract
      - internal/dev/generate/pluginwire
      - internal/digest
      - internal/ordered
      - internal/wcag
    std:
      - archive/zip
      - bytes
      - cmp
      - context
      - crypto/hmac
      - embed
      - encoding/base64
      - encoding/hex
      - encoding/json
      - errors
      - fmt
      - go/ast
      - go/format
      - go/parser
      - go/token
      - go/types
      - io
      - io/fs
      - maps
      - net/url
      - path
      - regexp
      - regexp/syntax
      - slices
      - strconv
      - strings
      - text/template
      - time
    why: "supply.intake.2, arch.layers.13: the shipped binary's closure holds no dev code, and a generator imports the leaves only"

  - layer: dev-pluginwire
    kind: pure
    packages:
      - internal/dev/generate/pluginwire
    holds: "the second generator of gragas-generate: plugin contract 1's Go types and their ToCanon and FromCanon, read from contract/plugin/v1/*.schema.json; it reads the two schemas and writes internal/model/plugin, and nothing else"
    template: "`internal/dev/*`: the engine's own tooling, not shipped"
    product: "gragas's: internal/dev/generate/pluginwire turns the plugin contract, which only gragas's schemas describe, into the types the engine reads a plugin's messages with; it is the one place the schema's bounds are written down as code, so no copy of them is kept by hand, and no platform home is named in this table"
    may:
      - internal/ordered
    std:
      - bytes
      - fmt
      - go/format
      - regexp
      - slices
      - strconv
      - strings
    why: "supply.intake.2, arch.layers.13: internal/dev/generate/pluginwire is imported by internal/dev/generate and cmd/gragas-generate alone, never by cmd/gragas or the product; a generator imports the leaves only"

  - layer: dev-standin
    kind: edge
    packages:
      - internal/dev/standin
    holds: "the source of standin.wasm, the one plugin gragas keeps: a main package for wasip1 whose Answer is the plugin contract's five operations as small deterministic functions of the request, and whose main wraps it on stdin and stdout; the wasm host's tests build the module from it, and the gate rebuilds it and compares its digest"
    template: "`internal/dev/*`: the engine's own tooling, not shipped; an edge for the one read of stdin and write of stdout a wasip1 program makes"
    product: "gragas's: internal/dev/standin is the module the wasm host and the journeys are tested against; it serves no tool, and the plugins of the tools are another repository's"
    may:
      - internal/canon
      - internal/core/wire
      - internal/model/plugin
      - internal/port
    why: "arch.layers.13: internal/dev/standin imports the engine's own codec and generated types and the standard library alone (canon, to read a request body into the value tree the generated types read, so a body that is no request answers bug), never the SDK, which is another repository's; its test files import the port and the suite of contracttest, to run the cases through port.Plugin, and no non-test file does; it is built for the wasm target by being targeted, with no build tag and no read of a file"

  - layer: dev-say
    kind: pure
    packages:
      - internal/dev/say
    holds: "the dev tools' shared first-error writer; not product: the one Speaker that cmd/gragas-* write their output and diagnostics through, in place of the copy each kept"
    template: "`internal/dev/*`: the engine's own tooling, not shipped"
    may: []
    std:
      - io
    why: "supply.intake.2, arch.layers.13: internal/dev/say is imported by the dev tools of cmd/gragas-* alone, never by cmd/gragas or the product, and its lines count under dev-tool-lines' ceiling with theirs"

  - layer: dev-entry
    kind: edge
    packages:
      - cmd/gragas-dev
    holds: "main of the engine's own generators: the flags, the files, the exit"
    template: "`cmd/gragas-dev`: dev only, not shipped"
    may:
      - internal/config
      - internal/core/project
      - internal/dev/census
      - internal/dev/gate
      - internal/dev/join
      - internal/dev/layers
      - internal/dev/say
      - internal/dev/scan
      - internal/dev/surface
      - internal/dev/tokens
      - internal/digest
      - internal/exit
      - internal/host/clock
      - internal/host/fs
      - internal/host/jsonschema
      - internal/host/term
      - internal/host/treepin
      - internal/host/trust
      - internal/model
    why: "supply.intake.2, arch.layers.13: cmd/gragas-dev calls the generators in internal/dev, and of what the shipped binary links only internal/core/project, the one check of gate/exemptions.yaml, which the gate runs itself with its own clock (gates.exemptions.4), and the lap log of the push tier, which it writes through internal/host/fs's Writer.Replace (gate/shared.yaml, the atomic-write owner) with the model's Root; and the settings' mounts, through internal/config's Load with host/trust's owned read, so the names scan reads its hashed list on a disk GRAGAS_MOUNTS or the mounts setting names, as the product reads the names file"

  - layer: new-entry
    kind: edge
    packages:
      - cmd/gragas-new
    holds: "main of the command generator: it holds a name to the registry's rules, shows the files a new command would have and with --apply writes them, and with check runs the generator into a copy of the tree"
    template: "`cmd/gragas-new`: dev only, not shipped, and apart from gragas-dev because it links the command tree, which the landing check's closure must not"
    may:
      - internal/cli/kit
      - internal/cli/planned
      - internal/dev/newcommand
      - internal/dev/say
      - internal/dev/templates/command
      - internal/exit
      - internal/host/term
    why: "arch.layers.13: a generator of commands imports the kit whose rules it holds a name to and nothing the adapters hold, and links the pinned tools into its copy of the tree through go-files' confine.LinkFolder"

  - layer: docs-entry
    kind: edge
    packages:
      - cmd/gragas-docs
    holds: "main of the command documents' generator: it asks the command tree for the documents the registry makes and writes them, or with --check says which differs"
    template: "`cmd/gragas-docs`: dev only, not shipped, and apart from gragas-dev because it links the command tree, which the landing check's closure must not"
    may:
      - internal/cli/root
      - internal/dev/say
      - internal/exit
      - internal/host/term
      - internal/ordered
      - internal/rendered
    why: "arch.layers.13: a generator of documents imports the command tree it describes and nothing the adapters hold"
  - layer: crash-entry
    kind: edge
    packages:
      - cmd/gragas-crash
    holds: "main of the crash-injection child: one scripted plan through the write path over the host's files, and each writing command of the tree run as cmd/gragas wires it with its writer and journal counted, each stopped at a numbered boundary for the journey to kill, and the recovery run after it"
    template: "`cmd/gragas-crash`: dev only, built by the journeys and shipped nowhere, and outside the landing check's closure"
    may:
      - internal/apply
      - internal/cli/root
      - internal/config
      - internal/core/api
      - internal/core/plugins
      - internal/core/wire
      - internal/exit
      - internal/host/...
      - internal/model
      - internal/port
      - internal/port/legacy
    why: "store.recovery.2: only a child process dies like a crash; a main of its own keeps the write path out of gragas-dev, and wires the command tree as cmd/gragas does so every writing command is killed in its own code; it hands the plugin host the engine's codec (core/wire) and judgement of a manifest (core/plugins) as cmd/gragas does, so a rule plan reaches a Plugins port that is the root's own and no port is tested for nil (arch.ports.5)"

  - layer: release-entry
    kind: edge
    packages:
      - cmd/gragas-release
    holds: "main of the release's Go steps: before goreleaser builds, sources holds every source .goreleaser.yaml names to be a plain file in the clone's HEAD, never a symbolic link goreleaser would follow; after it, compare holds the checksums.txt of two builds from two clean copies to each other, and verify holds a release folder to its checksums.txt, unpacks each archive, checks its licence and notices, holds each binary to the one built, runs the host's binary (behind go-proc's network block; where the system gives none, sandbox.ErrNoBlock, the start test is refused by name and never run unblocked) and records what it found; build runs those steps around goreleaser, which it starts from two clean clones of HEAD only once the program is the sha256 tools.yaml pins for the host; it tags, signs and publishes nothing itself"
    template: "`cmd/gragas-release`: dev only, not shipped, and apart from gragas-dev so the landing check's closure does not grow"
    may:
      - internal/dev/say
      - internal/digest
      - internal/exit
      - internal/host/fs
      - internal/host/term
      - internal/host/trust
      - internal/ordered
