ports:
  fake: internal/port/testing
  carries:
    - Bundles
    - Plugin
    - Plugins
    - StepRunner
    - Trial
  list:
    - port: Tree
      subject: "a root's files, read-only: a rulebook's repository, a project, the engine's own state folder"
      adapter: internal/host/fs
    - port: Writer
      subject: "one file replaced whole, or one line appended, inside a root"
      adapter: internal/host/fs
    - port: Lock
      subject: "one writer per root at a time, and proof's scratch lock"
      adapter: internal/host/fs
    - port: Journal
      subject: "the record of a run that writes: intent before effect, the plan, the copies, the close"
      adapter: internal/host/fs
    - port: History
      subject: "a repository's own history, read-only"
      adapter: internal/host/git
    - port: Remote
      subject: "releases from elsewhere, and the two writes release makes"
      adapter: internal/host/git
    - port: Sandbox
      subject: "a prepared run at a named level"
      adapter: internal/host/sandbox
    - port: Schema
      subject: "a document checked against a JSON Schema"
      adapter: internal/host/jsonschema
    - port: Clock
      subject: "today, and the run time"
      adapter: internal/host/clock
    - port: Assets
      subject: "the embedded files: the explorer app, the handbook, the schemas, the profiles, the fixture rulebook"
      adapter: internal/host/assets
    - port: Terminal
      subject: "the person's terminal: width, colour depth, a question, a line out, a line in"
      adapter: internal/host/term
    - port: Owned
      subject: "one file outside every root, read whole, that the settings name by an absolute path and only this account or root owns"
      adapter: internal/host/fs
    - port: FileNames
      subject: "what a disk does with a file's name: its key where a disk folds names, or a refusal"
      adapter: internal/host/fs
    - port: Trust
      subject: "the plugins a person approved to run on this machine, each by its bundle's digest, kept in the state folder and never in a clone"
      adapter: internal/host/fs
    - port: Steps
      subject: "a plugin's steps of one read, each run or read under its manifest's grants alone, journalled before it starts"
      adapter: internal/host/tool
    - port: Bundles
      subject: "the plugin bundles installed under a root as they lie on disk: the lock's list, and each bundle's files and digests as read"
      adapter: internal/host/fs
    - port: Plugins
      subject: "the installed plugins of a root, each opened over its bundle and refused before any of its code runs, and each call one fresh instance of its module"
      adapter: internal/host/plugin

# The outside programs, each with the one adapter package that starts it by
# the checked path its setting names (arch.ports.6, cli.process.1). gragas
# gen writes a G204 exclusion in .golangci.yml for the non-test files of each
# adapter here, and internal/lintconfig_test.go holds that no other package
# has one. The adapter is a package of the host row: a program joins this
# list in the pull request that builds its adapter (host/sandbox when its
# milestone comes).
programs:
  - program: git
    adapter: internal/host/git
  # enforcer is every tool a plugin stands for: host/tool runs the one it
  # located, by its checked absolute path, with a step inside the plugin's grants.
  - program: enforcer
    adapter: internal/host/tool
    file: run.go

# Packages docs/architecture.md section 3 names that do not exist yet, each
# with the milestone of section 18 that creates it and the layer it joins.
# internal/layers_test.go holds section 3 to this table: a package it names
# either exists or is here. The pull request that creates a package moves it
# into its row's packages: in the same change.
planned:
  - created: M1
    layer: cli
    packages:
      - internal/cli/cmd/format
  - created: M2
    layer: cli
    packages:
      - internal/cli/cmd/lifecycle
  - created: M3
    layer: cli
    packages:
      - internal/cli/cmd/link
  - created: M4
    layer: cli
    packages:
      - internal/cli/cmd/proof
  - created: M5
    layer: cli
    packages:
      - internal/cli/cmd/release
  - created: M5
    layer: core
    packages:
      - internal/core/release
  - created: M6
    layer: cli
    packages:
      - internal/cli/cmd/project
  - created: M7
    layer: cli
    packages:
      - internal/cli/cmd/publish
  - created: M7
    layer: core
    packages:
      - internal/core/publish
  - created: M8
    layer: cli
    packages:
      - internal/cli/cmd/explorer
  - created: M9
    layer: cli
    packages:
      - internal/cli/cmd/agents
  - created: M9
    layer: core
    packages:
      - internal/core/agents

# The bounded contexts (arch.ports.8, arch.layers.9): each is the package
# internal/core/<name>, and the boundary lint refuses an import between any two.
contexts:
  why: "arch.ports.8: no context imports another; what one needs from another arrives as an argument, and the contexts meet only in internal/core/api"
  names:
    - link
    - proof
    - format
    - lifecycle
    - release
    - publish
    - project
    - audit
    - agents
    - contract
    - plugins

# The explorer's modules (docs/architecture.md section 8.2) and what each may
# import, rendered into the ESLint boundary configuration. A name ending in /*
# stands for each folder below it, and those folders may not import one another.
# The paths are the workspace's folders under explorer/packages (M8).
explorer:
  why: "arch.ports.8: the explorer's modules have the contexts' independence contract; a view reaches data through the selectors and words through the messages, and no view imports another"
  modules:
    - name: contract
      path: explorer/packages/contract
    - name: tokens
      path: explorer/packages/tokens
    - name: core/data
      path: explorer/packages/core/data
      may:
        - contract
    - name: core/selectors
      path: explorer/packages/core/selectors
      may:
        - contract
        - core/data
    - name: core/messages
      path: explorer/packages/core/messages
    - name: core/formatter
      path: explorer/packages/core/formatter
    - name: core/markup
      path: explorer/packages/core/markup
    - name: core/parts
      path: explorer/packages/core/parts
      may:
        - tokens
        - core/messages
        - core/formatter
    - name: core/views/*
      path: explorer/packages/core/views/*
      may:
        - contract
        - tokens
        - core/data
        - core/selectors
        - core/messages
        - core/formatter
        - core/markup
        - core/parts
    - name: standalone
      path: explorer/packages/standalone
      may:
        - contract
        - tokens
        - core/data
        - core/selectors
        - core/messages
        - core/formatter
        - core/parts
        - core/views/*
    - name: element
      path: explorer/packages/element
      may:
        - contract
        - tokens
        - core/data
        - core/selectors
        - core/messages
        - core/formatter
        - core/views/*
    - name: plugin-docs
      path: explorer/packages/plugin-docs
      may:
        - tokens
        - element
    - name: plugin-portal
      path: explorer/packages/plugin-portal
      may:
        - tokens
        - element

# The words of one system or another (arch.ports.4, .5, .17): no non-test
# file of a pure package starts a string with a root, names a tool or a
# home-relative system folder, and no
# port or fake names a system. There is no exception list; the fix is a port.
platform:
  roots:
    - /sys
    - /proc
    - /run
    - /opt
    - /etc
    - /var
    - /usr
    - /Library
    - /System
    - "C:\\"
  tools:
    - systemctl
    - systemd-run
    - journalctl
    - launchctl
    - apt-get
    - dpkg
    - brew
    - dnf
    - yum
    - pacman
    - powershell
    - diskutil
    - pmset
  names:
    - linux
    - darwin
    - windows
    - macos
    - freebsd
  homes:
    - Library/LaunchAgents
    - Library/LaunchDaemons
    - Library/Application Support
    - Library/Preferences
    - .config/systemd
    - .local/share/systemd
    - AppData/

# What the source test holds (arch.ports.2, arch.structure.7, arch.layers.3):
# no Go string or name in these folders is a rule id of the rulebook or the
# name of a tool or of its config format, since rules are data and a tool is a
# plugin, which lives outside the product's non-test Go; no package carries a refused name; the
# files of one layer stay under a line limit; and init functions outside main
# are counted, and the count only falls.
source:
  scope:
    - internal/core
    - internal/cli
  rule_id: '\b[a-z][a-z0-9]*\.[a-z][a-z0-9-]*\.[0-9]+\b'
  # The other list of tools is gate/tool-names.txt, which holds all of the
  # product's Go. The two stand until one of them is retired,
  # and differ by exactly the names that file's !
  # line leaves out; TestTheToolListsDifferByTheLeftOut holds it.
  tools:
    - golangci-lint
    - eslint
    - tsc
    - ast-grep
    - depguard
    - ruff
    - mypy
    - prettier
    - biome
    - semgrep
    - gitleaks
    - govulncheck
    - staticcheck
    - gosec
  formats:
    - .golangci.yml
    - .eslintrc
    - eslint.config
    - pyproject.toml
    - ruff.toml
    - biome.json
    - .prettierrc
    - .gitleaks.toml
  refused:
    - util
    - utils
    - common
    - helpers
    - types
    - misc
    - api
  limit: {layer: coreapi, lines: 300}
  inits: 0
