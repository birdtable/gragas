      - {owner: internal/host/fs, why: "its tests plant links through testenv.Link"}
      - {owner: internal/host/git, why: "its tests plant links through testenv.Link"}
      - {owner: internal/host/sandbox, why: "its tests plant links through testenv.Link"}
      - {owner: internal/host/tool, why: "its tests plant links through testenv.Link"}
      - {owner: internal/host/treepin, why: "its tests plant links through testenv.Link"}
      - {owner: internal/host/trust, why: "its tests plant links through testenv.Link"}
      - {owner: internal/journeys, why: "its tests plant links through testenv.Link"}
      - {owner: internal/journeys/overflow, why: "its one test builds the binary through testenv.Build, as the journeys do"}
  - path: github.com/birdtable/go-testkit/contain
    owner: internal/config/testing
    # Test-only: contain runs a test binary again in a user and
