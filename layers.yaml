    also:
      - {owner: internal/host/git, why: "git, the only transport, runs through proc.Run in run.go's runWith, the one start of the git adapter, its tree, an ssh or a helper among it, killed whole at the deadline"}
      - {owner: internal/platformgap/goproc/commondir, why: "commondir asks git for the common git dir through proc.Run, as the git adapter does, until go-proc has the helper"}
      - {owner: internal/config/testing, why: "tests.isolation: Rerun starts the test binary again through proc.Run, with go-testkit (imported as testenv) beside it, and HoldOf asks proc.Holds what this system does with a run held to a memory limit, so a test expects the host's answer, never the GOOS's; a test helper, not a host adapter, so it does not go through host/tool"}
