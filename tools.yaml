# Every check tool the gate runs, pinned by version and by the sha256 of the
# program itself on each platform (architecture 14, Tools; A25). This file is
# the only place a tool's version or checksum is written: the Taskfile reads
# the programs from .tools/bin, where `task tools` puts them, and nothing is
# installed on the machine.
#
# `task tools` needs the network. A release tool is
# fetched over https, its archive checked against the publisher's checksum
# below before it is opened, and the program in it checked against its own
# sha256 before it is placed. A go tool is built from the tools module
# (tools/go.mod, verified against the checksum database when it is added) with
# the toolchain go.mod pins, and the program checked against its sha256 before
# it is placed. A program whose sum differs is refused and never run
# (supply.provenance.7). A release archive is a .tar.gz or a .zip, and its
# member is the program's path in it, in a folder or at its top; on windows
# the program is placed as its id and .exe.
#
# The stated build of a go tool: task tools runs, from the root,
#   CGO_ENABLED=0 GOAMD64=v1 GOARM64=v8.0 GOEXPERIMENT= GOFIPS140=off \
#     go build -C tools -trimpath -buildvcs=false [-ldflags=<the row's ldflags>] -o .tools/bin/<id> <package>
# with GOTOOLCHAIN=go1.27.4 (the toolchain go.mod pins, which the Taskfile's
# guard holds), GOFLAGS=-mod=readonly and GOWORK=off. That build prints the same
# file on every machine of a system, so the platform's sha256 is the sha256 of
# that file, and tools-check (and the end of task tools) refuses a go tool whose
# file is another. A go tool with no sha256 for a system says why, and is
# then held by go.sum alone: no-<goos> for the platforms of one system, as
# no-windows for windows, and no-sha256 for every system (task). A no-<goos>
# beside a pin of a platform of that system is red, as a no-sha256 beside any
# pin is, so a no-<goos> never quiets a system the row pins. A go row that pins no sha256 for the system tools-check runs
# on and says neither, or has a platforms line that is not
# "<goos>/<goarch>: {sha256: <64 lowercase hex>}", is red and named,
# as is a go tool of the Taskfile with no row here. The
# linux/amd64 and darwin/arm64 rows were measured by one run of that build on each system; linux/arm64 and darwin/amd64 were
# built across from darwin/arm64 with it, and no session of those systems has
# run it yet: their rows hold until one does. The windows/amd64 rows were
# measured by two clean runs of task tools on Windows at 81cd489a7, which
# printed the same sums, possibly on one machine.
#
# The windows/amd64 pins let the gate's tools run on Windows. Nothing here
# picks the release's systems: those are the Taskfile's CROSS, which
# .goreleaser.yaml builds. A tool with no windows/amd64 pin
# says why in no-windows: task alone, held by its build info everywhere.
#
# A node tool is a package of the workspace tools/.node, installed by task
# tools with the pnpm and node below from its lockfile alone (which holds the
# sha512 of every package's tarball), frozen, into a plain tree of folders.
# pnpm refuses at that install a package with a build script
# (strictDepBuilds, tools/.node/pnpm-workspace.yaml). No release-age window is
# held. What the preflight holds is the
# install, not a digest: tools-check reads the lockfile pnpm wrote when it
# installed, tools/.node/node_modules/.pnpm/lock.yaml, and refuses the tree
# when that is not tools/.node/pnpm-lock.yaml, or is missing (gragas-dev
# tools-check --pnpm). The sha256 each node tool still carries below is read
# by no check of the tree: tests want every tool pinned on Windows or saying
# why not, and the prettier preset's test reads prettier's, so the pins stay
# until those readers go. task tools installs from pnpm's
# store when it holds every package, with no network.
#
# The preflight (gragas-dev tools-check, the first step of every tier)
# needs no network: it checks each program's sha256, runs it with the network
# blocked and reads its version back, reads a go tool's build info, and fails
# closed on a missing tool (supply.install.10, gates.plants.5). Where the
# system gives no network block the run is refused by name
# (sandbox.ErrNoBlock), never made unblocked. The gate then
# runs every member with the network blocked (supply.install.2).
#
# opa is not listed: gragas has no Policy port, and D3, which named it, is
# superseded. The gate refuses an opa entry.
#
# expected are the programs the engine runs that the settings file names
# (architecture 9, programs:). They are never fetched or pinned here: the
# person who installs gragas chooses them, and the engine checks each one
# where it runs it.
#
# To bump a tool: change its version, its urls and archive sums from the
# publisher's checksums, and its tools/go.mod line for a go tool; then put each
# platform's program sha256 here, from a build or an unpacked archive, and run
# task tools. For a node tool, change its version in tools/.node/package.json
# and run pnpm install there with the pnpm below, so pnpm-lock.yaml moves with
# it; task tools then installs the tree tools-check holds to that lock. Bump
# the toolchain in go.mod and every go tool's sums change.

