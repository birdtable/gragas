# The browsers Vitest's browser mode starts, Chromium's headless shell, its
# ffmpeg and WebKit. Playwright's own `playwright install`, run by
# the pinned node at the version explorer/pnpm-lock.yaml holds, places them in
# .tools/playwright, and there is no unpacker of our own. Neither the CDN nor
# the npm package publishes a checksum, so the pin is the tree digest
# (go-files treesum, a link kept only when its target stays inside the folder)
# of the folder as first fetched over https and measured here: a first-fetch
# pin, not signed by the publisher (supply.provenance.7). The gate holds the
# folder to it before a test starts a browser (gragas-dev browsers), refusing a
# changed file, an added file, a link out of the folder and a folder past the
# caps. To bump Playwright, change it in the explorer, run task tools, read the
# new digest with gragas-dev browsers --print --platform <platform> on each
# platform, and put it here. The digest is browsers2: since go-files v0.4.0
# (treesum's t2: lines, which no longer cover the executable bit); a
# browsers1: pin is refused as an older format. Each browsers2: pin was
# measured twice, by the new binary, from a tree the old binary had just
# passed against its browsers1: pin on that system, so the
# change of format blesses no drift.
browsers:
  playwright: 1.65.0
  platforms:
    darwin/arm64: {tree: browsers2:9c0d483cde314ed20e5d1008ae7a054a40dc77f632e8af00dc081044d938758e}
    darwin/amd64: {unmeasured: "no session of that system has run the install, so no tree was measured"}
    linux/amd64: {unmeasured: "no session of that system has run the install, so no tree was measured"}
    linux/arm64: {unmeasured: "no session of that system has run the install, so no tree was measured"}
    windows/amd64: {unmeasured: "no session of that system has run the install, so no tree was measured"}

# The plugins the generated-presets member installs the way a user does:
# each is a bundle a release of birdtable/gragas-plugins tagged,
# added to this tree by gragas plugin add from that tag's commit, so
# plugins/lock.yaml holds it and plugins/<name>/<version>/ is its folder. A pin
# is the release's tag, the tag's object and commit, and the bundle's digest the
# tag's message records, which is the digest the lock holds. The digest is what
# is enforced; the tag, object and commit are the record a person checks it
# against in gragas-plugins, and are read for their shape only. The member preset-plugins (gragas-dev
# preset-plugins) holds the lock to these pins, approves each plugin by its
# pinned digest in a state folder it makes for its run and never the
# account's, and runs gragas preset --check through them; a plugin missing, a
# lock digest that is not its pin, and a bundle whose files are not that digest
# are each red. To bump a plugin, read its new tag's record in gragas-plugins'
# RELEASES, gragas plugin add the bundle from the tag's commit, and change its
# line here.
plugins:
  golangci-lint@1.0.1: {tag: golangci-lint/v1.0.1, object: 8adf8bd03e4d2d4be7f29ee44af2a8869b693ee8, commit: bf6ce7a3d3e9f21c6ab7dc4af60eaa4e5e76a69e, digest: "sha256:6a11c13105016f4ae034373c8d379a582d4bec94b3d3044a2484d930a0d1f923"}
  ast-grep@1.1.0: {tag: ast-grep/v1.1.0, object: 1b422d7d6b35ca52a9bd0284bb0e00d472211bc0, commit: bf6ce7a3d3e9f21c6ab7dc4af60eaa4e5e76a69e, digest: "sha256:c1eef2baae51c0db88d04b17280dbd312b439dd709e31dc268c85c9277079558"}
  eslint@1.0.0: {tag: eslint/v1.0.0, object: ec7cb941db11199d08a87e3bc67dd36a7bba90aa, commit: bf6ce7a3d3e9f21c6ab7dc4af60eaa4e5e76a69e, digest: "sha256:6f8e3468308b64fa7410875d173ef09f491fe09d66e222bed4ae84c419922627"}
  tsc@1.0.0: {tag: tsc/v1.0.0, object: 6884b7c916e6779da7bbce71eb6e15873404ec8c, commit: bf6ce7a3d3e9f21c6ab7dc4af60eaa4e5e76a69e, digest: "sha256:86e424e3236bc6e5c27ad0247986bcaf3f25484c490e791994e1fc56eca4300f"}
