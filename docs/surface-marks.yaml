# The stability marks of the public surface and the reason for each, written by
# hand. docs/surface.md is generated from the code and this file by
# `gragas-dev surface` (task gen) and is never edited.
#
# A name this file does not list is experimental: a new export starts there.
# To mark one stable or internal, add a row with the reason (at least three
# words), then add a step to changes: for the change. `task generated-files` fails
# until the record holds the listing, saying the step to add, and fails on a row
# for a name the code does not export.
#
# marks:
#   - {package: internal/port, name: Clock, mark: stable, reason: "the port is held to its contract from the first release"}
marks: []

# Newest last. The record moved to sums at its base line.
#
# The base is the listing's sum when the record moved: each export's SHA-256
# added as a number, modulo 2^256 (docs/surface.md, "Listing sum"). It is
# written once and never edited: the landing check refuses a head whose base
# line is not main's, number and reason, so no change is folded into it.
#
# Each line after the base is a step: the listing's sum after one change less
# its sum before, modulo 2^256, with the reason for the change. The record
# holds the listing when the base and the steps add up to its sum. Two changes
# made apart each bring their own step, in either order, and git merges the two
# appends with no conflict (merge=union in .gitattributes). A revert takes its
# step line with it. A step may come twice: an export removed and then added
# back as it was is its step, the removal's, and its step again.
