<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="gragas">
  <title>gragas</title>

  <!--
    A goose feather. Grágás is Icelandic for the greylag goose and for the old Icelandic
    law book, and the feather is the pen that law was written with: gragas writes a
    project's rules into its tools. The leading vane is ink and the trailing vane grey,
    the greylag's two colours, with three splits in the vane. The bare quill end is cut
    short and rounded, with no nib, so it reads as a feather and not a pen; the short ink
    stroke under it is the line it has just written.

    Flat shapes, no gradients, the family's ground, ink, grey and pale: it has to survive
    sixteen pixels in a browser tab, where the splits and the line drop out and the
    two-tone feather carries it. Approved by the operator on 22 Nov 2026 (G5a).
  -->

  <defs>
    <clipPath id="badge">
      <rect x="0" y="0" width="256" height="256" rx="56" ry="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="256" height="256" fill="#C7D0D8"/><g transform="translate(30 222) scale(1.06)">
    <path fill="#161A1F" d="M42 -47 C44 -86 78 -132 160 -172 Q94 -103 42 -47 Z"/>
    <path fill="#6C7681" d="M160 -172 C150 -110 110 -60 48 -36 L42 -47 Q94 -103 160 -172 Z"/>
    <path d="M145 -118 L127 -121 M114 -78 L98 -83 M77 -115 L88 -109" stroke="#C7D0D8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M22 -24 Q32 -35 42 -47" stroke="#161A1F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M42 -47 Q94 -103 152 -164" stroke="#F2F5F8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <path d="M44 218 L120 218" stroke="#161A1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
