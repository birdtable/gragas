# Every key of the tools file, at a value that is not its default.
version: 1
tools:
  golangci-lint@2.15.0: {root}/opt/golangci-lint/2.15.0/golangci-lint
  golangci-lint@2.14.1: {root}/opt/golangci-lint/2.14.1/golangci-lint
  eslint@9.12.0: {root}/home/me/tools/node_modules/.bin/eslint
container:
  runtime: {root}/usr/bin/podman
  image: registry.example/gragas/proof@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
sandbox:
  userns: {root}/usr/bin/bwrap
  macos: {root}/usr/bin/sandbox-exec
