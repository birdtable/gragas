part: service
concern: authz
order: 7
title: Authorisation
summary: >-
  Who may call what is declared on every route in one permission grammar, denied by default including reads,
  held in a catalogue generated from code, and enforced by shared code. Identity comes from the gate, one
  source per socket and never forwarded; a service keeps no login; only the identity owner touches the
  provider; and a change that opens a new door answers a threat question.
rules:
  - id: service.authz.1
    slug: route-declares-caller
    since: 0.1.0
    rule: >-
      Every route declares who may call it and with which permission; a permission follows one grammar of
      three parts (owner.subject.action) written in the casing the program declares, with owner names
      reserved; a machine declares only permissions for subjects it has, so a grant naming an undeclared
      permission is refused; and a route with no entry fails.
    detail: >-
      The declaration names the auth mode and the permission. Each part of a permission is in the program's
      declared casing (service.contract.10); the rulebook names no default. The subject part may come from
      config (a named folder, a named device), and only subjects present on this machine are declared, so no
      grant can name an absent path. An owner name is reserved to the program that owns it. A new subject kind
      is one more entry in the declaration; the grammar does not change. In Go, each daemon route declares its
      allowed callers.
    level: function
    why: >-
      A route with no declaration is open by omission; the gap is invisible until someone calls it. One
      grammar is what makes permissions readable by a stranger in year five, and a grant for a subject the
      machine lacks is a grant that waits for a path to appear.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: ts
        class: preset-config
        tier: "1"
        note: >-
          contract lint failing an operation with no security requirement and no permission extension. Plant:
          an operation with neither fails. Control: a declared operation passes
      - binding: go
        class: test-kit
        tier: "2"
        note: >-
          a route-list test failing a daemon route with no declared callers. Plant: a route with no declared
          callers fails. Control: a declared route passes
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          a test over the permission declaration: every permission has three parts in the declared casing, no
          owner part is another program's reserved name, and a grant naming a permission not declared on this
          machine is refused. Plant: a permission with two parts, a part in a second casing, or a grant for an
          undeclared subject fails. Control: a declared three-part permission and a grant for it pass
    relates:
      - id: service.contract.10
        how: see
    open:
      - >-
        In Go, a per-route declared caller list for daemon routes is a gap with no row yet.
  - id: service.authz.2
    slug: access-catalogue-regenerated
    since: 0.1.0
    rule: >-
      The access catalogue (every route and the permission it needs) is regenerated from code and diffed
      against the committed copy in the gate.
    detail: >-
      The step is regenerate-and-diff. In Go, the command and route tree is generated to a file and compared
      so drift fails; the kit listing is generated per tag and diffed.
    level: release
    why: >-
      A catalogue kept by hand drifts from the routes, and access reviews then read a list that is wrong.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
    sources:
      - ref: service-reasons-stated
        backs: rule
    checks:
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          gate step regenerating the catalogue from the route declarations and failing on a diff with the
          committed file. Plant: a route added without regenerating the catalogue fails. Control: a
          regenerated catalogue passes
  - id: service.authz.3
    slug: identity-never-from-body
    since: 0.1.0
    rule: >-
      The acting identity is never taken from the request body or a verb's input; a system actor names the job
      it runs as; and a bare system actor with no subject fails.
    detail: >-
      The identity comes from the verified credential or the run context only. A write made by the system (a
      scheduled job, a migration, a consumer) records its actor as the system with the job as subject, so
      every change can be traced to what made it. In Go, the caller is known from peer credentials or a
      secret, never from a payload or header.
    level: function
    why: >-
      An identity named in a body is whatever the caller says it is, and a write by an unnamed system actor
      cannot be traced to the job that made it.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: ts
        class: preset-rule
        tool: ast-grep
        tier: "1"
        note: >-
          ast-grep rule failing reads of actor or user identity fields from the validated request body. Plant:
          a handler that reads actor id from the body fails. Control: one reading it from the auth context
          passes
      - binding: go
        class: test-kit
        tier: "2"
        note: >-
          a daemon test that a request with a forged caller field in the body or header is attributed to the
          peer credentials. Plant: a forged caller header accepted fails. Control: the peer credential used
          passes
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          a test over the actor type refusing a system actor with an empty subject, and a schema check that no
          verb input carries an actor field. Plant: a system write recorded with no job as subject fails.
          Control: a system write naming its job passes
  - id: service.authz.4
    slug: server-refuses-what-page-hides
    since: 0.1.0
    rule: Where a door names the visitor, the server refuses what the page hides.
    detail: >-
      A route-list test: the daemon writes the list of routes from its contract (not hand-kept); a shared
      helper requests every route as a visitor with no grant and asserts 401 or 403 (or the designed denial)
      for each gated route; the count of routes tested equals the count in the contract. The page repository
      holds the front-end half.
    level: program
    why: >-
      A control hidden in the page and not checked on the server is a suggestion; anyone can call the route
      directly.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
    unless:
      - kinds:
          - service
        facets:
          - anonymous-visitors
        reason: a door that does not identify a visitor has no hidden control to refuse
    sources:
      - ref: decision-19
        backs: rule
    checks:
      - binding: go
        class: test-kit
        tier: "3"
        note: >-
          a Go route-list test held by the daemon repository: every contract route requested without a grant,
          expecting 401 or 403, count equal to the contract count. Plant: removing the server check on one
          route (the page hides it) fails; a tested route count below the contract count fails. Control: all
          gated routes refusing a visitor passes
      - binding: ts
        class: test-kit
        tier: "3"
        note: >-
          the same route-list helper over the generated contract in a service test. Plant: a gated route
          answering a visitor with no grant fails. Control: a refused route passes
    open:
      - The route-list test is planned, not built.
    note: >-
      Held in Go (daemon tests) and named in the front-end part for the page half. The target programs hold
      the route list.
  - id: service.authz.5
    slug: field-visibility-one-owner
    since: 0.1.0
    rule: Field visibility is applied only through one shared owner module.
    detail: >-
      One shared package performs permission checks, scope enforcement and field filtering, as plain functions
      and as middleware. In Go, redaction and secret handling of output goes through one owner and a secret is
      never printed.
    level: package
    why: >-
      Field filtering written per route is forgotten per route; a field leaks from the route that missed it.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
    sources:
      - ref: service-reasons-stated
        backs: rule
    checks:
      - binding: ts
        class: preset-rule
        tool: ast-grep
        tier: "1"
        note: >-
          import and ast-grep rules limiting the field filter and scope enforcement to the shared
          authorisation package. Plant: a handler that deletes fields by hand to filter output fails. Control:
          the shared filter call passes
      - binding: go
        class: preset-rule
        tier: "1"
        note: >-
          import rule giving one package the redaction function, and a test that a secret is never printed.
          Plant: a secret value printed fails. Control: a redacted value passes
  - id: service.authz.6
    slug: permissions-point-at-live-definitions
    since: 0.1.0
    rule: Permission mappings point only at live (active) definitions.
    detail: >-
      In Go, every reference in a rule or doc resolves and a vocabulary is declared once.
    level: release
    why: A mapping to a retired permission grants nothing or, worse, something else.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
    sources:
      - ref: service-reasons-stated
        backs: rule
    checks:
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          a registry test resolving every permission mapping to a definition with status active. Plant: a
          mapping to a retired permission fails. Control: a mapping to an active one passes
  - id: service.authz.7
    slug: no-handrolled-credential-checks
    since: 0.1.0
    rule: >-
      A service keeps no accounts, passwords or login page of its own and is never an OpenID Connect client;
      no code verifies credentials by hand or calls the identity service on every request; and token signing
      exists only at the identity owner.
    detail: >-
      Identity comes from the gate in front of the service (service.authz.15). A user table with a password
      column, a login route, a session-cookie issuer or an OpenID Connect client library outside the identity
      owner is banned. Token verification code (key sets, signature checks) and symmetric-key signing are
      banned outside the identity owner. In Go, no home-made credential checks outside the one owner, and the
      security linter runs.
    level: package
    why: >-
      A service with its own login is a second identity system to patch forever. Hand-rolled verification is
      where algorithm and expiry mistakes come from, and a per-request call to the identity service makes it a
      point of failure for all traffic.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: ts
        class: preset-rule
        tool: ast-grep
        tier: "1"
        note: >-
          ast-grep rules failing token verification or HS-family signing calls and identity-service HTTP calls
          outside the identity owner package. Plant: a handler that decodes a token by hand fails. Control:
          verification through the shared bootstrap passes
      - binding: go
        class: preset-rule
        tool: golangci-lint
        tier: "1"
        note: >-
          gosec enabled and forbidigo on credential check primitives outside the one owner package. Plant: a
          hand-written token check outside the owner fails. Control: the owner package passes
      - binding: any
        class: preset-rule
        tier: "1"
        note: >-
          a dependency ban on OpenID Connect client and password-hashing libraries, and a route lint refusing
          a login route, outside the identity owner. Plant: a service that adds a login route and a password
          hash fails. Control: a service that reads identity from the gate passes
    relates:
      - id: service.authz.15
        how: see
  - id: service.authz.8
    slug: catalogue-conformance-fails-closed
    since: 0.1.0
    rule: >-
      The access catalogue passes one shared conformance test, and a request no source vouches for is refused
      on every route, reads and static files included, with no guest answer; a service without a catalogue
      refuses everything.
    detail: >-
      Deny by default covers reads as well as writes: a GET, a list, a health detail beyond liveness, and a
      served folder are refused without an identity. The refusal is 403 with no hint of what exists. Only
      routes the catalogue marks public, each with a written reason and never a writing route, answer without
      an identity. In Go, a shared check fails closed when a required declaration is missing.
    level: program
    why: >-
      A missing catalogue that is read as nothing to check turns every route into an open one, and an open
      read is how a system leaks what it would refuse to change.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          v1 class shared-code. shared conformance test run in every service and daemon, sending a request
          with no identity to every route and static path in the catalogue and asserting a refusal unless the
          route is marked public with a reason. Plant: a read route or a static file served to a request with
          no identity fails, and a catalogue-less service that serves any route fails. Control: a service with
          a conforming catalogue passes
  - id: service.authz.9
    slug: only-identity-owner-touches-provider
    since: 0.1.0
    rule: Only the identity owner touches the identity provider.
    detail: In Go, only one package touches an external identity or credential store.
    level: package
    why: >-
      Every service that talks to the identity provider can change its users and credentials.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
    sources:
      - ref: service-reasons-stated
        backs: rule
    checks:
      - binding: ts
        class: preset-rule
        tier: "1"
        note: >-
          import-restriction rule allowing the identity provider SDK in the identity owner package only.
          Plant: a service importing the identity provider SDK fails. Control: the owner package passes
      - binding: go
        class: preset-rule
        tool: golangci-lint
        tier: "1"
        note: >-
          depguard rule limiting the credential store package to the one owner. Plant: a second package
          opening the credential store fails. Control: the owner passes
  - id: service.authz.10
    slug: identity-provider-settings-pinned
    since: 0.1.0
    rule: >-
      The identity provider drift-prone settings are pinned in code: app clients set their auth flows
      explicitly and the user pool keeps its schema attributes ignored on change.
    level: deploy
    why: >-
      Provider settings that the console or the provider edits drift, and the next deploy either reverts them
      or breaks sign-in.
    kind: rule
    strength: Hard
    status: proposed
    when:
      kinds:
        - service
    checks:
      - binding: ts
        class: preset-rule
        tool: ast-grep
        tier: "1"
        note: >-
          ast-grep rules over the infrastructure code: every app client sets ExplicitAuthFlows and the user
          pool carries ignoreChanges: ['schemas']. Plant: an app client with no explicit auth flows fails; a
          pool without the ignore entry fails. Control: both present passes
    open:
      - "Proposed for lack of a source (decision 47); the v1 evidence was: practice"
  - id: service.authz.11
    slug: cors-allow-list-safe
    since: 0.1.0
    rule: >-
      The cross-origin allow-list builder cannot emit a wildcard origin or a privileged header.
    detail: >-
      In Go, a daemon that serves a page is reachable only by expected callers, loopback or socket.
    level: function
    why: >-
      A wildcard origin or a privileged header in the allow list lets any site act as the caller.
    kind: rule
    strength: Hard
    status: proposed
    when:
      kinds:
        - service
    checks:
      - binding: ts
        class: test-kit
        tool: ast-grep
        tier: "1"
        note: >-
          a unit test and ast-grep rule over the allow-list builder: it rejects the wildcard origin and the
          privileged header names. Plant: a builder call that produces origin star or the privileged header in
          allow-headers fails. Control: an explicit origin list passes
      - binding: go
        class: test-kit
        tier: "2"
        note: >-
          a daemon test that a cross-site request is refused and only expected hosts are answered. Plant: a
          request from an unexpected host answered fails. Control: an expected host passes
    open:
      - "Proposed for lack of a source (decision 47); the v1 evidence was: practice"
  - id: service.authz.12
    slug: boundary-change-threat-question
    since: 0.1.0
    rule: >-
      A change that adds a route, a caller class, an internal-plane grant or an outbound target answers three
      questions in the change: what is newly reachable, by whom, and what would an attacker try first.
    detail: >-
      It applies at boundary changes only. The paths on the gate-config list (infrastructure and IAM,
      migrations, gate config, shared packages) are a ready trigger.
    level: process
    why: >-
      A route can declare its permission correctly and still make an internal path reachable from a new public
      one. Argued, not measured: a short question list per story in place of a full threat model, because a
      full model per story is too heavy to keep up. No case from the reference estate.
    kind: instruction
    strength: Review
    status: active
    when:
      kinds:
        - service
    sources:
      - ref: tarandach-coles-threat-modeling
        where: ch. 5 (continuous threat modeling, the leading-questions table)
        backs: rule
    review_question: >-
      What is newly reachable through this change, by whom, and what would an attacker try first?
    open:
      - >-
        No plant as a gate: a seeded diff that grants an internal-plane invoke to a public route must be
        flagged by the reviewer lens.
      - >-
        An agent answers in seconds and can invent the answer, so on sensitive paths the answer needs a reader
        (inference).
    note: >-
      Beyond route-declares-caller, which only guarantees a new route is not unguarded; it does not ask
      whether the new door opens something nobody considered.
  - id: service.authz.13
    slug: issued-tokens-hashed
    since: 0.1.0
    rule: >-
      A token a program issues is stored only as a hash and shown once, and a secret that must be kept as a
      row is encrypted under a key that comes from the environment, never from the same store.
    detail: >-
      The plain token is returned once at issue and never again; lookup is by hash. A secret the program must
      use later (a connector's key) is encrypted before it is written, and the key is read from the
      environment or a key file named by path, so a copy of the store alone reveals nothing. A new kind of
      secret takes the same path.
    level: function
    why: >-
      A token readable from a database dump is a live credential in every backup; hashing and encryption close
      that leak in every program that holds one.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          a store test that issues a token and a secret, reads the raw rows and asserts the token's plain
          value and the secret's plain value are absent, and that a second read of the token returns nothing.
          Plant: a token stored in plain text fails, and a secret row readable without the key fails. Control:
          a hashed token and an encrypted secret pass
    relates:
      - id: cli.config.4
        how: see
      - id: supply.secrets.2
        how: see
    note: >-
      cli.config.4 and supply.secrets.2 hold secret references and file modes; this rule covers secrets at
      rest in a store.
  - id: service.authz.14
    slug: reads-filtered-to-the-asker
    since: 0.1.0
    rule: >-
      A list read returns only the items the caller may read, an empty list when there are none; a single item
      the caller may not read answers as not found; and a writing route whose answer reveals state also
      requires the read permission for that state, with a refusal that reveals nothing.
    detail: >-
      A list is never refused with 403 for holding items the caller may not see; it is cut. An item the caller
      may not read is not said to exist. An action needs the read permission as well as the act permission;
      act without read gets the bare refusal with no detail.
    level: function
    why: >-
      A 403 on one item tells the caller it exists, and an action answer that carries state leaks what the
      read permission would have hidden.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          a shared authorisation test that calls every list, item and writing route as a caller holding only
          part of the permissions, and asserts filtered lists, not found for hidden items, and a bare refusal
          for act without read. Plant: a list that returns 403 for a partly hidden set fails, and an item
          route that answers 403 for an item the caller may not read fails. Control: a filtered list and a
          not-found answer pass
  - id: service.authz.15
    slug: one-identity-source-per-socket
    since: 0.1.0
    rule: >-
      An identity source gives a person and role names only, never permissions; there is one source per
      server, believed only on its own socket and on no other listener; each program maps roles to its own
      permissions in its own file; a request carrying an identity header twice is refused; and a program never
      forwards identity or permissions to another tool or keeps another tool's catalogue.
    detail: >-
      A source is pluggable (the private network's login, a trusted proxy's headers, a local fallback file); a
      new source is one adapter. Identity headers from a proxy are believed only on the socket that proxy
      reaches. A duplicated identity header answers 400. Each tool reads the gate itself, so each decision has
      one home.
    level: program
    why: >-
      A forwarded permission is a decision with two homes, and a header believed on any listener can be set by
      anyone who reaches another one.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          a door test that sends a proxy identity header to a listener of another source and asserts it is
          ignored, sends the header twice and asserts 400, and a test that the role map lives in the program's
          own file; a code search refusing an outbound request that carries identity or permission headers.
          Plant: a proxy header believed on the local socket fails, and a request with two identity headers
          that is admitted fails. Control: a header believed only on its own socket passes
  - id: service.authz.16
    slug: person-only-acts-and-access-history
    since: 0.1.0
    rule: >-
      Acts reserved to a person are an explicit list granted to no agent or system actor, pinned by a test,
      and every change to who may do what appends who, when, the command, the reason and the lines changed to
      a history only the privileged writer can write.
    detail: >-
      The person-only list names permissions in the program's grammar (service.authz.1). A grant of a listed
      permission to an agent or system actor is refused at write time and at load. The permissions file is
      written whole by one command under a lock with a revision; the history is append-only and owned by the
      privileged account (root on a machine, the identity owner in a service). A new act joins the list by one
      entry.
    level: program
    why: >-
      In an estate where agents hold tokens, the person-only list is the rule that matters most, and a
      permission change no one can trace cannot be reviewed.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          a test pinning the person-only list and refusing a grant of any item to an agent or system actor; a
          test that a permission change appends a history entry with who, when, command, reason and diff, and
          that the history file is append-only and owned by the privileged account. Plant: a grant of a
          person-only act to an agent fails, and a permission change with no history entry fails. Control: a
          person-only act granted to a person, with a history entry, passes
    relates:
      - id: service.authz.1
        how: see
