part: service
concern: errors
order: 9
title: Errors
summary: >-
  Errors are handled, never swallowed. Each service has one closed list of error codes, listed in its
  contract; every error carries a request id, and the message is for developers only.
rules:
  - id: service.errors.1
    slug: no-swallowed-errors
    since: 0.1.0
    rule: No empty catch and no catch that returns a default.
    detail: In Go, every error is handled or returned and nothing is swallowed.
    level: function
    why: >-
      A swallowed error turns a failure into missing data that surfaces far from its cause.
    kind: rule
    strength: Hard
    status: proposed
    when:
      kinds:
        - service
    checks:
      - binding: ts
        class: preset-rule
        tool: eslint
        tier: "1"
        note: >-
          ESLint no-empty and an ast-grep rule failing a catch block that returns a literal or a default
          value. Plant: an empty catch fails; a catch returning an empty list fails. Control: a catch that
          rethrows or maps the error passes
      - binding: go
        class: preset-rule
        tier: "1"
        note: >-
          errcheck and a rule failing a discarded error. Plant: an ignored error return fails. Control: a
          handled error passes
    open:
      - "Proposed for lack of a source (decision 47); the v1 evidence was: practice"
    note: >-
      Beyond goal-already-holds-is-success in the contract concern, whose count of catch-and-continue handlers
      signals swallowing dressed as ensure.
  - id: service.errors.2
    slug: error-code-closed-list
    since: 0.1.0
    rule: >-
      An error code is a value from the program's own closed typed list, written in the casing the program
      declares (service.contract.10), and a code is never reused for a new meaning.
    detail: >-
      The rulebook names no default casing: the code list is linted against the program's one declared casing,
      and a program with no declaration fails. In Go, exit codes are one tested table and typed errors are a
      closed set.
    level: type
    why: >-
      A code that changes meaning breaks every caller that branches on it, and a code in a second casing is a
      second vocabulary for one reader to learn.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: ts
        class: test-kit
        tier: "2"
        note: >-
          a typed code list and a test failing any thrown code not in the list, plus a diff of the committed
          list against the last release that fails on a changed meaning. Plant: a thrown string not in the
          list fails. Control: a listed code passes
      - binding: go
        class: test-kit
        tier: "2"
        note: >-
          exit codes held in one tested table and a test over the typed error set. Plant: an exit code outside
          the table fails. Control: a table code passes
      - binding: any
        class: preset-config
        tier: "1"
        note: >-
          the casing lint of service.contract.10 run over the error-code enum in the generated contract.
          Plant: an error code in a casing other than the declared one fails. Control: codes in the declared
          casing pass
    relates:
      - id: service.contract.10
        how: see
  - id: service.errors.3
    slug: message-is-developer-diagnostic
    since: 0.1.0
    rule: >-
      An error message is a developer diagnostic and is never shown to users; users see a text chosen from the
      code.
    level: function
    why: A raw message leaks internals and changes with every refactor.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
    sources:
      - ref: service-reasons-stated
        backs: rule
    checks:
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          contract tests asserting the user-facing text is mapped from the code and the message field is
          absent from the public error body. Plant: a public error body that carries the exception message
          fails. Control: a body with only code and request id passes
    note: >-
      In the front end a machine code is separate from its sentence in a closed documented set.
  - id: service.errors.4
    slug: contract-lists-error-codes
    since: 0.1.0
    rule: >-
      Each contract lists its error codes as one enum, referenced by every error response; an error is always
      a non-2xx status with the JSON error body, including errors raised before the handler runs or by a proxy
      in front of it; and a 2xx never carries an error.
    detail: >-
      Errors raised before the handler include a filtered request and a gateway 401 or 403; a proxy in front
      of the program is configured to answer with the same JSON body, never an empty 502 or an HTML page. A
      200 with an error field, an error flag or an error sentence inside is a defect. In Go, the exit-code
      table and the command tree list every code and are compared.
    level: file
    why: >-
      A code the contract does not list cannot be handled by a generated client, and platform codes are the
      ones nobody remembers. A reader that has to look inside a 200 for an error is a reader that guesses, and
      one that guesses breaks.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - service
        - daemon
    sources:
      - ref: decision-65-service
        backs: rule
    checks:
      - binding: any
        class: preset-config
        tool: spectral
        tier: "1"
        note: >-
          Spectral rule failing an error response whose body does not reference the shared error-code enum,
          and a test that the enum covers the platform codes. Plant: an error response with a free-text code
          fails. Control: a response referencing the enum passes
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          a contract test that drives each error path, a request refused before the handler and a request
          through the proxy to a stopped program, and asserts a non-2xx status with the JSON error body; a
          lint refusing an error field in any 2xx schema. Plant: a 200 answer with an error field fails, and a
          proxy that answers an empty 502 fails. Control: a 4xx or 5xx with the JSON error body passes
    open:
      - >-
        v1 evidence, not yet a source: practice; target: a design record of one program (every error is a
        non-2xx status with a JSON error body, a 200 with an error inside or a proxy's empty 502 is a defect)
  - id: service.errors.5
    slug: error-carries-request-id
    since: 0.1.0
    rule: >-
      Every error carries a request id a user can quote, from the handler and from the gateway.
    detail: In Go, every log line carries a run id and errors name the next step.
    level: function
    why: A user reporting an error with no id leaves support to search by time and guess.
    kind: rule
    strength: Hard
    status: proposed
    when:
      kinds:
        - service
    checks:
      - binding: any
        class: test-kit
        tier: "2"
        note: >-
          an end-to-end test requesting a failing route and a gateway-refused route, asserting the error body
          and header carry a request id that appears in the logs. Plant: a gateway refusal with no request id
          fails. Control: an error with an id found in the logs passes
    open:
      - >-
        In Go, the error shown to a person carrying a quotable run or request id is a gap with no row yet.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: practice"
