part: web
concern: delivery
order: 12
title: Delivery, review and supply
summary: >-
  What goes with a UI change to review, what runs at land, and how a built page is embedded, configured and
  watched once deployed.
rules:
  - id: web.delivery.1
    slug: change-carries-pictures
    since: 0.1.0
    rule: >-
      A change that alters what a person sees carries pictures of it at phone, tablet and desktop sizes (for
      example 390, 1024 and 1440 px) in light and dark, with links to the stories, and a done claim names its
      question.
    detail: >-
      The screenshot matrix of viewports and schemes is generated by the land gate, not typed into the change
      description; land refuses a UI change with no pictures.
    level: process
    why: v1 gave no reason beyond its evidence grade, Evidence D.
    kind: rule
    strength: Record
    status: proposed
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class record. a land check on the change description and its generated screenshot matrix. Plant:
          a UI change with no pictures is refused at land. Control: a change with the matrix attached passes
    review_question: >-
      Does this change show the screen at phone, tablet and desktop, light and dark, and does the done claim
      name the question it answers?
    open:
      - >-
        The gated version lives in the picture-matrix rows of the testing concern; this rule asks the change
        to show it.
      - >-
        Held as Record: the source verdict is a best practice, so it binds when promoted.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: D"
  - id: web.delivery.2
    slug: browser-checks-at-land
    since: 0.1.0
    rule: >-
      The browser checks that find UI faults run at land for what the change can reach, not only by hand.
    detail: >-
      The land step reads the plan: a change touching a web path whose plan has no browser step fails. The
      picker is the reach map of the affected-gates rules; one site's habit of running its changed-journeys
      target is lifted into the land command.
    level: process
    why: >-
      No fault in one site's record was found by its normal check; another site runs its verify target before
      a merge, unproven as a refusal.
    kind: rule
    strength: Hard
    status: proposed
    checks:
      - binding: ts
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class our-cli. the land command reads the plan and requires a browser step for a change touching
          a page source. Plant: a change touching a page source with the browser step removed from the plan
          fails. Control: a plan with the browser step passes
    open:
      - >-
        Proposed for lack of a source (decision 47); the v1 evidence was: A: no fault in one site's record was
        found by its normal check
  - id: web.delivery.3
    slug: agent-looks-at-its-page
    since: 0.1.0
    rule: The building agent renders and looks at its own page before asking for review.
    level: process
    why: >-
      21 of 72 faults in one site were found by the builder; the site's own check ends by saying to open the
      page.
    kind: rule
    strength: Session
    status: proposed
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: R
        note: >-
          v1 class record. the session reader of the agent's own session record checks that a screenshot was
          opened before review was requested. Plant: a session that asks for review with no screenshot opened
          is flagged. Control: a session that opened a screenshot first passes
    review_question: Did the agent open a screenshot of the page before asking for review?
    open:
      - >-
        Looking cannot be measured; the artefact-presence rule holds the files. A stop hook demanding a
        screenshot is Claude-only and proves no looking.
      - The check is not built.
      - >-
        Proposed for lack of a source (decision 47); the v1 evidence was: A: 21 of 72 found by the builder
  - id: web.delivery.4
    slug: design-rubric
    since: 0.1.0
    rule: >-
      Taste, hierarchy, tone and brand fit are judged against a written design rubric, hierarchy test first;
      an agent lens reads every surface, and a canvas screen that is exempt is judged by its own rubric.
    detail: >-
      Hierarchy test: one primary action, emphasis by taking away from what is secondary, labels only when
      needed, and no page that wraps itself in what the shell already gives. The rubric lens verdict is stored
      like the other lens verdicts.
    level: file
    why: >-
      Faults found by the rubric in two sites (a recorded issue and a case). The rubric's content is
      provisional, because the book it draws on was read only in outline.
    kind: rule
    strength: Lens
    status: active
    sources:
      - ref: refactoring-ui
        where: outline only
        backs: rule
    checks: []
    review_question: >-
      Which single thing on this screen is the primary action, and what was de-emphasised to make it so?
    open:
      - The rubric's content is provisional (read in outline).
      - >-
        The reference's rubric is the platform guidelines' rubric; a canvas screen is exempt and has its own
        rubric. No rubric gate exists as a catalogue row.
      - Lens verdicts bind once promoted.
      - "v1 evidence, not yet a source: A: two sites"
    note: >-
      v1 review check (review is not a v2 check class): the rubric lens, an agent reading every surface
      against the written rubric, with its verdict stored like the other lens verdicts
  - id: web.delivery.5
    slug: new-surface-signed-off
    since: 0.1.0
    rule: >-
      The operator signs a sample of surfaces plus every new surface, with a stored record.
    detail: >-
      New routes need a sign-off record entry; the check compares the route list with the sign-off file. Taste
      and hierarchy are judgement; only the presence of the sign-off is mechanical.
    level: process
    why: "Decision 33: the person looks at what the lens only flags."
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: decision-33
        backs: rule
    checks:
      - binding: ts
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class our-cli. a route-list diff against the sign-off file in the land check. Plant: a new route
          page with no sign-off entry is refused. Control: a route with an entry passes
    review_question: Did the operator see this surface, or is it in the sampled set?
    open:
      - "Half holds: presence of sign-off; taste is judged."
      - "v1 evidence, not yet a source: A: two sites"
    note: >-
      Split from the design-rubric criterion, which bundled the rubric lens and the operator's signature.
  - id: web.delivery.6
    slug: per-person-state-local
    since: 0.1.0
    rule: Per-person state is private on a shared device.
    level: program
    why: Three recorded cases in one site where one person's state showed to the next.
    kind: rule
    strength: Lens
    status: proposed
    checks: []
    review_question: >-
      Is any per-person state here stored where the next person on the same device would see it?
    open:
      - >-
        A lint on storage keys would catch only the common pattern; a model lens reads the rest. Lens verdicts
        bind once promoted.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: A: three cases"
    note: >-
      v1 review check (review is not a v2 check class): a lint on storage keys for the common pattern and a
      model lens question for the rest
  - id: web.delivery.7
    slug: build-output-static
    since: 0.1.0
    rule: The web build output is static files where a daemon embeds it.
    detail: >-
      After the build a test asserts the output folder has no server entry, and the Go side's embed directive
      fails to compile when the directory is empty or absent.
    level: deploy
    why: >-
      Held in two sites; an adapter emitting a server entry would make the embed a lie.
    kind: rule
    strength: Hard
    status: proposed
    unless:
      - kinds:
          - static-data
        reason: >-
          No daemon embeds the page: the engine embeds the built app and writes it out as files.
    checks:
      - binding: ts
        class: test-kit
        tier: "3"
        note: >-
          a test after the build asserts no server entry, and the Go embed directive fails on an empty
          directory. Plant: a build with an adapter emitting a server folder fails. Control: the static build
          passes
    open:
      - "Proposed for lack of a source (decision 47); the v1 evidence was: C"
  - id: web.delivery.8
    slug: typed-env-schema
    since: 0.1.0
    rule: >-
      A variable a page reads is declared in a typed environment schema, secrets are reachable only on the
      server, only public-prefixed names reach the bundle, and a service base URL comes from one descriptor
      that throws when unset, never a hard-coded URL or fallback.
    detail: >-
      ESLint `no-restricted-syntax` on environment access (`import.meta.env`) outside the one schema module,
      with the framework's own schema as the framework side; a bundler exposes only the public prefix. An
      endpoint address is read from the typed schema, never hard-coded. The schema module and the public
      prefix are per framework: the template-stack form uses the framework's own environment schema, and the
      component-stack form (its bundler's public prefix) is react.config.1.
    level: file
    why: And D; the outcome scan on the built output is the no-secret rule.
    kind: rule
    strength: Hard
    status: proposed
    checks:
      - binding: ts
        class: preset-rule
        tool: eslint
        tier: "0"
        note: >-
          ESLint `no-restricted-syntax` on environment member access outside the schema module, with the
          framework's schema configured. Plant: reading a secret from the environment object in a component
          fails. Control: an environment read through the schema passes
    relates:
      - id: react.config.1
        how: see
    open:
      - >-
        The two source rows were twins for two frameworks (a template-stack form and a component-stack form);
        the second was moved to react.config.1 at the cross-part move.
      - Same pattern as the one-network-module rule.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: C and D"
      - "v1 reference, not yet a source: framework environment-variable guides"
  - id: web.delivery.9
    slug: no-secret-in-bundle
    since: 0.1.0
    rule: >-
      No secret reaches the bundle, and no secret sits in an environment file that the bundler inlines into
      the build.
    detail: >-
      gitleaks runs on the built output with redaction at land and release; findings are reported by rule and
      line only, never by value. An empty variable-prefix setting inlines every key into the bundle, so the
      rule also bans secrets in the stage environment files. A source-tree secret scan covers source. The
      plant fires `aws-access-token`; allow-lists must not use documented example strings.
    level: deploy
    why: >-
      The documented AWS example key did not fire (the tool allows words like EXAMPLE), so plants must not use
      documented example strings. A minified single-line bundle was found. Entropy-only secrets without a
      known prefix may escape.
    kind: rule
    strength: Hard
    status: proposed
    checks:
      - binding: any
        class: preset-config
        tool: gitleaks
        tier: "3"
        note: >-
          gitleaks 8.30 `dir` on the built output with `--redact` at land and release; the other secret
          scanner was rejected for its licence (AGPL-3.0). Plant: a 20-character key-shaped token in a
          one-line minified bundle fires the access-token rule with file and line; the control is a clean
          build. Control: a clean built output exits 0
    open:
      - Entropy-only secrets without a known prefix may escape.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: D"
  - id: web.delivery.10
    slug: embedded-cache-headers
    since: 0.1.0
    rule: >-
      The built page is embedded, hashed files are immutable and the HTML entry revalidates.
    detail: >-
      A test in the shared helper asserts `Cache-Control: immutable` on hashed files and revalidation on the
      HTML entry; one site's web test is the lift.
    level: deploy
    why: Held in one site.
    kind: rule
    strength: Hard
    status: proposed
    unless:
      - kinds:
          - static-data
        reason: >-
          No daemon embeds the page: the engine embeds the built app and writes it out as files.
    checks:
      - binding: go
        class: test-kit
        tier: "3"
        note: >-
          the shared helper's test of cache headers for hashed assets and the entry file. Plant: no-cache on a
          hashed asset fails. Control: immutable on hashed files and revalidation on the entry pass
    open:
      - "Proposed for lack of a source (decision 47); the v1 evidence was: C"
  - id: web.delivery.11
    slug: deployed-page-has-a-listener
    since: 0.1.0
    rule: >-
      A deployed page has someone listening: a health poll on its real address notifies a person when it
      fails, and failures per release are reported; staged rollout is not required.
    level: deploy
    why: >-
      The page shows a stale state when the server is down; this row is who hears. A page embedded in a daemon
      rests on the daemon's health.
    kind: rule
    strength: Record
    status: active
    unless:
      - kinds:
          - static-data
        reason: >-
          The page has no address of its own, so nothing is listening for it: whoever hosts a copy owns its poll.
    sources:
      - ref: p-04-systems-and-delivery
        where: section 20
        backs: rule
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: R
        note: >-
          v1 class record. the release step checks that a monitor entry (health URL) exists for the deployed
          page; a scripted failure proves the notification. Plant: a stopped server must produce one
          notification. Control: a monitored page passes
    review_question: Who is notified when this page's health poll fails?
    open:
      - Notification is run-time operations; only the entry is checkable.
      - "Held as Record: the source verdict is a best practice."
