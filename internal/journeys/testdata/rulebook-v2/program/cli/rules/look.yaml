part: cli
concern: look
order: 7
title: The shared terminal look
summary: >-
  Every CLI takes its look from one module by version and exactly one module imports the terminal library.
  Colours come from one token file and are contrast-tested, sizes and escapes appear nowhere else, closing
  words and the dry-run footer are built by constructors, and components have goldens at three widths.
rules:
  - id: cli.look.1
    slug: one-look-module
    since: 0.1.0
    rule: >-
      Every CLI that ships to users, in whatever language it is written, takes its look from one shared module
      by version; exactly one module of the program writes to the terminal or reads from it; and a program
      holds no copy of a module file.
    detail: >-
      The rule binds the programs that ship to users: a program a user installs and runs. A tool that only the
      repo's own gate or build runs is not bound, and none is named here. The seam is the same in every
      language: one render module is the CLI's only writer to stdout and stderr and its only reader of the
      terminal (raw mode, size, stdin as a terminal). Go: a depguard rule allows only the shared terminal
      module (and a program's cli/ui package that wraps it) to import x/term, go-isatty, fatih/color and termenv; the
      Charm libraries are not banned: the shared module owns its prebuilt components, and a product may
      import Charm directly and build its own, so the rule asks for one look, not for one importer of Charm; a
      repo-check lists which packages hold which adapters; a repo-check test compares every program file with
      the module's file list at the version in go.mod and fails on the same name at 0.8 similarity or more.
      TypeScript: an import rule allows the terminal and process-stdout modules only in the render module.
    level: program
    why: >-
      Own measure; held in one repo with a plant, planned for the others. The rule describes a seam, not a
      library, so it holds the same in TypeScript. depguard is GPL-3.0 and runs inside golangci-lint as a
      tool, so there is no linking concern.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - cli
    sources:
      - ref: decision-65-cli
        backs: rule
    checks:
      - binding: go
        class: preset-rule
        tool: golangci-lint
        key: depguard
        tier: "1"
        fix: never
        note: >-
          depguard rule owner-ui in golangci-lint 2.14.0 over x/term, go-isatty, fatih/color and termenv, an adapters
          repo-check (repocheck.Adapters, held in one repo with a plant), and a similarity test against the
          module's file list. Plant: importing x/term in a command package fails
          depguard, and a copy of a module file in a program fails the similarity test. Control: the module's
          own import passes
      - binding: ts
        class: preset-rule
        tier: "1"
        note: >-
          an import restriction allowing process.stdout writes and terminal modules only in the render module.
          Plant: process.stdout.write in a verb module fails. Control: the same call in the render module
          passes
    open:
      - The architecture part holds the import-boundary side of the same check.
  - id: cli.look.2
    slug: one-token-file
    since: 0.1.0
    rule: >-
      One token file is the source of every terminal colour, and every text colour is contrast-tested.
    detail: The contrast test is contrast_test.go, generated from the token list.
    level: type
    why: >-
      The contrast test is held in the module and all four copies but covers 4 of 9 colours, so a colour can
      be added with no contrast entry.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - cli
    sources:
      - ref: cli-reasons-stated
        backs: rule
    checks:
      - binding: go
        class: test-kit
        tier: "1"
        note: >-
          tokens package generating the colour constants and the contrast test from one list, and an AST walk
          asserting every colour constant appears in the generated contrast table. Plant: adding a colour
          constant with no contrast entry fails. Control: the generated table covers all nine
    open:
      - Shares its engine with the web contrast test.
  - id: cli.look.3
    slug: counts-and-sizes-by-helper
    since: 0.1.0
    rule: Counts and sizes go through the shared module's helpers.
    detail: >-
      The module helpers are Count and Bytes, replacing literals such as %d/%d, %d B, %.1f GB and %d%%.
    level: function
    why: Hand-typed count and size formats drift; planned scan.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - cli
    sources:
      - ref: cli-reasons-stated
        backs: rule
    checks:
      - binding: go
        class: test-kit
        tier: "1"
        note: >-
          go/parser test flagging format literals such as %d/%d, %d B, %.1f GB and %d%% outside the module.
          Plant: fmt.Sprintf("%d/%d", a, b) in a program fails. Control: ui.Count(a, b) passes
  - id: cli.look.4
    slug: no-colour-or-escape-literal
    since: 0.1.0
    rule: >-
      No colour literal or escape string outside the shared module, and no size or spacing literal in Go
      outside the generated file.
    detail: >-
      An AST test over string literals fails on any ESC byte in the three spellings or a hex colour literal
      outside the module and the generated file; forbidigo bans the style-constructor calls that take a raw
      size or spacing (padding, margin, width) outside the module. Size and spacing literals are caught only
      through the banned constructors.
    level: type
    why: >-
      The AST test fired on both escape spellings and passed with the escape only in the module. gocritic's
      rule engine did not load rules in three attempts.
    kind: rule
    strength: Hard
    status: proposed
    when:
      kinds:
        - cli
    checks:
      - binding: go
        class: test-kit
        tool: golangci-lint
        tier: "1"
        note: >-
          go/parser test over basic literals plus forbidigo on the style constructors The AST test inspects
          *ast.BasicLit strings for the spellings \x1b, \033 and \u001b and for hex colour literals outside
          the shared terminal module and the generated file (app/ fails, ui/ passes); forbidigo bans the
          constructors Padding(, Margin( and Width( outside the module. Plant: the escape strings "\x1b[31m"
          and "\033[1m" in the app folder fail. Control: the same inside the module passes
    open:
      - >-
        gocritic ruleguard did not load rules in three attempts, so the AST test is used instead.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: C"
  - id: cli.look.5
    slug: closing-words-closed-set
    since: 0.1.0
    rule: >-
      The closing words are a closed set of eight (done, findings, failed, usage, busy, not ready, refused,
      declined), built with their next line by constructors only.
    level: word
    why: Constructors only make the closed set a compile fact.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - cli
    sources:
      - ref: cli-reasons-stated
        backs: rule
    checks:
      - binding: go
        class: preset-rule
        tool: golangci-lint
        tier: "1"
        note: >-
          forbidigo on the ending struct literal outside the module (verified: it flags the composite
          literal); stronger, unexported fields so a literal does not compile forbidigo pattern ^ui\.Ending$
          outside the shared terminal module (it flagged a ui.Ending{...} composite literal in the trial).
          Plant: ui.Ending{Word: "done"} in a program fails. Control: ui.Done(next) passes
  - id: cli.look.6
    slug: dry-run-footer
    since: 0.1.0
    rule: A dry run ends with one footer naming the flag, then the ending.
    detail: >-
      The AST helper flags the literal "dry run." and the old footer forms outside the module (18 sites); one
      footer function writes the footer with the flag name and the ending. The function does not exist yet
      (fix A5).
    level: word
    why: >-
      Hand-typed footers drift; related to the command rule that a dry run ends by naming the apply command
      (cli.commands.1).
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - cli
    sources:
      - ref: cli-reasons-stated
        backs: rule
    checks:
      - binding: go
        class: test-kit
        tier: "1"
        note: >-
          the same AST helper as cli.look.4 over footer literals The footer function is ui.DryRunFooter(flag),
          which writes the flag name and then the ending. Plant: a hand-typed "dry run." line in a command
          fails. Control: the shared footer function passes
    relates:
      - id: cli.commands.1
        how: see
  - id: cli.look.7
    slug: tables-keep-columns
    since: 0.1.0
    rule: >-
      Tables keep their columns, a long cell wraps, a dropped column is marked, and piped output has no rules.
    level: type
    why: The current table drops and cuts a column at 40 columns (fix A6).
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - cli
    sources:
      - ref: cli-reasons-stated
        backs: rule
    checks:
      - binding: go
        class: test-kit
        tier: "1"
        note: >-
          golden for the table component at widths 80, 60 and 40, plain and role-tagged The golden is
          uitest.Golden. Plant: the current table that drops and cuts a column at 40 fails the golden.
          Control: a wrapping table passes
  - id: cli.look.8
    slug: component-goldens
    since: 0.1.0
    rule: >-
      Each component has plain and role-tagged goldens at three widths, and goldens cannot be rewritten in the
      gate.
    detail: >-
      The update flag refuses to run when the gate variable is set, and golden folders are on the
      protected-path list. A coverage assertion fails a component with only a plain golden.
    level: type
    why: Eleven plain goldens are held; the tagged ones are planned.
    kind: rule
    strength: Hard
    status: proposed
    when:
      kinds:
        - cli
    checks:
      - binding: go
        class: test-kit
        tier: "1"
        note: >-
          golden harness in the shared test package with the update flag refused under the gate variable and a
          per-component coverage assertion The golden harness is uitest.Golden. Plant: running the gate with
          the update flag fails, and a component with only a plain golden fails coverage. Control: a component
          with plain and tagged goldens at three widths passes
    relates:
      - id: tests.generated.5
        how: see
    open:
      - >-
        The same compare-without-writing rule for non-terminal output is tests.generated.5.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: C"
  - id: cli.look.9
    slug: typographic-glyphs
    since: 0.1.0
    rule: Glyphs are typographic, no emoji.
    detail: >-
      The allow-list of typographic runes inside the emoji ranges is short and kept beside the helper.
    level: word
    why: Planned range scan, not run.
    kind: rule
    strength: Hard
    status: proposed
    when:
      kinds:
        - cli
    checks:
      - binding: go
        class: test-kit
        tier: "1"
        note: >-
          AST helper flagging runes in the emoji ranges (U+1F300 to U+1FAFF, U+2600 to U+27BF except a short
          typographic allow list) in string literals of the module and programs. Plant: a literal with a
          check-mark emoji fails. Control: a typographic arrow passes
    open:
      - "Proposed for lack of a source (decision 47); the v1 evidence was: C"
  - id: cli.look.10
    slug: screen-reader-use-recorded
    since: 0.1.0
    rule: >-
      Terminal use with a screen reader is held by a named person, recorded at release.
    level: release
    why: No tool can do the use; only the record of it can be checked.
    kind: instruction
    strength: Record
    status: proposed
    review_question: >-
      Who used the terminal programs with a screen reader for this release, on which date and version, and
      what did they find?
    open:
      - >-
        The tag refuses without a named person's record; the presence check is the only mechanical part.
      - >-
        Promotion needs the record paired with a review question that checks its content.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: C"
