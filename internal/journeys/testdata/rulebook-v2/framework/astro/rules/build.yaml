part: astro
concern: build
order: 1
title: Static build and script policy
summary: >-
  An Astro project is a static site: no on-demand rendering, no adapter, and a script policy that the
  framework generates from hashes at build time, never with unsafe-inline.
rules:
  - id: astro.build.1
    slug: static-only
    since: 0.1.0
    rule: >-
      A static Astro project uses no actions and no server islands, because both need on-demand rendering and
      an adapter.
    detail: >-
      A test loads the Astro config and fails on an adapter, on an output mode other than static, and on a
      `src/actions` directory. A lint on `.astro` files fails on a `server:defer` island. A new rendering mode
      is admitted only with its own pack and a decision.
    level: deploy
    why: >-
      On-demand rendering adds a server and an adapter to a site that was built to be a folder of files. The
      rule was rated C from the framework's own guides; no site uses either feature yet.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - web-app
    sources:
      - ref: astro-docs
        where: actions and server islands
        backs: rule
      - ref: decision-43
        where: reviewer verdict A1
        backs: rule
    checks:
      - binding: ts
        class: test-kit
        tool: vitest
        tier: "2"
        note: >-
          a Vitest test that loads astro.config and fails on an adapter, an output other than static or an
          actions directory, plus ESLint no-restricted-syntax on `server:defer` in `.astro` files. Plant:
          adding an adapter to the config fails; a `server:defer` island fails; a `src/actions` directory
          fails. Control: a static config with no adapter and no actions passes
    open:
      - >-
        v1 evidence, not yet a source: C (the framework's actions and server-islands guides)
    note: Static form of the React part's rule that full-stack rendering needs a decision.
  - id: astro.build.2
    slug: generated-script-policy
    since: 0.1.0
    rule: >-
      The framework generates the script policy, so `script-src` lists hashes and never contains
      `unsafe-inline`.
    detail: >-
      The Astro security.csp option is set in the config. A test parses each built page for the policy meta
      element and fails when `script-src` lacks hashes or holds `unsafe-inline`. Islands stay banned. An
      unhashed inline script in a template is in no hash list, so the browser refuses it at run time: a loud
      failure the violation listener catches, not a bypass.
    level: deploy
    why: >-
      A policy that allows inline scripts gives no protection against injected ones. The option was tried on
      one framework version: four pages built, a policy meta element on the two counted, no script on the
      plain page and two inline scripts on an island page.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - web-app
    sources:
      - ref: astro-docs
        where: configuration reference (security.csp)
        backs: rule
      - ref: w3c-csp3
        backs: rule
    checks:
      - binding: ts
        class: preset-config
        tier: "3"
        note: >-
          v1 class framework. Astro security.csp in the config, read back, and a test that parses each built
          page for the policy meta element and checks script-src. Plant: the config with security.csp removed
          fails the built-page parse. Control: the build with the option set passes
    open:
      - >-
        Trialled on one Astro version; a newer one was out when the source was read and its behaviour is a
        source read, not run.
      - "v1 evidence, not yet a source: C; trialled on four pages"
    note: The Astro form of the web part's script-policy rule.
