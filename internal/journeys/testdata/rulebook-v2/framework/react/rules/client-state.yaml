part: react
concern: client-state
order: 3
title: Client state and forms
summary: >-
  Client state that changes lives in one store, and context carries only values handed down. Forms use one
  form library through one design-system module; that pick is recorded in the part's tools.
rules:
  - id: react.client-state.1
    slug: one-client-store
    since: 0.1.0
    rule: >-
      Client state that changes lives in one store; context is only for passing values down.
    detail: >-
      One store library, no second one and no bespoke store class. The package ban lists the other client
      stores (redux, jotai, valtio, recoil, mobx, nanostores, zustand), and the external-store hook is
      restricted outside the store file. Whether a context holds changing state is a judgement that no tool
      makes.
    level: function
    why: >-
      Two stores for client state drift apart, and state in context re-renders every consumer. Half of the
      rule holds by package ban; the context half is a model lens.
    kind: rule
    strength: Lens
    status: active
    when:
      kinds:
        - web-app
    sources:
      - ref: react-docs
        where: scaling up with reducer and context
        backs: rule
      - ref: decision-44
        backs: rule
      - ref: decision-65-react
        backs: rule
    checks:
      - binding: ts
        class: preset-rule
        tier: "0"
        note: >-
          manifest and no-restricted-imports ban of redux, jotai, valtio, recoil, mobx, nanostores and
          zustand, and no-restricted-syntax on the external-store hook outside the store file (Biome form:
          `noRestrictedImports` with the same list and a GritQL plugin for the hook). Plant: importing `jotai`
          fails; `useSyncExternalStore` in a feature file fails; a second `createContext` holding mutable
          state is not seen by any tool. Control: reading and writing the one store passes
    review_question: Does this context hold state that changes, or only a value injected from above?
    open:
      - >-
        Half holds: the package bans are hard; a second context holding mutable state is not seen by any tool.
      - Not yet promoted, so it binds only through the review question.
    note: The store pick is a tool entry (client store, TanStack Store).
  - id: react.client-state.2
    slug: one-form-library
    since: 0.1.0
    rule: >-
      A React program uses one form library, TanStack Form, with every other form library banned, and sets
      field errors only in the one server-error mapping module.
    detail: >-
      `no-restricted-imports` and a manifest ban on the other form libraries: `formik`, `final-form`,
      `conform`, and `react-hook-form` with `@hookform/resolvers` (the replaced pick). `@tanstack/react-form`
      is the chosen one (before the TanStack-always ruling it was the banned one). `.setError(` calls outside
      the mapping module are banned, so a server 400 problem response reaches form and field errors only
      through the one helper of web.forms.3. Schema validation follows web.forms.4; in the form library's
      current major, output that differs from input is parsed in the submit handler.
    level: function
    why: >-
      With no form in either site the check is vacuous until the detector sees one. Two form libraries, or
      field errors set by hand in pages, give two patterns for fields, validation and server errors.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - web-app
    sources:
      - ref: decision-65-react
        backs: rule
    checks:
      - binding: ts
        class: preset-rule
        tier: "0"
        note: >-
          a manifest ban list and `no-restricted-imports` on form libraries other than the chosen one, and
          `no-restricted-syntax` banning the field-error setter outside the one mapping module (Biome form:
          `noRestrictedImports` with the same list and a GritQL plugin for the setter). Plant: importing a
          second form library fails; calling the field-error setter in a page file fails. Control: the mapping
          module passes
    relates:
      - id: web.forms.3
        how: see
      - id: web.forms.4
        how: see
    open:
      - >-
        The source picked react-hook-form with its resolvers (decision 9); the operator's TanStack-always
        ruling replaces the pick with TanStack Form, which is now the component-stack library. The old pick is
        kept in the tool entry's lost list.
      - >-
        The submit-parse detail is specific to one form library's major version and is re-read at adoption.
    note: >-
      The component-stack form of web.forms.3 (one form pattern and one error mapping) and the submit-parse
      detail of web.forms.4, moved here from the web part. The pick is the tool entry form library.
  - id: react.client-state.3
    slug: derived-value-not-synced-by-effect
    since: 0.1.0
    rule: >-
      A derived value is computed during render, never stored in state and synced by an effect.
    detail: >-
      The lint `no-derived-state` from `eslint-plugin-react-you-might-not-need-an-effect` (1.1.0) fails an
      effect that sets state from other state or props. This is the React form of web.states.15 (a derived
      value is computed, not stored and synced).
    level: function
    why: Stored derived state drifts from the value it was derived from.
    kind: rule
    strength: Hard
    status: active
    when:
      kinds:
        - web-app
    sources:
      - ref: decision-65-react
        backs: rule
    checks:
      - binding: ts
        class: preset-rule
        tool: eslint
        tier: "1"
        note: >-
          `eslint-plugin-react-you-might-not-need-an-effect` `no-derived-state` as an error (ESLint-only:
          Biome has no form, so a Biome project records the gap). Plant: `useEffect(() => setFull(first +
          last))` fails the lint (planned). Control: a value computed during render passes
    relates:
      - id: web.states.15
        how: see
    open:
      - >-
        The lint rule is from its README and not run; the source would make this a rule on React once the
        plugin is trialled.
      - >-
        The source row is an instruction with a best-practice strength of Hard; written here as a rule on that
        strength.
    note: The React-only check of web.states.15, moved here from the web part.
