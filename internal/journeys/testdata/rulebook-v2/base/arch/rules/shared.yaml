part: arch
concern: shared
order: 4
title: Shared code and reuse
summary: >-
  Code that more than one program needs lives in a small named set of shared modules with an owner, and
  reaching for it is easier than copying it. This concern covers what may be shared, when a piece enters or
  leaves the shared layer, how copies are found, counted and held equal, and how the shared surface is listed.
rules:
  - id: arch.shared.1
    slug: small-named-set-of-shared-modules
    since: 0.1.0
    rule: >-
      Shared code lives in a small, named set of shared modules with one owner lane, and no other shared
      module exists.
    detail: >-
      The set is named in rule data: the shared library modules (for example one for plumbing and one for the
      terminal look) and any separate private package for design tokens. All of them have one owner lane. A
      package managed by agents, with the operator only advising, versions on its own semver and not in
      lockstep with the others. A scan of the module files across repositories finds shared modules outside
      the named set.
    level: package
    why: >-
      Every extra shared module is another place a copy can hide and another owner to find. The shared module
      exists; its owner lane is a new platform lane that cannot be created until the roster change is allowed.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: decision-5
        backs: rule
      - ref: decision-28
        backs: rule
      - ref: decision-35
        backs: rule
    checks:
      - binding: go
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class our-cli. a go.mod scan across repositories for owned shared modules outside the named set,
          run as a census in the standards repo's gate. Plant: a new shared module in a go.mod fails. Control:
          the named modules only pass
    open:
      - >-
        Planned and blocked on decision 35: the new platform lane cannot be created until the roster change
        that waits for the current hold is allowed. The scan is proposed and has no plant recorded.
      - "v1 evidence, not yet a source: own measure; operator decisions"
  - id: arch.shared.2
    slug: shared-code-is-mechanism
    since: 0.1.0
    rule: >-
      The shared package holds mechanism, not product knowledge; policy and domain words stay in the program,
      and the API is small functions and structs.
    detail: >-
      Domain logic, product sentences and a page's own layout stay in the project whatever the copy count. In
      Go an AST test over the shared module's identifiers and string literals runs against a deny-list of
      program and domain words (tool names from the workspace, domain words) and a scan finds repository
      names. The shared module carries no program's domain.
    level: file
    why: >-
      A shared module with product words in it is a program in disguise; one shared style file (style.go)
      carried photo words. The shared kit has no repository names today.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: arch-reasons-stated
        backs: rule
    checks:
      - binding: go
        class: test-kit
        tier: "1"
        note: >-
          TestUINamesNoTool extended: an AST test over the shared module's identifiers and string literals
          against a deny-list of program and domain words; plus a private-name scan of the shared kit. Plant:
          a style file with photo words fails; a neutral word passes. Control: a neutral word passes
    review_question: >-
      Is this mechanism or policy, and would a second program with other words use it unchanged?
    open:
      - >-
        Mechanism against policy is judgement; the lens was clean in the trial and has no plant.
      - Held in Go only; the TypeScript side is a review question with no check.
      - >-
        Some plants and controls of this rule were written at the merge from the sources' description of the
        check, and have not been run.
      - >-
        v1 evidence, not yet a source: A (shared style file carried domain words); practice
    note: >-
      v1 review check (review is not a v2 check class): a model question on shared packages and shared parts;
      no automatic check
  - id: arch.shared.3
    slug: copies-counted-across-repos
    since: 0.1.0
    rule: >-
      A step copied into a second repository moves to the shared module, and the census count of copies only
      falls.
    detail: >-
      A census (the step-copies measure, a go test that regenerates the census and diffs it against the committed one) hashes every known shared step across the
      repositories and counts copies and versions; the count per step has a shrink-only ratchet. Clones across
      repositories are reported. Engines such as a clone detector are candidates. Copies found by hashing are
      also counted for design tokens and parts on the web side.
    level: program
    why: >-
      One census found 42 hand copies (223,170 bytes) of what the shared UI module holds, and named a shared
      package for 31 of the 51 steps. Copies diverge silently.
    kind: measure
    strength: Hard
    status: active
    sources:
      - ref: arch-reasons-stated
        backs: rule
    checks:
      - binding: any
        class: fact
        tool: jscpd
        tier: "3"
        note: >-
          v1 class our-cli. the census script rebuilt as companion census with a shrink-only count per step;
          jscpd or dupl as candidate engines. Plant: a copy of a listed step in a second repo raises the count
          and fails. Control: the unchanged repos pass
    open:
      - >-
        The census exists as a read-only measure and is the host of the shrink-only count; no plant is
        recorded for the ratchet.
    note: >-
      The census is a measurement behind the counts of copies; the same rule governs copies of shared plumbing
      steps counted across the services.
  - id: arch.shared.4
    slug: second-copy-reported-in-the-change
    since: 0.1.0
    rule: >-
      A second copy found by shape is reported in the change, which either moves it or lists it as independent
      with a reason.
    detail: >-
      The clone detector runs with identifiers and literals ignored (a renamed copy shows 0 clones by default)
      with a minimum of 5 lines and 30 tokens; looser similarity and embedding modes exist and were not run.
      The report is advice; the gate is the ban on the primitive in arch.shared.8.
    level: file
    why: A copy found only by name is missed once renamed; the shape is what repeats.
    kind: rule
    strength: Answered
    status: proposed
    when:
      kinds:
        - web-app
    checks:
      - binding: ts
        class: fact
        tool: jscpd
        tier: "2"
        note: >-
          v1 class our-cli. jscpd 5.4.2 with --ignore-identifiers --ignore-literals --min-lines 5 --min-tokens
          30, a report in the change. Plant: an 11-line function copied with every identifier and literal
          renamed, defaults find 0 clones and with identifiers ignored exit 1 at 27% of lines. Control: two
          distinct files exit 0
    relates:
      - id: arch.shared.8
        how: see
    open:
      - >-
        Advice by the criterion; the model rule says a second copy blocks until moved or listed.
      - >-
        Looser similarity and embedding modes of the clone detector exist but were not run (the embedding
        model is 548 MB).
      - "Proposed for lack of a source (decision 47); the v1 evidence was: D"
  - id: arch.shared.5
    slug: independent-copies-listed
    since: 0.1.0
    rule: >-
      A copy that must differ is listed as independent with a reason and a removal date, and a copy that
      diverged is reported.
    detail: >-
      A census class named independent needs a named reason, and every allowed copy has a removal date that
      fails once it passes. A copy that diverged is reported when only one of its copies changed in 90 days (a
      git log per copy file); the next change to a diverged copy is blocked until answered. The count only
      falls. Clones not on the list fail. In Go the list is the shrink-only baseline file: one row per
      deliberate copy, with the path, a metric of lines, a ticket and the date by which it is zero. The
      divergence report reads the list of copies taken from another repository (arch.shared.6).
    level: file
    why: >-
      12 of 20 UI steps were independent copies in one census, and 14 independent steps in a Go census;
      without a reason list a divergence cannot be told from drift.
    kind: rule
    strength: Hard
    status: proposed
    sources:
      - ref: arch-reasons-stated
        backs: rule
    checks:
      - binding: any
        class: fact
        tool: jscpd
        tier: "2"
        note: >-
          v1 class our-cli. independent-copy list as exception records with reason and removal date; jscpd
          5.4.2 --ignore-identifiers --ignore-literals finds clones not on the list; the 90-day divergence is
          a report. Plant: a clone not on the list fails; an expired removal date fails. Control: a listed
          copy within its date passes
    relates:
      - id: arch.shared.4
        how: see
    open:
      - >-
        The 90-day divergence report is proposed and was not measured; the reason is judgement, the presence
        of a reason a check. In Go it reads the list of arch.shared.6, which is a later step (G9) of the
        shared-code proposal.
      - >-
        The baseline row for a deliberate copy exists today for one copy; the other Go copies are listed as
        the steps that remove them land. The row is the check, so the rule stays proposed until the clone
        pass of code.duplication.1 (gragas#513, G2) shows which clones are not on the list.
      - "Related rule: arch.shared.4 reports a copy found by shape."
  - id: arch.shared.6
    slug: copies-held-byte-equal
    since: 0.1.0
    rule: >-
      A file that must stay a copy is checked byte for byte against its origin in the gate, and a shared file
      reaches every consumer through a manifest of path and hash, and copies are counted by the step-copies
      census.
    detail: >-
      Root configs are byte-equal to the template and an edited one fails; a config read by meaning is
      validated by meaning (an .npmrc is last value wins, and the pnpm-workspace file is compared to the
      expected key map). Each holder has a manifest of path: sha256, a changed hash re-runs the readers, and
      the check sits inside the path agents take, with a per-repo ceiling that only falls. A repo copy of a
      canonical root file is diffed against the shared config package: each repo's copy is a one-line extends
      or re-export, a pre-push job diffs it, and a template update reconciles drift once the template exists.
      For a copy taken from another repository the list is one file with one row per copy: the path here,
      the original, what may differ and why. A repository test reads the list through the shared module's
      list reader and compares each pair; a difference the row allows passes and any other fails. The first
      rows are two test-isolation helpers copied from another program.
    level: file
    why: >-
      One repo's drift check fails and sits outside the gate (7 of 25 whole-file entries fail); five versions
      of a pre-push hook exist in five repos; three byte-equal things were found in one census.
    kind: rule
    strength: Hard
    status: proposed
    sources:
      - ref: arch-reasons-stated
        backs: rule
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: "1"
        note: >-
          v1 class our-cli. companion sync --check inside the gate: byte-compares of listed copies to origin
          and of root configs to the template; manifest of path and sha256 per holder; .npmrc and the
          workspace file parsed by meaning and compared to the expected key map. Plant: one byte changed in a
          copy fails; a duplicate .npmrc key with the wrong last value fails. Control: an unchanged copy
          passes
    open:
      - >-
        One repo's check fails and is not in its gate; the platform check is proposed and a plant is owed.
      - >-
        A per-repo ceiling that only falls is still to be set; copies are held by a check inside the path
        agents take.
      - >-
        Proposed until the list and its repository test exist: step G9 of the shared-code proposal, which
        has no ticket yet. Plant for the Go list: one changed byte in a listed copy fails. Control: the
        difference the row allows passes.
  - id: arch.shared.7
    slug: one-change-reaches-projects-by-bump
    since: 0.1.0
    rule: >-
      A shared rule or look changes once, in its package, and reaches projects by a version bump; it is
      imported, never copied.
    detail: >-
      No project holds a copy of the shared rule file or of a module file; declared differences (a program's
      own brand, banner art) stay allowed. A one-line wrapper is allowed and a 78-line copy is not. In Go the
      terminal look comes from the shared UI module, with no colour literal or escape string outside it and no
      terminal-detection package outside it (a program can still paint with raw escape strings through the
      formatting package or detect a terminal with x/term, which is not banned today).
    level: package
    why: >-
      Only one program imports the shared UI module (30 non-test files); the others copy. Three byte-equal
      things and 12 independent steps were found in one census.
    kind: rule
    strength: Hard
    status: active
    unless:
      - kinds:
          - daemon
        reason: no terminal output
      - kinds:
          - library
        reason: no terminal output
    sources:
      - ref: arch-reasons-stated
        backs: rule
    checks:
      - binding: go
        class: preset-rule
        tool: golangci-lint
        key: depguard
        tier: "1"
        fix: never
        note: >-
          depguard owner-ui row (82 of 82 planted bans fired), a ban of the terminal-detection package and raw
          escape strings outside the shared UI module, and a copy check on the module's files. Plant: a
          terminal-library import outside the UI module fails; use of x/term fails. Control: the same import
          inside the module passes
      - binding: ts
        class: fact
        tool: gragas
        tier: "1"
        note: >-
          v1 class our-cli. sync --check fails on a copy of a shared rule file in a project (name list from
          the packages and a hash scan). Plant: a copied 78-line ESLint config fails; a one-line wrapper
          passes. Control: a one-line wrapper passes
    open:
      - >-
        The second half of the Go rule (no colour literal or terminal reads outside the shared module) is
        planned in the terminal rules of the cli part.
      - "v1 evidence, not yet a source: own measure; A (three byte-equal things)"
  - id: arch.shared.8
    slug: shared-exports-protected-twice
    since: 0.1.0
    rule: >-
      Every shared export that replaces a hand copy is protected twice: a ban on the primitive outside its
      owner with a shrink-only allow list, and an advisory shape rule that points at the export to use.
    detail: >-
      The ban is the gate. The shape rule is advice and does not stop a rebuild by itself, because a name
      search cannot find a copy (copies are called Put, replaceOnce or enqueue). The message names the export
      to use and old copies stay on a per-file count that only falls. The shape rule has a planted copy under
      a different name, its known bypasses kept as fixtures (a helper that makes the temp file, a file create
      call, a root rename, a method-value alias of the rename call, link-then-remove) and its measured rates
      beside it. Locking, atomic writes, paths and the daemon helper come from the shared module, not a local
      copy. An export without both halves is planned. A known bypass is a helper in a ban-free package that
      calls an allowed primitive. In Go the ban rows are not hand-kept: they are generated from the registry
      of arch.shared.15, one forbidigo or depguard row per primitive with the export in its message, and the
      exclusion list of each ban is the shrink-only allow list. The bans at adoption are the file-write
      primitives (rename, temp file, write file, create, open for write) outside the write owners; the
      digest primitives and the hex encoding of a sum outside the digest owner; the raw stat of a path
      outside the trust owners; running the version-control program outside its owners; and the golden
      update flag outside the one golden helper. The shape rule stays advice; the restructured copy it
      cannot see is made visible by the trailer of agents.discovery.6.
    level: function
    why: >-
      13 hand-written replace-a-file bodies sit outside the owner and 14 production files call flock directly;
      a name search found none of the copies and a clone detector found 0 clones; the shape rule flagged 1 of
      6 planted forms of the atomic write and missed all five restructured copies, so per-export bans are the
      gate.
    kind: rule
    strength: Hard
    status: proposed
    sources:
      - ref: arch-reasons-stated
        backs: rule
    checks:
      - binding: go
        class: preset-rule
        tool: golangci-lint
        tier: "1"
        note: >-
          one forbidigo or depguard ban per primitive outside the owner, generated from the registry of
          arch.shared.15 with a shrink-only allow list, and one ast-grep 0.51.1 shape rule per export with a
          planted hit and a clean control; census ratchet. Plant: os.Rename onto a state path fails; a
          hand-written lock outside the lock package fails. Control: the call through the shared export
          passes
      - binding: ts
        class: preset-rule
        tool: eslint
        tier: "1"
        note: >-
          ESLint no-restricted-imports and no-restricted-syntax generated from the platform export table
          (primitive banned outside its owner), and ast-grep shape rules per export with planted copies and
          bypass fixtures, advice only. Plant: a hand-written atomic copy under another name; the ban half
          fires only on the primitive and the shape half on the renamed copy. Control: the call through the
          shared export passes
    open:
      - >-
        The forbidigo half was verified on 5 Nov (selector bans fire on aliases and method forms). Of the 17
        exports in the platform list only the write and lock exports have any planted rule today; 0 of 13 web
        exports have either half.
      - >-
        The ast-grep YAML rules missed cheap restructurings in one trial, so the shape half must carry its
        bypass fixtures.
      - >-
        The web half is planned; the rule must be written by the person who owns the export.
      - >-
        Proposed until the bans are rendered: the registry and the renderer are step G1 of the shared-code
        proposal (gragas#513). A ban appears only when its owner exists, so the digest ban comes with step G3
        and the write ban with step G4; the bans that already pass land with G1.
  - id: arch.shared.9
    slug: public-surface-listed
    since: 0.1.0
    rule: >-
      Each port and shared package's public surface is listed in one generated file per tag with a stability
      mark (stable, experimental, internal) on every export, held both ways against the code, and a change to
      the surface or a mark fails until a reason is recorded.
    detail: >-
      The listing is regenerated and diffed in the owner repository (for Go, a short doc listing per package);
      a test that the listing's tag equals the pinned version, and a program reads the listing for the version
      it pins. A surface is few, typed and closed. Every export carries one mark: stable (kept until a
      recorded break), experimental (said so at the export site too) or internal (not reachable from outside
      the package). The register and the code agree both ways: an export with no mark fails, a mark with no
      export fails, and an internal export reachable from outside fails. For a published web package the
      surface is its exports map with one subpath per unit, no root barrel on a package with more than one
      unit, and every entry resolving in the packed tarball. The reason must resolve to a ticket or a second
      case. Width per part is printed and does not gate because a limit would be a guess. The interface
      comment is a review question (see code.comments).
    level: release
    why: >-
      The shared Go package's surface is 181 lines and 6.9 KB; the list read at the version one repo pins has
      no UI and no door entry. In the trial, 25 landings in one repo and 11 in another were real port changes.
      A surface with no stability mark promises everything to every reader; the mark is what lets an
      experimental export change without a break.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: ousterhout-aposd
        where: chapter 13
        backs: rule
      - ref: b-01-evolutionary-architectures
        where: section 5.2 item 4
        backs: rule
      - ref: b-04-philosophy-of-software-design
        where: section 7 item 4
        backs: rule
      - ref: decision-65-arch
        backs: rule
    checks:
      - binding: go
        class: preset-config
        tier: "3"
        note: >-
          a recipe in the shared Makefile fragment: go doc -short listing regenerated per tag and diffed, with
          a mark column; a test that the listing's tag equals the go.mod version and that every exported name
          has exactly one mark. Plant: an exported func added without a regenerated listing fails; an export
          with no mark fails. Control: the regenerated listing with every export marked passes
      - binding: ts
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class our-cli. companion surface: ts-morph 28.0.0 or @microsoft/api-extractor 7.60.1 writes a
          committed surface file per shared part (exported names, prop names, types and marks); the gate
          regenerates it and fails when it differs and the change carries no reason (a ticket or decision id
          in a trailer); publint and are-the-types-wrong run over the packed tarball to prove every exports
          entry resolves. Plant: adding a prop with no reason fails; an internal export listed in the exports
          map fails; an exports entry missing from the tarball fails. Control: the same diff with a ticket in
          the trailer passes
    open:
      - >-
        The reason is free (nearly every landing names a ticket) so the value is a visible diff, not the
        judgement. api-extractor is for libraries with declaration files; Astro components need the ts-morph
        route.
      - The fingerprint is the reader's inference and the book has no width metric.
    note: Shares its engine with the Go listing check and the web surface check.
  - id: arch.shared.10
    slug: shared-entry-conditions
    since: 0.1.0
    rule: >-
      A new shared package or part enters the shared layer only when entry conditions hold: two live
      consumers, one concern, a named owner and a line in the generated listing.
    detail: >-
      For a web module: two or more consumers today; no single module's entity rule; imports only the kernel,
      generated types, the design system and packages; a named kernel package with a README naming its
      purpose, allowed imports and owner; a catalogue row and tests. For a shared part: published criteria,
      holds no single surface's rule, and the fan-in threshold (3 surfaces) is rule data with its reason, not
      a repo's choice. Test helpers go in a testkit package in the root module. Anything else stays in the
      program.
    level: process
    why: >-
      A shared item with one consumer pays for the shared layer's cost and none of its value.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: ford-sathp
        where: chapter 8
        backs: rule
      - ref: ousterhout-aposd
        where: chapter 11
        backs: rule
      - ref: p-08-splitting
        where: section 18
        backs: rule
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class our-cli. a check that each listed package has an owner line and two importers, with the
          consumer count read at each tag and the fan-in per shared part reported. Plant: a package with one
          importer fails. Control: a package with an owner line and two importers passes
    review_question: >-
      Do all its callers change for one reason, and what was the second design, and why did it lose?
    open:
      - Planned and blocked on decision 35 (the platform lane).
      - >-
        A fail on low fan-in is beaten by importing the part from one more file; it would change if a fan-in
        line is ruled with an owner-approved exception list.
      - "v1 evidence, not yet a source: practice; D (anecdotal)"
  - id: arch.shared.11
    slug: move-up-one-step-at-a-time
    since: 0.1.0
    rule: >-
      A piece moves up one step at a time (page, the site's shared/ folder, then a shared package), and
      stack-free code moves when a second project needs it.
    detail: >-
      Stack-free code moves on any framework. A part moves by the three-copy rule inside a site; across sites
      it needs a second live consumer on the same framework, after its fault has recurred. Domain logic,
      product sentences and a page's own layout never move. A new package or repository names the driver that
      a folder or namespace cannot meet (arch.structure.5).
    level: process
    why: Skipping a step creates a shared package for something that has one user.
    kind: rule
    strength: Lens
    status: active
    when:
      kinds:
        - web-app
    sources:
      - ref: ford-sathp
        where: chapters 3, 6 and 7
        backs: rule
      - ref: p-08-splitting
        where: section 11
        backs: rule
    checks: []
    review_question: >-
      What named driver does a folder or namespace fail to meet, so that this needs its own package or
      repository?
    relates:
      - id: arch.structure.5
        how: see
      - id: arch.structure.1
        how: see
    open:
      - >-
        A new package case rides on the door classification (arch.structure.1); the driver text and the
        second-copy report are advice.
    note: >-
      v1 review check (review is not a v2 check class): a model checks the move order; copy counts are checked
      by the web part's copy rule
  - id: arch.shared.12
    slug: shared-item-moves-back
    since: 0.1.0
    rule: >-
      A shared item whose consumers drop to one moves back into that consumer, or names a second as a recorded
      exit.
    detail: >-
      A module two or more modules need moves to the shared layer; one that drops to a single consumer moves
      back. The structure check fails a shared item with fewer than two consumers. A step used by one program
      again returns to it, since a step moves up only on two holders.
    level: package
    why: A shared item kept for one consumer is shared in name only.
    kind: rule
    strength: Answered
    status: proposed
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class our-cli. the structure check fails a shared item with fan-in below 2; a shared part
          dropping to one user blocks its next change until it is moved or the change answers why. Plant: a
          shared part with one importer is listed and its next change blocks. Control: a shared part with two
          importers passes
    open:
      - >-
        A fail on low fan-in is beaten by importing the part from one more file; a Go kit step left with one
        consumer is a gap in the sources.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: practice; D"
  - id: arch.shared.13
    slug: one-exported-definition
    since: 0.1.0
    rule: >-
      A shared pattern, marker or behaviour-deciding value has one exported definition that others import.
    detail: >-
      A shared value or pattern is defined once in the shared module and copied byte for byte only by listing
      (arch.shared.6). A threshold or limit is a named constant in one configuration module, so the same
      number is not typed in two view files. The same value in two exported constants blocks until answered.
    level: function
    why: >-
      Two copies of a pattern drift apart and the program silently splits into two behaviours; one threshold
      lived in four places in one repo.
    kind: rule
    strength: Answered
    status: proposed
    checks:
      - binding: ts
        class: preset-rule
        tool: eslint
        tier: "0"
        note: >-
          ESLint core no-magic-numbers (ignore 0, 1, -1; enforceConst) in view and model folders plus
          sonarjs/no-duplicate-string (threshold 3) for string constants that decide behaviour; a
          duplicate-constant check (the same value in two exported constants) is still to be built, and
          duplicate numeric constants across files are listed by the merge-candidate report. Plant: if (rows >
          50) in a view file fails; if (rows > MAX_ROWS) with MAX_ROWS imported from the config module passes.
          Control: if (rows > MAX_ROWS) with the constant imported passes
      - binding: any
        class: fact
        tool: gragas
        tier: "2"
        note: >-
          v1 class our-cli. a census hit on a second definition of the shared pattern fails, and a lint ban on
          re-declaring the marker outside its owner. Plant: a second definition of the marker regex fails.
          Control: an import of the one definition passes
    relates:
      - id: arch.shared.6
        how: see
    open:
      - >-
        no-magic-numbers forces a name, not one home: two files can each name the same number, and it fires on
        pixel values in JS. "One home" has no tool until the duplicate-constant check is built; the evidence
        would justify it. The proxy of the same number literal in two view files is planned.
      - >-
        Some plants and controls of this rule were written at the merge from the sources' description of the
        check, and have not been run.
      - >-
        Proposed for lack of a source (decision 47); the v1 evidence was: A (one threshold in four places in
        one repo)
  - id: arch.shared.14
    slug: shared-source-has-an-owner
    since: 0.1.0
    rule: >-
      A shared source has a named owner, one home, a stated version and a place to ask with a response time,
      named before it is called adopted.
    detail: >-
      Each shared repository has an owner file with the owner, home, version, ask channel and response time;
      the sync check verifies every shared dependency repository has a valid one at its pinned tag. The tokens
      package is managed by agents and the operator only advises.
    level: release
    why: >-
      Two shared UI sources have no owner file; a shared source with no one to ask is abandoned the first time
      it needs a change.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: decision-2
        backs: rule
      - ref: decision-28
        backs: rule
      - ref: decision-35
        backs: rule
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class our-cli. an owner-file schema in each shared repository, checked by sync at the pinned tag.
          Plant: a shared repository without an owner file fails. Control: a repository with a valid owner
          file passes
    review_question: >-
      Who owns this shared source, where does it live and how fast is a question answered?
    open:
      - >-
        Planned and blocked until the owning lane exists (decisions 2 and 35); creating it waits for the hold
        on the roster.
      - "v1 evidence, not yet a source: A (two shared sources have no owner file)"
  - id: arch.shared.15
    slug: shared-capability-registry
    since: 0.1.0
    rule: >-
      Every capability that more than one package or program needs is one row in a registry, and the lint
      bans, the instruction block and the export listing's shared column are rendered from it.
    detail: >-
      The registry is one file, one row per line, sorted. A row has the capability, the owner package, the
      export, the shared module's package and export if it has one, the primitives the capability owns, a
      status (local, shared or later) and the tag since which it is shared. A repository test fails a row
      whose owner does not exist, a primitive with no rendered ban, a ban with no row, and a shared-module
      row whose export is not in the pinned tag's package listing. The owner column is held to the owners
      that the layer table already names, so the two files cannot disagree. A ban nobody can find is not
      read, and an instruction nobody enforces is not followed; one file is both, and the generator writes
      the ban rows into the generated part of the lint config and the instruction block into the agents'
      file. Removing a row narrows a gate, so the registry is a protected path.
    level: package
    why: >-
      Own measure: the atomic write exists six times in one Go program and the digest of a file twelve times,
      each added by a builder who did not see the earlier one; the shared module's own instruction file
      states the second-copy rule, and nothing in this program enforced it.
    kind: rule
    strength: Hard
    status: proposed
    sources:
      - ref: decision-16
        backs: rule
    checks:
      - binding: go
        class: test-kit
        tool: gragas
        tier: "2"
        fix: never
        note: >-
          the registry test over the file, and the generator whose rendered rows the generated-file check
          holds. Plant: a row with a primitive and no ban fails gen --check. Control: the rendered config
          passes
    relates:
      - id: arch.shared.8
        how: see
      - id: agents.discovery.1
        how: see
    review_question: >-
      Which row of the registry did this change read, and does the capability it adds belong in a row?
    open:
      - >-
        Proposed until the registry exists: the file, its schema, its test and the renderer are step G1 of
        the shared-code proposal (gragas#513). The first rows are those whose owner already exists; the rows
        for the digest and dev-write owners come with steps G3 and G4.
