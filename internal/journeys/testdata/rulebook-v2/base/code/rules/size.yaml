part: code
concern: size
order: 2
title: Size and complexity
summary: >-
  File and function size, complexity and parameter counts, and the reports that watch them. Complexity and
  parameters only fall; length is a measure read beside a count of tiny single-use helpers, so splitting alone
  is never progress; only the extreme tail of file length is gated. A merge-candidate report supplies the
  opposite pull.
rules:
  - id: code.size.1
    slug: file-length
    since: 0.1.0
    rule: >-
      Files over a per-type line limit are reported without failing, and the count of files over a far larger
      limit is held from rising.
    detail: >-
      The reported lines (code 300, component 400, stylesheet 800) are guesses, and so is the gated tail of
      1000 lines. A file over the report line prints; a file past the tail line fails when it is not in the
      committed baseline (one file per entry, shrink-only). Generated files, golden test data and end-to-end
      files are on a declared exclusion list. The donor's rule gated at 300 lines (counting non-blank,
      non-comment lines) with a shrink-only per-file override list that ships empty; our ruling demoted the
      300 line to a report because no harm is shown and a ratchet with no partner rewards the cheap split.
      Splitting a file past the tail is free, which is why only the tail gates. The other side of this rule, a
      file split too far (a too-small split, which no instrument covers), is read through code.size.6.
    level: file
    why: >-
      A size ratchet failed once in the estate (a file grew from 400 to 3,000 lines and still counted as one
      violation), so a one-sided count is known to be gamed. Over 300 lines: 62 files (11.4%) in one repo, 96
      (26.0%) in another, 36, 44, 37 and 8 in the others; the standard library has 25.9% over 300 and 8.3%
      over 800. Over 1000: 5, 8, 4, 1 and 0.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: ousterhout-aposd
        where: chapter 9
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 5.8
        backs: rule
      - ref: p-09-agentic-development
        where: section 5.3
        backs: rule
    checks:
      - binding: go
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class our-cli. baseline metric FILES_OVER_LINE_CAP printed as a report (line count over tracked,
          non-generated .go files), with the shrink-only ratchet on the 1000-line tail (one baseline file per
          entry); a file past the tail that is not in the baseline fails. Plant: a file grown past 1000 lines
          fails the ratchet. Control: a file between 300 and 1000 lines prints and passes
      - binding: ts
        class: fact
        tool: eslint
        tier: "2"
        note: >-
          v1 class our-cli. companion size: lines per file by type read from the repo, a report of files over
          300, 400 and 800, and a failure only on a rising count of files over 1000 against a committed count
          file (shrink-only), excluding the generated-file list; ESLint max-lines can count per file but not
          the shrink-only total. Plant: a fixture file of 1001 lines raises the count and fails; a fixture of
          301 lines prints and passes; a generated file on the exclusion list does not count. Control: a
          fixture of 301 lines prints and passes
    relates:
      - id: code.size.6
        how: see
    open:
      - >-
        The three report lines and the 1000-line tail are guesses. No fault traces to file size, and no
        instrument covers a file split too far.
      - >-
        Conflict with the donor's rule, which fails a file over 300 lines; the ruling here is report at 300
        and gate the tail. The ratchet exists in one repo's file baseline.
      - >-
        The Ousterhout book is silent on files. The ratchet exists in one repo's file-baseline.
      - >-
        v1 evidence, not yet a source: own measure (no harm shown); C (10 of 95 and 13 of 328 web files over
        300)
  - id: code.size.2
    slug: function-length-beside-helpers
    since: 0.1.0
    rule: >-
      Functions over 50 lines are shown as a measure beside the count of tiny single-use helpers, read per
      change, so a fall in length with a rise in helpers reads as no progress.
    detail: >-
      A helper is any function of 20 lines or fewer, exported or not, with exactly one referrer by call or
      value. The count covers exported helpers and function values, because counting private call sites alone
      is beaten for free by exporting the helper, calling it from a dead branch or putting it in a table. A
      function over 100 lines is reported and fails nothing: length cannot tell a nest from a flat table, and
      cognitive complexity already holds every nest. 50, 100 and 20 are guesses. A function over 50 lines
      grows only after the change says why. The donor's rule failed a function at 50 lines (not applied to
      tests); that demotion is the ruling here. The review question beside it is whether the new function can
      be understood without opening its caller.
    level: function
    why: >-
      Nine commits in one repo say they extract a helper to get under a limit, so the limit drives extraction.
      Over 50 lines: 3.1%, 3.7% and 7.9% of functions in three repos, 7.6% in the standard library; helper
      counts are 1311, 1056 (331 exported), 514, 415 and 401. In a sample of 24, about 4 were merge
      candidates.
    kind: measure
    strength: Answered
    status: active
    unless:
      - paths:
          - "**/*_test.go"
          - "**/*.test.*"
          - "**/*.spec.*"
        reason: test bodies are long by design; the donor's cap does not apply to tests
    sources:
      - ref: ousterhout-aposd
        where: chapters 4 and 9
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 5.8
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 5.14
        backs: rule
    checks:
      - binding: go
        class: fact
        tool: gragas
        tier: "3"
        note: >-
          v1 class our-cli. a report of funlen (lines, not statements; the donor's lint rules were max-lines,
          max-lines-per-function, max-params and cognitive complexity) and the fixed helper count (go/types
          referrer count: functions of 20 lines or fewer with exactly one referrer by call or value), read per
          change as the partner of code.size.3. Plant: a 56-line function chopped into 13 helpers adds 13
          helpers in all three forms; a 159-line flat table adds none. Control: a flat table adds no helper
      - binding: ts
        class: fact
        tool: gragas
        tier: "2"
        note: >-
          v1 class our-cli. companion shape: a TypeScript-compiler walk over .ts, .tsx and .astro frontmatter
          and scripts counting functions over 50 lines and the fixed helper count as a pair per change; a
          falling length count with a rising helper count prints as no progress and the change fails the
          ratchet. Plant: a chopped 160-line function (13 one-use helpers) reads as no progress; a flat
          159-line table prints and does not fail. Control: a flat 159-line table prints and does not fail
    review_question: Can the new function be understood without opening its caller?
    open:
      - >-
        The 100-line exit as a failing condition was dropped because a flat table fires like a nest. The
        20-line cut is a guess.
      - >-
        The web form uses an approximate score (a trial script), not sonarjs, which is LGPL-3.0 (the standards
        owner should read the licence before a shared preset ships it). Exporting a helper beats a
        private-only count, so the fixed count is the one to build.
      - >-
        Conflict with the donor's rule, which fails a function over 50 lines; the sources here demote it to a
        measure, with a pairing that fails the cheap cure.
      - >-
        v1 evidence, not yet a source: own measure; R-05 recommends measure for length and a pair for the
        helper count
  - id: code.size.3
    slug: complexity-only-falls
    since: 0.1.0
    rule: >-
      The count of functions with cognitive complexity over 20 only falls, and a fall paired with a rise in
      the helper count prints as no progress.
    detail: >-
      The line of 20 is inherited, not measured, and is one line for Go and the web stack (decision 41); the
      donor's line was 15 and is not used. The ratchet reads the pair per change: a fall in this count with a
      rise in the helper count of code.size.2 in the same change prints as no progress, so the baseline can
      lower only if the helper count did not rise. The count of over-limit functions is a per-function
      baseline, one file per function. A lint runner's new-from-merge-base setting flags every touched line of
      an old over-limit function, so the count ratchet is preferred. Existing debt in the web stack sits in
      the linter's bulk suppression file, which is the shrink-only baseline. Tests are off.
    level: function
    why: >-
      At 20 with tests off: 94 functions in one repo, 91 in another, 48 and 33 in two more; 0 over 30 where
      the config holds 30. In a hand sample about 2 of 4 hits were worth splitting. A 160-line nest scores 143
      and fires; a 159-line flat table scores 0; splitting a nest into two methods that share state still
      fires on both. Nine commits extract a helper to get under the limit.
    kind: rule
    strength: Hard
    status: active
    unless:
      - paths:
          - "**/*_test.go"
          - "**/*.test.*"
          - "**/*.spec.*"
        reason: tests are off in the tool configuration
    sources:
      - ref: ousterhout-aposd
        where: chapter 18
        backs: rule
      - ref: decision-41
        backs: rule
      - ref: p-01-core-programming
        where: section 6
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 5.6
        backs: rule
    checks:
      - binding: go
        class: preset-rule
        tool: golangci-lint
        key: gocognit
        tier: "3"
        fix: never
        note: >-
          golangci-lint gocognit (v1.2.1; 1.3.0 ships with golangci-lint 2.15.0) min-complexity 20 with tests
          off; a companion ratchet counts findings per run and fails on a rise against a committed
          per-function baseline. Plant: a 160-line nest scores 143 and fires; a 159-line flat table scores 0;
          extracting 13 helpers lowers the count but the baseline is not lowered. Control: a flat 159-line
          table scores 0 and passes
      - binding: ts
        class: preset-rule
        tool: eslint
        tier: "2"
        note: >-
          eslint-plugin-sonarjs 4.2.2 cognitive-complexity at 20, ESLint core complexity, all errors, with
          ESLint bulk suppressions (--suppress-all, eslint-suppressions.json) as the shrink-only baseline for
          existing debt. Plant: a nested function over cognitive 20 fails. Control: a flat function under the
          limit passes
    relates:
      - id: code.size.2
        how: see
    open:
      - >-
        The rule bounds growth; the helper pair denies credit and does not fail the cheap cure. The tool's
        version changes between 2.14.0 and 2.15.0, so rerun the plant when pinning.
      - >-
        One repo's config holds 30, so the line of 20 needs a config change; in the web stack the trial
        recorded counts only and no plant.
      - Conflict with the donor's line of 15 per function.
      - >-
        v1 evidence, not yet a source: own measure (nine commits extract helpers to get under a limit)
  - id: code.size.4
    slug: few-parameters
    since: 0.1.0
    rule: >-
      Functions with many parameters take a struct or options object, and the parameter count only falls.
    detail: >-
      The Go limit is 6 for new code with the receiver not counted (a guess; no Go source gives one, and the
      revive default is 8); the web limit is 4, with a shrink-only baseline for existing debt. The cure the
      rule wants is the one that passes. The donor's cap was 3 parameters per function. The cheap cure is a
      variadic any, which the port rules catch at ports only.
    level: function
    why: >-
      A long parameter list hides a missing type and makes every caller depend on the order. In the web stack
      67 functions in one repo exceeded the limit of 4.
    kind: rule
    strength: Hard
    status: proposed
    checks:
      - binding: go
        class: preset-rule
        tool: golangci-lint
        key: revive
        tier: "1"
        fix: auto
        note: >-
          golangci-lint revive argument-limit (default 8) set at 6 for new code via new-from-merge-base,
          receiver not counted. Plant: a function with 7 parameters is reported by revive argument-limit set
          to 6 (run). Control: a function with a struct parameter passes (not run)
      - binding: ts
        class: preset-rule
        tool: eslint
        tier: "2"
        note: >-
          ESLint core max-params at 4 as an error with bulk suppressions as the shrink-only baseline. Plant: a
          function with 5 parameters fails. Control: a function with an options object passes
    open:
      - >-
        6 for Go and 4 for the web are guesses; the donor's cap of 3 conflicts with both.
      - >-
        Proposed for lack of a source (decision 47); the v1 evidence was: practice (config only); C (67
        functions over the web limit in one repo)
  - id: code.size.5
    slug: size-trend-and-hotspots
    since: 0.1.0
    rule: >-
      Size and complexity are watched as a trend and a hotspot list (churn times lines), reported and not
      gated, with a declared exclusion list and a window by release or ticket, never by days.
    detail: >-
      A hotspot report uses a declared exclusion list that takes generated files, registers, golden test data
      and end-to-end files, and states its window and its unit: by release, train or ticket, never by days,
      because agent commit rates inflate churn and make time windows meaningless (118 commits a day on one
      repo). After a squash the unit changes little, and splitting a hot file drops it off the list, so a file
      that leaves it has not shown it got better. A hot file carries a per-file trend (lines and indentation
      depth over its commits) before and after a refactor, so a fix is checked against history. A ratchet is
      used only where a number reaches zero in practice, such as files over 1000 lines not rising
      (code.size.1; one repo's numeric per-file file-baseline already does it). A size distribution (the 90th
      percentile) is reported as a trend. A diff size (a diff-size ceiling paired with a rework count) is
      reported beside post-land rework per ticket wherever a small-change rule exists, from the delivery
      record, with no limit.
    level: file
    why: >-
      The top tenth of files by churn times lines took 46.4% of later fix touches in one repo and 30.2% in
      another, against 9.9% for a random tenth; lines alone gave 34.8 and 36.9, so the product is no better
      than its parts. A rerun did not reproduce the 46.4: the top tenth took 31.1, 30.7 and 25.9 against 9.8
      random, and lines alone beat the product in two repos. Commit and ticket units share 18 to 20 of the top
      20. Raw churn lists fill with generated files. The delivery stability findings with AI use are explained
      by larger changes.
    kind: measure
    strength: Answered
    status: active
    sources:
      - ref: tornhill-code-crime-scene
        where: chapters 2 to 6 and 14
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 7.2 item 1
        backs: rule
      - ref: b-02-code-as-a-crime-scene
        where: section 9 items 1 to 5
        backs: rule
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: "4"
        note: >-
          v1 class our-cli. hotspot report: git log --numstat grouped by release or ticket, churn times lines
          per file with an exclusion file, per-file trend, unit stated; diff size beside post-land rework per
          ticket from the delivery record; a hot file that grows blocks until answered. Plant: a generated
          file on the exclusion list stays off the report; a fixture history with one known hot file and one
          known coupled pair reports both. Control: a hot file that did not grow passes
    relates:
      - id: code.size.1
        how: see
      - id: arch.measures.3
        how: see
    open:
      - >-
        A commercial hotspot tool and a GPL tool were not adopted (code-maat licence not checked further); a
        ranking tool exists for churn times complexity (a 0 to 100 score per file).
      - >-
        No hotspot report exists for the web stack; a short git-log script would give it. The hotspot list is
        a best practice; only the tail ratchet is a rule.
      - Diff size beside rework has no plant and no measure yet.
    note: Change coupling across a boundary is arch.measures.3.
  - id: code.size.6
    slug: merge-candidate-report
    since: 0.1.0
    rule: >-
      A merge-candidate report lists modules with one importer that change with it, near-duplicate modules,
      ports with one implementation and private functions with one call site; it is report only.
    detail: >-
      A root or command module imports everything by construction, so it does not count as the one importer.
      Near-duplicates are found by token clones (renaming every exported name beats a name match for free).
      Interfaces with one implementation are listed when no second is named. No floor is set: a single call
      site is often right and floors misfire. A new merge candidate blocks until the change merges it or says
      why not. It is read beside code.size.2.
    level: package
    why: >-
      Every size rule pushes towards splitting and nothing reported the opposite. Across six repos 93 packages
      had one importer, 33 changed with it, 31 of those on a command root, 2 left to read; a clone finder
      found about 9 clone pairs in one repo in 0.9 s.
    kind: measure
    strength: Answered
    status: active
    sources:
      - ref: ford-sathp
        where: chapters 5 and 7
        backs: rule
      - ref: ousterhout-aposd
        where: chapter 9
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 7.1
        backs: rule
      - ref: p-08-splitting
        where: section 18
        backs: rule
    checks:
      - binding: go
        class: fact
        tool: jscpd
        tier: "3"
        note: >-
          v1 class our-cli. companion merge-report: one-importer packages excluding command roots, co-change
          over tickets, token clones from dupl or jscpd, private single-call functions, printed at land.
          Plant: a copied package fires; the same copy with every exported name changed also fires through the
          clone finder. Control: a package with two importers is not listed
      - binding: ts
        class: fact
        tool: knip
        tier: "2"
        note: >-
          v1 class our-cli. report only: knip (modules with one importer), private functions with one call
          site via the TypeScript walk of code.size.2, and jscpd for near-duplicate modules. Plant: a fixture
          with one single-importer module and one single-call-site helper lists both. Control: a module with
          two importers is not listed
    relates:
      - id: code.size.2
        how: see
    open:
      - >-
        The trial sample was located and not read in full; 0.5 and 3 are guesses; no gate is justified by the
        web evidence.
      - "v1 evidence, not yet a source: practice; D for the web"
  - id: code.size.7
    slug: types-by-method-count
    since: 0.1.0
    rule: >-
      Types are listed by method count, with no limit, so a god object that is under every file-size line is
      visible.
    detail: >-
      A small analyser counts methods per type, leaving out fakes. Grouping methods by the fields they use
      does not do this: it flags fakes and data records, a mutex used in every method hides it, and it missed
      a 49-method server. A type whose method count rises above its baseline blocks until answered.
    level: type
    why: >-
      The types with the most methods were 49 (a server), 35 (a config) and 33 (a call type). Field cohesion
      tried flagged 49 hits across six repos, of which 1 to 2 of 12 in one repo were plausibly true.
    kind: measure
    strength: Answered
    status: active
    sources:
      - ref: p-01-core-programming
        where: section 20
        backs: rule
      - ref: p-01-core-programming
        where: five-list item 4
        backs: rule
    checks:
      - binding: go
        class: analyzer
        tier: "3"
        note: >-
          v1 class our-plugin. a go/analysis analyzer or go/types script prints methods per type (non-fake, no
          limit); a rise above the baseline blocks until answered. Plant: a type whose method count rises
          above its baseline blocks; the dropped cohesion form was planted with a God type and a Whole type.
          Control: a type with an unchanged method count passes
    open:
      - >-
        Would become a firm rule only with a method-count ceiling and data on the cheap cure (embedding a
        struct moves methods without reducing them).
      - "v1 evidence, not yet a source: practice; no fault in our record"
