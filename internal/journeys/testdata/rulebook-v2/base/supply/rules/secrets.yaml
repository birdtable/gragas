part: supply
concern: secrets
order: 7
title: Secrets and credentials
summary: >-
  No secret and no private name is committed, and a finding is reported without the value. Configuration holds
  a reference to a secret and never the value, and the credential a CI job uses is read-only and scoped to
  what it needs.
rules:
  - id: supply.secrets.1
    slug: no-secret-committed
    since: 0.1.0
    rule: >-
      No secret is committed: one pinned secret scanner runs at commit and in the pre-push gate over the whole
      history, a land tier where one exists runs it again, and a finding is reported by rule, file and line
      without the value.
    detail: >-
      The scanner config is chosen explicitly and not picked up by accident. A staged-file scan runs at
      commit, and the gate command the pre-push hook runs scans every commit in the history and the working
      tree as it is. A land tier, where a repo has one, repeats the full scan; it is never the only full scan.
      The documentation example key is allowlisted by default and is not reported. The staged-file scan is
      gitleaks protect --staged (git --staged in current versions). The commit scan is one of the three
      standing gates shared across repos (the others are the armed hook and the pipefail check), run by the
      shared hook file over the staged changes.
    level: file
    why: >-
      A committed secret stays in history forever and must be rotated. The scan also reaches the web bundle,
      which must carry no secret. Under decision 65 there is no hosted land job, so a full scan placed
      only at land never ran.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: decision-65-supply
        backs: rule
      - ref: operator-points
        backs: rule
    checks:
      - binding: any
        class: preset-config
        tool: gitleaks
        tier: "1"
        note: >-
          gitleaks pinned, with its staged-file scan at commit and a full-history scan in the gate command the
          pre-push hook runs, config chosen explicitly, findings reported as rule, file and line. Plant: a
          fake key-shaped string in a staged file fails and the finding shows no value; a key-shaped string in
          an old commit fails the pre-push scan. Control: a clean diff passes
    relates:
      - id: gates.hooks.7
        how: see
    open:
      - >-
        A second scanner (an AGPL-licensed one) was not run and kept second because of its licence; the
        alternatives are to be checked.
      - >-
        The commit scan was held in two reference repos and lifted into the shared set of standing gates.
    note: >-
      The same rule as gates.hooks.7 (secrets scanned at commit by a shared standing gate), which the merge
      wrote in the gates part and which was merged here at the cross-part move.
  - id: supply.secrets.2
    slug: config-holds-secret-reference
    since: 0.1.0
    rule: >-
      Configuration holds a reference to a secret, never the value, and secrets are read through one required
      schema.
    detail: >-
      A secret never comes from a flag and is never printed. For a web page, variables it reads are in a typed
      schema and no secret reaches the bundle.
    level: program
    why: >-
      A value in configuration is copied into logs, images and every place the configuration goes; a reference
      is resolved only where it is used.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: supply-reasons-stated
        backs: rule
    checks:
      - binding: ts
        class: test-kit
        tier: "1"
        note: >-
          a typed schema that reads secrets through one required step, a scan of configuration files for
          secret-shaped values, and a bundle scan for secrets. Plant: a configuration with a secret value in
          place of a reference fails. Control: a reference passes
    open:
      - >-
        Where this binds for Go and for deployed functions is covered by program and cloud parts; this rule
        holds the supply-chain half (references only).
  - id: supply.secrets.3
    slug: no-secret-in-public-config
    since: 0.1.0
    rule: >-
      Secret-shaped keys in public environment files fail, and no secret reaches the bundle.
    detail: >-
      Public environment files hold only public values; a variable whose name looks like a secret fails the
      check.
    level: file
    why: A secret in a public file ships to every browser.
    kind: rule
    strength: Hard
    status: proposed
    checks:
      - binding: ts
        class: fact
        tool: gragas
        tier: "1"
        note: >-
          v1 class our-cli. A structural check over public environment files for secret-shaped key names.
          Plant: A public env file with a key named like a token fails. Control: Public values only passes.
    relates:
      - id: gates.own-rules.5
        how: see
      - id: supply.secrets.2
        how: see
    open:
      - Taken from one bundled source row of five small domain rules written as checks.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: practice"
    note: >-
      Moved from gates.own-rules.5, where the merge wrote it with the doubt that it belongs in supply
      (secrets). Related to supply.secrets.2, which holds that configuration carries a reference and never the
      value; this one checks key names in public files.
  - id: supply.secrets.4
    slug: private-names-never-in-the-repo
    since: 0.1.0
    rule: >-
      Forbidden names come from a list kept outside the repository with its words stored as hashes; every
      tracked file, branch name and pushed commit message is scanned against it, the check fails when the list
      cannot be read, and in a public repo every commit's author and committer email is a no-reply address.
    detail: >-
      The forbidden names are the private facts of the people and places a repo serves: employers, people,
      machines, networks, addresses, households and the software a deployment runs. The list lives outside the
      repository (a path set in the environment) and holds each word as a hash, so the guard does not spell
      what it guards. The scan reads every tracked file, the branch name and every commit message in the
      pushed range, matching whole words case-insensitively against the hashes. When the list path is unset or
      unreadable the check exits 2 (could not run), never 0. Examples, fixtures and docs use stand-in names
      from an explicit stand-in list and documentation address ranges. In a public repository the pre-push
      hook refuses a commit whose author or committer email is not the host's no-reply address.
    level: file
    why: >-
      A private name in history cannot be removed without rewriting it, and a public repository publishes
      every word of it. In one target repository a work email reached 217 commits before the check existed. A
      list kept in the repo would itself publish the names.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: decision-65-supply
        backs: rule
    examples:
      bad:
        lang: markdown
        code: |
          <!-- docs/thanks.md: a word of the private list in a tracked file -->
          Reviewed by a person whose name is on the list.
      good:
        lang: markdown
        code: |
          <!-- docs/thanks.md -->
          Reviewed by the maintainer.
    checks:
      - binding: any
        class: hook
        tier: "2"
        note: >-
          a names check in the gate command and the pre-push hook: hashed whole-word match over tracked files,
          the branch name and the pushed range's messages against the list at the configured path, exit 2 when
          the list cannot be read; an author and committer email check on the pushed range in a public repo.
          Plant: a planted forbidden word in a commit message fails; an unset list path exits 2; a commit with
          a work email in a public repo is refused. Control: a tree, branch and messages free of listed words,
          with no-reply emails, pass
      - binding: any
        class: preset-rule
        tool: gragas
        key: names
        tier: "3"
        fix: never
        note: >-
          The names key of the gragas preset, which gragas check computes: the hashed list at the names-file
          path against every tracked file and its path, and with --range each commit message since the merge
          base. Plant: a tracked file holding a listed word is a finding, naming the file and line. Control: a
          tree free of listed words passes (internal/core/audit/repo_test.go)
