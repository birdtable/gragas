part: docs
concern: markdown
order: 4
title: Markdown structure
summary: >-
  Markdown in docs follows one shipped configuration, the same for every repository that takes this part, so
  structure is checked the same way everywhere.
rules:
  - id: docs.markdown.1
    slug: shipped-markdown-config
    since: 0.1.0
    rule: >-
      Markdown structure (headings, lists, code fences) follows one shipped lint configuration.
    detail: >-
      All default rules are on except four, line length is off, and duplicate headings are checked among
      siblings only. The configuration is exported from one shared place and a repository does not carry its
      own copy. A project's own docs, including UI projects, follow the same configuration.
    level: file
    why: >-
      The default rules gave 62,000 findings on a first run (80 percent of them line length), so the
      configuration is the work. No repo had a doc linter configuration or front matter.
    kind: rule
    strength: Hard
    status: proposed
    checks:
      - binding: any
        class: preset-config
        tier: "3"
        note: >-
          markdownlint-cli2 with the shipped configuration that turns line length (MD013) off. Plant: a
          document with a heading level skipped or a duplicate sibling heading fails. Control: a well-formed
          document passes
    relates:
      - id: docs.freshness.1
        how: see
    open:
      - markdownlint-cli2 0.24.0 was planted once and is not yet a gate.
      - No UI catalogue row named it; the part now applies to UI repositories too.
      - >-
        Proposed for lack of a source (decision 47); the v1 evidence was: practice (default rules gave 62,000
        findings)
    note: The front-matter half of the same row is docs.freshness.1.
