part: agents
concern: delivery
order: 6
title: Delivery records and measuring guidance
summary: >-
  The gate writes a record for each ticket, a short list of measures rolls up once a week, the agent judged on
  those numbers does not see them, and a change to guidance is replayed on closed tickets before it spreads.
rules:
  - id: agents.delivery.1
    slug: delivery-record-per-ticket
    since: 0.1.0
    rule: >-
      The gate writes a delivery record per ticket holding gate rounds, review rounds, rework and time, with
      the first-pass gate-green rate.
    detail: >-
      The record is appended by the gate to a per-ticket file, and a figure that cannot be measured prints
      null with its reason. A test fails if the record is missing. Coverage per changed file is reported with
      no threshold.
    level: process
    why: >-
      The ticket is the unit that commits and pull requests cannot give: 1,739 commits in 14 days says nothing
      of value (principles report P-09 section 9.3).
    kind: measure
    strength: Record
    status: active
    sources:
      - ref: p-09-agentic-development
        where: section 9.3
        backs: rule
      - ref: p-02-enforcement-and-measure
        where: section 7.2 item 2
        backs: rule
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: R
        note: >-
          v1 class record. a measure script appends the gate's output to a per-ticket record, and a test fails
          when the record is missing. Plant: a fixture ticket record with known rounds gives known totals.
          Control: a record with all fields present passes
    review_question: >-
      Does the record hold the real gate and review rounds and the real rework for this ticket?
    open:
      - >-
        A Record binds only once it is paired with a review question that checks the record's content
        (decision 44).
      - Numbers watched, stop nothing; proposed, report only.
      - >-
        The reference organisation's version records metrics per ticket as a line file; a per-ticket record
        was a gap in the Go rows.
      - "v1 evidence, not yet a source: D (tickets give the unit that commits cannot)"
    note: >-
      Merges the Go and UI rows, the handbook rule and the reference's per-ticket metrics rule.
  - id: agents.delivery.2
    slug: weekly-measures-line
    since: 0.1.0
    rule: A short list of measures rolls up into one line a week for the reader.
    detail: >-
      The list: first-pass gate-green rate, review rounds, rework within 14 days, files over the size line,
      new disables, platform-import ratio, state coverage, accessibility violations, and time to green.
    level: process
    why: A weekly line shows trend without making any one number a target.
    kind: measure
    strength: Record
    status: proposed
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: R
        note: >-
          v1 class record. the measure script rolls the per-ticket records into the weekly line. Plant: a
          fixture set of ticket records with known rounds gives the known weekly totals. Control: a complete
          week produces one line
    review_question: Do the weekly numbers match the records they roll up?
    open:
      - Planned only; the measure script and the weekly digest do not exist yet.
      - "Proposed for lack of a source (decision 47); the v1 evidence was: D"
  - id: agents.delivery.3
    slug: agent-does-not-see-its-number
    since: 0.1.0
    rule: The reader sees the delivery numbers; the agent judged on them does not.
    level: process
    why: >-
      A scorer visible to the agent invites gaming; scorer visibility is linked to hacking in an outside study
      (principles report P-09 section 5.5).
    kind: instruction
    strength: Review
    status: proposed
    review_question: Can the agent whose ticket this is read its own delivery record?
    open:
      - "Proposed for lack of a source (decision 47); the v1 evidence was: practice"
  - id: agents.delivery.4
    slug: guidance-change-replayed
    since: 0.1.0
    rule: >-
      A change to guidance is measured before it spreads, by replaying closed tickets with and without it and
      reporting success and cost for each arm.
    detail: >-
      A replay harness runs the arms and a person reads the two arms; nothing passes or fails, so it has no
      plant. A guidance change must carry its replay result. Tests that give an agent a task and check that it
      followed the guidance are the same idea in eval form.
    level: process
    why: >-
      The one controlled study shows guidance can add cost with no gain (principles report P-09 section 7.7);
      its figures are second-hand, from a workshop poster.
    kind: instruction
    strength: Record
    status: active
    sources:
      - ref: p-09-agentic-development
        where: section 7.7
        backs: rule
    checks:
      - binding: any
        class: fact
        tool: gragas
        tier: R
        note: >-
          v1 class record. a guidance change carries its replay result, checked present by the land check.
          Plant: a guidance change with no replay result is flagged. Control: a guidance change carrying a
          replay result passes
    review_question: >-
      Does the replay result show the guidance change helped, or added cost with no gain?
    open:
      - >-
        Proposed replay harness; none has run. No plant is possible because a person reads the two arms.
      - The study behind it is a workshop poster and its figures are second-hand.
      - >-
        No UI row replayed tasks to measure guidance; the first-file and weekly measures came closest.
      - "v1 evidence, not yet a source: practice (a workshop poster, figures second-hand)"
    note: Merges the Go and UI rows and the reference's measured-before-it-spreads rule.
  - id: agents.delivery.5
    slug: commit-message-shape
    since: 0.1.0
    rule: >-
      A commit subject states what is true after it, not what was done, its body says why, and a type and
      scope prefix is a repo parameter.
    detail: >-
      The subject is a sentence about the tree after the commit ("The gate refuses a stale base"), not an
      action ("Fix gate" or "Updated docs"). The body says why the change was needed; a body that only repeats
      the subject fails. A repo declares once whether subjects carry a conventional type and scope prefix, and
      the commit check holds whichever it declared.
    level: process
    why: >-
      A log of what is true reads as the history of the program's behaviour; a log of actions says only that
      someone was busy. The body is the one place the reason survives.
    kind: rule
    strength: Hard
    status: active
    sources:
      - ref: decision-65-agents
        backs: rule
    checks:
      - binding: any
        class: hook
        tier: "1"
        note: >-
          a commit-msg hook that fails an empty body, a subject that starts with a past-tense or imperative
          action verb from a listed set, and a prefix that disagrees with the repo's declared setting. Plant:
          a commit with subject "Fixed the gate" fails; a commit with no body fails; a prefix in a repo that
          declared none fails. Control: a subject stating what is true with a body saying why passes
    review_question: Does the subject say what is true after the commit, and does the body say why?
    open:
      - >-
        A verb list catches the common forms only; whether a subject states a fact is review.
