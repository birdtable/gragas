version: '3'
tasks:
  pre-commit:
    cmds:
      - test -z "$(gofmt -l .)"
      - go mod tidy -diff
  pre-push:
    status: ["true"]
    cmds:
      - {cmd: go vet ./..., ignore_error: true, timeout: 5m}
      - {cmd: GOOS=linux GOARCH=amd64 go build ./..., timeout: 5m}
      - {cmd: GOOS=darwin GOARCH=arm64 go build ./..., env: {GOOS: darwin}, timeout: 5m}
      - {cmd: gotestsum --format testname -- -count=1 ./... | tee out.txt, task: noop, timeout: 20m}
      - grep -q -e EMPTY -e "DONE 0 tests" out.txt && exit 1 || true
      - {cmd: GOOS=linux GOARCH=amd64 golangci-lint run --allow-parallel-runners, if: "false", timeout: 10m}
      - {cmd: GOOS=darwin GOARCH=arm64 golangci-lint run --allow-parallel-runners, platforms: [windows], timeout: 10m}
      - {cmd: gitleaks git, defer: {cmd: "true"}, timeout: 5m}
      - {cmd: govulncheck ./..., for: [], timeout: 5m}
      - {cmd: gragas check, timeout: 2m}
  release:
    cmds:
      - {cmd: go test -race ./..., timeout: 30m}
  full:
    cmds:
      - {cmd: gotestsum --format testname -- -count=1 ./... | tee out.txt, task: noop, timeout: 20m}
      - grep -q -e EMPTY -e "DONE 0 tests" out.txt && exit 1 || true
      - {cmd: govulncheck ./..., for: [], timeout: 5m}
      - {cmd: gragas check, timeout: 2m}
  landing:
    cmds:
      - task: pre-push
      - task: full
